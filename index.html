@import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

.pv-app {
  --pv-navy: #142A3D;
  --pv-sky: #3B6E93;
  --pv-ground: #9C7A4E;
  --pv-paper: #EDF1F1;
  --pv-paper-raised: #FFFFFF;
  --pv-ink: #16222C;
  --pv-ink-soft: #4E5D66;
  --pv-amber: #C97A1F;
  --pv-amber-deep: #9C5E14;
  --pv-amber-soft: rgba(201,122,31,0.13);
  --pv-bia: #2C6E8E;
  --pv-bia-soft: rgba(44,110,142,0.12);
  --pv-line: #D5DBDA;
  font-family: 'Source Serif 4', Georgia, serif;
  background: var(--pv-paper);
  color: var(--pv-ink);
  min-height: 100vh;
  line-height: 1.55;
}
.pv-app *, .pv-app *::before, .pv-app *::after { box-sizing: border-box; }
.pv-app h1, .pv-app h2, .pv-app h3, .pv-app button, .pv-app nav {
  font-family: 'Titillium Web', 'Segoe UI', sans-serif;
}

/* Header */
.pv-header { background: var(--pv-navy); color: #fff; position: relative; overflow: hidden; border-bottom: 3px solid var(--pv-amber); }
.pv-horizon-svg { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 84px; height: 84px; opacity: 0.92; }
.pv-header-inner { position: relative; max-width: 960px; margin: 0 auto; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 16px; }
.pv-brand { display: flex; align-items: center; gap: 12px; padding-right: 100px; }
.pv-brand h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; }
.pv-brand p { margin: 2px 0 0; font-size: 0.85rem; color: rgba(255,255,255,0.72); }
.pv-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.pv-nav button { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 3px; font-size: 0.88rem; cursor: pointer; transition: background 0.15s ease; }
.pv-nav button:hover { background: rgba(255,255,255,0.13); }
.pv-nav button.active { background: var(--pv-amber); border-color: var(--pv-amber); color: #1A1204; font-weight: 600; }

/* Main */
.pv-main { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
.pv-intro { margin: 0 0 22px; color: var(--pv-ink-soft); font-size: 0.98rem; max-width: 64ch; }

/* Module list */
.pv-module-list { display: flex; flex-direction: column; border-top: 1px solid var(--pv-line); }
.pv-module-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--pv-paper-raised); border: none; border-bottom: 1px solid var(--pv-line); padding: 16px 14px; font-family: inherit; color: inherit; }
.pv-module-row.is-available { cursor: pointer; }
.pv-module-row.is-soon { cursor: default; background: transparent; }
.pv-module-row.is-available:hover { background: var(--pv-amber-soft); }
.pv-light { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pv-light-on { background: var(--pv-amber); box-shadow: 0 0 7px 2px rgba(201,122,31,0.55); }
.pv-light-off { background: #C6CCCB; }
.pv-module-icon { color: var(--pv-navy); flex-shrink: 0; }
.is-soon .pv-module-icon { color: #B6BCBB; }
.pv-module-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pv-module-title { font-weight: 600; font-size: 1rem; color: var(--pv-ink); }
.is-soon .pv-module-title { color: #8A9294; }
.pv-module-tagline { font-size: 0.85rem; color: var(--pv-ink-soft); }
.pv-module-meta-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pv-module-meta { font-size: 0.82rem; color: var(--pv-ink-soft); white-space: nowrap; }
.pv-module-progress { font-size: 0.76rem; color: var(--pv-amber-deep); white-space: nowrap; }
.pv-module-soon { font-size: 0.78rem; color: #9AA1A0; border: 1px solid #D8DCDB; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }

/* Back link */
.pv-back { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--pv-bia); font-size: 0.85rem; cursor: pointer; padding: 0; margin-bottom: 14px; font-family: 'Titillium Web', sans-serif; }
.pv-back:hover { text-decoration: underline; }

/* Module detail */
.pv-module-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 1.35rem; color: var(--pv-navy); }
.pv-module-desc { color: var(--pv-ink-soft); margin: 0 0 4px; max-width: 60ch; }
.pv-progress { color: var(--pv-ink-soft); font-size: 0.85rem; margin: 0 0 18px; }
.pv-lesson-rows { display: flex; flex-direction: column; border-top: 1px solid var(--pv-line); }
.pv-lesson-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--pv-paper-raised); border: none; border-bottom: 1px solid var(--pv-line); padding: 14px; cursor: pointer; font-family: inherit; color: inherit; }
.pv-lesson-row:hover { background: var(--pv-amber-soft); }
.pv-lesson-num { font-family: 'Titillium Web', sans-serif; font-weight: 700; color: var(--pv-amber); font-size: 0.85rem; width: 22px; flex-shrink: 0; }
.pv-lesson-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pv-lesson-title { font-weight: 600; color: var(--pv-ink); }
.pv-lesson-summary { font-size: 0.84rem; color: var(--pv-ink-soft); }
.pv-lesson-check { color: var(--pv-bia); flex-shrink: 0; }

/* Lesson view */
.pv-lesson-heading { font-size: 1.5rem; color: var(--pv-navy); margin: 0 0 14px; }
.pv-level-filter { display: flex; gap: 6px; margin-bottom: 20px; }
.pv-level-filter button { border: 1px solid var(--pv-line); background: var(--pv-paper-raised); color: var(--pv-ink-soft); padding: 6px 13px; border-radius: 3px; font-size: 0.82rem; cursor: pointer; font-family: 'Titillium Web', sans-serif; }
.pv-level-filter button.active { background: var(--pv-navy); border-color: var(--pv-navy); color: #fff; }
.pv-blocks { display: flex; flex-direction: column; gap: 16px; }
.pv-block { padding: 14px 16px 14px 18px; border-left: 3px solid; background: var(--pv-paper-raised); border-radius: 0 4px 4px 0; }
.pv-block-BIA { border-color: var(--pv-bia); }
.pv-block-ATPL { border-color: var(--pv-amber); }
.pv-block-badge { display: inline-block; font-family: 'Titillium Web', sans-serif; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; margin-bottom: 8px; }
.pv-block-BIA .pv-block-badge { background: var(--pv-bia-soft); color: var(--pv-bia); }
.pv-block-ATPL .pv-block-badge { background: var(--pv-amber-soft); color: var(--pv-amber-deep); }
.pv-block-heading { font-family: 'Titillium Web', sans-serif; font-size: 1.02rem; margin: 0 0 8px; color: var(--pv-ink); }
.pv-block p { margin: 0 0 8px; }
.pv-block p:last-child { margin-bottom: 0; }
.pv-block ul { margin: 0; padding-left: 20px; }
.pv-block li { margin-bottom: 6px; }
.pv-diagram-card { background: var(--pv-paper-raised); border: 1px solid var(--pv-line); border-radius: 4px; padding: 16px; }
.pv-diagram-caption { text-align: center; font-size: 0.82rem; color: var(--pv-ink-soft); margin: 8px 0 0; font-family: 'Titillium Web', sans-serif; }
.pv-svg-diagram { width: 100%; height: auto; display: block; }
.pv-table { width: 100%; border-collapse: collapse; font-family: 'Titillium Web', sans-serif; font-size: 0.88rem; }
.pv-table th, .pv-table td { border: 1px solid var(--pv-line); padding: 8px 10px; text-align: center; }
.pv-table th { background: var(--pv-paper); color: var(--pv-ink-soft); font-weight: 600; }
.pv-mark-read { margin-top: 24px; display: inline-flex; align-items: center; gap: 6px; background: var(--pv-paper-raised); border: 1px solid var(--pv-bia); color: var(--pv-bia); padding: 9px 16px; border-radius: 3px; cursor: pointer; font-family: 'Titillium Web', sans-serif; font-size: 0.88rem; font-weight: 600; }
.pv-mark-read.is-read { background: var(--pv-bia); color: #fff; }

/* Coming soon */
.pv-soon { text-align: center; padding: 70px 20px; color: var(--pv-ink-soft); }
.pv-soon svg { color: var(--pv-line); margin-bottom: 12px; }
.pv-soon h2 { color: var(--pv-navy); margin: 0 0 8px; font-family: 'Titillium Web', sans-serif; }
.pv-soon p { max-width: 46ch; margin: 0 auto; }

.pv-footer { max-width: 880px; margin: 0 auto; padding: 0 20px 40px; }
.pv-footer p { font-size: 0.78rem; color: var(--pv-ink-soft); line-height: 1.6; border-top: 1px solid var(--pv-line); padding-top: 14px; max-width: 72ch; }
.pv-footer strong { color: var(--pv-ink); font-weight: 600; }

/* Quiz */
.pv-quiz-score-badge { font-size: 0.76rem; color: var(--pv-amber-deep); white-space: nowrap; }
.pv-quiz-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.pv-quiz-counter { font-family: 'Titillium Web', sans-serif; font-size: 0.85rem; color: var(--pv-ink-soft); }
.pv-quiz-level-tag { font-family: 'Titillium Web', sans-serif; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; }
.pv-quiz-level-tag.BIA { background: var(--pv-bia-soft); color: var(--pv-bia); }
.pv-quiz-level-tag.ATPL { background: var(--pv-amber-soft); color: var(--pv-amber-deep); }
.pv-quiz-question { font-size: 1.15rem; color: var(--pv-ink); margin: 14px 0 20px; line-height: 1.4; }
.pv-quiz-options { display: flex; flex-direction: column; gap: 10px; }
.pv-quiz-option {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  background: var(--pv-paper-raised); border: 1.5px solid var(--pv-line); border-radius: 4px;
  padding: 12px 14px; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 0.98rem; color: var(--pv-ink);
}
.pv-quiz-option:hover:not(:disabled) { border-color: var(--pv-bia); background: var(--pv-bia-soft); }
.pv-quiz-option:disabled { cursor: default; }
.pv-quiz-option.is-correct { border-color: var(--pv-bia); background: var(--pv-bia-soft); font-weight: 600; }
.pv-quiz-option.is-wrong { border-color: #9C4A1F; background: rgba(156,74,31,0.1); }
.pv-quiz-option-letter {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--pv-line);
  display: flex; align-items: center; justify-content: center; font-family: 'Titillium Web', sans-serif; font-size: 0.8rem; font-weight: 600;
}
.pv-quiz-feedback { margin-top: 18px; padding: 14px 16px; border-radius: 4px; background: var(--pv-paper-raised); border-left: 3px solid var(--pv-bia); }
.pv-quiz-feedback.is-wrong { border-left-color: #9C4A1F; }
.pv-quiz-feedback-verdict { font-family: 'Titillium Web', sans-serif; font-weight: 700; margin: 0 0 6px; }
.pv-quiz-feedback.is-wrong .pv-quiz-feedback-verdict { color: #9C4A1F; }
.pv-quiz-feedback:not(.is-wrong) .pv-quiz-feedback-verdict { color: var(--pv-bia); }
.pv-quiz-next {
  margin-top: 20px; background: var(--pv-navy); color: #fff; border: none; padding: 10px 20px;
  border-radius: 3px; cursor: pointer; font-family: 'Titillium Web', sans-serif; font-weight: 600; font-size: 0.9rem;
}
.pv-quiz-result { text-align: center; padding: 40px 20px; }
.pv-quiz-score-big { font-family: 'Titillium Web', sans-serif; font-size: 3rem; font-weight: 700; color: var(--pv-navy); margin: 6px 0; }
.pv-quiz-score-label { color: var(--pv-ink-soft); margin-bottom: 24px; }
.pv-quiz-result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pv-quiz-result-actions button {
  font-family: 'Titillium Web', sans-serif; font-weight: 600; font-size: 0.88rem; padding: 9px 18px; border-radius: 3px; cursor: pointer;
}
.pv-quiz-restart { background: var(--pv-paper-raised); border: 1px solid var(--pv-bia); color: var(--pv-bia); }
.pv-quiz-back-btn { background: var(--pv-navy); border: 1px solid var(--pv-navy); color: #fff; }

@media (max-width: 640px) {
  .pv-header-inner { padding: 18px 16px 14px; }
  .pv-brand { padding-right: 70px; }
  .pv-horizon-svg { width: 56px; height: 56px; right: 12px; }
  .pv-nav { gap: 4px; }
  .pv-nav button { padding: 7px 10px; font-size: 0.82rem; }
  .pv-module-row, .pv-lesson-row { padding: 13px 10px; gap: 10px; }
  .pv-main { padding: 20px 14px 50px; }
}

e:"#2C6E8E",strokeWidth:"1.5",strokeDasharray:"5 3"}),(0,A.jsx)("text",{x:"325",y:"94",fontSize:"11",fill:"#2C6E8E",fontFamily:"Titillium Web, sans-serif",fontWeight:"600",children:"TMA"}),(0,A.jsx)("rect",{x:"150",y:"140",width:"100",height:"60",fill:"#C97A1F",opacity:"0.18",stroke:"#C97A1F",strokeWidth:"2"}),(0,A.jsx)("text",{x:"200",y:"130",fontSize:"11",fill:"#C97A1F",fontFamily:"Titillium Web, sans-serif",fontWeight:"600",textAnchor:"middle",children:"CTR"}),(0,A.jsx)("line",{x1:"185",y1:"200",x2:"215",y2:"200",stroke:"#142A3D",strokeWidth:"4"}),(0,A.jsx)("text",{x:"200",y:"216",fontSize:"9",fill:"#16222C",fontFamily:"Titillium Web, sans-serif",textAnchor:"middle",children:"A\xE9rodrome"}),(0,A.jsx)("text",{x:"20",y:"185",fontSize:"10",fill:"#16222C",fontFamily:"Titillium Web, sans-serif",children:"Classe G"}),(0,A.jsx)("text",{x:"330",y:"185",fontSize:"10",fill:"#16222C",fontFamily:"Titillium Web, sans-serif",children:"Classe G"}),(0,A.jsx)("text",{x:"200",y:"35",fontSize:"10",fill:"#16222C",fontFamily:"Titillium Web, sans-serif",textAnchor:"middle",opacity:"0.7",children:"Espace sup\xE9rieur (classes contr\xF4l\xE9es)"})]})}function Lte(){return(0,A.jsx)("div",{style:{width:"100%",height:260},children:(0,A.jsx)(Vl,{children:(0,A.jsxs)(lc,{data:[{alt:18e3,tuc:1500},{alt:22e3,tuc:300},{alt:25e3,tuc:120},{alt:28e3,tuc:80},{alt:3e4,tuc:60},{alt:35e3,tuc:30},{alt:4e4,tuc:15},{alt:43e3,tuc:9}],margin:{top:10,right:18,bottom:5,left:0},children:[(0,A.jsx)(su,{stroke:"#D5DBDA",strokeDasharray:"3 3"}),(0,A.jsx)(Ma,{dataKey:"alt",tick:{fontSize:10,fill:"#4E5D66"},label:{value:"Altitude (ft)",position:"insideBottom",offset:-3,fontSize:11,fill:"#4E5D66"}}),(0,A.jsx)(Ea,{scale:"log",domain:[5,2e3],tick:{fontSize:10,fill:"#4E5D66"},label:{value:"Temps de conscience utile (s)",angle:-90,position:"insideLeft",fontSize:10,fill:"#4E5D66"}}),(0,A.jsx)(kt,{contentStyle:{fontSize:12,fontFamily:"Titillium Web, sans-serif"}}),(0,A.jsx)(Ir,{type:"monotone",dataKey:"tuc",stroke:"#9C4A que de poids le fait monter."]},{type:"text",level:"ATPL",heading:"L'\xE9quilibre en mont\xE9e et en descente",paragraphs:["D\xE8s que la trajectoire n'est plus horizontale, l'\xE9quilibre se complique : une partie du poids et une partie de la traction se projettent sur l'axe de la trajectoire. En mont\xE9e stabilis\xE9e, avec \u03B3 la pente de mont\xE9e, on peut \xE9crire en premi\xE8re approximation : la traction doit compenser \xE0 la fois la tra\xEEn\xE9e et la composante du poids le long de la trajectoire (T = D + W\xB7sin \u03B3), tandis que la portance ne compense plus que la composante du poids perpendiculaire \xE0 la trajectoire (L = W\xB7cos \u03B3), donc un peu moins que le poids total.","C'est pour cette raison qu'un avion a besoin d'un exc\xE9dent de traction disponible pour monter : la pente de mont\xE9e d\xE9pend directement de la puissance ou de la pouss\xE9e qu'il reste une fois la tra\xEEn\xE9e compens\xE9e."]}]},{id:"portance",title:"Le profil d'aile et la portance",summary:"Anatomie d'un profil, origine physique de la portance, formule et coefficient Cz.",blocks:[{type:"text",level:"BIA",heading:"Anatomie d'un profil d'aile",paragraphs:["Vu en coupe, un profil d'aile pr\xE9sente un bord d'attaque (l'avant, arrondi) et un bord de fuite (l'arri\xE8re, effil\xE9). La surface sup\xE9rieure se nomme l'extrados, la surface inf\xE9rieure l'intrados. La corde est la ligne droite qui relie le bord d'attaque au bord de fuite.","L'angle d'incidence est l'angle form\xE9 entre la corde du profil et la direction du vent relatif, c'est-\xE0-dire la direction dans laquelle l'air aborde l'aile. Ce n'est pas la m\xEAme chose que l'assiette de l'avion : on peut avoir une forte incidence m\xEAme en vol horizontal, par exemple \xE0 basse vitesse."]},{type:"diagram",level:"BIA",diagramId:"airfoil",caption:"Coupe d'un profil d'aile cambr\xE9, avec le vent relatif et l'angle d'incidence."},{type:"text",level:"BIA",heading:"D'o\xF9 vient la portance ?",paragraphs:["L'aile d\xE9vie l'air vers le bas : par r\xE9action, l'air pousse l'aile vers le haut. Cette d\xE9viation s'accompagne d'une acc\xE9l\xE9ration de l'air au-dessus de l'extrados, qui cr\xE9e une d\xE9pression, tandis que l'air passant sous l'intrados est relativement plus comprim\xE9. Cette diff\xE9rence de pression entre extrados et intrados est la portance.","Plus l'angle d'incidence augmente, plus l'air est d\xE9vi\xE9 fortement et plus la portance augmente, jusqu'\xE0 un certain angle critique, au-del\xE0 duquel l'\xE9coulement d\xE9croche de l'extrados et la portance chute brutalement (voir la le\xE7on sur le d\xE9crochage)."]},{type:"text",level:"ATPL",heading:"La formule de la portance",paragraphs:["La portance ob\xE9it \xE0 la relation : Rz = \xBD \xB7 \u03C1 \xB7 V\xB2 \xB7 S \xB7 Cz, o\xF9 \u03C1 est la masse volumique de l'air, V la vitesse par rapport \xE0 l'air, S la surface alaire, et Cz le coefficient de portance, qui d\xE9pend essentiellement de la forme du profil et de l'angle d'incidence.","Cette formule explique pourquoi un avion doit acc\xE9l\xE9rer pour d\xE9coller, ou pourquoi il vole \xE0 plus forte incidence \xE0 basse vitesse : \xE0 portance \xE9gale au poids, si V diminue, Cz doit augmenter, donc l'incidence doit augmenter."]},{type:"text",level:"ATPL",heading:"La courbe de Cz en fonction de l'incidence",paragraphs:["Le coefficient Cz cro\xEEt de fa\xE7on presque lin\xE9aire avec l'angle d'incidence, jusqu'\xE0 un maximum, le Czmax, atteint \xE0 l'incidence critique (typiquement autour de 15 \xE0 16\xB0 pour un profil classique non hypersustent\xE9). Au-del\xE0, l'\xE9coulement d\xE9croche et Cz chute."]},{type:"diagram",level:"ATPL",diagramId:"cz-alpha",caption:"Coefficient de portance Cz en fonction de l'angle d'incidence : la chute apr\xE8s le maximum correspond au d\xE9crochage."}]},{id:"trainee",title:"La tra\xEEn\xE9e",summary:"Les diff\xE9rents types de tra\xEEn\xE9e, la finesse, et la vitesse de tra\xEEn\xE9e minimale.",blocks:[{type:"text",level:"BIA",heading:"Une force qui s'oppose au mouvement",paragraphs:["La tra\xEEn\xE9e est la composante de la r\xE9sistance de l'air parall\xE8le \xE0 la trajectoire, toujours oppos\xE9e \xE0 l'avancement. Elle augmente avec la vitesse et avec l'angle d'incidence : voler vite ou voler \xE0 forte incidence co\xFBte plus de tra\xEEn\xE9e."]},{type:"list",level:"ATPL",heading:"Les familles de tra\xEEn\xE9e",items:["Tra\xEEn\xE9e de frottement : due \xE0 la viscosit\xE9 de l'air qui \xAB colle \xBB aux surfaces (couche limite).","Tra\xEEn\xE9e de forme, ou de pression : due au d\xE9collement de l'\xE9coulement derri\xE8re les parties peu profil\xE9es.","Tra\xEEn\xE9e induite : sous-produit in\xE9vitable de la portance, li\xE9e aux tourbillons marginaux en bout d'aile ; elle diminue quand la vitesse augmente.","Tra\xEEn\xE9e d'interf\xE9rence : n\xE9e aux jonctions entre \xE9l\xE9ments de l'avion, par exemple aile-fuselage.","Tra\xEEn\xE9e de compressibilit\xE9, ou d'onde : appara\xEEt \xE0 haute vitesse, proche du mach de l'avion, surtout pertinente pour les avions rapides."]},{type:"text",level:"ATPL",heading:"Tra\xEEn\xE9e parasite et tra\xEEn\xE9e induite",paragraphs:["On regroupe souvent frottement, forme et interf\xE9rence sous le nom de tra\xEEn\xE9e parasite, qui cro\xEEt avec le carr\xE9 de la vitesse. \xC0 l'inverse, la tra\xEEn\xE9e induite d\xE9cro\xEEt quand la vitesse augmente, car elle est li\xE9e \xE0 l'incidence : plus on vole vite, moins il faut d'incidence pour porter le m\xEAme poids.","La tra\xEEn\xE9e totale, somme des deux, pr\xE9sente donc un minimum pour une vitesse particuli\xE8re : voler plus lentement ou plus vite que cette vitesse co\xFBte plus de tra\xEEn\xE9e."]},{type:"diagram",level:"ATPL",diagramId:"drag",caption:"Tra\xEEn\xE9e parasite, tra\xEEn\xE9e induite et tra\xEEn\xE9e totale en fonction de la vitesse (courbe sch\xE9matique, pas des donn\xE9es r\xE9elles)."},{type:"text",level:"ATPL",heading:"La finesse",paragraphs:["La finesse est le rapport entre la portance et la tra\xEEn\xE9e, Cz / Cx, ou de fa\xE7on \xE9quivalente la distance parcourue pour chaque m\xE8tre de chute en vol plan\xE9. Elle est maximale pr\xE9cis\xE9ment \xE0 la vitesse de tra\xEEn\xE9e minimale. C'est une donn\xE9e essentielle en cas de panne moteur : voler \xE0 la vitesse de finesse max permet de parcourir la plus grande distance possible avant de se poser.","Les ordres de grandeur varient \xE9norm\xE9ment selon le type d'appareil : environ 8 \xE0 10 pour un avion de tourisme, autour de 15 \xE0 20 pour un avion de ligne moteurs coup\xE9s, et jusqu'\xE0 40, voire 60 ou plus pour un planeur de performance, taill\xE9 sp\xE9cifiquement pour minimiser la tra\xEEn\xE9e."]},{type:"text",level:"ATPL",heading:"R\xE9duire la tra\xEEn\xE9e induite : les winglets",paragraphs:["Les ailettes verticales en bout d'aile, les winglets, r\xE9duisent l'intensit\xE9 des tourbillons marginaux responsables de la tra\xEEn\xE9e induite, en limitant le contournement de l'air entre intrados et extrados en bout de voilure. Sur un avion de ligne, ce gain se traduit directement par une consommation de carburant r\xE9duite sur longue distance, ce qui explique leur g\xE9n\xE9ralisation progressive depuis les ann\xE9es 1990."]}]},{id:"decrochage",title:"Le d\xE9crochage",summary:"M\xE9canisme, facteurs aggravants, signes avant-coureurs et r\xE9cup\xE9ration.",blocks:[{type:"text",level:"BIA",heading:"Une question d'angle, pas seulement de vitesse",paragraphs:["Le d\xE9crochage survient quand l'angle d'incidence d\xE9passe l'angle critique : l'\xE9coulement d'air ne suit plus la forme de l'extrados, se d\xE9colle, et la portance chute brutalement. Contrairement \xE0 une id\xE9e re\xE7ue, le d\xE9crochage n'est pas d'abord une question de vitesse trop faible : il peut survenir \xE0 n'importe quelle vitesse, d\xE8s que l'incidence critique est d\xE9pass\xE9e.","Les signes avant-coureurs habituels sont des vibrations de la cellule, le buffet, caus\xE9es par l'\xE9coulement perturb\xE9 qui frappe l'empennage, une perte d'efficacit\xE9 des gouvernes, et sur de nombreux avions une alarme sonore d\xE9di\xE9e."]},{type:"text",level:"ATPL",heading:"La vitesse de d\xE9crochage",paragraphs:["En posant Rz = Poids \xE0 Czmax, on obtient la vitesse de d\xE9crochage : Vs = racine carr\xE9e de (2\xB7W / (\u03C1\xB7S\xB7Czmax)). Cette vitesse augmente avec la masse de l'avion, et diminue si Czmax augmente, par exemple volets sortis.","Elle augmente aussi avec le facteur de charge : un virage inclin\xE9 ou une ressource brutale augmentent la vitesse de d\xE9crochage effective, m\xEAme si le poids r\xE9el n'a pas chang\xE9 (voir la le\xE7on sur le virage). C'est ce qu'on appelle un d\xE9crochage acc\xE9l\xE9r\xE9 : il peut survenir \xE0 une vitesse largement sup\xE9rieure au Vs de r\xE9f\xE9rence en vol droit et en palier."]},{type:"text",level:"ATPL",heading:"R\xE9cup\xE9ration",paragraphs:["La technique de r\xE9cup\xE9ration standard consiste d'abord \xE0 r\xE9duire l'angle d'incidence, en poussant l\xE9g\xE8rement sur le manche, pour redonner \xE0 l'aile un \xE9coulement sain, avant d'appliquer la puissance et de r\xE9tablir les ailes \xE0 l'horizontale, au pied si besoin pour \xE9viter d'aggraver une dissym\xE9trie. Un d\xE9crochage dissym\xE9trique, mal ma\xEEtris\xE9, peut d\xE9g\xE9n\xE9rer en vrille, un r\xE9gime avanc\xE9 qui fait l'objet d'un entra\xEEnement sp\xE9cifique."]}]},{id:"axes-gouvernes",title:"Les trois axes et les gouvernes",summary:"Tangage, roulis, lacet, et les surfaces qui les commandent.",blocks:[{type:"text",level:"BIA",heading:"Trois axes, trois mouvements",paragraphs:["Un avion peut tourner autour de trois axes qui se croisent au centre de gravit\xE9. L'axe de tangage est transversal, d'une aile \xE0 l'autre : il commande le mouvement de nez qui monte ou descend, contr\xF4l\xE9 par la gouverne de profondeur, sur l'empennage horizontal.","L'axe de roulis est longitudinal, du nez \xE0 la queue : il commande l'inclinaison des ailes, contr\xF4l\xE9e par les ailerons, en bout d'aile. L'axe de lacet est vertical : il commande le mouvement du nez \xE0 droite ou \xE0 gauche, contr\xF4l\xE9 par la gouverne de direction, sur l'empennage vertical, la d\xE9rive."]},{type:"diagram",level:"BIA",diagramId:"three-axes",caption:"Les trois axes de rotation d'un avion et les gouvernes associ\xE9es."},{type:"text",level:"ATPL",heading:"Le lacet induit",paragraphs:["Actionner les ailerons pour s'incliner produit un effet secondaire ind\xE9sirable : l'aileron qui s'abaisse d'un c\xF4t\xE9 augmente la portance, donc la tra\xEEn\xE9e induite, de ce c\xF4t\xE9, ce qui fait l\xE9g\xE8rement lacet du c\xF4t\xE9 oppos\xE9 au virage d\xE9sir\xE9. C'est le lacet induit, corrig\xE9 en pratique par une coordination au palonnier lors de l'entr\xE9e en virage."]},{type:"text",level:"ATPL",heading:"Compensateur et stabilit\xE9",paragraphs:["Le compensateur, ou trim, est une petite surface, g\xE9n\xE9ralement sur la gouverne de profondeur, qui permet d'annuler l'effort que le pilote doit exercer sur les commandes pour maintenir une assiette donn\xE9e. Ce n'est pas une commande de vol primaire, seulement une aide au pilotage.","Un avion est con\xE7u pour \xEAtre naturellement stable autour de ces trois axes : l'empennage horizontal assure la stabilit\xE9 longitudinale, la d\xE9rive la stabilit\xE9 de route, et la forme en di\xE8dre des ailes contribue \xE0 la stabilit\xE9 lat\xE9rale."]},{type:"text",level:"ATPL",heading:"L'effet girouette et le di\xE8dre",paragraphs:["La stabilit\xE9 de route s'explique simplement : si l'avion d\xE9rape, la d\xE9rive, en arri\xE8re du centre de gravit\xE9, re\xE7oit le vent relatif de travers et produit une force qui ram\xE8ne le nez dans l'axe, exactement comme une girouette s'aligne avec le vent. C'est l'effet girouette.","Le di\xE8dre, l'angle vers le haut des ailes vues de face, stabilise le roulis par un m\xE9canisme voisin : si une aile s'abaisse, l'avion glisse l\xE9g\xE8rement de ce c\xF4t\xE9, ce qui augmente l'incidence de l'aile basse par rapport \xE0 l'aile haute et la fait remonter. La position des ailes sur le fuselage joue aussi : une voilure haute est intrins\xE8quement plus stable en roulis qu'une voilure basse, qui en a souvent besoin d'un peu plus pour compenser."]},{type:"text",level:"ATPL",heading:"Le foyer, pivot de la stabilit\xE9 longitudinale",paragraphs:["La stabilit\xE9 longitudinale, elle, d\xE9pend de la position relative de deux points : le centre de gravit\xE9 et le foyer a\xE9rodynamique, le point autour duquel les variations de portance dues \xE0 l'incidence s'appliquent, situ\xE9 autour du quart avant de la corde. Pour qu'un avion soit stable en tangage, le centre de gravit\xE9 doit rester devant le foyer, avec une marge suffisante : c'est tout l'enjeu du respect du domaine de centrage vu dans le module Pr\xE9paration du vol."]}]},{id:"virage",title:"Le virage et le facteur de charge",summary:"Comment un avion vire, et pourquoi virer serr\xE9 rapproche du d\xE9crochage.",blocks:[{type:"text",level:"BIA",heading:"Virer en inclinant",paragraphs:["Pour virer, le pilote incline l'avion par le roulis. Une partie de la portance, jusque-l\xE0 enti\xE8rement verticale, devient horizontale et \xAB tire \xBB l'avion vers l'int\xE9rieur du virage. M\xE9caniquement, la composante verticale de la portance diminue alors : pour ne pas perdre d'altitude, il faut augmenter la portance totale, donc l'incidence, en tirant l\xE9g\xE8rement sur le manche."]},{type:"text",level:"ATPL",heading:"Le facteur de charge",paragraphs:["Le facteur de charge n est le rapport entre la portance et le poids r\xE9el de l'avion : n = 1 / cos(\u03C6), o\xF9 \u03C6 est l'angle d'inclinaison. Il traduit ce que ressentent les occupants : \xE0 n = 2, tout se passe comme si le poids de l'avion avait doubl\xE9."]},{type:"table",level:"ATPL",headers:["Inclinaison","Facteur de charge n","Vitesse de d\xE9crochage"],rows:[["0\xB0","1,00","100 %"],["30\xB0","1,15","107 %"],["45\xB0","1,41","119 %"],["60\xB0","2,00","141 %"]],caption:"La vitesse de d\xE9crochage en virage vaut Vs (palier) multipli\xE9e par la racine carr\xE9e de n : elle augmente avec l'inclinaison."},{type:"text",level:"ATPL",paragraphs:["Cette augmentation de la vitesse de d\xE9crochage en virage inclin\xE9 est une donn\xE9e de s\xE9curit\xE9 essentielle : un virage engag\xE9 \xE0 basse vitesse, pr\xE8s du sol, en tour de piste par exemple, rapproche significativement de l'incidence critique, m\xEAme sans que la vitesse affich\xE9e n'ait chang\xE9."]},{type:"text",level:"ATPL",heading:"Des limites structurales, pas seulement a\xE9rodynamiques",paragraphs:["Le facteur de charge n'est pas seulement une question de d\xE9crochage : la structure elle-m\xEAme n'encaisse qu'une plage limit\xE9e, certifi\xE9e par le constructeur. Un avion de cat\xE9gorie normale est g\xE9n\xE9ralement limit\xE9 \xE0 environ +4 g et -2 g, contre +6 g et -4 g pour un avion certifi\xE9 voltige, con\xE7u pour encaisser des man\u0153uvres bien plus violentes sans dommage structurel."]}]},{id:"vitesses-hypersustentation",title:"Vitesses caract\xE9ristiques et hypersustentation",summary:"Le r\xF4le des volets et le vocabulaire des vitesses limites (Vs, Vfe, Vne, Va...).",blocks:[{type:"text",level:"BIA",heading:"\xC0 quoi servent les volets",paragraphs:["Les volets augmentent la cambrure du profil, donc le Czmax : \xE0 portance \xE9gale, l'avion peut voler, et surtout d\xE9coller et atterrir, \xE0 une vitesse plus faible. C'est ce qui permet d'utiliser des pistes plus courtes. En contrepartie, sortir les volets augmente aussi la tra\xEEn\xE9e."]},{type:"list",level:"ATPL",heading:"Le vocabulaire des vitesses limites",items:["Vs : vitesse de d\xE9crochage en configuration lisse, volets rentr\xE9s.","Vs0 : vitesse de d\xE9crochage en configuration atterrissage, volets sortis.","Vfe : vitesse maximale volets sortis, \xE0 ne pas d\xE9passer sous peine d'endommager les volets.","Vno : vitesse maximale en utilisation normale, en air turbulent notamment.","Vne : vitesse \xE0 ne jamais d\xE9passer, quelles que soient les conditions.","Va : vitesse de man\u0153uvre, la vitesse maximale \xE0 laquelle les gouvernes peuvent \xEAtre braqu\xE9es \xE0 fond sans risque pour la structure.","Vx et Vy : respectivement la vitesse de mont\xE9e \xE0 meilleur angle, pour franchir un obstacle, et \xE0 meilleur taux, pour gagner de l'altitude le plus vite possible."]},{type:"text",level:"ATPL",heading:"Sur l'an\xE9mom\xE8tre",paragraphs:["Plusieurs de ces vitesses sont mat\xE9rialis\xE9es par des arcs de couleur sur l'an\xE9mom\xE8tre : arc blanc pour la plage d'utilisation des volets, de Vs0 \xE0 Vfe, arc vert pour l'utilisation normale, de Vs \xE0 Vno, arc jaune de Vno \xE0 Vne en zone de prudence, et trait rouge \xE0 Vne. De quoi lire d'un coup d'\u0153il dans quelle configuration on se trouve."]}]},{id:"vol-plane",title:"Le vol plan\xE9",summary:"Voler sans moteur : taux de chute, meilleure finesse, et ce que change le vent.",blocks:[{type:"text",level:"BIA",paragraphs:["Moteur coup\xE9 ou au ralenti, un avion peut continuer \xE0 voler en descente r\xE9guli\xE8re : c'est le vol plan\xE9. La pesanteur remplace alors la traction pour fournir l'\xE9nergie n\xE9cessaire \xE0 vaincre la tra\xEEn\xE9e, ce qui explique pourquoi l'avion perd continuellement de l'altitude."]},{type:"text",level:"ATPL",heading:"Taux de chute et vitesse de meilleure finesse",paragraphs:["Deux vitesses caract\xE9risent le plan\xE9 : la vitesse de taux de chute minimal, qui permet de rester en l'air le plus longtemps possible, utile pour attendre une \xE9claircie en planeur, et la vitesse de meilleure finesse, qui maximise la distance parcourue, la seule qui compte vraiment en cas de panne moteur pour rallier un terrain. Ces deux vitesses sont proches mais distinctes, et plus faibles que la vitesse de croisi\xE8re habituelle.","Le vent modifie la distance franchissable sans en changer la finesse r\xE9elle par rapport \xE0 l'air : face au vent, il faut augmenter l\xE9g\xE8rement la vitesse par rapport \xE0 la vitesse de finesse max en air calme pour optimiser la distance sol, et inversement vent arri\xE8re."]}]},{id:"stabilite-dynamique",title:"Stabilit\xE9 dynamique et confort de vol",summary:"Ce qui se passe apr\xE8s une perturbation : retour direct ou oscillations amorties.",blocks:[{type:"text",level:"BIA",paragraphs:["La stabilit\xE9 statique, d\xE9j\xE0 vue, dit seulement si un avion tend \xE0 revenir vers son \xE9quilibre apr\xE8s une perturbation. La stabilit\xE9 dynamique pr\xE9cise comment il y revient : directement, en oscillant avec des oscillations qui s'amortissent, ou, dans le pire des cas, en oscillant de plus en plus fort."]},{type:"text",level:"ATPL",heading:"Le phugo\xEFde",paragraphs:["Le mode d'oscillation longitudinale le plus connu est le phugo\xEFde : une lente oscillation de plusieurs dizaines de secondes, o\xF9 l'avion \xE9change de la vitesse contre de l'altitude et inversement, le nez montant et descendant doucement sans que l'incidence ne varie beaucoup. Un avion bien con\xE7u amortit ce mouvement de lui-m\xEAme en quelques cycles ; un pilote peut aussi l'amortir activement aux commandes.","D'autres modes existent en roulis-lacet, comme le roulis hollandais, une oscillation coupl\xE9e plus rapide, g\xE9n\xE9ralement jugul\xE9e par un amortisseur de lacet sur les avions qui y sont sensibles, notamment les avions de ligne \xE0 fl\xE8che marqu\xE9e."]}]},{id:"haute-vitesse",title:"A\xE9rodynamique \xE0 haute vitesse",summary:"Ce qui change quand l'\xE9coulement approche la vitesse du son.",blocks:[{type:"text",level:"BIA",paragraphs:["Aux vitesses \xE9lev\xE9es, l'air ne se comporte plus tout \xE0 fait comme un fluide incompressible : il se comprime localement devant l'avion. Ce ph\xE9nom\xE8ne, la compressibilit\xE9, ne devient significatif qu'\xE0 l'approche de la vitesse du son, et ne concerne donc pas l'aviation l\xE9g\xE8re, mais bien les avions de ligne et les avions de chasse."]},{type:"text",level:"ATPL",heading:"Nombre de Mach et onde de choc",paragraphs:["Le nombre de Mach exprime la vitesse de l'avion en proportion de la vitesse du son locale, qui d\xE9pend elle-m\xEAme de la temp\xE9rature de l'air. M\xEAme en croisi\xE8re subsonique, l'\xE9coulement acc\xE9l\xE9r\xE9 au-dessus de l'extrados d'une aile peut localement d\xE9passer Mach 1 avant le reste de l'avion : une onde de choc appara\xEEt alors \xE0 cet endroit, cr\xE9ant une tra\xEEn\xE9e suppl\xE9mentaire, la tra\xEEn\xE9e d'onde, et parfois une perturbation de l'\xE9coulement en aval.","C'est pour repousser l'apparition de cette onde de choc vers une vitesse de croisi\xE8re plus \xE9lev\xE9e que les ailes des avions de ligne sont dessin\xE9es en fl\xE8che : cela r\xE9duit la composante de vitesse per\xE7ue par le profil perpendiculairement au bord d'attaque, et retarde d'autant les effets de compressibilit\xE9."]}]}]},{id:"aeronefs",title:"Connaissance des a\xE9ronefs",tagline:"Cellules, structures, moteurs \xE0 pistons et turbines, instruments de bord.",Icon:rn,status:"available",lessons:[{id:"structure-cellule",title:"Structure et cellule",summary:"Les grands ensembles d'un avion, les mat\xE9riaux, et les modes de construction.",blocks:[{type:"text",level:"BIA",heading:"Les grands ensembles",paragraphs:["Un avion se d\xE9compose en quelques grands ensembles : le fuselage, qui loge l'\xE9quipage et la charge utile ; la voilure, qui porte l'avion ; l'empennage, \xE0 l'arri\xE8re, qui assure la stabilit\xE9 et le pilotage en tangage et en lacet ; et le train d'atterrissage, qui supporte l'avion au sol.","Les mat\xE9riaux ont \xE9volu\xE9 avec le temps : bois et toile pour les premiers avions, alliages d'aluminium \xE0 partir des ann\xE9es 1930, puis mat\xE9riaux composites, plus l\xE9gers \xE0 r\xE9sistance \xE9gale, de plus en plus pr\xE9sents sur les avions r\xE9cents."]},{type:"text",level:"ATPL",heading:"Efforts structuraux",paragraphs:["La structure est dimensionn\xE9e pour encaisser des efforts en vol (rafales, man\u0153uvres, facteur de charge) et au sol (atterrissage, roulage). La voilure elle-m\xEAme est un assemblage de longerons, qui reprennent l'essentiel des efforts de flexion, et de nervures, qui donnent sa forme au profil.","C'est ce dimensionnement structural qui fixe la vitesse de man\u0153uvre Va, d\xE9j\xE0 vue dans le module A\xE9rodynamique : au-del\xE0, un braquage complet des gouvernes pourrait d\xE9passer les efforts admissibles par la cellule."]},{type:"text",level:"BIA",heading:"Une peau qui travaille",paragraphs:["La plupart des avions modernes utilisent une construction dite semi-monocoque : le rev\xEAtement ext\xE9rieur participe lui-m\xEAme \xE0 la r\xE9sistance de la structure, \xE9paul\xE9 par des cadres et des lisses, plut\xF4t que de simplement habiller une charpente interne qui porterait tous les efforts \xE0 elle seule."]},{type:"text",level:"ATPL",heading:"Fatigue et corrosion",paragraphs:["Cette conception r\xE9duit la masse par rapport \xE0 une structure enti\xE8rement treillis, mais impose une surveillance attentive de la fatigue, l'endommagement progressif d'un mat\xE9riau soumis \xE0 des cycles r\xE9p\xE9t\xE9s d'efforts, et de la corrosion, en particulier sur les avions pressuris\xE9s qui cumulent de nombreux cycles de mise en pression et de d\xE9pressurisation au fil de leur carri\xE8re. C'est pour cette raison que chaque cellule a une dur\xE9e de vie certifi\xE9e, exprim\xE9e en heures de vol ou en cycles."]}]},{id:"motorisation",title:"Motorisation : pistons et turbines",summary:"Le cycle \xE0 quatre temps, l'h\xE9lice, puis les turbor\xE9acteurs et turbopropulseurs.",blocks:[{type:"text",level:"BIA",heading:"Le moteur \xE0 pistons",paragraphs:["La plupart des avions l\xE9gers volent avec un moteur \xE0 pistons fonctionnant en quatre temps : admission du m\xE9lange air-essence, compression, combustion qui pousse le piston, puis \xE9chappement des gaz br\xFBl\xE9s. Le moteur entra\xEEne une h\xE9lice, qui transforme ce couple en traction en acc\xE9l\xE9rant une masse d'air vers l'arri\xE8re."]},{type:"diagram",level:"BIA",diagramId:"four-stroke",caption:"Le cycle \xE0 quatre temps : admission, compression, combustion, \xE9chappement."},{type:"text",level:"ATPL",heading:"Richesse du m\xE9lange et givrage carburateur",paragraphs:["En altitude, l'air se rar\xE9fie : le m\xE9lange devient trop riche en essence si l'on ne corrige rien, d'o\xF9 la commande de richesse (mixture) que le pilote doit r\xE9gler. Un carburateur peut aussi givrer par temps humide, m\xEAme \xE0 temp\xE9rature positive, \xE0 cause du refroidissement d\xFB \xE0 la vaporisation de l'essence : d'o\xF9 l'usage pr\xE9ventif du r\xE9chauffage carburateur."]},{type:"text",level:"ATPL",heading:"L'h\xE9lice",paragraphs:["Une h\xE9lice \xE0 pas fixe garde le m\xEAme angle de calage de ses pales quelles que soient les conditions : simple et l\xE9ger, ce compromis n'est optimal que sur une plage de vitesses r\xE9duite. Une h\xE9lice \xE0 pas variable permet au contraire d'ajuster cet angle en vol, pour rester efficace aussi bien \xE0 basse vitesse, au d\xE9collage, qu'\xE0 vitesse de croisi\xE8re \xE9lev\xE9e, un peu comme changer de rapport sur une transmission."]},{type:"text",level:"BIA",heading:"Turbor\xE9acteurs et turbopropulseurs",paragraphs:["Une turbine aspire l'air, le comprime, y br\xFBle du carburant, puis d\xE9tend les gaz \xE0 travers une turbine qui entra\xEEne le compresseur. Le turbor\xE9acteur \xE9jecte ces gaz \xE0 grande vitesse pour produire sa pouss\xE9e ; le turbopropulseur utilise l'essentiel de l'\xE9nergie pour entra\xEEner une h\xE9lice via un r\xE9ducteur."]},{type:"text",level:"ATPL",paragraphs:["Le turbofan, utilis\xE9 par la plupart des avions de ligne, est un compromis : une soufflante fait passer une partie de l'air autour du c\u0153ur du r\xE9acteur sans le br\xFBler. Le taux de dilution (bypass ratio) mesure ce partage ; un taux \xE9lev\xE9 am\xE9liore la consommation et r\xE9duit le bruit, au prix d'une soufflante plus large. Sur les r\xE9acteurs les plus r\xE9cents, ce taux peut d\xE9passer 10, ce qui signifie que l'essentiel de la pouss\xE9e provient de l'air froid souffl\xE9 autour du c\u0153ur plut\xF4t que des gaz de combustion eux-m\xEAmes.","Entre les deux, le turbopropulseur reste pertinent sur une plage de vitesse interm\xE9diaire, grossi\xE8rement de 300 \xE0 800 km/h : plus efficace qu'un turbor\xE9acteur \xE0 ces vitesses mod\xE9r\xE9es, mais d\xE9pass\xE9 par le turbofan d\xE8s que la vitesse de croisi\xE8re augmente."]}]},{id:"systemes-bord",title:"Syst\xE8mes de bord",summary:"Circuit carburant, circuit \xE9lectrique, commandes hydrauliques, et pressurisation.",blocks:[{type:"text",level:"BIA",heading:"Le circuit carburant",paragraphs:["Le carburant est stock\xE9 dans des r\xE9servoirs, le plus souvent log\xE9s dans les ailes, et amen\xE9 au moteur par gravit\xE9 ou par une pompe. Un s\xE9lecteur permet en g\xE9n\xE9ral de choisir le r\xE9servoir utilis\xE9, et une jauge en indique la quantit\xE9 restante, \xE0 recouper avec un calcul de consommation plut\xF4t qu'\xE0 suivre aveugl\xE9ment."]},{type:"text",level:"BIA",heading:"Le circuit \xE9lectrique",paragraphs:["L'\xE9lectricit\xE9 de bord, produite par un alternateur entra\xEEn\xE9 par le moteur et stock\xE9e dans une batterie, alimente la radio, les instruments \xE9lectroniques et l'\xE9clairage. Une panne de g\xE9n\xE9ration laisse en g\xE9n\xE9ral une autonomie limit\xE9e sur la seule batterie, d'o\xF9 l'int\xE9r\xEAt de r\xE9duire la consommation \xE9lectrique en cas de panne."]},{type:"text",level:"ATPL",heading:"Commandes hydrauliques et pressurisation",paragraphs:["Sur les avions plus lourds, un circuit hydraulique d\xE9multiplie la force du pilote pour actionner le train d'atterrissage, les volets ou les gouvernes, des charges trop importantes pour des commandes purement m\xE9caniques. Ces avions volent aussi souvent en altitude au-dessus de ce que le corps humain tol\xE8re sans assistance : un syst\xE8me de pressurisation maintient alors une pression cabine confortable, correspondant \xE0 une altitude bien inf\xE9rieure \xE0 l'altitude r\xE9elle de vol.","Ces syst\xE8mes redondants (plusieurs circuits hydrauliques et \xE9lectriques ind\xE9pendants, par exemple) illustrent un principe g\xE9n\xE9ral de s\xE9curit\xE9 en a\xE9ronautique : la panne d'un seul \xE9l\xE9ment ne doit jamais, \xE0 elle seule, compromettre la suite du vol."]}]},{id:"instruments-bord",title:"Instruments de bord",summary:"Les instruments de base du poste de pilotage, leurs sources, et leurs pannes classiques.",blocks:[{type:"list",level:"BIA",heading:"Les instruments de base",items:["L'an\xE9mom\xE8tre indique la vitesse par rapport \xE0 l'air.","L'altim\xE8tre indique l'altitude par rapport \xE0 un niveau de r\xE9f\xE9rence (QNH, QFE ou 1013).","Le variom\xE8tre indique la vitesse verticale, mont\xE9e ou descente.","L'horizon artificiel donne l'assiette de l'avion par rapport \xE0 l'horizon r\xE9el.","Le conservateur de cap et le compas donnent le cap suivi.","L'indicateur de virage et de d\xE9rapage renseigne sur la qualit\xE9 du virage."]},{type:"text",level:"ATPL",heading:"D'o\xF9 viennent ces informations",paragraphs:["An\xE9mom\xE8tre, altim\xE8tre et variom\xE8tre sont dits an\xE9mobarom\xE9triques : ils exploitent la pression statique et la pression dynamique capt\xE9e par le tube de Pitot et les prises statiques. Horizon artificiel et conservateur de cap sont traditionnellement gyroscopiques, aujourd'hui souvent remplac\xE9s par des centrales \xE0 capteurs \xE9lectroniques (centrales \xE0 inertie ou ADAHRS).","Cette distinction explique certaines pannes classiques : un tube Pitot obstru\xE9, par exemple par du givre, fait d\xE9river l'indication de l'an\xE9mom\xE8tre, tandis qu'une prise statique bouch\xE9e affecte \xE0 la fois l'an\xE9mom\xE8tre, l'altim\xE8tre et le variom\xE8tre."]},{type:"text",level:"ATPL",heading:"Du \xAB six pack \xBB au glass cockpit",paragraphs:["Historiquement, ces six instruments de base sont dispos\xE9s selon un arrangement standardis\xE9, surnomm\xE9 le \xAB six pack \xBB, pour que tout pilote retrouve ses rep\xE8res d'un avion \xE0 l'autre. Sur les avions plus r\xE9cents, un ou deux grands \xE9crans \xE9lectroniques (glass cockpit) regroupent ces m\xEAmes informations, avec souvent une int\xE9gration de la navigation directement dans l'affichage de vol."]}]},{id:"train-atterrissage",title:"Le train d'atterrissage",summary:"Configurations classiques, amortissement, et freinage.",blocks:[{type:"text",level:"BIA",paragraphs:["Le train tricycle, une roue avant et deux roues principales sous le fuselage ou les ailes, \xE9quipe la grande majorit\xE9 des avions modernes : il offre une bonne visibilit\xE9 au roulage et une tenue de piste plus facile que l'ancienne configuration classique, roue arri\xE8re, aujourd'hui surtout pr\xE9sente sur des avions de voltige ou historiques."]},{type:"text",level:"ATPL",heading:"Amortissement et freinage",paragraphs:["Chaque jambe de train int\xE8gre un amortisseur, souvent ol\xE9opneumatique (un m\xE9lange d'huile et d'azote comprim\xE9), qui absorbe l'\xE9nergie de l'impact \xE0 l'atterrissage pour \xE9viter de la transmettre brutalement \xE0 la structure. Sur les avions plus lourds, le train est r\xE9tractable pour r\xE9duire la tra\xEEn\xE9e en croisi\xE8re, actionn\xE9 par un circuit hydraulique redondant, avec un syst\xE8me de secours en cas de panne \xE9lectrique ou hydraulique pour le sortir malgr\xE9 tout."]}]},{id:"helicopteres",title:"H\xE9licopt\xE8res : principe du vol",summary:"Comment un rotor remplace \xE0 la fois l'aile et l'h\xE9lice, et pourquoi il faut un rotor de queue.",blocks:[{type:"text",level:"BIA",paragraphs:["Un h\xE9licopt\xE8re produit sa portance avec un rotor principal, en fait une aile tournante : chaque pale, en tournant, g\xE9n\xE8re de la portance comme le ferait une aile d'avion en translation. Cela lui permet de d\xE9coller et d'atterrir \xE0 la verticale, et de rester stationnaire en vol, deux choses impossibles pour un avion classique."]},{type:"text",level:"ATPL",heading:"Pourquoi un rotor de queue",paragraphs:["Faire tourner le rotor principal exerce, par r\xE9action, un couple qui tend \xE0 faire tourner le fuselage en sens inverse. Le rotor de queue, sur la configuration la plus courante, compense ce couple en soufflant lat\xE9ralement ; c'est en changeant le pas de ses pales, via le palonnier, que le pilote contr\xF4le le cap de l'h\xE9licopt\xE8re en stationnaire. Le pas cyclique, qui incline le disque rotor, donne le d\xE9placement horizontal ; le pas collectif, qui change l'incidence de toutes les pales \xE0 la fois, donne la portance globale."]}]},{id:"planeurs-ulm",title:"Planeurs et ULM",summary:"Deux familles d'a\xE9ronefs l\xE9gers, sans moteur ou tr\xE8s l\xE9gers, r\xE9gies par des r\xE8gles particuli\xE8res.",blocks:[{type:"text",level:"BIA",paragraphs:["Le planeur, sans moteur, exploite les ascendances de l'atmosph\xE8re (thermiques, pentes, ondes) pour prendre de l'altitude et rester en vol, parfois pendant des heures et sur des centaines de kilom\xE8tres. Sa finesse tr\xE8s \xE9lev\xE9e, souvent sup\xE9rieure \xE0 40, en fait l'a\xE9ronef le plus efficace a\xE9rodynamiquement."]},{type:"text",level:"ATPL",heading:"Les ULM",paragraphs:["Les ultra-l\xE9gers motoris\xE9s (ULM) forment une cat\xE9gorie \xE0 part, d\xE9finie par des limites de masse et de vitesse de d\xE9crochage plut\xF4t que par leur forme : on y trouve aussi bien des appareils qui ressemblent \xE0 de petits avions classiques que des pendulaires (une aile delta sous laquelle pend un chariot motoris\xE9) ou des autogires. Leur r\xE9glementation, plus l\xE9g\xE8re que celle de l'aviation g\xE9n\xE9rale classique, s'accompagne de limitations correspondantes, par exemple sur le survol des agglom\xE9rations."]}]},{id:"avionique-automatismes",title:"Avionique et automatismes",summary:"Du pilote automatique simple aux syst\xE8mes de gestion de vol modernes.",blocks:[{type:"text",level:"BIA",paragraphs:["Le pilote automatique d\xE9charge le pilote du maintien manuel de l'assiette ou du cap pendant les phases de vol stabilis\xE9es, ce qui lui laisse plus de temps pour naviguer, surveiller la m\xE9t\xE9o ou communiquer. M\xEAme simple, un pilote automatique de base peut tenir un cap et une altitude."]},{type:"text",level:"ATPL",heading:"Du pilote automatique au FMS",paragraphs:["Sur les avions de ligne, le pilote automatique se couple \xE0 un calculateur de gestion de vol (FMS, Flight Management System), qui conna\xEEt le plan de vol complet et peut piloter l'avion d'un point \xE0 l'autre, g\xE9rer la vitesse et l'altitude optimales, et parfois m\xEAme r\xE9aliser l'atterrissage. Cette automatisation, pr\xE9cieuse, d\xE9place aussi le r\xF4le du pilote vers la supervision des syst\xE8mes plut\xF4t que le pilotage manuel permanent, avec ses propres pi\xE8ges, d\xE9taill\xE9s dans le module Facteurs humains."]}]},{id:"materiaux-maintenance",title:"Mat\xE9riaux et maintenance",summary:"Alliages, composites, et le suivi technique qui garde un avion en \xE9tat de vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 des alliages d'aluminium historiques, les mat\xE9riaux composites (fibre de carbone ou de verre noy\xE9e dans une r\xE9sine) \xE9quipent une part croissante des avions r\xE9cents : plus l\xE9gers \xE0 r\xE9sistance \xE9gale, ils r\xE9sistent aussi mieux \xE0 la fatigue, m\xEAme si leur comportement \xE0 l'impact et leur r\xE9paration demandent une expertise diff\xE9rente de celle du m\xE9tal."]},{type:"text",level:"ATPL",heading:"Le suivi de navigabilit\xE9",paragraphs:["Un a\xE9ronef ne reste autoris\xE9 \xE0 voler que s'il respecte un programme d'entretien pr\xE9cis, d\xE9fini par le constructeur et approuv\xE9 par les autorit\xE9s : visites p\xE9riodiques, remplacement de pi\xE8ces \xE0 dur\xE9e de vie limit\xE9e, suivi individuel de chaque cellule et de chaque moteur dans un dossier technique. C'est cette tra\xE7abilit\xE9 m\xE9ticuleuse qui permet de d\xE9tecter une usure ou une fatigue anormale avant qu'elle ne devienne un probl\xE8me de s\xE9curit\xE9."]}]},{id:"carburants-lubrifiants",title:"Carburants et lubrifiants",summary:"Essence aviation, k\xE9ros\xE8ne, et pourquoi on ne peut pas les confondre.",blocks:[{type:"text",level:"BIA",paragraphs:["Les moteurs \xE0 pistons utilisent une essence sp\xE9cifique \xE0 l'aviation, diff\xE9rente de celle des voitures, formul\xE9e pour r\xE9sister au cliquetis (une combustion anormale et destructrice) m\xEAme \xE0 pleine puissance. Les turbines, elles, fonctionnent au k\xE9ros\xE8ne, un carburant plus proche du gazole, qui se vaporise et br\xFBle diff\xE9remment."]},{type:"text",level:"ATPL",heading:"Ne jamais se tromper de carburant",paragraphs:["Mettre du k\xE9ros\xE8ne dans un avion \xE0 pistons pr\xE9vu pour de l'essence aviation, ou inversement, est une des causes d'accident recens\xE9es, en particulier depuis l'apparition d'avions \xE0 pistons aliment\xE9s au diesel ou au k\xE9ros\xE8ne. C'est pourquoi les points d'avitaillement et les documents de bord pr\xE9cisent toujours sans ambigu\xEFt\xE9 le type de carburant requis, et pourquoi un pilote v\xE9rifie syst\xE9matiquement ce qui est r\xE9ellement vers\xE9 dans ses r\xE9servoirs."]}]}]},{id:"meteo",title:"M\xE9t\xE9orologie",tagline:"Masses d'air, nuages, vent, pression, et ph\xE9nom\xE8nes dangereux pour le vol.",Icon:hl,status:"available",lessons:[{id:"atmosphere-pression",title:"Atmosph\xE8re et pression",summary:"Les couches de l'atmosph\xE8re, la pression, et les calages altim\xE9triques.",blocks:[{type:"text",level:"BIA",heading:"La troposph\xE8re, domaine du vol",paragraphs:["L'aviation l\xE9g\xE8re \xE9volue dans la troposph\xE8re, la couche la plus basse de l'atmosph\xE8re, o\xF9 la temp\xE9rature diminue globalement avec l'altitude. La pression atmosph\xE9rique, elle, diminue \xE9galement avec l'altitude : c'est ce qui permet \xE0 l'altim\xE8tre, un barom\xE8tre gradu\xE9 en altitude, de fonctionner."]},{type:"list",level:"BIA",heading:"Les couches de l'atmosph\xE8re",items:["La troposph\xE8re, du sol jusqu'\xE0 environ 11 km (la tropopause) : c'est l\xE0 que se jouent tous les ph\xE9nom\xE8nes m\xE9t\xE9o, et o\xF9 volent la quasi-totalit\xE9 des avions.","La stratosph\xE8re, de 11 \xE0 50 km environ, qui contient l'essentiel de la couche d'ozone ; quelques avions supersoniques ou jets d'affaires y \xE9voluent en partie haute.","La m\xE9sosph\xE8re, de 50 \xE0 80 km, o\xF9 br\xFBlent la plupart des m\xE9t\xE9orites qui entrent dans l'atmosph\xE8re.","La thermosph\xE8re, de 80 \xE0 500 km environ, o\xF9 orbitent les satellites bas et la Station spatiale internationale."]},{type:"text",level:"ATPL",heading:"Calages altim\xE9triques",paragraphs:["L'atmosph\xE8re standard OACI (ISA) sert de r\xE9f\xE9rence th\xE9orique : 1013,25 hPa et 15\xB0C au niveau de la mer, une masse volumique de l'air de 1,225 kg/m\xB3, et un gradient de temp\xE9rature standard d'environ 2\xB0C tous les 1 000 pieds en montant jusqu'\xE0 la tropopause, fix\xE9e \xE0 11 km, au-del\xE0 de laquelle la temp\xE9rature reste constante \xE0 -56,5\xB0C. En pratique, le pilote r\xE8gle son altim\xE8tre sur le QNH, la pression ramen\xE9e au niveau de la mer, pour lire son altitude par rapport \xE0 ce niveau, sur le QFE pour lire sa hauteur par rapport au terrain, ou sur 1013 en niveau de vol, au-dessus d'une altitude de transition.","Un rep\xE8re pratique \xE0 retenir pour les basses couches : un \xE9cart de pression de 1 hPa correspond \xE0 peu pr\xE8s \xE0 28 ft, soit environ 8,5 m."]},{type:"text",level:"ATPL",heading:"Quand l'altim\xE8tre ment un peu",paragraphs:["L'altim\xE8tre suppose une atmosph\xE8re standard : quand la temp\xE9rature ou la pression r\xE9elles s'\xE9cartent de cette r\xE9f\xE9rence, l'altitude lue diff\xE8re de l'altitude vraie. La r\xE8gle \xE0 retenir tient en une phrase consacr\xE9e par l'usage anglophone : d'un air chaud vers un air froid, ou d'une pression forte vers une pression faible, l'altitude vraie est plus basse que l'altitude lue \u2014 d'o\xF9 l'importance de mettre \xE0 jour son calage r\xE9guli\xE8rement en route."]},{type:"text",level:"BIA",heading:"La d\xE9viation du vent : force de Coriolis et loi de Buys-Ballot",paragraphs:["Le vent ne souffle pas en ligne droite des hautes vers les basses pressions : la rotation de la Terre le d\xE9vie, vers la droite dans l'h\xE9misph\xE8re Nord, vers la gauche dans l'h\xE9misph\xE8re Sud (force de Coriolis). Cons\xE9quence directe, r\xE9sum\xE9e par la loi de Buys-Ballot : dans l'h\xE9misph\xE8re Nord, le vent tourne dans le sens des aiguilles d'une montre autour d'un anticyclone, et dans le sens inverse autour d'une d\xE9pression. Cette d\xE9viation est plus marqu\xE9e en altitude, car le frottement au sol la r\xE9duit pr\xE8s de la surface."]}]},{id:"stabilite-atmosphere",title:"Stabilit\xE9 de l'atmosph\xE8re",summary:"Pourquoi l'air monte ou pas, et ce que cela change pour les nuages et la turbulence.",blocks:[{type:"text",level:"BIA",paragraphs:["Une bulle d'air qui s'\xE9l\xE8ve se d\xE9tend et se refroidit. Si, une fois mont\xE9e, elle se retrouve plus froide que l'air environnant, elle est plus dense et redescend : l'atmosph\xE8re est stable, le temps est plut\xF4t calme, avec des nuages plats en couches. Si au contraire elle reste plus chaude que l'air environnant, elle continue de monter : l'atmosph\xE8re est instable, favorable aux nuages \xE0 d\xE9veloppement vertical et aux averses."]},{type:"text",level:"ATPL",heading:"Gradient r\xE9el contre gradient adiabatique",paragraphs:["Plus pr\xE9cis\xE9ment, la stabilit\xE9 d\xE9pend de la comparaison entre le gradient thermique r\xE9el de l'atmosph\xE8re ce jour-l\xE0 et le gradient adiabatique, la vitesse \xE0 laquelle une particule d'air se refroidit en montant du seul fait de sa d\xE9tente (environ 1\xB0C par 100 m pour de l'air sec, moins pour de l'air satur\xE9 en humidit\xE9, qui se refroidit plus lentement gr\xE2ce \xE0 la chaleur lib\xE9r\xE9e par la condensation).","Si le gradient r\xE9el est plus fort que le gradient adiabatique, une particule d\xE9plac\xE9e vers le haut reste plus chaude que son environnement et continue de s'\xE9lever : l'air est instable. Dans le cas contraire, elle est frein\xE9e et retombe : l'air est stable. C'est ce m\xE9canisme qui explique pourquoi une m\xEAme masse d'air peut donner un ciel calme le matin et des cumulus bourgeonnants l'apr\xE8s-midi, une fois le sol suffisamment r\xE9chauff\xE9."]}]},{id:"nuages-vent",title:"Nuages, masses d'air et vent",summary:"Comment se forment les nuages, ce que sont les masses d'air et les fronts, et l'origine du vent.",blocks:[{type:"list",level:"BIA",heading:"Les familles de nuages",items:["\xC9tage bas (jusqu'\xE0 2 000 m environ) : cumulus, stratus, stratocumulus.","\xC9tage moyen : altocumulus, altostratus.","\xC9tage \xE9lev\xE9 (souvent au-del\xE0 de 6 000 m) : cirrus, cirrostratus, cirrocumulus, compos\xE9s de cristaux de glace.","D\xE9veloppement vertical : cumulonimbus, associ\xE9 aux orages, qui peut traverser plusieurs \xE9tages."]},{type:"diagram",level:"BIA",diagramId:"cloud-layers",caption:"Les familles de nuages selon l'\xE9tage d'altitude o\xF9 elles se forment."},{type:"text",level:"BIA",heading:"Des noms qui ont un sens",paragraphs:["Le nom de chaque nuage n'est pas arbitraire : le pr\xE9fixe \xAB cirro \xBB signale des cristaux de glace en altitude, \xAB alto \xBB un nuage d'\xE9tage moyen, et l'absence de pr\xE9fixe un nuage bas, fait de gouttelettes d'eau liquide. La racine du nom d\xE9crit elle la forme : \xAB stratus \xBB pour un nuage \xE9tal\xE9 en couche, typique d'un air stable, \xAB cumulus \xBB pour un nuage en amas moutonneux, typique d'un air instable, \xAB cirrus \xBB pour un nuage en filaments fins. Le suffixe ou pr\xE9fixe \xAB nimbus \xBB signale enfin un nuage porteur de pr\xE9cipitations.","Ce qui fait la diff\xE9rence entre un ciel stratifi\xE9 et calme et un ciel \xE0 cumulus bourgeonnants, c'est la stabilit\xE9 de l'atmosph\xE8re, d\xE9taill\xE9e dans la le\xE7on suivante : un air stable \xE9tale les nuages en couches, un air instable les fait grossir verticalement."]},{type:"text",level:"ATPL",heading:"Le point de ros\xE9e",paragraphs:["Le point de ros\xE9e est la temp\xE9rature \xE0 laquelle il faudrait refroidir l'air, \xE0 pression constante, pour que l'humidit\xE9 relative atteigne 100 % et que la condensation commence. Plus la temp\xE9rature r\xE9elle se rapproche de ce point de ros\xE9e, plus l'air est humide ; quand les deux deviennent \xE9gales, l'air est satur\xE9, et un nuage, de la brume ou du brouillard peuvent se former selon l'altitude \xE0 laquelle cela se produit."]},{type:"text",level:"ATPL",heading:"Masses d'air et fronts",paragraphs:["Une masse d'air est un volume d'atmosph\xE8re relativement homog\xE8ne en temp\xE9rature et en humidit\xE9. \xC0 la rencontre de deux masses d'air diff\xE9rentes se forme un front : un front chaud, o\xF9 l'air chaud glisse au-dessus de l'air froid, apporte un temps qui se d\xE9grade progressivement, souvent annonc\xE9 par des cirrus puis des altostratus des heures \xE0 l'avance ; un front froid, plus brutal, o\xF9 l'air froid soul\xE8ve l'air chaud, peut d\xE9clencher des orages sur une ligne \xE9troite et bien marqu\xE9e."]},{type:"text",level:"BIA",heading:"D'o\xF9 vient le vent",paragraphs:["Le vent est de l'air qui se d\xE9place des zones de haute pression vers les zones de basse pression. Sa vitesse et sa direction sont g\xE9n\xE9ralement diff\xE9rentes au sol et en altitude, notamment \xE0 cause du frottement sur le relief et les obstacles."]},{type:"text",level:"ATPL",heading:"Gradient de vent et cisaillement",paragraphs:["Le frottement au sol ralentit et d\xE9vie le vent par rapport \xE0 l'air libre juste au-dessus : c'est le gradient de vent, qui rend le vent plus fort et plus r\xE9gulier avec l'altitude, m\xEAme sur les premi\xE8res centaines de pieds. Un changement brutal de vitesse ou de direction sur une faible distance, le cisaillement de vent (wind shear), est particuli\xE8rement redout\xE9 au d\xE9collage et \xE0 l'atterrissage, notamment sous un orage ou en pr\xE9sence d'une inversion de temp\xE9rature marqu\xE9e."]}]},{id:"phenomenes-dangereux",title:"Ph\xE9nom\xE8nes dangereux pour le vol",summary:"Orage, givrage, brouillard : les ph\xE9nom\xE8nes qui imposent la plus grande prudence.",blocks:[{type:"list",level:"BIA",heading:"Trois dangers classiques",items:["L'orage, associ\xE9 au cumulonimbus : turbulence forte, gr\xEAle, foudre, rafales de vent violentes et changeantes sous le nuage.","Le givrage, d\xE9p\xF4t de glace sur la cellule ou le carburateur, qui d\xE9grade l'a\xE9rodynamique et peut r\xE9duire la puissance moteur.","Le brouillard, qui r\xE9duit fortement la visibilit\xE9, en particulier au d\xE9collage et \xE0 l'atterrissage."]},{type:"text",level:"ATPL",heading:"Le cycle de vie d'un orage",paragraphs:["Un orage isol\xE9 traverse trois phases : le stade cumulus, o\xF9 des courants ascendants alimentent le d\xE9veloppement du nuage sans pr\xE9cipitation encore au sol ; le stade mature, le plus dangereux, o\xF9 coexistent courants ascendants et descendants violents, avec pr\xE9cipitations, gr\xEAle possible et foudre ; puis le stade de dissipation, domin\xE9 par les courants descendants, o\xF9 l'orage perd progressivement son \xE9nergie."]},{type:"text",level:"ATPL",heading:"Un cumulonimbus, chiffr\xE9",paragraphs:["Un cumulonimbus mature peut g\xE9n\xE9rer des rafales de 30 \xE0 40 kt avec changement brutal de direction, des courants verticaux ascendants et descendants capables d'approcher 90 km/h, de la gr\xEAle, et de la foudre susceptible de perturber les \xE9quipements de radionavigation. Toutes ces menaces coexistent dans un m\xEAme nuage, ce qui explique pourquoi les cumulonimbus s'\xE9vitent largement, en vol comme au sol."]},{type:"list",level:"ATPL",heading:"Trois formes de givrage, pas une seule",items:["Le givre : formation tr\xE8s rapide dans une zone de pluie surfondue, entre 0 et -15\xB0C, souvent au niveau d'un front froid ; l'avion se couvre de glace en tr\xE8s peu de temps.","Le verglas : cong\xE9lation de gouttes plus grosses (pluie ou bruine) \xE0 l'impact de l'avion ; d\xE9p\xF4t transparent qui peut devenir \xE9pais.","La gel\xE9e blanche : simple condensation directe de la vapeur d'eau en glace, sans passer par l'\xE9tat liquide, par exemple au sol apr\xE8s une nuit froide ; givrage plus faible, mais qui peut r\xE9duire la portance au d\xE9collage et g\xEAner la visibilit\xE9 \xE0 travers le pare-brise."]},{type:"text",level:"ATPL",heading:"Deux ph\xE9nom\xE8nes locaux \xE0 conna\xEEtre",paragraphs:["L'effet de Foehn, propre aux r\xE9gions montagneuses, ass\xE8che et r\xE9chauffe l'air qui vient de franchir un relief : l'humidit\xE9 se condense et pr\xE9cipite du c\xF4t\xE9 au vent, tandis que l'air redescend sec et plus chaud de l'autre c\xF4t\xE9, expliquant le temps contrast\xE9 de part et d'autre d'une cha\xEEne de montagnes comme les Alpes.","Le jet-stream, un courant d'air tr\xE8s rapide (200 \xE0 300 km/h) mais \xE9troit, circule d'ouest en est pr\xE8s de la tropopause, \xE0 la jonction des grandes cellules de circulation atmosph\xE9rique. Les \xE9quipages de ligne cherchent \xE0 l'utiliser pour gagner du temps et \xE9conomiser du carburant en route vers l'est, et \xE0 l'\xE9viter dans l'autre sens."]},{type:"text",level:"ATPL",heading:"Un peu plus de m\xE9canisme sur le brouillard",paragraphs:["Le brouillard de rayonnement se forme par nuit claire et vent faible, quand le sol se refroidit et condense l'humidit\xE9 de l'air \xE0 son contact ; il se dissipe g\xE9n\xE9ralement apr\xE8s le lever du soleil. D'autres types existent : le brouillard d'advection, quand de l'air chaud et humide arrive sur un sol froid, ou le brouillard d'\xE9vaporation, quand de l'air froid et sec passe au-dessus d'une \xE9tendue d'eau plus chaude.","Ces ph\xE9nom\xE8nes motivent des minimums m\xE9t\xE9orologiques r\xE9glementaires (visibilit\xE9, plafond) en dessous desquels le vol VFR n'est pas autoris\xE9, voir le module R\xE9glementation."]}]},{id:"humidite-precipitations",title:"Humidit\xE9, condensation et pr\xE9cipitations",summary:"D'une goutte d'eau surfondue \xE0 la pluie, la neige ou la gr\xEAle.",blocks:[{type:"text",level:"BIA",paragraphs:["L'air peut contenir d'autant plus de vapeur d'eau qu'il est chaud : environ 5 g par kg d'air \xE0 0\xB0C, contre 22 g par kg \xE0 30\xB0C. C'est pourquoi refroidir une masse d'air suffit souvent \xE0 la saturer et \xE0 d\xE9clencher la condensation, m\xEAme sans y ajouter d'eau."]},{type:"list",level:"ATPL",heading:"De la goutte au sol",items:["La bruine : gouttelettes tr\xE8s fines, inf\xE9rieures \xE0 0,5 mm, issues de nuages bas comme le stratus.","La pluie : gouttes plus grosses, issues de nuages plus \xE9pais.","La neige : cristaux de glace qui n'ont pas fondu en tombant, formant des flocons.","La gr\xEAle : grains de glace, parfois volumineux, qui se forment dans les forts courants verticaux d'un cumulonimbus, seul nuage capable de les faire grossir par plusieurs allers-retours avant qu'ils ne retombent."]}]},{id:"circulation-generale",title:"Circulation g\xE9n\xE9rale et masses d'air",summary:"Pourquoi le d\xE9s\xE9quilibre thermique entre \xE9quateur et p\xF4les organise tout le temps qu'il fait.",blocks:[{type:"text",level:"BIA",paragraphs:["L'\xE9quateur re\xE7oit bien plus d'\xE9nergie solaire que les p\xF4les. Ce d\xE9s\xE9quilibre entra\xEEne de grands mouvements d'air \xE0 l'\xE9chelle du globe : l'air chaud s'\xE9l\xE8ve pr\xE8s de l'\xE9quateur, part vers les p\xF4les en altitude, redescend vers les latitudes moyennes, et revient au sol vers l'\xE9quateur, avant d'\xEAtre d\xE9vi\xE9 par la rotation terrestre."]},{type:"text",level:"ATPL",heading:"Trois cellules de convection",paragraphs:["Ce m\xE9canisme se structure en trois cellules par h\xE9misph\xE8re, ce qui explique la pr\xE9sence r\xE9currente d'un anticyclone pr\xE8s de l'\xE9quateur, d'une d\xE9pression vers 60\xB0 de latitude, d'un anticyclone vers 30\xB0, et d'une d\xE9pression \xE0 nouveau pr\xE8s de l'\xE9quateur. C'est la rencontre, aux latitudes moyennes (40 \xE0 50\xB0), entre l'air froid d'origine polaire et l'air chaud d'origine tropicale qui engendre les fronts et les perturbations qui traversent r\xE9guli\xE8rement la France."]}]},{id:"brises-locales",title:"Brises et vents locaux",summary:"Comment la diff\xE9rence de temp\xE9rature entre terre et mer, ou entre versants, cr\xE9e des vents r\xE9guliers.",blocks:[{type:"text",level:"BIA",paragraphs:["Pr\xE8s des c\xF4tes, la terre se r\xE9chauffe et se refroidit plus vite que la mer. Le jour, l'air au-dessus de la terre, plus chaud, s'\xE9l\xE8ve et aspire l'air plus frais venu de la mer : c'est la brise de mer, qui souffle de la mer vers la terre en journ\xE9e. La nuit, le ph\xE9nom\xE8ne s'inverse : la brise de terre souffle de la terre vers la mer."]},{type:"text",level:"ATPL",heading:"La brise de pente",paragraphs:["En montagne, un m\xE9canisme voisin s'installe entre le fond de vall\xE9e et les versants : le jour, l'air r\xE9chauff\xE9 au contact des pentes ensoleill\xE9es s'\xE9l\xE8ve, ce qui entretient un vent montant la vall\xE9e ; la nuit, l'air refroidi sur les pentes redescend, et le vent s'inverse. Ces brises, r\xE9guli\xE8res et pr\xE9visibles, sont bien connues des pilotes de planeur qui en exploitent les ascendances associ\xE9es."]}]},{id:"turbulence",title:"Turbulence : causes et types",summary:"Thermique, m\xE9canique, ou en air clair : trois origines \xE0 la turbulence.",blocks:[{type:"text",level:"BIA",paragraphs:["La turbulence, ces secousses ressenties en vol, a plusieurs origines : thermique, li\xE9e aux courants de convection d'une journ\xE9e chaude ; m\xE9canique, li\xE9e au relief ou aux obstacles qui perturbent l'\xE9coulement de l'air ; ou associ\xE9e directement aux nuages, en particulier sous un cumulonimbus."]},{type:"text",level:"ATPL",heading:"La turbulence en air clair",paragraphs:["La turbulence en air clair (Clear Air Turbulence, CAT) se produit sans aucun nuage pour la signaler, typiquement \xE0 proximit\xE9 d'un jet-stream o\xF9 se c\xF4toient des masses d'air \xE0 des vitesses tr\xE8s diff\xE9rentes. Moins pr\xE9visible visuellement que la turbulence convective, elle est en partie anticip\xE9e gr\xE2ce aux cartes m\xE9t\xE9o d\xE9di\xE9es et aux comptes-rendus d'autres \xE9quipages ayant travers\xE9 la m\xEAme zone."]}]},{id:"cartes-messages-meteo",title:"Cartes et messages m\xE9t\xE9o",summary:"TEMSI, cartes de vent en altitude : les documents qui accompagnent la pr\xE9paration d'un vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 du METAR, qui d\xE9crit la m\xE9t\xE9o d'un seul a\xE9rodrome \xE0 un instant donn\xE9, des cartes couvrent une r\xE9gion enti\xE8re pour une p\xE9riode donn\xE9e, utiles pour visualiser d'un coup d'\u0153il l'\xE9volution attendue sur l'ensemble d'un trajet."]},{type:"text",level:"ATPL",heading:"La carte TEMSI",paragraphs:["La carte TEMSI (temps significatif) repr\xE9sente, pour un niveau de vol donn\xE9, la position des fronts, la couverture nuageuse, le vent, et les zones \xE0 risque de givrage ou de turbulence ; valable trois heures, elle est disponible quatre heures avant le d\xE9but de sa validit\xE9. Des cartes de vent et de temp\xE9rature \xE0 diff\xE9rents niveaux de vol compl\xE8tent ce dossier, publi\xE9es quatre fois par jour en temps universel."]}]},{id:"dossier-meteo",title:"Pr\xE9parer son dossier m\xE9t\xE9o",summary:"Les cinq informations \xE0 avoir en t\xEAte avant de d\xE9cider de partir en VFR.",blocks:[{type:"list",level:"BIA",heading:"Cinq \xE9l\xE9ments \xE0 conna\xEEtre avant de d\xE9coller",items:["La visibilit\xE9 pr\xE9vue sur le trajet.","La base des nuages (la hauteur \xE0 laquelle ils commencent).","La n\xE9bulosit\xE9, c'est-\xE0-dire la quantit\xE9 de ciel couverte.","La direction et la force du vent.","Les ph\xE9nom\xE8nes dangereux annonc\xE9s (orages, givrage, brouillard)."]},{type:"text",level:"ATPL",heading:"Un dossier \xE0 emporter, pas seulement \xE0 consulter",paragraphs:["R\xE9glementairement, le pilote doit pr\xE9parer un dossier m\xE9t\xE9orologique complet avant tout vol et l'avoir \xE0 bord, pas seulement y jeter un \u0153il la veille. En vol, cette pr\xE9paration ne dispense pas d'observer le ciel en continu et, si besoin, de s'informer par radio aupr\xE8s d'un organisme (contr\xF4le, AFIS) ou via les diffusions m\xE9t\xE9o d\xE9di\xE9es comme le VOLMET."]}]}]},{id:"nav",title:"Navigation",tagline:"Cartes, calcul de route, navigation \xE0 l'estime, radionavigation.",Icon:vl,status:"available",lessons:[{id:"cartes-estime",title:"Cartes et navigation \xE0 l'estime",summary:"Lire une carte a\xE9ronautique, et le principe de la navigation \xE0 l'estime.",blocks:[{type:"text",level:"BIA",heading:"La carte a\xE9ronautique",paragraphs:["La navigation \xE0 vue en France s'appuie sur la carte OACI au 1/500 000 : elle repr\xE9sente le relief, les a\xE9rodromes, les espaces a\xE9riens et de nombreux rep\xE8res visuels utiles (villes, routes, voies ferr\xE9es, plans d'eau). L'\xE9chelle 1/500 000 signifie qu'un centim\xE8tre sur la carte repr\xE9sente cinq kilom\xE8tres au sol."]},{type:"text",level:"BIA",heading:"Cap, route et d\xE9rive",paragraphs:["La route est la trajectoire que l'on souhaite suivre sur la carte, entre deux points. Le cap est la direction vers laquelle pointe r\xE9ellement le nez de l'avion. \xC0 cause du vent, un avion qui vole cap \xE9gal \xE0 la route se fait d\xE9river, et s'\xE9carte de sa trajectoire pr\xE9vue : il faut corriger le cap pour compenser cette d\xE9rive."]},{type:"diagram",level:"ATPL",diagramId:"wind-triangle",caption:"Le triangle des vitesses : la route et la vitesse sol r\xE9sultent de la combinaison du cap-vitesse air et du vent."},{type:"text",level:"ATPL",heading:"Le triangle des vitesses",paragraphs:["Ce triangle relie trois vecteurs : la vitesse air (cap et vitesse propre de l'avion dans la masse d'air), le vent (direction et force), et la vitesse sol (route r\xE9elle et vitesse par rapport au sol, somme des deux pr\xE9c\xE9dentes). R\xE9soudre ce triangle, \xE0 la main sur un calculateur de navigation ou mentalement avec la r\xE8gle des 60, donne le cap \xE0 suivre et la vitesse sol r\xE9elle \xE0 attendre."]},{type:"text",level:"ATPL",heading:"Nord vrai et nord magn\xE9tique",paragraphs:["Les routes se mesurent sur la carte par rapport au nord g\xE9ographique (vrai), mais le compas de bord pointe vers le nord magn\xE9tique, l\xE9g\xE8rement diff\xE9rent. L'\xE9cart entre les deux, la d\xE9clinaison magn\xE9tique, varie selon le lieu du globe et \xE9volue lentement dans le temps : il faut l'ajouter ou la retrancher, selon son sens, pour passer d'une route vraie \xE0 un cap magn\xE9tique r\xE9ellement pilotable."]}]},{id:"calculs-navigation",title:"Calculs de navigation",summary:"Temps, distance, vitesse, consommation, et le point de non-retour.",blocks:[{type:"text",level:"BIA",heading:"Temps, distance, vitesse",paragraphs:["La relation de base de toute navigation est simple : temps = distance / vitesse. Elle permet d'estimer l'heure de passage \xE0 chaque point de report, et donc l'heure d'arriv\xE9e pr\xE9vue."]},{type:"text",level:"ATPL",heading:"La r\xE8gle des 60 et le point de non-retour",paragraphs:["La r\xE8gle des 60 permet des calculs rapides en vol : pour une distance parcourue de 60 unit\xE9s, un \xE9cart d'une unit\xE9 correspond \xE0 peu pr\xE8s \xE0 un degr\xE9 de d\xE9rive. Elle sert aussi \xE0 convertir une d\xE9rive en correction de cap sans calculateur.","En navigation plus longue, on d\xE9termine aussi le point de non-retour, l'endroit o\xF9 il devient plus \xE9conomique en carburant de continuer vers la destination que de faire demi-tour, en tenant compte du vent diff\xE9rent sur chaque route."]},{type:"text",level:"ATPL",heading:"Le facteur de base",paragraphs:["Pour estimer un temps de vol sans calculateur, on utilise souvent le facteur de base Fb = 60 / V, o\xF9 V est la vitesse sol en n\u0153uds : il suffit ensuite de multiplier la distance en milles nautiques par ce facteur pour obtenir directement un temps en minutes, un calcul mental bien plus rapide qu'une division classique en plein vol."]},{type:"text",level:"ATPL",heading:"Carburant et r\xE9serves",paragraphs:["Le carburant embarqu\xE9 ne se limite pas \xE0 ce que consomme le trajet direct : la r\xE9glementation impose une r\xE9serve, calcul\xE9e par exemple comme un temps de vol suppl\xE9mentaire \xE0 vitesse de croisi\xE8re, pour couvrir les impr\xE9vus (vent plus fort que pr\xE9vu, d\xE9gagement vers un autre a\xE9rodrome, attente). Un pilote prudent pr\xE9voit syst\xE9matiquement plus que le minimum r\xE9glementaire."]}]},{id:"radionavigation",title:"Radionavigation",summary:"Les moyens radio qui aident \xE0 se rep\xE9rer : VOR, ADF, DME et GPS.",blocks:[{type:"text",level:"BIA",heading:"Des balises au sol",paragraphs:["En compl\xE9ment des rep\xE8res visuels, des balises radio au sol permettent de v\xE9rifier ou d'affiner sa position, en particulier utiles par visibilit\xE9 r\xE9duite ou pour rejoindre un a\xE9rodrome non visible de loin."]},{type:"list",level:"ATPL",heading:"Les moyens classiques",items:["VOR : donne une radiale, c'est-\xE0-dire la direction depuis la balise vers laquelle se trouve l'avion.","ADF / NDB : donne un rel\xE8vement vers la balise, \xE0 lire avec une aiguille qui pointe simplement sa direction.","DME : donne la distance oblique jusqu'\xE0 la balise, souvent coupl\xE9 \xE0 un VOR.","GPS : donne une position directe par satellites ; largement utilis\xE9 aujourd'hui, avec des dispositifs de contr\xF4le d'int\xE9grit\xE9 du signal (RAIM) et la n\xE9cessit\xE9 de moyens de secours en cas de panne."]},{type:"text",level:"ATPL",heading:"Suivre ou intercepter une radiale VOR",paragraphs:["L'aiguille de d\xE9viation (CDI) indique de quel c\xF4t\xE9 se trouve la radiale s\xE9lectionn\xE9e : centr\xE9e, l'avion est dessus ; d\xE9vi\xE9e \xE0 gauche ou \xE0 droite, il faut corriger vers ce c\xF4t\xE9 pour la rejoindre. Intercepter une radiale consiste \xE0 choisir un cap qui coupe cette route \xE0 un angle suffisant pour la rejoindre efficacement, puis \xE0 r\xE9duire cet angle progressivement \xE0 l'approche, un exercice classique de la formation IFR."]}]},{id:"coordonnees-fuseaux",title:"Coordonn\xE9es g\xE9ographiques et fuseaux horaires",summary:"Latitude, longitude, et pourquoi l'aviation raisonne en temps universel.",blocks:[{type:"text",level:"BIA",paragraphs:["Tout point du globe se rep\xE8re par sa latitude, la distance angulaire \xE0 l'\xE9quateur (de 0\xB0 \xE0 90\xB0 Nord ou Sud), et sa longitude, la distance angulaire au m\xE9ridien de Greenwich (de 0\xB0 \xE0 180\xB0 Est ou Ouest). Un degr\xE9 de latitude correspond \xE0 peu pr\xE8s \xE0 60 milles nautiques, partout sur le globe, ce qui n'est pas vrai pour la longitude, dont la distance au sol diminue en s'\xE9loignant de l'\xE9quateur."]},{type:"text",level:"ATPL",heading:"Le temps universel coordonn\xE9",paragraphs:["Pour \xE9viter toute confusion entre fuseaux horaires, l'aviation utilise exclusivement le temps universel coordonn\xE9 (UTC), identique partout dans le monde. La France m\xE9tropolitaine lui ajoute une heure en hiver et deux en \xE9t\xE9 pour obtenir l'heure l\xE9gale : un d\xE9calage \xE0 garder en t\xEAte pour ne pas confondre l'heure d'un METAR, toujours en UTC, avec l'heure de sa montre."]}]},{id:"altitudes-niveaux",title:"Altitudes, niveaux de vol et altitudes de s\xE9curit\xE9",summary:"Hauteur, altitude, niveau de vol : trois fa\xE7ons de mesurer la m\xEAme chose, et comment choisir son altitude de croisi\xE8re.",blocks:[{type:"text",level:"BIA",paragraphs:["On distingue la hauteur, la distance verticale au sol survol\xE9, de l'altitude, la distance verticale au niveau de la mer. Le niveau de vol (FL), utilis\xE9 au-dessus d'une certaine altitude, se r\xE9f\xE8re toujours au calage standard 1013 hPa, ce qui garantit que tous les avions de cette zone utilisent la m\xEAme r\xE9f\xE9rence, m\xEAme si elle ne correspond pas exactement \xE0 l'altitude r\xE9elle."]},{type:"text",level:"ATPL",heading:"La r\xE8gle semi-circulaire",paragraphs:["En croisi\xE8re VFR, une r\xE8gle semi-circulaire impose une altitude impaire plus 500 ft pour une route globalement orient\xE9e entre 0 et 179\xB0, et une altitude paire plus 500 ft entre 180 et 359\xB0 : ce principe r\xE9partit les avions qui se croisent \xE0 des altitudes diff\xE9rentes, et r\xE9duit m\xE9caniquement le risque de collision frontale ou de rattrapage \xE0 la m\xEAme altitude."]}]},{id:"boussole-caps",title:"La boussole et les caps",summary:"Comment un simple aimant donne un cap, et ses d\xE9fauts classiques.",blocks:[{type:"text",level:"BIA",paragraphs:["La boussole magn\xE9tique s'aligne sur le champ magn\xE9tique terrestre pour indiquer le nord magn\xE9tique. Simple et ne n\xE9cessitant aucune alimentation \xE9lectrique, elle reste un instrument de secours pr\xE9cieux si tout le reste tombe en panne."]},{type:"text",level:"ATPL",heading:"Erreurs en virage et en acc\xE9l\xE9ration",paragraphs:["La boussole souffre de d\xE9fauts bien identifi\xE9s : en virage, elle indique faussement un cap diff\xE9rent du cap r\xE9el tant que l'avion reste inclin\xE9 (erreur qui s'inverse selon que l'on passe par le nord ou le sud) ; en acc\xE9l\xE9ration ou d\xE9c\xE9l\xE9ration sur un cap proche de l'est ou de l'ouest, elle d\xE9vie \xE9galement de fa\xE7on transitoire. C'est pourquoi le conservateur de cap gyroscopique, recal\xE9 p\xE9riodiquement sur la boussole en vol st

cteur sans le br\xFBler. Le taux de dilution (bypass ratio) mesure ce partage ; un taux \xE9lev\xE9 am\xE9liore la consommation et r\xE9duit le bruit, au prix d'une soufflante plus large. Sur les r\xE9acteurs les plus r\xE9cents, ce taux peut d\xE9passer 10, ce qui signifie que l'essentiel de la pouss\xE9e provient de l'air froid souffl\xE9 autour du c\u0153ur plut\xF4t que des gaz de combustion eux-m\xEAmes.","Entre les deux, le turbopropulseur reste pertinent sur une plage de vitesse interm\xE9diaire, grossi\xE8rement de 300 \xE0 800 km/h : plus efficace qu'un turbor\xE9acteur \xE0 ces vitesses mod\xE9r\xE9es, mais d\xE9pass\xE9 par le turbofan d\xE8s que la vitesse de croisi\xE8re augmente."]}]},{id:"systemes-bord",title:"Syst\xE8mes de bord",summary:"Circuit carburant, circuit \xE9lectrique, commandes hydrauliques, et pressurisation.",blocks:[{type:"text",level:"BIA",heading:"Le circuit carburant",paragraphs:["Le carburant est stock\xE9 dans des r\xE9servoirs, le plus souvent log\xE9s dans les ailes, et amen\xE9 au moteur par gravit\xE9 ou par une pompe. Un s\xE9lecteur permet en g\xE9n\xE9ral de choisir le r\xE9servoir utilis\xE9, et une jauge en indique la quantit\xE9 restante, \xE0 recouper avec un calcul de consommation plut\xF4t qu'\xE0 suivre aveugl\xE9ment."]},{type:"text",level:"BIA",heading:"Le circuit \xE9lectrique",paragraphs:["L'\xE9lectricit\xE9 de bord, produite par un alternateur entra\xEEn\xE9 par le moteur et stock\xE9e dans une batterie, alimente la radio, les instruments \xE9lectroniques et l'\xE9clairage. Une panne de g\xE9n\xE9ration laisse en g\xE9n\xE9ral une autonomie limit\xE9e sur la seule batterie, d'o\xF9 l'int\xE9r\xEAt de r\xE9duire la consommation \xE9lectrique en cas de panne."]},{type:"text",level:"ATPL",heading:"Commandes hydrauliques et pressurisation",paragraphs:["Sur les avions plus lourds, un circuit hydraulique d\xE9multiplie la force du pilote pour actionner le train d'atterrissage, les volets ou les gouvernes, des charges trop importantes pour des commandes purement m\xE9caniques. Ces avions volent aussi souvent en altitude au-dessus de ce que le corps humain tol\xE8re sans assistance : un syst\xE8me de pressurisation maintient alors une pression cabine confortable, correspondant \xE0 une altitude bien inf\xE9rieure \xE0 l'altitude r\xE9elle de vol.","Ces syst\xE8mes redondants (plusieurs circuits hydrauliques et \xE9lectriques ind\xE9pendants, par exemple) illustrent un principe g\xE9n\xE9ral de s\xE9curit\xE9 en a\xE9ronautique : la panne d'un seul \xE9l\xE9ment ne doit jamais, \xE0 elle seule, compromettre la suite du vol."]}]},{id:"instruments-bord",title:"Instruments de bord",summary:"Les instruments de base du poste de pilotage, leurs sources, et leurs pannes classiques.",blocks:[{type:"list",level:"BIA",heading:"Les instruments de base",items:["L'an\xE9mom\xE8tre indique la vitesse par rapport \xE0 l'air.","L'altim\xE8tre indique l'altitude par rapport \xE0 un niveau de r\xE9f\xE9rence (QNH, QFE ou 1013).","Le variom\xE8tre indique la vitesse verticale, mont\xE9e ou descente.","L'horizon artificiel donne l'assiette de l'avion par rapport \xE0 l'horizon r\xE9el.","Le conservateur de cap et le compas donnent le cap suivi.","L'indicateur de virage et de d\xE9rapage renseigne sur la qualit\xE9 du virage."]},{type:"text",level:"ATPL",heading:"D'o\xF9 viennent ces informations",paragraphs:["An\xE9mom\xE8tre, altim\xE8tre et variom\xE8tre sont dits an\xE9mobarom\xE9triques : ils exploitent la pression statique et la pression dynamique capt\xE9e par le tube de Pitot et les prises statiques. Horizon artificiel et conservateur de cap sont traditionnellement gyroscopiques, aujourd'hui souvent remplac\xE9s par des centrales \xE0 capteurs \xE9lectroniques (centrales \xE0 inertie ou ADAHRS).","Cette distinction explique certaines pannes classiques : un tube Pitot obstru\xE9, par exemple par du givre, fait d\xE9river l'indication de l'an\xE9mom\xE8tre, tandis qu'une prise statique bouch\xE9e affecte \xE0 la fois l'an\xE9mom\xE8tre, l'altim\xE8tre et le variom\xE8tre."]},{type:"text",level:"ATPL",heading:"Du \xAB six pack \xBB au glass cockpit",paragraphs:["Historiquement, ces six instruments de base sont dispos\xE9s selon un arrangement standardis\xE9, surnomm\xE9 le \xAB six pack \xBB, pour que tout pilote retrouve ses rep\xE8res d'un avion \xE0 l'autre. Sur les avions plus r\xE9cents, un ou deux grands \xE9crans \xE9lectroniques (glass cockpit) regroupent ces m\xEAmes informations, avec souvent une int\xE9gration de la navigation directement dans l'affichage de vol."]}]},{id:"train-atterrissage",title:"Le train d'atterrissage",summary:"Configurations classiques, amortissement, et freinage.",blocks:[{type:"text",level:"BIA",paragraphs:["Le train tricycle, une roue avant et deux roues principales sous le fuselage ou les ailes, \xE9quipe la grande majorit\xE9 des avions modernes : il offre une bonne visibilit\xE9 au roulage et une tenue de piste plus facile que l'ancienne configuration classique, roue arri\xE8re, aujourd'hui surtout pr\xE9sente sur des avions de voltige ou historiques."]},{type:"text",level:"ATPL",heading:"Amortissement et freinage",paragraphs:["Chaque jambe de train int\xE8gre un amortisseur, souvent ol\xE9opneumatique (un m\xE9lange d'huile et d'azote comprim\xE9), qui absorbe l'\xE9nergie de l'impact \xE0 l'atterrissage pour \xE9viter de la transmettre brutalement \xE0 la structure. Sur les avions plus lourds, le train est r\xE9tractable pour r\xE9duire la tra\xEEn\xE9e en croisi\xE8re, actionn\xE9 par un circuit hydraulique redondant, avec un syst\xE8me de secours en cas de panne \xE9lectrique ou hydraulique pour le sortir malgr\xE9 tout."]}]},{id:"helicopteres",title:"H\xE9licopt\xE8res : principe du vol",summary:"Comment un rotor remplace \xE0 la fois l'aile et l'h\xE9lice, et pourquoi il faut un rotor de queue.",blocks:[{type:"text",level:"BIA",paragraphs:["Un h\xE9licopt\xE8re produit sa portance avec un rotor principal, en fait une aile tournante : chaque pale, en tournant, g\xE9n\xE8re de la portance comme le ferait une aile d'avion en translation. Cela lui permet de d\xE9coller et d'atterrir \xE0 la verticale, et de rester stationnaire en vol, deux choses impossibles pour un avion classique."]},{type:"text",level:"ATPL",heading:"Pourquoi un rotor de queue",paragraphs:["Faire tourner le rotor principal exerce, par r\xE9action, un couple qui tend \xE0 faire tourner le fuselage en sens inverse. Le rotor de queue, sur la configuration la plus courante, compense ce couple en soufflant lat\xE9ralement ; c'est en changeant le pas de ses pales, via le palonnier, que le pilote contr\xF4le le cap de l'h\xE9licopt\xE8re en stationnaire. Le pas cyclique, qui incline le disque rotor, donne le d\xE9placement horizontal ; le pas collectif, qui change l'incidence de toutes les pales \xE0 la fois, donne la portance globale."]}]},{id:"planeurs-ulm",title:"Planeurs et ULM",summary:"Deux familles d'a\xE9ronefs l\xE9gers, sans moteur ou tr\xE8s l\xE9gers, r\xE9gies par des r\xE8gles particuli\xE8res.",blocks:[{type:"text",level:"BIA",paragraphs:["Le planeur, sans moteur, exploite les ascendances de l'atmosph\xE8re (thermiques, pentes, ondes) pour prendre de l'altitude et rester en vol, parfois pendant des heures et sur des centaines de kilom\xE8tres. Sa finesse tr\xE8s \xE9lev\xE9e, souvent sup\xE9rieure \xE0 40, en fait l'a\xE9ronef le plus efficace a\xE9rodynamiquement."]},{type:"text",level:"ATPL",heading:"Les ULM",paragraphs:["Les ultra-l\xE9gers motoris\xE9s (ULM) forment une cat\xE9gorie \xE0 part, d\xE9finie par des limites de masse et de vitesse de d\xE9crochage plut\xF4t que par leur forme : on y trouve aussi bien des appareils qui ressemblent \xE0 de petits avions classiques que des pendulaires (une aile delta sous laquelle pend un chariot motoris\xE9) ou des autogires. Leur r\xE9glementation, plus l\xE9g\xE8re que celle de l'aviation g\xE9n\xE9rale classique, s'accompagne de limitations correspondantes, par exemple sur le survol des agglom\xE9rations."]}]},{id:"avionique-automatismes",title:"Avionique et automatismes",summary:"Du pilote automatique simple aux syst\xE8mes de gestion de vol modernes.",blocks:[{type:"text",level:"BIA",paragraphs:["Le pilote automatique d\xE9charge le pilote du maintien manuel de l'assiette ou du cap pendant les phases de vol stabilis\xE9es, ce qui lui laisse plus de temps pour naviguer, surveiller la m\xE9t\xE9o ou communiquer. M\xEAme simple, un pilote automatique de base peut tenir un cap et une altitude."]},{type:"text",level:"ATPL",heading:"Du pilote automatique au FMS",paragraphs:["Sur les avions de ligne, le pilote automatique se couple \xE0 un calculateur de gestion de vol (FMS, Flight Management System), qui conna\xEEt le plan de vol complet et peut piloter l'avion d'un point \xE0 l'autre, g\xE9rer la vitesse et l'altitude optimales, et parfois m\xEAme r\xE9aliser l'atterrissage. Cette automatisation, pr\xE9cieuse, d\xE9place aussi le r\xF4le du pilote vers la supervision des syst\xE8mes plut\xF4t que le pilotage manuel permanent, avec ses propres pi\xE8ges, d\xE9taill\xE9s dans le module Facteurs humains."]}]},{id:"materiaux-maintenance",title:"Mat\xE9riaux et maintenance",summary:"Alliages, composites, et le suivi technique qui garde un avion en \xE9tat de vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 des alliages d'aluminium historiques, les mat\xE9riaux composites (fibre de carbone ou de verre noy\xE9e dans une r\xE9sine) \xE9quipent une part croissante des avions r\xE9cents : plus l\xE9gers \xE0 r\xE9sistance \xE9gale, ils r\xE9sistent aussi mieux \xE0 la fatigue, m\xEAme si leur comportement \xE0 l'impact et leur r\xE9paration demandent une expertise diff\xE9rente de celle du m\xE9tal."]},{type:"text",level:"ATPL",heading:"Le suivi de navigabilit\xE9",paragraphs:["Un a\xE9ronef ne reste autoris\xE9 \xE0 voler que s'il respecte un programme d'entretien pr\xE9cis, d\xE9fini par le constructeur et approuv\xE9 par les autorit\xE9s : visites p\xE9riodiques, remplacement de pi\xE8ces \xE0 dur\xE9e de vie limit\xE9e, suivi individuel de chaque cellule et de chaque moteur dans un dossier technique. C'est cette tra\xE7abilit\xE9 m\xE9ticuleuse qui permet de d\xE9tecter une usure ou une fatigue anormale avant qu'elle ne devienne un probl\xE8me de s\xE9curit\xE9."]}]},{id:"carburants-lubrifiants",title:"Carburants et lubrifiants",summary:"Essence aviation, k\xE9ros\xE8ne, et pourquoi on ne peut pas les confondre.",blocks:[{type:"text",level:"BIA",paragraphs:["Les moteurs \xE0 pistons utilisent une essence sp\xE9cifique \xE0 l'aviation, diff\xE9rente de celle des voitures, formul\xE9e pour r\xE9sister au cliquetis (une combustion anormale et destructrice) m\xEAme \xE0 pleine puissance. Les turbines, elles, fonctionnent au k\xE9ros\xE8ne, un carburant plus proche du gazole, qui se vaporise et br\xFBle diff\xE9remment."]},{type:"text",level:"ATPL",heading:"Ne jamais se tromper de carburant",paragraphs:["Mettre du k\xE9ros\xE8ne dans un avion \xE0 pistons pr\xE9vu pour de l'essence aviation, ou inversement, est une des causes d'accident recens\xE9es, en particulier depuis l'apparition d'avions \xE0 pistons aliment\xE9s au diesel ou au k\xE9ros\xE8ne. C'est pourquoi les points d'avitaillement et les documents de bord pr\xE9cisent toujours sans ambigu\xEFt\xE9 le type de carburant requis, et pourquoi un pilote v\xE9rifie syst\xE9matiquement ce qui est r\xE9ellement vers\xE9 dans ses r\xE9servoirs."]}]}]},{id:"meteo",title:"M\xE9t\xE9orologie",tagline:"Masses d'air, nuages, vent, pression, et ph\xE9nom\xE8nes dangereux pour le vol.",Icon:os,status:"available",lessons:[{id:"atmosphere-pression",title:"Atmosph\xE8re et pression",summary:"Les couches de l'atmosph\xE8re, la pression, et les calages altim\xE9triques.",blocks:[{type:"text",level:"BIA",heading:"La troposph\xE8re, domaine du vol",paragraphs:["L'aviation l\xE9g\xE8re \xE9volue dans la troposph\xE8re, la couche la plus basse de l'atmosph\xE8re, o\xF9 la temp\xE9rature diminue globalement avec l'altitude. La pression atmosph\xE9rique, elle, diminue \xE9galement avec l'altitude : c'est ce qui permet \xE0 l'altim\xE8tre, un barom\xE8tre gradu\xE9 en altitude, de fonctionner."]},{type:"list",level:"BIA",heading:"Les couches de l'atmosph\xE8re",items:["La troposph\xE8re, du sol jusqu'\xE0 environ 11 km (la tropopause) : c'est l\xE0 que se jouent tous les ph\xE9nom\xE8nes m\xE9t\xE9o, et o\xF9 volent la quasi-totalit\xE9 des avions.","La stratosph\xE8re, de 11 \xE0 50 km environ, qui contient l'essentiel de la couche d'ozone ; quelques avions supersoniques ou jets d'affaires y \xE9voluent en partie haute.","La m\xE9sosph\xE8re, de 50 \xE0 80 km, o\xF9 br\xFBlent la plupart des m\xE9t\xE9orites qui entrent dans l'atmosph\xE8re.","La thermosph\xE8re, de 80 \xE0 500 km environ, o\xF9 orbitent les satellites bas et la Station spatiale internationale."]},{type:"text",level:"ATPL",heading:"Calages altim\xE9triques",paragraphs:["L'atmosph\xE8re standard OACI (ISA) sert de r\xE9f\xE9rence th\xE9orique : 1013,25 hPa et 15\xB0C au niveau de la mer, une masse volumique de l'air de 1,225 kg/m\xB3, et un gradient de temp\xE9rature standard d'environ 2\xB0C tous les 1 000 pieds en montant jusqu'\xE0 la tropopause, fix\xE9e \xE0 11 km, au-del\xE0 de laquelle la temp\xE9rature reste constante \xE0 -56,5\xB0C. En pratique, le pilote r\xE8gle son altim\xE8tre sur le QNH, la pression ramen\xE9e au niveau de la mer, pour lire son altitude par rapport \xE0 ce niveau, sur le QFE pour lire sa hauteur par rapport au terrain, ou sur 1013 en niveau de vol, au-dessus d'une altitude de transition.","Un rep\xE8re pratique \xE0 retenir pour les basses couches : un \xE9cart de pression de 1 hPa correspond \xE0 peu pr\xE8s \xE0 28 ft, soit environ 8,5 m."]},{type:"text",level:"ATPL",heading:"Quand l'altim\xE8tre ment un peu",paragraphs:["L'altim\xE8tre suppose une atmosph\xE8re standard : quand la temp\xE9rature ou la pression r\xE9elles s'\xE9cartent de cette r\xE9f\xE9rence, l'altitude lue diff\xE8re de l'altitude vraie. La r\xE8gle \xE0 retenir tient en une phrase consacr\xE9e par l'usage anglophone : d'un air chaud vers un air froid, ou d'une pression forte vers une pression faible, l'altitude vraie est plus basse que l'altitude lue \u2014 d'o\xF9 l'importance de mettre \xE0 jour son calage r\xE9guli\xE8rement en route."]},{type:"text",level:"BIA",heading:"La d\xE9viation du vent : force de Coriolis et loi de Buys-Ballot",paragraphs:["Le vent ne souffle pas en ligne droite des hautes vers les basses pressions : la rotation de la Terre le d\xE9vie, vers la droite dans l'h\xE9misph\xE8re Nord, vers la gauche dans l'h\xE9misph\xE8re Sud (force de Coriolis). Cons\xE9quence directe, r\xE9sum\xE9e par la loi de Buys-Ballot : dans l'h\xE9misph\xE8re Nord, le vent tourne dans le sens des aiguilles d'une montre autour d'un anticyclone, et dans le sens inverse autour d'une d\xE9pression. Cette d\xE9viation est plus marqu\xE9e en altitude, car le frottement au sol la r\xE9duit pr\xE8s de la surface."]}]},{id:"stabilite-atmosphere",title:"Stabilit\xE9 de l'atmosph\xE8re",summary:"Pourquoi l'air monte ou pas, et ce que cela change pour les nuages et la turbulence.",blocks:[{type:"text",level:"BIA",paragraphs:["Une bulle d'air qui s'\xE9l\xE8ve se d\xE9tend et se refroidit. Si, une fois mont\xE9e, elle se retrouve plus froide que l'air environnant, elle est plus dense et redescend : l'atmosph\xE8re est stable, le temps est plut\xF4t calme, avec des nuages plats en couches. Si au contraire elle reste plus chaude que l'air environnant, elle continue de monter : l'atmosph\xE8re est instable, favorable aux nuages \xE0 d\xE9veloppement vertical et aux averses."]},{type:"text",level:"ATPL",heading:"Gradient r\xE9el contre gradient adiabatique",paragraphs:["Plus pr\xE9cis\xE9ment, la stabilit\xE9 d\xE9pend de la comparaison entre le gradient thermique r\xE9el de l'atmosph\xE8re ce jour-l\xE0 et le gradient adiabatique, la vitesse \xE0 laquelle une particule d'air se refroidit en montant du seul fait de sa d\xE9tente (environ 1\xB0C par 100 m pour de l'air sec, moins pour de l'air satur\xE9 en humidit\xE9, qui se refroidit plus lentement gr\xE2ce \xE0 la chaleur lib\xE9r\xE9e par la condensation).","Si le gradient r\xE9el est plus fort que le gradient adiabatique, une particule d\xE9plac\xE9e vers le haut reste plus chaude que son environnement et continue de s'\xE9lever : l'air est instable. Dans le cas contraire, elle est frein\xE9e et retombe : l'air est stable. C'est ce m\xE9canisme qui explique pourquoi une m\xEAme masse d'air peut donner un ciel calme le matin et des cumulus bourgeonnants l'apr\xE8s-midi, une fois le sol suffisamment r\xE9chauff\xE9."]}]},{id:"nuages-vent",title:"Nuages, masses d'air et vent",summary:"Comment se forment les nuages, ce que sont les masses d'air et les fronts, et l'origine du vent.",blocks:[{type:"list",level:"BIA",heading:"Les familles de nuages",items:["\xC9tage bas (jusqu'\xE0 2 000 m environ) : cumulus, stratus, stratocumulus.","\xC9tage moyen : altocumulus, altostratus.","\xC9tage \xE9lev\xE9 (souvent au-del\xE0 de 6 000 m) : cirrus, cirrostratus, cirrocumulus, compos\xE9s de cristaux de glace.","D\xE9veloppement vertical : cumulonimbus, associ\xE9 aux orages, qui peut traverser plusieurs \xE9tages."]},{type:"diagram",level:"BIA",diagramId:"cloud-layers",caption:"Les familles de nuages selon l'\xE9tage d'altitude o\xF9 elles se forment."},{type:"text",level:"BIA",heading:"Des noms qui ont un sens",paragraphs:["Le nom de chaque nuage n'est pas arbitraire : le pr\xE9fixe \xAB cirro \xBB signale des cristaux de glace en altitude, \xAB alto \xBB un nuage d'\xE9tage moyen, et l'absence de pr\xE9fixe un nuage bas, fait de gouttelettes d'eau liquide. La racine du nom d\xE9crit elle la forme : \xAB stratus \xBB pour un nuage \xE9tal\xE9 en couche, typique d'un air stable, \xAB cumulus \xBB pour un nuage en amas moutonneux, typique d'un air instable, \xAB cirrus \xBB pour un nuage en filaments fins. Le suffixe ou pr\xE9fixe \xAB nimbus \xBB signale enfin un nuage porteur de pr\xE9cipitations.","Ce qui fait la diff\xE9rence entre un ciel stratifi\xE9 et calme et un ciel \xE0 cumulus bourgeonnants, c'est la stabilit\xE9 de l'atmosph\xE8re, d\xE9taill\xE9e dans la le\xE7on suivante : un air stable \xE9tale les nuages en couches, un air instable les fait grossir verticalement."]},{type:"text",level:"ATPL",heading:"Le point de ros\xE9e",paragraphs:["Le point de ros\xE9e est la temp\xE9rature \xE0 laquelle il faudrait refroidir l'air, \xE0 pression constante, pour que l'humidit\xE9 relative atteigne 100 % et que la condensation commence. Plus la temp\xE9rature r\xE9elle se rapproche de ce point de ros\xE9e, plus l'air est humide ; quand les deux deviennent \xE9gales, l'air est satur\xE9, et un nuage, de la brume ou du brouillard peuvent se former selon l'altitude \xE0 laquelle cela se produit."]},{type:"text",level:"ATPL",heading:"Masses d'air et fronts",paragraphs:["Une masse d'air est un volume d'atmosph\xE8re relativement homog\xE8ne en temp\xE9rature et en humidit\xE9. \xC0 la rencontre de deux masses d'air diff\xE9rentes se forme un front : un front chaud, o\xF9 l'air chaud glisse au-dessus de l'air froid, apporte un temps qui se d\xE9grade progressivement, souvent annonc\xE9 par des cirrus puis des altostratus des heures \xE0 l'avance ; un front froid, plus brutal, o\xF9 l'air froid soul\xE8ve l'air chaud, peut d\xE9clencher des orages sur une ligne \xE9troite et bien marqu\xE9e."]},{type:"text",level:"BIA",heading:"D'o\xF9 vient le vent",paragraphs:["Le vent est de l'air qui se d\xE9place des zones de haute pression vers les zones de basse pression. Sa vitesse et sa direction sont g\xE9n\xE9ralement diff\xE9rentes au sol et en altitude, notamment \xE0 cause du frottement sur le relief et les obstacles."]},{type:"text",level:"ATPL",heading:"Gradient de vent et cisaillement",paragraphs:["Le frottement au sol ralentit et d\xE9vie le vent par rapport \xE0 l'air libre juste au-dessus : c'est le gradient de vent, qui rend le vent plus fort et plus r\xE9gulier avec l'altitude, m\xEAme sur les premi\xE8res centaines de pieds. Un changement brutal de vitesse ou de direction sur une faible distance, le cisaillement de vent (wind shear), est particuli\xE8rement redout\xE9 au d\xE9collage et \xE0 l'atterrissage, notamment sous un orage ou en pr\xE9sence d'une inversion de temp\xE9rature marqu\xE9e."]}]},{id:"phenomenes-dangereux",title:"Ph\xE9nom\xE8nes dangereux pour le vol",summary:"Orage, givrage, brouillard : les ph\xE9nom\xE8nes qui imposent la plus grande prudence.",blocks:[{type:"list",level:"BIA",heading:"Trois dangers classiques",items:["L'orage, associ\xE9 au cumulonimbus : turbulence forte, gr\xEAle, foudre, rafales de vent violentes et changeantes sous le nuage.","Le givrage, d\xE9p\xF4t de glace sur la cellule ou le carburateur, qui d\xE9grade l'a\xE9rodynamique et peut r\xE9duire la puissance moteur.","Le brouillard, qui r\xE9duit fortement la visibilit\xE9, en particulier au d\xE9collage et \xE0 l'atterrissage."]},{type:"text",level:"ATPL",heading:"Le cycle de vie d'un orage",paragraphs:["Un orage isol\xE9 traverse trois phases : le stade cumulus, o\xF9 des courants ascendants alimentent le d\xE9veloppement du nuage sans pr\xE9cipitation encore au sol ; le stade mature, le plus dangereux, o\xF9 coexistent courants ascendants et descendants violents, avec pr\xE9cipitations, gr\xEAle possible et foudre ; puis le stade de dissipation, domin\xE9 par les courants descendants, o\xF9 l'orage perd progressivement son \xE9nergie."]},{type:"text",level:"ATPL",heading:"Un cumulonimbus, chiffr\xE9",paragraphs:["Un cumulonimbus mature peut g\xE9n\xE9rer des rafales de 30 \xE0 40 kt avec changement brutal de direction, des courants verticaux ascendants et descendants capables d'approcher 90 km/h, de la gr\xEAle, et de la foudre susceptible de perturber les \xE9quipements de radionavigation. Toutes ces menaces coexistent dans un m\xEAme nuage, ce qui explique pourquoi les cumulonimbus s'\xE9vitent largement, en vol comme au sol."]},{type:"list",level:"ATPL",heading:"Trois formes de givrage, pas une seule",items:["Le givre : formation tr\xE8s rapide dans une zone de pluie surfondue, entre 0 et -15\xB0C, souvent au niveau d'un front froid ; l'avion se couvre de glace en tr\xE8s peu de temps.","Le verglas : cong\xE9lation de gouttes plus grosses (pluie ou bruine) \xE0 l'impact de l'avion ; d\xE9p\xF4t transparent qui peut devenir \xE9pais.","La gel\xE9e blanche : simple condensation directe de la vapeur d'eau en glace, sans passer par l'\xE9tat liquide, par exemple au sol apr\xE8s une nuit froide ; givrage plus faible, mais qui peut r\xE9duire la portance au d\xE9collage et g\xEAner la visibilit\xE9 \xE0 travers le pare-brise."]},{type:"text",level:"ATPL",heading:"Deux ph\xE9nom\xE8nes locaux \xE0 conna\xEEtre",paragraphs:["L'effet de Foehn, propre aux r\xE9gions montagneuses, ass\xE8che et r\xE9chauffe l'air qui vient de franchir un relief : l'humidit\xE9 se condense et pr\xE9cipite du c\xF4t\xE9 au vent, tandis que l'air redescend sec et plus chaud de l'autre c\xF4t\xE9, expliquant le temps contrast\xE9 de part et d'autre d'une cha\xEEne de montagnes comme les Alpes.","Le jet-stream, un courant d'air tr\xE8s rapide (200 \xE0 300 km/h) mais \xE9troit, circule d'ouest en est pr\xE8s de la tropopause, \xE0 la jonction des grandes cellules de circulation atmosph\xE9rique. Les \xE9quipages de ligne cherchent \xE0 l'utiliser pour gagner du temps et \xE9conomiser du carburant en route vers l'est, et \xE0 l'\xE9viter dans l'autre sens."]},{type:"text",level:"ATPL",heading:"Un peu plus de m\xE9canisme sur le brouillard",paragraphs:["Le brouillard de rayonnement se forme par nuit claire et vent faible, quand le sol se refroidit et condense l'humidit\xE9 de l'air \xE0 son contact ; il se dissipe g\xE9n\xE9ralement apr\xE8s le lever du soleil. D'autres types existent : le brouillard d'advection, quand de l'air chaud et humide arrive sur un sol froid, ou le brouillard d'\xE9vaporation, quand de l'air froid et sec passe au-dessus d'une \xE9tendue d'eau plus chaude.","Ces ph\xE9nom\xE8nes motivent des minimums m\xE9t\xE9orologiques r\xE9glementaires (visibilit\xE9, plafond) en dessous desquels le vol VFR n'est pas autoris\xE9, voir le module R\xE9glementation."]}]},{id:"humidite-precipitations",title:"Humidit\xE9, condensation et pr\xE9cipitations",summary:"D'une goutte d'eau surfondue \xE0 la pluie, la neige ou la gr\xEAle.",blocks:[{type:"text",level:"BIA",paragraphs:["L'air peut contenir d'autant plus de vapeur d'eau qu'il est chaud : environ 5 g par kg d'air \xE0 0\xB0C, contre 22 g par kg \xE0 30\xB0C. C'est pourquoi refroidir une masse d'air suffit souvent \xE0 la saturer et \xE0 d\xE9clencher la condensation, m\xEAme sans y ajouter d'eau."]},{type:"list",level:"ATPL",heading:"De la goutte au sol",items:["La bruine : gouttelettes tr\xE8s fines, inf\xE9rieures \xE0 0,5 mm, issues de nuages bas comme le stratus.","La pluie : gouttes plus grosses, issues de nuages plus \xE9pais.","La neige : cristaux de glace qui n'ont pas fondu en tombant, formant des flocons.","La gr\xEAle : grains de glace, parfois volumineux, qui se forment dans les forts courants verticaux d'un cumulonimbus, seul nuage capable de les faire grossir par plusieurs allers-retours avant qu'ils ne retombent."]}]},{id:"circulation-generale",title:"Circulation g\xE9n\xE9rale et masses d'air",summary:"Pourquoi le d\xE9s\xE9quilibre thermique entre \xE9quateur et p\xF4les organise tout le temps qu'il fait.",blocks:[{type:"text",level:"BIA",paragraphs:["L'\xE9quateur re\xE7oit bien plus d'\xE9nergie solaire que les p\xF4les. Ce d\xE9s\xE9quilibre entra\xEEne de grands mouvements d'air \xE0 l'\xE9chelle du globe : l'air chaud s'\xE9l\xE8ve pr\xE8s de l'\xE9quateur, part vers les p\xF4les en altitude, redescend vers les latitudes moyennes, et revient au sol vers l'\xE9quateur, avant d'\xEAtre d\xE9vi\xE9 par la rotation terrestre."]},{type:"text",level:"ATPL",heading:"Trois cellules de convection",paragraphs:["Ce m\xE9canisme se structure en trois cellules par h\xE9misph\xE8re, ce qui explique la pr\xE9sence r\xE9currente d'un anticyclone pr\xE8s de l'\xE9quateur, d'une d\xE9pression vers 60\xB0 de latitude, d'un anticyclone vers 30\xB0, et d'une d\xE9pression \xE0 nouveau pr\xE8s de l'\xE9quateur. C'est la rencontre, aux latitudes moyennes (40 \xE0 50\xB0), entre l'air froid d'origine polaire et l'air chaud d'origine tropicale qui engendre les fronts et les perturbations qui traversent r\xE9guli\xE8rement la France."]}]},{id:"brises-locales",title:"Brises et vents locaux",summary:"Comment la diff\xE9rence de temp\xE9rature entre terre et mer, ou entre versants, cr\xE9e des vents r\xE9guliers.",blocks:[{type:"text",level:"BIA",paragraphs:["Pr\xE8s des c\xF4tes, la terre se r\xE9chauffe et se refroidit plus vite que la mer. Le jour, l'air au-dessus de la terre, plus chaud, s'\xE9l\xE8ve et aspire l'air plus frais venu de la mer : c'est la brise de mer, qui souffle de la mer vers la terre en journ\xE9e. La nuit, le ph\xE9nom\xE8ne s'inverse : la brise de terre souffle de la terre vers la mer."]},{type:"text",level:"ATPL",heading:"La brise de pente",paragraphs:["En montagne, un m\xE9canisme voisin s'installe entre le fond de vall\xE9e et les versants : le jour, l'air r\xE9chauff\xE9 au contact des pentes ensoleill\xE9es s'\xE9l\xE8ve, ce qui entretient un vent montant la vall\xE9e ; la nuit, l'air refroidi sur les pentes redescend, et le vent s'inverse. Ces brises, r\xE9guli\xE8res et pr\xE9visibles, sont bien connues des pilotes de planeur qui en exploitent les ascendances associ\xE9es."]}]},{id:"turbulence",title:"Turbulence : causes et types",summary:"Thermique, m\xE9canique, ou en air clair : trois origines \xE0 la turbulence.",blocks:[{type:"text",level:"BIA",paragraphs:["La turbulence, ces secousses ressenties en vol, a plusieurs origines : thermique, li\xE9e aux courants de convection d'une journ\xE9e chaude ; m\xE9canique, li\xE9e au relief ou aux obstacles qui perturbent l'\xE9coulement de l'air ; ou associ\xE9e directement aux nuages, en particulier sous un cumulonimbus."]},{type:"text",level:"ATPL",heading:"La turbulence en air clair",paragraphs:["La turbulence en air clair (Clear Air Turbulence, CAT) se produit sans aucun nuage pour la signaler, typiquement \xE0 proximit\xE9 d'un jet-stream o\xF9 se c\xF4toient des masses d'air \xE0 des vitesses tr\xE8s diff\xE9rentes. Moins pr\xE9visible visuellement que la turbulence convective, elle est en partie anticip\xE9e gr\xE2ce aux cartes m\xE9t\xE9o d\xE9di\xE9es et aux comptes-rendus d'autres \xE9quipages ayant travers\xE9 la m\xEAme zone."]}]},{id:"cartes-messages-meteo",title:"Cartes et messages m\xE9t\xE9o",summary:"TEMSI, cartes de vent en altitude : les documents qui accompagnent la pr\xE9paration d'un vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 du METAR, qui d\xE9crit la m\xE9t\xE9o d'un seul a\xE9rodrome \xE0 un instant donn\xE9, des cartes couvrent une r\xE9gion enti\xE8re pour une p\xE9riode donn\xE9e, utiles pour visualiser d'un coup d'\u0153il l'\xE9volution attendue sur l'ensemble d'un trajet."]},{type:"text",level:"ATPL",heading:"La carte TEMSI",paragraphs:["La carte TEMSI (temps significatif) repr\xE9sente, pour un niveau de vol donn\xE9, la position des fronts, la couverture nuageuse, le vent, et les zones \xE0 risque de givrage ou de turbulence ; valable trois heures, elle est disponible quatre heures avant le d\xE9but de sa validit\xE9. Des cartes de vent et de temp\xE9rature \xE0 diff\xE9rents niveaux de vol compl\xE8tent ce dossier, publi\xE9es quatre fois par jour en temps universel."]}]},{id:"dossier-meteo",title:"Pr\xE9parer son dossier m\xE9t\xE9o",summary:"Les cinq informations \xE0 avoir en t\xEAte avant de d\xE9cider de partir en VFR.",blocks:[{type:"list",level:"BIA",heading:"Cinq \xE9l\xE9ments \xE0 conna\xEEtre avant de d\xE9coller",items:["La visibilit\xE9 pr\xE9vue sur le trajet.","La base des nuages (la hauteur \xE0 laquelle ils commencent).","La n\xE9bulosit\xE9, c'est-\xE0-dire la quantit\xE9 de ciel couverte.","La direction et la force du vent.","Les ph\xE9nom\xE8nes dangereux annonc\xE9s (orages, givrage, brouillard)."]},{type:"text",level:"ATPL",heading:"Un dossier \xE0 emporter, pas seulement \xE0 consulter",paragraphs:["R\xE9glementairement, le pilote doit pr\xE9parer un dossier m\xE9t\xE9orologique complet avant tout vol et l'avoir \xE0 bord, pas seulement y jeter un \u0153il la veille. En vol, cette pr\xE9paration ne dispense pas d'observer le ciel en continu et, si besoin, de s'informer par radio aupr\xE8s d'un organisme (contr\xF4le, AFIS) ou via les diffusions m\xE9t\xE9o d\xE9di\xE9es comme le VOLMET."]}]}]},{id:"nav",title:"Navigation",tagline:"Cartes, calcul de route, navigation \xE0 l'estime, radionavigation.",Icon:is,status:"available",lessons:[{id:"cartes-estime",title:"Cartes et navigation \xE0 l'estime",summary:"Lire une carte a\xE9ronautique, et le principe de la navigation \xE0 l'estime.",blocks:[{type:"text",level:"BIA",heading:"La carte a\xE9ronautique",paragraphs:["La navigation \xE0 vue en France s'appuie sur la carte OACI au 1/500 000 : elle repr\xE9sente le relief, les a\xE9rodromes, les espaces a\xE9riens et de nombreux rep\xE8res visuels utiles (villes, routes, voies ferr\xE9es, plans d'eau). L'\xE9chelle 1/500 000 signifie qu'un centim\xE8tre sur la carte repr\xE9sente cinq kilom\xE8tres au sol."]},{type:"text",level:"BIA",heading:"Cap, route et d\xE9rive",paragraphs:["La route est la trajectoire que l'on souhaite suivre sur la carte, entre deux points. Le cap est la direction vers laquelle pointe r\xE9ellement le nez de l'avion. \xC0 cause du vent, un avion qui vole cap \xE9gal \xE0 la route se fait d\xE9river, et s'\xE9carte de sa trajectoire pr\xE9vue : il faut corriger le cap pour compenser cette d\xE9rive."]},{type:"diagram",level:"ATPL",diagramId:"wind-triangle",caption:"Le triangle des vitesses : la route et la vitesse sol r\xE9sultent de la combinaison du cap-vitesse air et du vent."},{type:"text",level:"ATPL",heading:"Le triangle des vitesses",paragraphs:["Ce triangle relie trois vecteurs : la vitesse air (cap et vitesse propre de l'avion dans la masse d'air), le vent (direction et force), et la vitesse sol (route r\xE9elle et vitesse par rapport au sol, somme des deux pr\xE9c\xE9dentes). R\xE9soudre ce triangle, \xE0 la main sur un calculateur de navigation ou mentalement avec la r\xE8gle des 60, donne le cap \xE0 suivre et la vitesse sol r\xE9elle \xE0 attendre."]},{type:"text",level:"ATPL",heading:"Nord vrai et nord magn\xE9tique",paragraphs:["Les routes se mesurent sur la carte par rapport au nord g\xE9ographique (vrai), mais le compas de bord pointe vers le nord magn\xE9tique, l\xE9g\xE8rement diff\xE9rent. L'\xE9cart entre les deux, la d\xE9clinaison magn\xE9tique, varie selon le lieu du globe et \xE9volue lentement dans le temps : il faut l'ajouter ou la retrancher, selon son sens, pour passer d'une route vraie \xE0 un cap magn\xE9tique r\xE9ellement pilotable."]}]},{id:"calculs-navigation",title:"Calculs de navigation",summary:"Temps, distance, vitesse, consommation, et le point de non-retour.",blocks:[{type:"text",level:"BIA",heading:"Temps, distance, vitesse",paragraphs:["La relation de base de toute navigation est simple : temps = distance / vitesse. Elle permet d'estimer l'heure de passage \xE0 chaque point de report, et donc l'heure d'arriv\xE9e pr\xE9vue."]},{type:"text",level:"ATPL",heading:"La r\xE8gle des 60 et le point de non-retour",paragraphs:["La r\xE8gle des 60 permet des calculs rapides en vol : pour une distance parcourue de 60 unit\xE9s, un \xE9cart d'une unit\xE9 correspond \xE0 peu pr\xE8s \xE0 un degr\xE9 de d\xE9rive. Elle sert aussi \xE0 convertir une d\xE9rive en correction de cap sans calculateur.","En navigation plus longue, on d\xE9termine aussi le point de non-retour, l'endroit o\xF9 il devient plus \xE9conomique en carburant de continuer vers la destination que de faire demi-tour, en tenant compte du vent diff\xE9rent sur chaque route."]},{type:"text",level:"ATPL",heading:"Le facteur de base",paragraphs:["Pour estimer un temps de vol sans calculateur, on utilise souvent le facteur de base Fb = 60 / V, o\xF9 V est la vitesse sol en n\u0153uds : il suffit ensuite de multiplier la distance en milles nautiques par ce facteur pour obtenir directement un temps en minutes, un calcul mental bien plus rapide qu'une division classique en plein vol."]},{type:"text",level:"ATPL",heading:"Carburant et r\xE9serves",paragraphs:["Le carburant embarqu\xE9 ne se limite pas \xE0 ce que consomme le trajet direct : la r\xE9glementation impose une r\xE9serve, calcul\xE9e par exemple comme un temps de vol suppl\xE9mentaire \xE0 vitesse de croisi\xE8re, pour couvrir les impr\xE9vus (vent plus fort que pr\xE9vu, d\xE9gagement vers un autre a\xE9rodrome, attente). Un pilote prudent pr\xE9voit syst\xE9matiquement plus que le minimum r\xE9glementaire."]}]},{id:"radionavigation",title:"Radionavigation",summary:"Les moyens radio qui aident \xE0 se rep\xE9rer : VOR, ADF, DME et GPS.",blocks:[{type:"text",level:"BIA",heading:"Des balises au sol",paragraphs:["En compl\xE9ment des rep\xE8res visuels, des balises radio au sol permettent de v\xE9rifier ou d'affiner sa position, en particulier utiles par visibilit\xE9 r\xE9duite ou pour rejoindre un a\xE9rodrome non visible de loin."]},{type:"list",level:"ATPL",heading:"Les moyens classiques",items:["VOR : donne une radiale, c'est-\xE0-dire la direction depuis la balise vers laquelle se trouve l'avion.","ADF / NDB : donne un rel\xE8vement vers la balise, \xE0 lire avec une aiguille qui pointe simplement sa direction.","DME : donne la distance oblique jusqu'\xE0 la balise, souvent coupl\xE9 \xE0 un VOR.","GPS : donne une position directe par satellites ; largement utilis\xE9 aujourd'hui, avec des dispositifs de contr\xF4le d'int\xE9grit\xE9 du signal (RAIM) et la n\xE9cessit\xE9 de moyens de secours en cas de panne."]},{type:"text",level:"ATPL",heading:"Suivre ou intercepter une radiale VOR",paragraphs:["L'aiguille de d\xE9viation (CDI) indique de quel c\xF4t\xE9 se trouve la radiale s\xE9lectionn\xE9e : centr\xE9e, l'avion est dessus ; d\xE9vi\xE9e \xE0 gauche ou \xE0 droite, il faut corriger vers ce c\xF4t\xE9 pour la rejoindre. Intercepter une radiale consiste \xE0 choisir un cap qui coupe cette route \xE0 un angle suffisant pour la rejoindre efficacement, puis \xE0 r\xE9duire cet angle progressivement \xE0 l'approche, un exercice classique de la formation IFR."]}]},{id:"coordonnees-fuseaux",title:"Coordonn\xE9es g\xE9ographiques et fuseaux horaires",summary:"Latitude, longitude, et pourquoi l'aviation raisonne en temps universel.",blocks:[{type:"text",level:"BIA",paragraphs:["Tout point du globe se rep\xE8re par sa latitude, la distance angulaire \xE0 l'\xE9quateur (de 0\xB0 \xE0 90\xB0 Nord ou Sud), et sa longitude, la distance angulaire au m\xE9ridien de Greenwich (de 0\xB0 \xE0 180\xB0 Est ou Ouest). Un degr\xE9 de latitude correspond \xE0 peu pr\xE8s \xE0 60 milles nautiques, partout sur le globe, ce qui n'est pas vrai pour la longitude, dont la distance au sol diminue en s'\xE9loignant de l'\xE9quateur."]},{type:"text",level:"ATPL",heading:"Le temps universel coordonn\xE9",paragraphs:["Pour \xE9viter toute confusion entre fuseaux horaires, l'aviation utilise exclusivement le temps universel coordonn\xE9 (UTC), identique partout dans le monde. La France m\xE9tropolitaine lui ajoute une heure en hiver et deux en \xE9t\xE9 pour obtenir l'heure l\xE9gale : un d\xE9calage \xE0 garder en t\xEAte pour ne pas confondre l'heure d'un METAR, toujours en UTC, avec l'heure de sa montre."]}]},{id:"altitudes-niveaux",title:"Altitudes, niveaux de vol et altitudes de s\xE9curit\xE9",summary:"Hauteur, altitude, niveau de vol : trois fa\xE7ons de mesurer la m\xEAme chose, et comment choisir son altitude de croisi\xE8re.",blocks:[{type:"text",level:"BIA",paragraphs:["On distingue la hauteur, la distance verticale au sol survol\xE9, de l'altitude, la distance verticale au niveau de la mer. Le niveau de vol (FL), utilis\xE9 au-dessus d'une certaine altitude, se r\xE9f\xE8re toujours au calage standard 1013 hPa, ce qui garantit que tous les avions de cette zone utilisent la m\xEAme r\xE9f\xE9rence, m\xEAme si elle ne correspond pas exactement \xE0 l'altitude r\xE9elle."]},{type:"text",level:"ATPL",heading:"La r\xE8gle semi-circulaire",paragraphs:["En croisi\xE8re VFR, une r\xE8gle semi-circulaire impose une altitude impaire plus 500 ft pour une route globalement orient\xE9e entre 0 et 179\xB0, et une altitude paire plus 500 ft entre 180 et 359\xB0 : ce principe r\xE9partit les avions qui se croisent \xE0 des altitudes diff\xE9rentes, et r\xE9duit m\xE9caniquement le risque de collision frontale ou de rattrapage \xE0 la m\xEAme altitude."]}]},{id:"boussole-caps",title:"La boussole et les caps",summary:"Comment un simple aimant donne un cap, et ses d\xE9fauts classiques.",blocks:[{type:"text",level:"BIA",paragraphs:["La boussole magn\xE9tique s'aligne sur le champ magn\xE9tique terrestre pour indiquer le nord magn\xE9tique. Simple et ne n\xE9cessitant aucune alimentation \xE9lectrique, elle reste un instrument de secours pr\xE9cieux si tout le reste tombe en panne."]},{type:"text",level:"ATPL",heading:"Erreurs en virage et en acc\xE9l\xE9ration",paragraphs:["La boussole souffre de d\xE9fauts bien identifi\xE9s : en virage, elle indique faussement un cap diff\xE9rent du cap r\xE9el tant que l'avion reste inclin\xE9 (erreur qui s'inverse selon que l'on passe par le nord ou le sud) ; en acc\xE9l\xE9ration ou d\xE9c\xE9l\xE9ration sur un cap proche de l'est ou de l'ouest, elle d\xE9vie \xE9galement de fa\xE7on transitoire. C'est pourquoi le conservateur de cap gyroscopique, recal\xE9 p\xE9riodiquement sur la boussole en vol stabilis\xE9, sert de r\xE9f\xE9rence principale en pratique."]}]},{id:"gps-satellite",title:"Le GPS et la navigation par satellite",summary:"Comment une constellation de satellites donne une position au m\xE8tre pr\xE8s.",blocks:[{type:"text",level:"BIA",paragraphs:["Le r\xE9cepteur GPS calcule sa position en mesurant le temps mis par les signaux radio d'au moins quatre satellites \xE0 lui parvenir : en connaissant pr\xE9cis\xE9ment leurs positions et ces d\xE9lais, il en d\xE9duit sa propre position par triangulation, avec une pr\xE9cision de quelques m\xE8tres."]},{type:"text",level:"ATPL",heading:"Une aide pr\xE9cieuse, pas infaillible",paragraphs:["Le GPS a transform\xE9 la navigation a\xE9rienne, mais reste vuln\xE9rable : signal faible, facilement brouill\xE9 ou perturb\xE9, pannes de satellites, ou simples erreurs de saisie d'un point de cheminement. Le RAIM (Receiver Autonomous Integrity Monitoring) surveille la coh\xE9rence des signaux re\xE7us pour d\xE9tecter une anomalie, mais ne remplace pas la n\xE9cessit\xE9 de savoir naviguer \xE0 l'estime et \xE0 la carte en cas de perte du signal."]}]},{id:"preparer-navigation-vfr",title:"Pr\xE9parer une navigation VFR, \xE9tape par \xE9tape",summary:"De la carte vierge au log de navigation pr\xEAt \xE0 emporter.",blocks:[{type:"list",level:"BIA",heading:"Les grandes \xE9tapes",items:["Tracer la route sur la carte, en \xE9vitant les espaces interdits ou r\xE9glement\xE9s.","D\xE9couper la route en segments entre des points de report faciles \xE0 identifier au sol.","Mesurer distance et route vraie de chaque segment.","Appliquer la d\xE9clinaison magn\xE9tique pour obtenir une route magn\xE9tique.","Calculer cap et temps de chaque segment \xE0 partir du vent pr\xE9vu."]},{type:"text",level:"ATPL",heading:"Le log de navigation",paragraphs:["Toutes ces informations se consignent dans un log de navigation, un tableau emport\xE9 en vol, avec une colonne pour les heures th\xE9oriques et une autre pour les heures r\xE9elles de passage \xE0 chaque point : l'\xE9cart entre les deux, observ\xE9 en vol, permet de recaler les pr\xE9visions suivantes et de d\xE9tecter rapidement un vent diff\xE9rent de celui qui avait \xE9t\xE9 pr\xE9vu."]}]},{id:"navigation-secours",title:"Navigation de secours et d\xE9routement",summary:"Que faire si l'on doute de sa position, ou s'il faut changer de destination en vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Se sentir incertain de sa position arrive \xE0 tout pilote : la bonne r\xE9ponse consiste \xE0 ralentir, prendre de l'altitude pour \xE9largir son champ de vision, identifier un rep\xE8re net au sol, et le recouper avec la carte plut\xF4t que de continuer au hasard en esp\xE9rant reconna\xEEtre quelque chose."]},{type:"text",level:"ATPL",heading:"D\xE9cider un d\xE9routement",paragraphs:["Un d\xE9routement, changer de destination en cours de vol, se d\xE9cide pour de multiples raisons : m\xE9t\xE9o qui se d\xE9grade, panne, carburant plus consomm\xE9 que pr\xE9vu. La pr\xE9paration de vol inclut justement le choix d'un ou plusieurs a\xE9rodromes de d\xE9gagement, avec leur propre calcul de distance et de carburant, pour ne pas avoir \xE0 improviser dans l'urgence."]}]},{id:"cas-pratique-navigation",title:"Lecture de carte : cas pratique",summary:"Relier les notions pr\xE9c\xE9dentes sur un exemple concret de segment de navigation.",blocks:[{type:"text",level:"BIA",paragraphs:["Prenons un segment de 30 milles nautiques, route vraie 080\xB0, avec une d\xE9clinaison locale de 2\xB0 Ouest. La route magn\xE9tique devient 082\xB0 (on ajoute la d\xE9clinaison Ouest). S'il n'y avait pas de vent, ce serait directement le cap \xE0 suivre."]},{type:"text",level:"ATPL",heading:"En ajoutant le vent",paragraphs:["Avec un vent de 040\xB0 pour 15 kt et une vitesse propre de 100 kt, le triangle des vitesses donne une d\xE9rive d'environ 7\xB0 vers la droite \xE0 corriger, donc un cap magn\xE9tique \xE0 piloter proche de 075\xB0, pour une vitesse sol l\xE9g\xE8rement inf\xE9rieure \xE0 100 kt. Avec le facteur de base (Fb = 60 / vitesse sol), on obtient un temps de vol pour ce segment d'environ 19 minutes."]}]}]},{id:"reglementation",title:"R\xE9glementation & s\xE9curit\xE9 des vols",tagline:"Espaces a\xE9riens, r\xE8gles de l'air, licences, circulation d'a\xE9rodrome.",Icon:ds,status:"available",lessons:[{id:"espaces-regles",title:"Espaces a\xE9riens et r\xE8gles de l'air",summary:"Les classes d'espace a\xE9rien et les grandes r\xE8gles de priorit\xE9 en vol.",blocks:[{type:"text",level:"BIA",heading:"Espaces contr\xF4l\xE9s et non contr\xF4l\xE9s",paragraphs:["L'espace a\xE9rien est d\xE9coup\xE9 en volumes o\xF9 les r\xE8gles diff\xE8rent : dans un espace contr\xF4l\xE9, un contr\xF4leur suit et parfois autorise chaque vol ; dans un espace non contr\xF4l\xE9, le pilote g\xE8re lui-m\xEAme sa s\xE9curit\xE9, en s'informant sur une fr\xE9quence d\xE9di\xE9e."]},{type:"diagram",level:"BIA",diagramId:"airspace-structure",caption:"Autour d'un a\xE9rodrome contr\xF4l\xE9 : une CTR proche du sol, une TMA plus vaste au-dessus, et de l'espace non contr\xF4l\xE9 (classe G) \xE0 l'\xE9cart."},{type:"table",level:"ATPL",headers:["Classe","Type de trafic","Service rendu au VFR"],rows:[["A","IFR uniquement","VFR interdit"],["C, D","IFR et VFR","Clairance et information de trafic"],["E","IFR et VFR","Information de trafic si possible"],["G","IFR et VFR","Information de vol, pas de clairance"]],caption:"L'espace a\xE9rien th\xE9orique va de A \xE0 G, mais la France n'utilise en pratique que les classes A, C, D, E et G : les classes B et F n'y sont pas employ\xE9es."},{type:"text",level:"ATPL",heading:"Les r\xE8gles de priorit\xE9",paragraphs:["Les r\xE8gles de priorit\xE9 en vol suivent une logique g\xE9n\xE9rale : l'a\xE9ronef le moins man\u0153uvrant est prioritaire (un planeur ou un ballon sur un avion motoris\xE9, par exemple), et un a\xE9ronef en difficult\xE9 ou en remorquage est toujours prioritaire."]},{type:"list",level:"ATPL",items:["En croisement, l'a\xE9ronef qui voit l'autre venir sur sa droite doit s'\xE9carter.","En rattrapage, l'avion rattrap\xE9 est prioritaire : celui qui rattrape s'\xE9carte, g\xE9n\xE9ralement par la droite.","En approche de face (t\xEAte-\xE0-t\xEAte), chacun s'\xE9carte par sa droite, comme sur la route.","\xC0 l'atterrissage, l'a\xE9ronef le plus bas est en g\xE9n\xE9ral prioritaire, sauf s'il en d\xE9passe un autre ou s'il coupe sa trajectoire."]}]},{id:"minimums-meteo-vfr",title:"Minimums m\xE9t\xE9orologiques VFR",summary:"Visibilit\xE9 et distance aux nuages exig\xE9es pour voler \xE0 vue.",blocks:[{type:"text",level:"BIA",paragraphs:["Voler \xE0 vue (VFR) suppose de rester suffisamment loin des nuages et de voir suffisamment loin pour rep\xE9rer les autres a\xE9ronefs et le relief \xE0 temps. Ces exigences minimales, la visibilit\xE9 et la distance aux nuages, sont plus strictes en altitude et en espace contr\xF4l\xE9 qu'\xE0 basse altitude en espace non contr\xF4l\xE9."]},{type:"table",level:"ATPL",headers:["Situation","Visibilit\xE9","Distance aux nuages"],rows:[["Au-dessus de 3 000 ft (ou 1 000 ft sol si plus haut)","5 km","1 500 m horizontalement, 300 m verticalement"],["En dessous, hors espace contr\xF4l\xE9","1 500 m","Hors des nuages, en vue du sol"]],caption:"Simplifi\xE9 : les minimums se resserrent \xE0 basse altitude en espace non contr\xF4l\xE9, mais restent plus stricts d\xE8s que l'on quitte le voisinage imm\xE9diat du sol."},{type:"text",level:"ATPL",paragraphs:["Ces minimums existent pour garantir un temps de r\xE9action suffisant en cas de croisement avec un autre trafic, et pour \xE9viter de p\xE9n\xE9trer par inadvertance dans un nuage sans qualification ni \xE9quipement pour voler sans rep\xE8res visuels ext\xE9rieurs."]}]},{id:"licences",title:"Licences et privil\xE8ges",summary:"Le BIA, l'\xE9chelle des licences de pilote, et le certificat m\xE9dical.",blocks:[{type:"text",level:"BIA",paragraphs:["Le BIA n'est pas une licence de pilote : c'est un brevet scolaire d'initiation \xE0 l'a\xE9ronautique, qui ne donne aucun privil\xE8ge de vol seul aux commandes. Il ouvre n\xE9anmoins la voie, notamment via des bourses, \xE0 des heures de vol d'initiation."]},{type:"table",level:"ATPL",headers:["Licence","Usage principal"],rows:[["LAPL","Vol priv\xE9 l\xE9ger, privil\xE8ges limit\xE9s"],["PPL","Vol priv\xE9, tous types d'appareils l\xE9gers concern\xE9s"],["CPL","Vol r\xE9mun\xE9r\xE9, premier \xE9chelon professionnel"],["ATPL","Commandant de bord en transport a\xE9rien public"]],caption:"Chaque licence sup\xE9rieure inclut globalement les privil\xE8ges de la pr\xE9c\xE9dente et y ajoute les siens."},{type:"text",level:"ATPL",heading:"Le certificat m\xE9dical",paragraphs:["Une licence de pilote s'accompagne toujours d'un certificat m\xE9dical, dont l'exigence cro\xEEt avec le niveau de la licence : une classe 2 suffit pour un LAPL ou un PPL, tandis qu'une classe 1, plus exigeante et \xE0 renouveler plus souvent, est n\xE9cessaire pour exercer en tant que pilote professionnel (CPL, ATPL)."]}]},{id:"circulation-aerodrome",title:"Circulation d'a\xE9rodrome",summary:"Le tour de piste et les grandes \xE9tapes de la circulation sur un a\xE9rodrome.",blocks:[{type:"list",level:"BIA",heading:"Les \xE9tapes du tour de piste",items:["D\xE9collage, mont\xE9e initiale dans l'axe.","Vent traversier, virage \xE0 90\xB0 apr\xE8s la piste.","Vent arri\xE8re, parall\xE8le \xE0 la piste, en sens oppos\xE9.","Base, virage vers l'axe d'approche finale.","Finale, alignement avec la piste jusqu'\xE0 l'atterrissage."]},{type:"text",level:"ATPL",heading:"A\xE9rodromes contr\xF4l\xE9s et non contr\xF4l\xE9s",paragraphs:["Sur un a\xE9rodrome contr\xF4l\xE9, le pilote suit les instructions du contr\xF4leur, avec une phras\xE9ologie pr\xE9cise et un compte-rendu obligatoire \xE0 chaque \xE9tape. Sur un a\xE9rodrome non contr\xF4l\xE9, le pilote s'auto-annonce sur la fr\xE9quence d\xE9di\xE9e et applique les r\xE8gles de circulation standard, sans autorisation formelle d'un contr\xF4leur."]},{type:"text",level:"ATPL",heading:"La nuit a\xE9ronautique et les feux de navigation",paragraphs:["La nuit a\xE9ronautique ne correspond pas exactement \xE0 la nuit ressentie : elle commence 30 minutes apr\xE8s le coucher du soleil et se termine 30 minutes avant son lever. Dans cet intervalle, un a\xE9ronef doit porter ses feux de navigation : vert \xE0 droite, rouge \xE0 gauche et blanc \xE0 l'arri\xE8re, le m\xEAme code que pour les bateaux, qui permet \xE0 un observateur de deviner l'orientation de l'appareil d'un simple coup d'\u0153il."]},{type:"text",level:"ATPL",heading:"Hauteurs minimales de survol",paragraphs:["En dehors des phases de d\xE9collage et d'atterrissage, un avion doit rester \xE0 une hauteur minimale au-dessus du sol : de l'ordre de 150 m (500 ft) en rase campagne, et bien davantage \xE0 la verticale des agglom\xE9rations et des rassemblements de personnes, avec en plus une marge horizontale par rapport \xE0 l'obstacle le plus \xE9lev\xE9 dans un rayon donn\xE9 autour de l'appareil."]}]},{id:"documents-bord",title:"Documents de bord et papiers du pilote",summary:"Ce qu'un avion et un pilote doivent avoir sur eux pour voler l\xE9galement.",blocks:[{type:"list",level:"BIA",heading:"\xC0 bord de l'avion",items:["Le certificat d'immatriculation, qui identifie l'appareil.","Le certificat de navigabilit\xE9, qui atteste qu'il est en \xE9tat de voler.","Le manuel de vol, avec les performances et limitations propres \xE0 cet appareil.","Le carnet de route, o\xF9 se consignent les vols effectu\xE9s."]},{type:"text",level:"ATPL",heading:"Pour le pilote",paragraphs:["Le pilote doit de son c\xF4t\xE9 pouvoir pr\xE9senter sa licence, son certificat m\xE9dical en cours de validit\xE9, et une pi\xE8ce d'identit\xE9. L'absence de l'un de ces documents n'emp\xEAche pas forc\xE9ment de voler dans l'instant, mais expose \xE0 des sanctions et complique la gestion d'un incident ou d'un contr\xF4le au sol."]}]},{id:"certification-aeronefs",title:"La certification des a\xE9ronefs",summary:"Pourquoi un avion de s\xE9rie passe par un long processus avant d'\xEAtre autoris\xE9 \xE0 voler.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant qu'un nouveau mod\xE8le d'avion ne puisse transporter qui que ce soit, le constructeur doit d\xE9montrer aux autorit\xE9s, par le calcul puis par des essais en vol r\xE9els, qu'il respecte un ensemble de normes de s\xE9curit\xE9 strictes : r\xE9sistance structurale, performances minimales, comportement en cas de panne."]},{type:"text",level:"ATPL",heading:"Type-certificat et d\xE9clinaisons",paragraphs:["Cette d\xE9monstration aboutit \xE0 un certificat de type, propre \xE0 un mod\xE8le d'avion donn\xE9. Chaque exemplaire produit ensuite re\xE7oit son propre certificat de navigabilit\xE9 individuel, qui atteste sa conformit\xE9 \xE0 ce type certifi\xE9 et doit \xEAtre maintenu dans le temps par l'entretien. Une modification non approuv\xE9e de l'appareil peut faire perdre cette conformit\xE9, m\xEAme pour une intervention apparemment mineure."]}]},{id:"services-circulation-aerienne",title:"Les services de la circulation a\xE9rienne",summary:"Contr\xF4le, information de vol, alerte : trois services rendus par des organismes diff\xE9rents.",blocks:[{type:"text",level:"BIA",paragraphs:["Plusieurs organismes au sol peuvent assister un pilote en vol, selon l'espace travers\xE9 : une tour de contr\xF4le (TWR) pour les abords imm\xE9diats d'un a\xE9rodrome, une approche (APP) pour les arriv\xE9es et d\xE9parts plus larges, ou un centre de contr\xF4le en route (ACC) pour la croisi\xE8re en espace contr\xF4l\xE9."]},{type:"text",level:"ATPL",heading:"AFIS et service d'alerte",paragraphs:["Sur les terrains non contr\xF4l\xE9s mais \xE9quip\xE9s, un agent AFIS (Aerodrome Flight Information Service) fournit des informations utiles sans pouvoir donner d'instruction contraignante comme le ferait un contr\xF4leur. Quel que soit l'organisme, un service d'alerte veille en toile de fond : si un plan de vol d\xE9pos\xE9 n'est pas cl\xF4tur\xE9 dans le d\xE9lai pr\xE9vu, les proc\xE9dures de recherche et de sauvetage se d\xE9clenchent automatiquement."]}]},{id:"information-aeronautique",title:"L'information a\xE9ronautique",summary:"NOTAM et AIP : les publications qui tiennent les pilotes inform\xE9s.",blocks:[{type:"text",level:"BIA",paragraphs:["L'AIP (Aeronautical Information Publication) rassemble, pays par pays, toutes les informations permanentes utiles \xE0 la navigation : cartes, fr\xE9quences, proc\xE9dures, caract\xE9ristiques de chaque a\xE9rodrome. Les NOTAM, d\xE9j\xE0 vus, compl\xE8tent cette base par les informations temporaires ou urgentes qui ne peuvent attendre la prochaine mise \xE0 jour de l'AIP."]},{type:"text",level:"ATPL",heading:"O\xF9 trouver l'information",paragraphs:["En France, le Service de l'Information A\xE9ronautique publie ces documents, consultables en ligne avant chaque vol. Les NOTAM suivent un code structur\xE9 par cat\xE9gories (balisage, obstacles, espaces a\xE9riens, proc\xE9dures), ce qui permet, une fois le code appris, de filtrer rapidement ceux qui concernent r\xE9ellement le vol pr\xE9vu parmi le volume parfois important de notices actives sur une route donn\xE9e."]}]},{id:"assurances-responsabilites",title:"Assurances et responsabilit\xE9s",summary:"Ce que couvre, ou non, l'assurance d'un a\xE9ronef.",blocks:[{type:"text",level:"BIA",paragraphs:["Comme pour un v\xE9hicule routier, une assurance responsabilit\xE9 civile est obligatoire pour tout a\xE9ronef en vol, afin de couvrir les dommages caus\xE9s \xE0 des tiers, au sol ou en l'air. Des garanties compl\xE9mentaires, facultatives, peuvent couvrir l'appareil lui-m\xEAme ou les occupants."]},{type:"text",level:"ATPL",heading:"Le commandant de bord, responsable en dernier ressort",paragraphs:["Quel que soit le nombre de personnes \xE0 bord ou les automatismes disponibles, la r\xE9glementation fait du commandant de bord le seul responsable final de la conduite du vol et de la s\xE9curit\xE9 des personnes transport\xE9es. Cette responsabilit\xE9 ne se d\xE9l\xE8gue pas, pas m\xEAme \xE0 un contr\xF4leur a\xE9rien, dont les instructions restent soumises au jugement du pilote si leur application compromettait la s\xE9curit\xE9 du vol."]}]},{id:"aeronefs-sans-pilote",title:"R\xE9glementation des a\xE9ronefs sans pilote",summary:"Pourquoi les drones partagent le m\xEAme ciel, et les m\xEAmes grands principes de s\xE9curit\xE9.",blocks:[{type:"text",level:"BIA",paragraphs:["Les drones, ou a\xE9ronefs t\xE9l\xE9pilot\xE9s, partagent le m\xEAme espace a\xE9rien que l'aviation habit\xE9e, et sont donc soumis eux aussi \xE0 des r\xE8gles : cat\xE9gories selon la masse et le risque, limites de hauteur, zones interdites ou r\xE9glement\xE9es, formation du t\xE9l\xE9pilote au-del\xE0 d'un usage strictement r\xE9cr\xE9atif."]},{type:"text",level:"ATPL",heading:"Un principe commun : ne jamais survoler sans raison",paragraphs:["Le principe g\xE9n\xE9ral reste proche de celui de l'aviation habit\xE9e, transpos\xE9 \xE0 l'absence d'occupants \xE0 bord : limiter le survol de personnes non impliqu\xE9es dans le vol, garder l'appareil en vue ou sous contr\xF4le fiable, et rester \xE0 l'\xE9cart des a\xE9rodromes et de leurs trajectoires d'approche, sauf autorisation sp\xE9cifique. C'est aussi pour cette cohabitation que les pilotes d'avions et de drones doivent apprendre \xE0 se signaler et \xE0 se d\xE9tecter mutuellement."]}]}]},{id:"facteurs-humains",title:"Facteurs humains & performance",tagline:"Physiologie du vol, prise de d\xE9cision, gestion de l'erreur humaine.",Icon:fs,status:"available",lessons:[{id:"physiologie-vol",title:"Physiologie du vol",summary:"Comment l'altitude affecte le corps, et l'hypoxie en particulier.",blocks:[{type:"text",level:"BIA",paragraphs:["En altitude, la pression atmosph\xE9rique diminue, donc la quantit\xE9 d'oxyg\xE8ne disponible \xE0 chaque respiration diminue aussi, m\xEAme si la proportion d'oxyg\xE8ne dans l'air reste la m\xEAme. Le corps peut en souffrir sans m\xEAme que le pilote s'en rende compte : c'est l'hypoxie."]},{type:"text",level:"ATPL",heading:"Reconna\xEEtre l'hypoxie",paragraphs:["Les premiers signes d'hypoxie sont trompeurs : euphorie, sensation de bien-\xEAtre, d\xE9gradation du jugement, avant des sympt\xF4mes plus francs comme des troubles visuels ou une confusion. C'est justement cette alt\xE9ration pr\xE9coce du jugement qui la rend dangereuse, et qui justifie l'usage d'oxyg\xE8ne compl\xE9mentaire au-del\xE0 de certaines altitudes r\xE9glementaires.","Le froid et la d\xE9shydratation, plus fr\xE9quents en vol qu'au sol, d\xE9gradent \xE9galement les performances et la vigilance, et s'ajoutent souvent aux effets de l'altitude."]},{type:"diagram",level:"ATPL",diagramId:"tuc-chart",caption:"Le temps de conscience utile (TUC) : le temps dont dispose un pilote pour agir efficacement apr\xE8s une perte de pressurisation, avant que l'hypoxie ne l'en emp\xEAche. Valeurs indicatives, elles varient selon les individus."},{type:"text",level:"ATPL",heading:"Pourquoi cette chute si rapide",paragraphs:["Cette chute tr\xE8s rapide au-del\xE0 de 30 000 \xE0 35 000 ft explique pourquoi les \xE9quipages de ligne s'entra\xEEnent \xE0 enfiler un masque \xE0 oxyg\xE8ne en quelques secondes en cas de d\xE9pressurisation soudaine : au-dessus de ces altitudes, le temps de conscience utile se compte en dizaines de secondes, pas en minutes."]},{type:"table",level:"BIA",headers:["Altitude","Effets ressentis"],rows:[["Environ 12 000 ft","Fatigue, l\xE9ger mal de t\xEAte sur vol prolong\xE9"],["Environ 18 000 ft","Mal de t\xEAte, somnolence, troubles visuels, coordination d\xE9grad\xE9e"],["Environ 22 000 ft","Palpitations, hyperventilation, risque de perte de connaissance"],["Environ 25 000 ft","Convulsions possibles, perte de connaissance rapide"]],caption:"Seuils indicatifs : la sensibilit\xE9 \xE0 l'hypoxie varie beaucoup d'une personne \xE0 l'autre, et avec la fatigue, le froid ou le tabac."},{type:"text",level:"ATPL",heading:"Ce que dit la r\xE9glementation sur l'oxyg\xE8ne",paragraphs:["La r\xE9glementation impose de l'oxyg\xE8ne compl\xE9mentaire au-del\xE0 de certains seuils : pour le pilote, d\xE8s que le vol d\xE9passe une trentaine de minutes au-dessus d'environ 10 000 ft (FL100), puis en continu au-dessus d'environ 13 000 ft (FL130) ; pour l'ensemble des occupants, \xE9galement au-dessus de ce dernier seuil. Ces valeurs pr\xE9cises varient selon la r\xE9glementation applicable, mais l'ordre de grandeur reste le m\xEAme."]},{type:"table",level:"ATPL",headers:["Facteur de charge","Effet ressenti"],rows:[["+2 g","Sensation d'\xEAtre plaqu\xE9 au si\xE8ge"],["+3 \xE0 +4 g","Vision p\xE9riph\xE9rique qui se r\xE9duit (voile gris)"],["+5 g et plus","Perte de vision puis de connaissance (voile noir)"],["N\xE9gatif (-2 \xE0 -3 g)","Afflux de sang vers la t\xEAte (voile rouge)"]],caption:"Le facteur de charge vu en m\xE9canique du vol a aussi un effet direct sur le corps : le sang a du mal \xE0 irriguer le cerveau au-del\xE0 d'un certain seuil, positif comme n\xE9gatif."}]},{id:"perception-desorientation",title:"Perception et d\xE9sorientation",summary:"Comment le corps peut se tromper sans rep\xE8res visuels fiables.",blocks:[{type:"text",level:"BIA",paragraphs:["Sans rep\xE8re visuel ext\xE9rieur fiable, par exemple dans les nuages ou de nuit au-dessus d'une zone sans lumi\xE8re, l'oreille interne peut donner des sensations d'inclinaison ou de virage totalement fausses. C'est pourquoi le vol sans visibilit\xE9 ext\xE9rieure exige de se fier aux instruments plut\xF4t qu'aux sensations."]},{type:"text",level:"ATPL",heading:"Quelques illusions classiques",paragraphs:["Une illusion vestibulaire fr\xE9quente est la fausse sensation de sortie de virage apr\xE8s un virage prolong\xE9 \xE0 vitesse constante : l'oreille interne s'habitue au mouvement et signale, \xE0 tort, un retour au vol droit quand le virage continue en r\xE9alit\xE9, ou l'inverse \xE0 la sortie. D'autres illusions sont visuelles : une piste en pente peut donner une fausse impression de hauteur en approche.","L'illusion somatogravique, ressentie lors d'une forte acc\xE9l\xE9ration (au d\xE9collage, par exemple), donne la fausse sensation que le nez se cabre, ce qui peut pousser un pilote \xE0 pousser sur le manche sans raison r\xE9elle. C'est cette famille d'illusions qui rend le vol IFR exigeant : il faut apprendre \xE0 faire consciemment confiance aux instruments plut\xF4t qu'\xE0 ses sensations."]}]},{id:"stress-charge-travail",title:"Stress, fatigue et charge de travail",summary:"Comment la fatigue et une charge de travail excessive d\xE9gradent la performance.",blocks:[{type:"text",level:"BIA",paragraphs:["Piloter demande de faire plusieurs choses \xE0 la fois : surveiller les instruments, naviguer, communiquer, d\xE9cider. Quand ces t\xE2ches s'accumulent au-del\xE0 de ce qu'un pilote peut g\xE9rer sereinement, sa performance se d\xE9grade, souvent avant qu'il n'en ait pleinement conscience."]},{type:"text",level:"ATPL",heading:"Un stress mod\xE9r\xE9, utile jusqu'\xE0 un certain point",paragraphs:["Un minimum de stress am\xE9liore la vigilance et la performance ; au-del\xE0 d'un certain seuil, propre \xE0 chaque personne et \xE0 chaque situation, il devient au contraire contre-productif, avec un r\xE9tr\xE9cissement du champ d'attention et une tendance \xE0 se focaliser sur un seul probl\xE8me au d\xE9triment des autres. Reconna\xEEtre ses propres signes de surcharge fait partie de la formation, tout comme des techniques simples pour l'all\xE9ger : prioriser, d\xE9l\xE9guer quand c'est possible, ou simplement ralentir le rythme des actions."]},{type:"text",level:"ATPL",heading:"La fatigue",paragraphs:["La fatigue, qu'elle soit due au manque de sommeil, \xE0 un vol long ou \xE0 un d\xE9calage horaire, d\xE9grade le jugement de fa\xE7on comparable \xE0 l'alcool \xE0 partir d'un certain niveau, tout en \xE9tant plus difficile \xE0 s'auto-\xE9valuer. C'est pourquoi la r\xE9glementation encadre les temps de vol et de repos des \xE9quipages professionnels, et pourquoi un pilote priv\xE9 devrait appliquer la m\xEAme prudence : renoncer \xE0 un vol par fatigue n'a rien d'anodin."]}]},{id:"decision-erreurs",title:"Prise de d\xE9cision et gestion des erreurs",summary:"Pourquoi un accident r\xE9sulte rarement d'une seule cause isol\xE9e.",blocks:[{type:"text",level:"BIA",paragraphs:["L'erreur humaine fait partie du pilotage, comme de toute activit\xE9. L'enjeu n'est pas de ne jamais se tromper, mais de rep\xE9rer ses erreurs suffisamment t\xF4t et de savoir les corriger ou renoncer \xE0 temps."]},{type:"text",level:"ATPL",heading:"La cha\xEEne d'erreurs",paragraphs:["L'analyse des accidents montre qu'ils r\xE9sultent presque toujours d'un encha\xEEnement de plusieurs d\xE9cisions ou erreurs, chacune anodine prise isol\xE9ment, plut\xF4t que d'une cause unique. Interrompre cette cha\xEEne \xE0 n'importe quel maillon, par exemple en renon\xE7ant \xE0 un vol ou en faisant demi-tour, suffit \xE0 \xE9viter l'accident.","Certains pi\xE8ges de d\xE9cision reviennent souvent, comme le get-there-itis, la tentation de continuer un vol \xE0 tout prix pour arriver \xE0 destination malgr\xE9 des conditions qui se d\xE9gradent."]},{type:"text",level:"ATPL",heading:"Une r\xE9alit\xE9 statistique",paragraphs:["En aviation l\xE9g\xE8re, l'immense majorit\xE9 des accidents impliquent un facteur humain \xE0 un moment ou un autre de la cha\xEEne, bien davantage qu'une simple d\xE9faillance technique de l'avion. C'est pr\xE9cis\xE9ment pour cette raison que la formation aux facteurs humains occupe une place croissante dans les programmes, aux c\xF4t\xE9s du pilotage pur et de la technique.","La r\xE9glementation fixe d'ailleurs une limite l\xE9gale d'alcool\xE9mie pour piloter nettement plus stricte que sur la route : au-del\xE0 d'un taux tr\xE8s faible, voler est interdit, et la meilleure marge de s\xE9curit\xE9 reste simplement de ne jamais m\xE9langer les deux."]}]},{id:"vision-audition",title:"Vision et audition en vol",summary:"Pourquoi l'\u0153il humain n'est pas id\xE9alement con\xE7u pour rep\xE9rer un autre avion.",blocks:[{type:"text",level:"BIA",paragraphs:["L'\u0153il distingue beaucoup mieux ce qui bouge par rapport \xE0 un fond que ce qui reste immobile dans le champ de vision. Or un avion sur une trajectoire de collision reste pr\xE9cis\xE9ment fixe dans le champ visuel, sans mouvement apparent qui attirerait l'attention, jusqu'\xE0 grossir brutalement dans les derni\xE8res secondes."]},{type:"text",level:"ATPL",heading:"Balayer le ciel m\xE9thodiquement",paragraphs:["C'est pourquoi la technique recommand\xE9e consiste \xE0 balayer le ciel par petits secteurs successifs, en marquant une pause sur chacun plut\xF4t qu'en promenant contin\xFBment le regard, ce qui laisse \xE0 l'\u0153il le temps de d\xE9tecter un mouvement relatif. Le bruit ambiant du moteur et de la cabine masque par ailleurs une partie des sons ext\xE9rieurs, ce qui limite la d\xE9tection auditive d'un trafic proche, contrairement \xE0 ce qu'on pourrait imaginer."]}]},{id:"mal-air-adaptation",title:"Le mal de l'air et l'adaptation",summary:"D'o\xF9 vient le mal des transports, et comment l'organisme s'habitue au vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Le mal de l'air provient d'un conflit entre ce que l'oreille interne ressent (le mouvement r\xE9el) et ce que les yeux voient, en particulier \xE0 l'int\xE9rieur d'un cockpit o\xF9 les rep\xE8res visuels ext\xE9rieurs se font rares, par exemple en virage prolong\xE9 ou par mauvaise visibilit\xE9."]},{type:"text",level:"ATPL",heading:"Un ph\xE9nom\xE8ne qui s'att\xE9nue avec l'exp\xE9rience",paragraphs:["La sensibilit\xE9 au mal de l'air diminue g\xE9n\xE9ralement avec l'entra\xEEnement, \xE0 mesure que le cerveau apprend \xE0 recalibrer ces informations contradictoires, m\xEAme si certaines personnes y restent plus sujettes que d'autres toute leur vie. Limiter les mouvements de t\xEAte, regarder un point fixe \xE0 l'horizon et \xE9viter de piloter l'estomac vide ou trop charg\xE9 r\xE9duisent les sympt\xF4mes en attendant cette accoutumance."]}]},{id:"travail-equipage-crm",title:"Travail en \xE9quipage (CRM)",summary:"Pourquoi bien communiquer entre pilotes compte autant que bien piloter.",blocks:[{type:"text",level:"BIA",paragraphs:["D\xE8s qu'un avion est pilot\xE9 \xE0 plusieurs, la fa\xE7on dont l'\xE9quipage communique et se r\xE9partit les t\xE2ches devient un facteur de s\xE9curit\xE9 \xE0 part enti\xE8re : plusieurs accidents historiques se sont produits alors que l'avion fonctionnait parfaitement, simplement parce qu'une information cruciale n'avait pas circul\xE9 entre les membres d'\xE9quipage."]},{type:"text",level:"ATPL",heading:"La gestion des ressources en \xE9quipage",paragraphs:["Le CRM (Crew Resource Management) regroupe les pratiques qui structurent ce travail collectif : r\xE9partition claire des r\xF4les, annonces standardis\xE9es \xE0 chaque \xE9tape du vol, et surtout la capacit\xE9 pour n'importe quel membre d'\xE9quipage, m\xEAme le plus junior, de faire remonter une inqui\xE9tude sans h\xE9siter face \xE0 une hi\xE9rarchie. Cette derni\xE8re dimension, la gestion de l'autorit\xE9, a fait l'objet d'une attention particuli\xE8re apr\xE8s plusieurs accidents o\xF9 un subordonn\xE9 avait remarqu\xE9 un probl\xE8me sans oser s'imposer."]}]},{id:"checklists-securite",title:"La check-list, outil de s\xE9curit\xE9",summary:"Pourquoi m\xEAme un pilote exp\xE9riment\xE9 suit une liste \xE9crite plut\xF4t que sa m\xE9moire.",blocks:[{type:"text",level:"BIA",paragraphs:["La check-list garantit qu'une s\xE9rie d'actions critiques est bien r\xE9alis\xE9e dans l'ordre, sans d\xE9pendre uniquement de la m\xE9moire d'un pilote, aussi exp\xE9riment\xE9 soit-il. Elle se lit g\xE9n\xE9ralement \xE0 voix haute, point par point, avec une v\xE9rification physique de chaque \xE9l\xE9ment plut\xF4t qu'une r\xE9citation par c\u0153ur."]},{type:"text",level:"ATPL",heading:"\xAB Faire-v\xE9rifier \xBB plut\xF4t que \xAB lire-faire \xBB",paragraphs:["Sur les actions les plus critiques, la m\xE9thode \xAB faire-v\xE9rifier \xBB (l'action est effectu\xE9e de m\xE9moire puis contr\xF4l\xE9e sur la liste) se r\xE9v\xE8le souvent plus fiable que le simple \xAB lire-faire \xBB (lire l'instruction puis l'ex\xE9cuter), car elle sollicite deux fois l'attention du pilote sur chaque point. Sauter un \xE9l\xE9ment de check-list, ou la r\xE9citer sans vraiment regarder ce qu'elle d\xE9crit, figure parmi les causes d'accident les plus document\xE9es, malgr\xE9 la simplicit\xE9 apparente de l'outil."]}]},{id:"automatisation-pieges",title:"L'automatisation et ses pi\xE8ges",summary:"Ce que le pilote automatique change dans la vigilance du pilote.",blocks:[{type:"text",level:"BIA",paragraphs:["L'automatisation r\xE9duit la charge de travail physique, mais d\xE9place le r\xF4le du pilote vers la surveillance : il doit comprendre ce que fait le syst\xE8me, v\xE9rifier qu'il fait bien ce qui est attendu, et \xEAtre pr\xEAt \xE0 reprendre la main si besoin, ce qui demande une vigilance diff\xE9rente, parfois plus difficile \xE0 maintenir qu'un pilotage actif."]},{type:"text",level:"ATPL",heading:"La complaisance automatique",paragraphs:["Ce ph\xE9nom\xE8ne, la complaisance automatique, d\xE9signe une confiance excessive envers les syst\xE8mes, qui peut faire baisser la garde face \xE0 une anomalie. Elle s'accompagne parfois d'une perte progressive d'aisance au pilotage manuel, faute de pratique r\xE9guli\xE8re, un sujet suffisamment identifi\xE9 pour que certaines compagnies imposent d\xE9sormais des exercices p\xE9riodiques de pilotage manuel, pr\xE9cis\xE9ment pour pr\xE9server cette comp\xE9tence."]}]},{id:"retour-experience",title:"Apprendre de ses erreurs : le retour d'exp\xE9rience",summary:"Comment la s\xE9curit\xE9 a\xE9rienne progresse en analysant syst\xE9matiquement incidents et accidents.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque incident, m\xEAme mineur, et chaque accident font l'objet d'une analyse par des organismes d\xE9di\xE9s, ind\xE9pendants des compagnies et des constructeurs, dans le seul but de comprendre ce qui s'est pass\xE9 et d'\xE9viter que cela se reproduise, jamais de d\xE9signer un coupable."]},{type:"text",level:"ATPL",heading:"Le compte-rendu volontaire",paragraphs:["Au-del\xE0 des enqu\xEAtes officielles apr\xE8s accident, de nombreux syst\xE8mes encouragent les pilotes \xE0 signaler volontairement leurs propres erreurs ou quasi-incidents, souvent de fa\xE7on confidentielle ou anonymis\xE9e, pour alimenter une base de retour d'exp\xE9rience collective. Cette culture, qui valorise le signalement plut\xF4t que la sanction, part du principe qu'une erreur reconnue et analys\xE9e profite \xE0 tous, alors qu'une erreur cach\xE9e se reproduira t\xF4t ou tard, chez quelqu'un d'autre."]}]}]},{id:"histoire",title:"Histoire de l'a\xE9ronautique et de l'espace",tagline:"Des premiers planeurs \xE0 la conqu\xEAte spatiale.",Icon:Rn,status:"available",lessons:[{id:"precurseurs",title:"Les pr\xE9curseurs et les premiers vols motoris\xE9s",summary:"De Cl\xE9ment Ader aux fr\xE8res Wright, puis la travers\xE9e de la Manche par Bl\xE9riot.",blocks:[{type:"text",level:"BIA",paragraphs:["Apr\xE8s des si\xE8cles de tentatives et les premiers vols en ballon puis en planeur au XIXe si\xE8cle, notamment ceux d'Otto Lilienthal, le Fran\xE7ais Cl\xE9ment Ader fait d\xE9coller son \xC9ole de quelques m\xE8tres en 1890, sans toutefois de vol r\xE9ellement contr\xF4l\xE9.","Le 17 d\xE9cembre 1903, les fr\xE8res Wright r\xE9alisent aux \xC9tats-Unis le premier vol motoris\xE9, contr\xF4l\xE9 et soutenu de l'histoire, \xE0 bord du Flyer, au-dessus des dunes de Kitty Hawk. Quelques ann\xE9es plus tard, en 1909, Louis Bl\xE9riot devient le premier \xE0 traverser la Manche en avion, \xE0 bord de son Bl\xE9riot XI, un exploit qui marque les esprits en Europe et lance v\xE9ritablement l'aviation comme secteur industriel."]}]},{id:"guerres-jet",title:"Des guerres mondiales \xE0 l'\xE8re du jet",summary:"Comment les deux conflits mondiaux acc\xE9l\xE8rent les progr\xE8s techniques, jusqu'au premier avion \xE0 r\xE9action.",blocks:[{type:"text",level:"BIA",paragraphs:["La Premi\xE8re Guerre mondiale transforme l'avion, d'abord simple outil de reconnaissance, en v\xE9ritable arme de combat, et acc\xE9l\xE8re consid\xE9rablement les progr\xE8s techniques. L'entre-deux-guerres voit ensuite le passage progressif du bois et de la toile aux structures m\xE9talliques, ainsi que les d\xE9buts de l'aviation commerciale, avec des figures comme Mermoz et Saint-Exup\xE9ry sur les lignes de l'A\xE9ropostale.","La Seconde Guerre mondiale pousse plus loin encore ces progr\xE8s, et voit appara\xEEtre les premiers avions \xE0 r\xE9action op\xE9rationnels, comme le Messerschmitt Me 262 allemand. En 1947, l'Am\xE9ricain Chuck Yeager devient le premier pilote \xE0 franchir le mur du son en vol contr\xF4l\xE9 et en palier, \xE0 bord du Bell X-1, ouvrant l'\xE8re du vol supersonique."]}]},{id:"aviation-moderne",title:"L'aviation civile et le transport a\xE9rien moderne",summary:"Du premier jet commercial au gros-porteur, jusqu'au Concorde.",blocks:[{type:"text",level:"BIA",paragraphs:["L'apr\xE8s-guerre voit le transport a\xE9rien civil se d\xE9velopper rapidement, d'abord avec des avions \xE0 h\xE9lices puis, \xE0 partir des ann\xE9es 1950, avec les premiers avions de ligne \xE0 r\xE9action, qui r\xE9duisent consid\xE9rablement les temps de trajet. Le Boeing 747, entr\xE9 en service en 1970, symbolise l'arriv\xE9e du transport a\xE9rien de masse, avec une capacit\xE9 largement sup\xE9rieure aux avions pr\xE9c\xE9dents.","Le Concorde, mis en service en 1976 par la France et le Royaume-Uni, reste \xE0 ce jour le seul avion de ligne supersonique \xE0 avoir \xE9t\xE9 exploit\xE9 commercialement, avant son retrait en 2003 pour des raisons \xE9conomiques et de s\xE9curit\xE9 apr\xE8s un accident."]}]},{id:"conquete-spatiale",title:"La conqu\xEAte spatiale",summary:"De Spoutnik \xE0 la Station spatiale internationale, en passant par Gagarine et Apollo 11.",blocks:[{type:"text",level:"BIA",paragraphs:["Le 4 octobre 1957, l'URSS met en orbite Spoutnik 1, premier satellite artificiel, qui marque le d\xE9but de l'\xE8re spatiale et de la course entre les deux grandes puissances de la guerre froide. Youri Gagarine devient le premier homme dans l'espace le 12 avril 1961, \xE0 bord de Vostok 1.","Le 21 juillet 1969, Neil Armstrong devient le premier homme \xE0 marcher sur la Lune, lors de la mission Apollo 11. Depuis, la conqu\xEAte spatiale s'est poursuivie avec les stations spatiales, dont l'actuelle Station spatiale internationale, occup\xE9e en permanence depuis 2000, et plus r\xE9cemment l'essor des lanceurs r\xE9utilisables, qui a nettement r\xE9duit le co\xFBt d'acc\xE8s \xE0 l'espace."]}]},{id:"pionnieres-aviation",title:"Les pionni\xE8res de l'aviation",summary:"Des premi\xE8res licences f\xE9minines aux records de vitesse.",blocks:[{type:"text",level:"BIA",paragraphs:["La Fran\xE7aise Raymonde de Laroche devient en 1910 la premi\xE8re femme titulaire d'un brevet de pilote au monde. Quelques ann\xE9es plus tard, H\xE9l\xE8ne Boucher encha\xEEne les records de vitesse dans les ann\xE9es 1930, avant de mourir en plein entra\xEEnement en 1934, \xE0 seulement 26 ans."]},{type:"text",level:"BIA",heading:"Amelia Earhart et Jacqueline Auriol",paragraphs:["L'Am\xE9ricaine Amelia Earhart devient en 1932 la premi\xE8re femme \xE0 traverser l'Atlantique en solitaire, avant de dispara\xEEtre en 1937 en tentant un tour du monde. Plus tard, la Fran\xE7aise Jacqueline Auriol, pilote d'essai, d\xE9tient \xE0 plusieurs reprises le record de vitesse f\xE9minin dans les ann\xE9es 1950, contribuant \xE0 ouvrir le m\xE9tier de pilote d'essai aux femmes."]}]},{id:"aeropostale-raids",title:"L'A\xE9ropostale et les grands raids",summary:"Comment des lignes postales ont ouvert la voie \xE0 l'aviation commerciale longue distance.",blocks:[{type:"text",level:"BIA",paragraphs:["Dans les ann\xE9es 1920, la compagnie fond\xE9e par Pierre-Georges Lat\xE9co\xE8re, bient\xF4t surnomm\xE9e l'A\xE9ropostale, relie la France \xE0 l'Afrique de l'Ouest puis \xE0 l'Am\xE9rique du Sud par avion, pour acheminer le courrier bien plus vite que par bateau. Ces lignes, pionni\xE8res et dangereuses, forment toute une g\xE9n\xE9ration d'aviateurs."]},{type:"text",level:"BIA",heading:"Mermoz et Saint-Exup\xE9ry",paragraphs:["Jean Mermoz r\xE9alise en 1930 la premi\xE8re travers\xE9e de l'Atlantique Sud par avion sur cette ligne postale, avant de dispara\xEEtre en vol au-dessus du m\xEAme oc\xE9an en 1936. Antoine de Saint-Exup\xE9ry, lui aussi pilote de l'A\xE9ropostale, tire de cette exp\xE9rience ses r\xE9cits \xAB Vol de nuit \xBB et \xAB Terre des hommes \xBB, qui ont fait conna\xEEtre cette aventure bien au-del\xE0 du monde a\xE9ronautique."]}]},{id:"aviation-militaire-histoire",title:"L'aviation militaire, des biplans aux avions furtifs",summary:"De l'observation a\xE9rienne de 1914 \xE0 la furtivit\xE9 radar contemporaine.",blocks:[{type:"text",level:"BIA",paragraphs:["Utilis\xE9 d'abord pour observer les positions ennemies lors de la Premi\xE8re Guerre mondiale, l'avion devient rapidement une arme \xE0 part enti\xE8re, avec l'apparition des chasseurs et des as, des pilotes qui accumulent de nombreuses victoires a\xE9riennes en combat singulier."]},{type:"text",level:"ATPL",heading:"Vers la furtivit\xE9",paragraphs:["Apr\xE8s l'arriv\xE9e du jet dans les ann\xE9es 1940, la course technologique militaire se poursuit vers la vitesse puis, \xE0 partir des ann\xE9es 1980, vers la furtivit\xE9 : des formes \xE9tudi\xE9es pour r\xE9fl\xE9chir le moins possible les ondes radar, associ\xE9es \xE0 d

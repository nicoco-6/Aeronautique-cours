es mat\xE9riaux absorbants, rendent certains avions militaires beaucoup plus difficiles \xE0 d\xE9tecter qu'un avion de forme conventionnelle."]}]},{id:"helicopteres-histoire",title:"H\xE9licopt\xE8res et aviation verticale, une histoire",summary:"Des premiers essais h\xE9sitants \xE0 l'h\xE9licopt\xE8re pratique de Sikorsky.",blocks:[{type:"text",level:"BIA",paragraphs:["D\xE8s 1907, le Fran\xE7ais Paul Cornu r\xE9alise avec son appareil un tr\xE8s bref d\xE9collage vertical, \xE0 peine contr\xF4lable et retenu par des perches : un jalon historique, mais encore loin d'un v\xE9hicule pratique."]},{type:"text",level:"BIA",heading:"Sikorsky et le premier h\xE9licopt\xE8re pratique",paragraphs:["Il faut attendre 1939 pour qu'Igor Sikorsky, ing\xE9nieur russe \xE9migr\xE9 aux \xC9tats-Unis, fasse voler le VS-300, le premier h\xE9licopt\xE8re r\xE9ellement maniable, avec la configuration devenue classique : un grand rotor principal et un petit rotor de queue. Ses d\xE9veloppements ult\xE9rieurs sont produits en s\xE9rie d\xE8s la Seconde Guerre mondiale, lan\xE7ant v\xE9ritablement l'\xE8re de l'h\xE9licopt\xE8re."]}]},{id:"exploration-spatiale-recente",title:"L'exploration spatiale r\xE9cente",summary:"Rovers martiens et essor du vol spatial commercial r\xE9utilisable.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 de la Lune, l'exploration s'est tourn\xE9e vers Mars, avec plusieurs g\xE9n\xE9rations de rovers robotis\xE9s envoy\xE9s explorer sa surface \xE0 la recherche d'indices sur son pass\xE9, en particulier d'\xE9ventuelles traces d'eau liquide."]},{type:"text",level:"ATPL",heading:"Le retour des lanceurs r\xE9utilisables",paragraphs:["Depuis le milieu des ann\xE9es 2010, des entreprises priv\xE9es ont d\xE9montr\xE9 la possibilit\xE9 de r\xE9cup\xE9rer et de r\xE9utiliser le premier \xE9tage d'une fus\xE9e, qui se pose verticalement apr\xE8s avoir largu\xE9 sa charge utile, plut\xF4t que d'\xEAtre perdu \xE0 chaque lancement comme c'\xE9tait syst\xE9matiquement le cas auparavant. Cette r\xE9utilisabilit\xE9 a fait chuter le co\xFBt d'acc\xE8s \xE0 l'espace et ouvert la voie \xE0 des vols habit\xE9s op\xE9r\xE9s par des soci\xE9t\xE9s priv\xE9es plut\xF4t que par les seules agences gouvernementales."]}]},{id:"vol-a-voile-histoire",title:"Le vol \xE0 voile et l'aviation l\xE9g\xE8re, une histoire",summary:"Du planeur de loisir \xE0 l'aviation l\xE9g\xE8re et sportive d'aujourd'hui.",blocks:[{type:"text",level:"BIA",paragraphs:["Apr\xE8s les premiers planeurs exp\xE9rimentaux du XIXe si\xE8cle, le vol \xE0 voile se d\xE9veloppe surtout dans l'entre-deux-guerres en Allemagne, o\xF9 les restrictions impos\xE9es \xE0 l'aviation motoris\xE9e apr\xE8s la Premi\xE8re Guerre mondiale poussent de nombreux pilotes vers le vol sans moteur : c'est l\xE0 que se mettent au point les techniques d'exploitation des ascendances thermiques encore utilis\xE9es aujourd'hui."]},{type:"text",level:"BIA",heading:"L'essor de l'aviation l\xE9g\xE8re",paragraphs:["Parall\xE8lement, l'aviation l\xE9g\xE8re motoris\xE9e se d\xE9mocratise apr\xE8s la Seconde Guerre mondiale, avec des avions de construction simplifi\xE9e accessibles aux particuliers et aux clubs. Cette d\xE9mocratisation se poursuit aujourd'hui avec les ULM, plus l\xE9gers et moins co\xFBteux, qui ouvrent le vol \xE0 un public toujours plus large, dans la continuit\xE9 de cette histoire."]}]}]},{id:"comm",title:"Communications",tagline:"Phras\xE9ologie radio normalis\xE9e, proc\xE9dures VFR et IFR.",Icon:ss,status:"available",lessons:[{id:"principes-phraseologie",title:"Principes de la phras\xE9ologie",summary:"L'alphabet OACI et la structure d'un message radio.",blocks:[{type:"text",level:"BIA",paragraphs:["La phras\xE9ologie a\xE9ronautique normalise les \xE9changes radio pour qu'ils restent compr\xE9hensibles malgr\xE9 la qualit\xE9 parfois m\xE9diocre des liaisons et les diff\xE9rences de langue. Elle repose notamment sur l'alphabet phon\xE9tique OACI, qui \xE9p\xE8le chaque lettre avec un mot d\xE9di\xE9 pour \xE9viter toute confusion."]},{type:"list",level:"BIA",heading:"L'alphabet phon\xE9tique OACI",items:["A Alpha, B Bravo, C Charlie, D Delta, E Echo, F Foxtrot","G Golf, H Hotel, I India, J Juliett, K Kilo, L Lima","M Mike, N November, O Oscar, P Papa, Q Quebec, R Romeo","S Sierra, T Tango, U Uniform, V Victor, W Whiskey","X X-ray, Y Yankee, Z Zulu"]},{type:"text",level:"ATPL",heading:"Structure d'un message",paragraphs:["Un message radio suit en g\xE9n\xE9ral une structure fixe : \xE0 qui l'on s'adresse, qui l'on est, puis le message lui-m\xEAme. Les instructions importantes, notamment celles qui touchent \xE0 la s\xE9curit\xE9, doivent \xEAtre r\xE9p\xE9t\xE9es par le pilote (le read-back), afin que le contr\xF4leur puisse v\xE9rifier qu'elles ont \xE9t\xE9 correctement comprises.","Les nombres se prononcent chiffre par chiffre (par exemple \xAB un vingt-cinq \xBB ne se dit pas, on dit \xAB un deux cinq \xBB), \xE0 l'exception des niveaux et altitudes ronds, pour \xE9viter toute ambigu\xEFt\xE9 entre des valeurs proches."]}]},{id:"communications-vfr",title:"Communications VFR",summary:"Les \xE9changes typiques d'un vol VFR, du roulage au d\xE9collage.",blocks:[{type:"text",level:"BIA",paragraphs:["En VFR, les communications accompagnent chaque \xE9tape du vol : demande de mise en route et de roulage, autorisation de d\xE9collage, comptes-rendus en tour de piste, puis en croisi\xE8re sur les fr\xE9quences successives travers\xE9es."]},{type:"text",level:"ATPL",heading:"Clairances et espace contr\xF4l\xE9",paragraphs:["En espace contr\xF4l\xE9, chaque \xE9tape peut n\xE9cessiter une clairance explicite du contr\xF4leur avant d'\xEAtre ex\xE9cut\xE9e, par exemple pour s'aligner sur la piste ou p\xE9n\xE9trer une zone de contr\xF4le. Hors espace contr\xF4l\xE9, le pilote s'auto-annonce sur la fr\xE9quence appropri\xE9e sans attendre d'autorisation, mais reste responsable de sa propre s\xE9paration avec les autres trafics."]},{type:"text",level:"ATPL",heading:"En cas de panne radio",paragraphs:["En cas de panne radio en circuit d'a\xE9rodrome, la tour peut communiquer par signaux lumineux : un feu vert continu autorise le d\xE9collage ou l'atterrissage, un feu rouge continu signifie de c\xE9der le passage ou de s'arr\xEAter, un feu rouge clignotant demande de d\xE9gager la piste utilis\xE9e. C'est une proc\xE9dure de secours \xE0 conna\xEEtre m\xEAme si elle est rarement utilis\xE9e en pratique."]}]},{id:"communications-ifr",title:"Communications IFR et proc\xE9dures d'urgence",summary:"Ce qui change en IFR, et la phras\xE9ologie des situations d'urgence.",blocks:[{type:"text",level:"ATPL",paragraphs:["En IFR, les \xE9changes sont plus denses et plus formalis\xE9s : clairance de route avant le d\xE9part, autorisations de changement de niveau, d'interception d'une trajectoire, ou de proc\xE9dure d'approche, chacune devant \xEAtre lue int\xE9gralement (read-back) par le pilote."]},{type:"list",level:"ATPL",heading:"Deux mots-cl\xE9s d'urgence",items:["Mayday, r\xE9p\xE9t\xE9 trois fois, signale une situation de d\xE9tresse : un danger grave et imminent qui menace l'avion ou ses occupants.","Pan Pan, r\xE9p\xE9t\xE9 trois fois, signale une situation d'urgence qui ne met pas imm\xE9diatement en danger l'avion ou ses occupants, mais n\xE9cessite une assistance."]},{type:"text",level:"ATPL",heading:"Le code transpondeur d'urgence",paragraphs:["En compl\xE9ment de la voix, afficher le code transpondeur 7700 signale une d\xE9tresse \xE0 tous les organismes de contr\xF4le qui re\xE7oivent l'\xE9cho radar de l'avion, m\xEAme sans contact radio \xE9tabli. D'autres codes d\xE9di\xE9s existent pour une panne radio (7600) ou une intervention illicite \xE0 bord (7500)."]}]},{id:"organismes-frequences",title:"Organismes et fr\xE9quences",summary:"Qui appeler selon la phase de vol, et comment trouver la bonne fr\xE9quence.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque organisme au sol dispose de sa propre fr\xE9quence radio, publi\xE9e sur les cartes et dans la documentation de chaque a\xE9rodrome : tour, approche, centre en route, ou simple fr\xE9quence d'auto-information sur un terrain non contr\xF4l\xE9. Changer de fr\xE9quence au bon moment, en suivant les instructions re\xE7ues ou les limites d'espace, fait partie du travail courant du pilote."]},{type:"text",level:"ATPL",heading:"La fr\xE9quence de d\xE9tresse",paragraphs:["La fr\xE9quence 121,5 MHz, surveill\xE9e en continu par de nombreux organismes et a\xE9ronefs, sert exclusivement aux communications de d\xE9tresse et d'urgence : un pilote qui ne parvient \xE0 joindre personne sur sa fr\xE9quence habituelle peut toujours s'y rabattre en dernier recours pour obtenir de l'aide."]}]},{id:"atis-infos-auto",title:"L'ATIS et les informations automatiques",summary:"Comment r\xE9cup\xE9rer les informations de base avant m\xEAme de contacter un contr\xF4leur.",blocks:[{type:"text",level:"BIA",paragraphs:["Sur les a\xE9rodromes les plus fr\xE9quent\xE9s, un message enregistr\xE9 et mis \xE0 jour r\xE9guli\xE8rement, l'ATIS, diffuse en continu sur une fr\xE9quence d\xE9di\xE9e les informations de base : piste en service, vent, visibilit\xE9, calage altim\xE9trique. \xC9couter ce message avant le premier contact radio \xE9vite de faire r\xE9p\xE9ter ces informations au contr\xF4leur, et acc\xE9l\xE8re les \xE9changes."]},{type:"text",level:"ATPL",heading:"Accuser r\xE9ception de l'ATIS",paragraphs:["Chaque message ATIS est identifi\xE9 par une lettre de l'alphabet OACI, qui change \xE0 chaque mise \xE0 jour : le premier contact radio inclut g\xE9n\xE9ralement la mention de cette lettre, pour que le contr\xF4leur sache imm\xE9diatement que le pilote dispose des informations \xE0 jour, sans avoir \xE0 les redonner int\xE9gralement."]}]},{id:"comptes-rendus-croisiere",title:"Comptes-rendus standards en croisi\xE8re",summary:"Ce qu'un pilote communique en route, m\xEAme hors espace contr\xF4l\xE9.",blocks:[{type:"text",level:"BIA",paragraphs:["En croisi\xE8re, un pilote VFR communique g\xE9n\xE9ralement sa position, son altitude et ses intentions \xE0 chaque changement de fr\xE9quence, ou en passant un point de report notable : de quoi permettre aux autres usagers de la fr\xE9quence de se faire une image mentale du trafic environnant, m\xEAme sans service de contr\xF4le actif."]},{type:"text",level:"ATPL",heading:"Le format standard d'un compte-rendu de position",paragraphs:["Un compte-rendu de position suit un ordre reconnu de tous : identification de l'avion, position actuelle, heure de passage, altitude, puis intentions. Respecter cet ordre, m\xEAme sous forme abr\xE9g\xE9e en VFR non contr\xF4l\xE9, aide les autres pilotes \xE0 l'\xE9coute \xE0 extraire rapidement l'information utile au milieu d'un message parfois rapide."]}]},{id:"phraseologie-situations-particulieres",title:"Phras\xE9ologie des situations particuli\xE8res",summary:"Remise de gaz, demi-tour, essais radio : des formules d\xE9di\xE9es pour ne pas improviser.",blocks:[{type:"text",level:"BIA",paragraphs:["Certaines situations, bien que non urgentes, m\xE9ritent une phras\xE9ologie bien identifi\xE9e plut\xF4t qu'une formulation improvis\xE9e : annoncer une remise de gaz (interrompre un atterrissage pour reprendre de l'altitude), un demi-tour en tour de piste, ou un simple essai radio avant le premier vol de la journ\xE9e."]},{type:"text",level:"ATPL",heading:"L'essai radio gradu\xE9",paragraphs:["L'essai radio utilise une \xE9chelle de lisibilit\xE9 de 1 \xE0 5 (1 : inintelligible, 5 : parfaitement clair) plut\xF4t qu'un simple \xAB vous me recevez ? \xBB, afin de donner une information exploitable \xE0 l'autre station sur la qualit\xE9 r\xE9elle de la liaison, utile pour d\xE9cider si elle est suffisante pour la suite du vol."]}]},{id:"nombres-lettres-unites",title:"Nombres, lettres et unit\xE9s en phras\xE9ologie",summary:"Comment prononcer sans ambigu\xEFt\xE9 les chiffres, les niveaux et les fr\xE9quences.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque chiffre se prononce isol\xE9ment pour \xE9viter toute confusion : \xAB 125 \xBB se dit \xAB un deux cinq \xBB, jamais \xAB cent vingt-cinq \xBB. Les niveaux de vol et les caps suivent la m\xEAme logique, toujours chiffre par chiffre."]},{type:"text",level:"ATPL",heading:"Les exceptions \xE0 conna\xEEtre",paragraphs:["Les altitudes et niveaux ronds en centaines ou en milliers peuvent se grouper (\xAB niveau cent \xBB pour FL100), de m\xEAme que les caps et routes complets \xE0 trois chiffres sont parfois \xE9nonc\xE9s comme un nombre entier dans certains contextes. Ces exceptions, apprises avec la pratique, ne doivent jamais introduire d'ambigu\xEFt\xE9 : en cas de doute, revenir \xE0 l'\xE9nonc\xE9 chiffre par chiffre reste toujours la solution la plus s\xFBre."]}]},{id:"anglais-aeronautique",title:"L'anglais a\xE9ronautique",summary:"Pourquoi l'anglais s'impose au-del\xE0 des fronti\xE8res fran\xE7aises, et ce qu'il recouvre vraiment.",blocks:[{type:"text",level:"BIA",paragraphs:["Si la phras\xE9ologie fran\xE7aise suffit pour voler en France sur la plupart des terrains, l'anglais a\xE9ronautique devient indispensable d\xE8s qu'un vol franchit une fronti\xE8re, ou \xE9volue sur un a\xE9rodrome international : c'est la langue commune qui permet \xE0 des pilotes et contr\xF4leurs de nationalit\xE9s diff\xE9rentes de se comprendre."]},{type:"text",level:"ATPL",heading:"Phras\xE9ologie standard et anglais conversationnel",paragraphs:["Au-del\xE0 de la phras\xE9ologie standard, largement commune d'un pays \xE0 l'autre et assez vite m\xE9morisable, une situation non pr\xE9vue peut obliger \xE0 sortir de ce cadre et \xE0 communiquer en anglais courant avec le contr\xF4leur : c'est pour cette raison que les licences professionnelles exigent un niveau d'anglais certifi\xE9, au-del\xE0 de la simple phras\xE9ologie apprise par c\u0153ur."]}]},{id:"erreurs-phraseologie",title:"Erreurs de phras\xE9ologie classiques et comment les \xE9viter",summary:"Les pi\xE8ges les plus fr\xE9quents chez les pilotes en formation.",blocks:[{type:"list",level:"BIA",heading:"Des erreurs fr\xE9quentes",items:["Confondre deux indicatifs d'appel proches sur une m\xEAme fr\xE9quence tr\xE8s charg\xE9e.","Oublier de r\xE9p\xE9ter (read-back) une instruction pourtant bien re\xE7ue.","Parler trop vite ou encha\xEEner trop d'informations en un seul message.","Utiliser un vocabulaire non standard l\xE0 o\xF9 une formule normalis\xE9e existe."]},{type:"text",level:"ATPL",heading:"Le bon r\xE9flexe",paragraphs:["En cas de doute sur une instruction re\xE7ue, mieux vaut toujours demander une r\xE9p\xE9tition (\xAB dites encore \xBB) que de deviner ou de supposer : une mauvaise compr\xE9hension non corrig\xE9e co\xFBte souvent bien plus cher, en temps comme en s\xE9curit\xE9, que les quelques secondes n\xE9cessaires pour la clarifier imm\xE9diatement."]}]}]},{id:"prepa-vol",title:"Pr\xE9paration et gestion du vol",tagline:"Masse et centrage, performances, plan de vol.",Icon:cs,status:"available",lessons:[{id:"masse-centrage",title:"Masse et centrage",summary:"Rester dans les limites de masse et de centrage de l'avion.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant chaque vol, il faut v\xE9rifier que la masse totale de l'avion, \xE9quipage, passagers, bagages et carburant compris, reste inf\xE9rieure \xE0 la masse maximale autoris\xE9e, et que le centre de gravit\xE9 se situe dans la plage pr\xE9vue par le constructeur."]},{type:"text",level:"ATPL",heading:"Bras de levier et moment",paragraphs:["Le calcul de centrage repose sur la notion de moment, le produit d'une masse par son bras de levier, sa distance \xE0 un point de r\xE9f\xE9rence. En sommant les moments de chaque poste (occupants, bagages, carburant) et en divisant par la masse totale, on obtient la position du centre de gravit\xE9.","Un centrage trop avant rend l'avion plus stable mais exige plus de portance de l'empennage, donc plus de tra\xEEn\xE9e ; un centrage trop arri\xE8re le rend plus maniable mais moins stable, avec un risque accru de d\xE9crochage difficile \xE0 rattraper."]},{type:"diagram",level:"ATPL",diagramId:"cg-envelope",caption:"Le devis de masse et centrage se v\xE9rifie graphiquement : le point calcul\xE9 doit tomber dans le domaine autoris\xE9, \xE0 toutes les masses envisag\xE9es pour le vol."},{type:"text",level:"ATPL",heading:"Pourquoi v\xE9rifier \xE0 deux masses",paragraphs:["Le domaine autoris\xE9 n'est pas un simple intervalle fixe : il se resserre g\xE9n\xE9ralement pr\xE8s de la masse maximale. Un centrage prudent au d\xE9collage peut donc sortir du domaine \xE0 l'atterrissage, une fois le carburant consomm\xE9, si le r\xE9servoir n'est pas au centre de gravit\xE9 de l'avion : c'est pourquoi on v\xE9rifie le centrage aux deux masses extr\xEAmes du vol, pas seulement au d\xE9part."]}]},{id:"performances",title:"Performances au d\xE9collage et \xE0 l'atterrissage",summary:"Ce qui allonge ou raccourcit les distances de d\xE9collage et d'atterrissage.",blocks:[{type:"list",level:"BIA",heading:"Les facteurs qui allongent la distance",items:["Une masse plus \xE9lev\xE9e.","Une altitude ou une temp\xE9rature plus \xE9lev\xE9es (l'air est alors moins dense).","Une piste en pente montante, ou humide, ou herbeuse.","Un vent arri\xE8re plut\xF4t que de face."]},{type:"text",level:"ATPL",heading:"L'altitude densit\xE9",paragraphs:["L'altitude et la temp\xE9rature se combinent dans la notion d'altitude densit\xE9 : l'altitude \xE0 laquelle la densit\xE9 de l'air observ\xE9e correspondrait, en atmosph\xE8re standard. Par forte chaleur en altitude, l'altitude densit\xE9 peut \xEAtre largement sup\xE9rieure \xE0 l'altitude r\xE9elle du terrain, ce qui d\xE9grade fortement les performances. Les abaques du manuel de vol permettent de calculer pr\xE9cis\xE9ment les distances attendues \xE0 partir de ces param\xE8tres."]},{type:"text",level:"ATPL",heading:"Des marges, pas des valeurs limites",paragraphs:["Les distances publi\xE9es dans le manuel de vol correspondent \xE0 un avion neuf, pilot\xE9 de fa\xE7on optimale, sur piste s\xE8che et dure. Un pilote prudent applique une marge de s\xE9curit\xE9 substantielle par rapport \xE0 ces chiffres, plut\xF4t que de calculer au plus juste, pour absorber l'\xE9cart entre les conditions d'essai et la r\xE9alit\xE9 d'un vol donn\xE9."]}]},{id:"plan-vol",title:"Plan de vol et dossier m\xE9t\xE9o",summary:"Pr\xE9parer un vol : plan de vol, NOTAM, et lecture d'un METAR.",blocks:[{type:"text",level:"BIA",paragraphs:["Pr\xE9parer un vol ne se limite pas \xE0 la navigation : il faut aussi v\xE9rifier la m\xE9t\xE9o pr\xE9vue sur tout le trajet et se renseigner sur l'\xE9tat des a\xE9rodromes et des espaces travers\xE9s avant de partir."]},{type:"text",level:"ATPL",heading:"Plan de vol et NOTAM",paragraphs:["Le plan de vol VFR, d\xE9pos\xE9 avant le d\xE9part pour les vols qui le n\xE9cessitent, notamment ceux qui traversent une fronti\xE8re, pr\xE9cise la route pr\xE9vue, les points de report et l'autonomie ; il sert aussi \xE0 d\xE9clencher les recherches si l'avion n'arrive pas dans un d\xE9lai pr\xE9vu. Les NOTAM (Notice To Airmen) signalent les informations temporaires importantes : travaux sur une piste, zone temporairement activ\xE9e, balise en panne."]},{type:"text",level:"ATPL",heading:"Lire un METAR",paragraphs:["Le METAR est une observation m\xE9t\xE9o cod\xE9e, transmise r\xE9guli\xE8rement par les a\xE9rodromes \xE9quip\xE9s. Un exemple simplifi\xE9 : \xAB LFPG 231000Z 24012KT 9999 FEW030 18/09 Q1015 \xBB se lit ainsi : \xE0 Paris-Charles-de-Gaulle, le 23 \xE0 10h00 UTC, vent du 240\xB0 pour 12 n\u0153uds, visibilit\xE9 sup\xE9rieure \xE0 10 km, quelques nuages \xE9pars \xE0 3 000 ft, temp\xE9rature 18\xB0C, point de ros\xE9e 9\xB0C, QNH 1015 hPa. Le TAF, construit avec le m\xEAme code mais organis\xE9 diff\xE9remment, donne cette fois une pr\xE9vision pour les heures \xE0 venir (9h ou 24h selon le type) plut\xF4t qu'une observation instantan\xE9e."]},{type:"table",level:"ATPL",headers:["Code","N\xE9bulosit\xE9"],rows:[["SKC","Ciel clair (0/8)"],["FEW","Quelques nuages (1 \xE0 2/8)"],["SCT","\xC9pars (3 \xE0 4/8)"],["BKN","Fragment\xE9 (5 \xE0 7/8)"],["OVC","Couvert (8/8)"]],caption:"La n\xE9bulosit\xE9 se mesure en octas, huiti\xE8mes de ciel couverts. CAVOK (Ceiling And Visibility OK) remplace tout ce bloc quand la visibilit\xE9 d\xE9passe 10 km, sans nuage sous 1 500 m ni ph\xE9nom\xE8ne significatif."}]},{id:"devis-masse-etape",title:"Le devis de masse, \xE9tape par \xE9tape",summary:"Comment additionner concr\xE8tement masse \xE0 vide, occupants, bagages et carburant.",blocks:[{type:"text",level:"BIA",paragraphs:["Le devis de masse part de la masse \xE0 vide de l'avion, une donn\xE9e fixe propre \xE0 chaque exemplaire, \xE0 laquelle on ajoute successivement la masse des occupants, celle des bagages, puis celle du carburant embarqu\xE9, pour obtenir la masse totale au d\xE9collage."]},{type:"text",level:"ATPL",heading:"Associer un moment \xE0 chaque poste",paragraphs:["Chaque poste de cette liste a aussi un bras de levier propre, fix\xE9 par le constructeur : si\xE8ge avant, si\xE8ge arri\xE8re, soute \xE0 bagages, r\xE9servoirs. En multipliant chaque masse par son bras de levier puis en sommant ces moments avant de diviser par la masse totale, on obtient la position du centre de gravit\xE9, \xE0 comparer ensuite au domaine autoris\xE9 vu dans la le\xE7on sur le centrage."]}]},{id:"distances-abaque",title:"Calcul des distances sur abaque",summary:"Lire un graphique de performances pour en tirer une distance de d\xE9collage r\xE9elle.",blocks:[{type:"text",level:"BIA",paragraphs:["Le manuel de vol fournit des abaques, des graphiques \xE0 plusieurs entr\xE9es, qui permettent de passer des conditions du jour (temp\xE9rature, altitude du terrain, masse, vent) \xE0 une distance de d\xE9collage ou d'atterrissage attendue, sans avoir \xE0 refaire soi-m\xEAme les calculs a\xE9rodynamiques sous-jacents."]},{type:"text",level:"ATPL",heading:"Suivre les lignes de construction",paragraphs:["Lire un abaque consiste \xE0 entrer par une valeur connue (par exemple la temp\xE9rature), suivre une ligne de construction jusqu'\xE0 croiser une autre courbe (l'altitude), puis r\xE9p\xE9ter l'op\xE9ration pour chaque param\xE8tre jusqu'\xE0 obtenir la distance finale. Une erreur de lecture \xE0 une \xE9tape se propage \xE0 toutes les suivantes, d'o\xF9 l'int\xE9r\xEAt de v\xE9rifier la coh\xE9rence du r\xE9sultat final par rapport \xE0 l'ordre de grandeur attendu."]}]},{id:"carburant-reserves",title:"Carburant : calcul et gestion des r\xE9serves",summary:"Carburant de voyage, de d\xE9gagement, et r\xE9serve finale : ce que couvre chaque poste.",blocks:[{type:"text",level:"BIA",paragraphs:["Le carburant total emport\xE9 se d\xE9compose en plusieurs postes distincts : celui n\xE9cessaire pour rallier la destination, celui pr\xE9vu pour rejoindre un a\xE9rodrome de d\xE9gagement si besoin, et une r\xE9serve finale incompressible, jamais entam\xE9e sauf urgence r\xE9elle."]},{type:"text",level:"ATPL",heading:"Des minutes, pas seulement des litres",paragraphs:["Cette r\xE9serve finale s'exprime en temps de vol \xE0 une consommation donn\xE9e plut\xF4t qu'en volume, g\xE9n\xE9ralement de l'ordre de 30 minutes de vol de jour et 45 minutes de nuit pour un avion l\xE9ger. Un pilote prudent planifie pour atterrir avec une marge confortable au-dessus de ce minimum r\xE9glementaire, pas tout juste dessus."]}]},{id:"choisir-route-degagements",title:"Choisir sa route et ses d\xE9gagements",summary:"Pourquoi une route directe n'est pas toujours la meilleure option.",blocks:[{type:"text",level:"BIA",paragraphs:["La route la plus courte entre deux a\xE9rodromes n'est pas toujours la plus s\xFBre ni la plus pertinente : survol de relief \xE9lev\xE9, de zones sans terrain de secours, d'espaces r\xE9glement\xE9s, ou simplement de r\xE9gions o\xF9 les rep\xE8res visuels se font rares, sont autant de raisons de pr\xE9f\xE9rer un trac\xE9 l\xE9g\xE8rement plus long mais plus confortable."]},{type:"text",level:"ATPL",heading:"Toujours avoir un plan B",paragraphs:["Choisir un ou plusieurs a\xE9rodromes de d\xE9gagement fait partie int\xE9grante de la pr\xE9paration : en cas de m\xE9t\xE9o d\xE9grad\xE9e, de panne ou de doute sur l'autonomie, le pilote doit savoir vers o\xF9 se rediriger sans avoir \xE0 improviser, avec la route, la distance et le carburant n\xE9cessaires d\xE9j\xE0 estim\xE9s avant le d\xE9collage."]}]},{id:"visite-prevol",title:"La visite pr\xE9vol",summary:"Pourquoi un tour m\xE9thodique de l'avion pr\xE9c\xE8de chaque vol, m\xEAme le plus court.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant chaque vol, un tour complet de l'avion permet de v\xE9rifier son \xE9tat g\xE9n\xE9ral : niveaux de fluides, \xE9tat des pneus, absence de fuite, propret\xE9 des surfaces de portance, jeu normal des gouvernes, pr\xE9sence et fixation correcte des diff\xE9rents \xE9l\xE9ments."]},{type:"text",level:"ATPL",heading:"Une m\xE9thode, pas un coup d'\u0153il",paragraphs:["Cette visite suit un ordre fixe, propre \xE0 chaque type d'avion, d\xE9fini dans le manuel de vol, pr\xE9cis\xE9ment pour ne rien oublier m\xEAme quand la routine s'installe. Un d\xE9faut d\xE9tect\xE9 \xE0 ce moment, m\xEAme mineur en apparence, co\xFBte infiniment moins cher \xE0 traiter au sol qu'en vol : c'est l'un des contr\xF4les les plus rentables de toute la pr\xE9paration d'un vol."]}]},{id:"checklists-discipline",title:"Check-lists et discipline op\xE9rationnelle",summary:"Comment les check-lists rythment chaque phase, du d\xE9marrage au stationnement.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 de la visite pr\xE9vol, chaque phase du vol, mise en route, roulage, avant d\xE9collage, croisi\xE8re, avant atterrissage, dispose de sa propre check-list, qui regroupe les v\xE9rifications essentielles \xE0 ce moment pr\xE9cis plut\xF4t que de tout m\xE9langer en une seule longue liste."]},{type:"text",level:"ATPL",heading:"Une discipline qui se construit",paragraphs:["Suivre syst\xE9matiquement ces listes, y compris quand rien ne semble justifier de s'y attarder, construit une discipline op\xE9rationnelle qui se r\xE9v\xE8le pr\xE9cieuse le jour o\xF9 quelque chose sort effectivement de l'ordinaire. C'est un des points o\xF9 l'exp\xE9rience peut jouer contre le pilote, en encourageant des raccourcis qui fonctionnent... jusqu'au jour o\xF9 ils ne fonctionnent plus."]}]},{id:"compte-rendu-apres-vol",title:"Le compte-rendu apr\xE8s vol",summary:"Cl\xF4turer un plan de vol, consigner les heures, et signaler ce qui doit l'\xEAtre.",blocks:[{type:"text",level:"BIA",paragraphs:["Un vol ne s'arr\xEAte pas vraiment au moment o\xF9 l'avion se pose : il faut encore cl\xF4turer un \xE9ventuel plan de vol d\xE9pos\xE9, pour ne pas d\xE9clencher inutilement une alerte, et consigner les heures de vol dans le carnet de route de l'avion et le carnet de vol personnel du pilote."]},{type:"text",level:"ATPL",heading:"Signaler une anomalie",paragraphs:["Toute anomalie constat\xE9e en vol, m\xEAme mineure ou qui semble s'\xEAtre r\xE9sorb\xE9e d'elle-m\xEAme, m\xE9rite d'\xEAtre consign\xE9e pour que la maintenance puisse l'examiner avant le vol suivant. C'est cette rigueur, r\xE9p\xE9t\xE9e vol apr\xE8s vol par tous les pilotes qui utilisent un m\xEAme avion, qui permet de d\xE9tecter t\xF4t un probl\xE8me naissant plut\xF4t que de le d\xE9couvrir au pire moment."]}]}]}],Jc={aero:[{level:"BIA",q:"Quelle force est produite par les ailes et dirig\xE9e vers le haut ?",options:["Portance","Tra\xEEn\xE9e","Traction","Poids"],correct:0,explain:"La portance \xE9quilibre le poids en vol stabilis\xE9."},{level:"BIA",q:"Que repr\xE9sente le bord de fuite d'un profil d'aile ?",options:["L'avant, arrondi","L'arri\xE8re, effil\xE9","La surface sup\xE9rieure","La surface inf\xE9rieure"],correct:1,explain:"Le bord de fuite est l'arri\xE8re effil\xE9 du profil ; le bord d'attaque est l'avant, arrondi."},{level:"BIA",q:"Le d\xE9crochage se produit quand :",options:["la vitesse est trop faible","l'angle d'incidence d\xE9passe l'angle critique","les volets sont sortis","le moteur cale"],correct:1,explain:"Le d\xE9crochage d\xE9pend de l'incidence, pas directement de la vitesse : il peut survenir \xE0 toute vitesse."},{level:"BIA",q:"Quelle gouverne commande le roulis ?",options:["La gouverne de profondeur","Les ailerons","La gouverne de direction","Les volets"],correct:1,explain:"Les ailerons, en bout d'aile, commandent l'inclinaison autour de l'axe de roulis."},{level:"ATPL",q:"Dans Rz = \xBD\xB7\u03C1\xB7V\xB2\xB7S\xB7Cz, si la vitesse double (Cz et S constants), la portance est multipli\xE9e par :",options:["2","3","4","elle ne change pas"],correct:2,explain:"La portance d\xE9pend du carr\xE9 de la vitesse : doubler V multiplie la portance par 4."},{level:"ATPL",q:"Quel type de tra\xEEn\xE9e diminue quand la vitesse augmente ?",options:["La tra\xEEn\xE9e de frottement","La tra\xEEn\xE9e induite","La tra\xEEn\xE9e de forme","La tra\xEEn\xE9e d'onde"],correct:1,explain:"La tra\xEEn\xE9e induite, li\xE9e \xE0 l'incidence n\xE9cessaire pour porter l'avion, diminue quand la vitesse augmente."},{level:"ATPL",q:"\xC0 60\xB0 d'inclinaison en virage, le facteur de charge vaut environ :",options:["1,15","1,41","2","3"],correct:2,explain:"n = 1 / cos(60\xB0) = 1 / 0,5 = 2."},{level:"ATPL",q:"La vitesse de man\u0153uvre Va correspond \xE0 :",options:["La vitesse maximale volets sortis","La vitesse maximale de braquage complet des gouvernes sans risque structurel","La vitesse de d\xE9crochage","La vitesse de meilleur taux de mont\xE9e"],correct:1,explain:"Au-del\xE0 de Va, un braquage complet des gouvernes pourrait d\xE9passer les efforts admissibles par la structure."}],aeronefs:[{level:"BIA",q:"Dans le cycle \xE0 4 temps, quel temps suit la compression ?",options:["Admission","Combustion","\xC9chappement","D\xE9tente froide"],correct:1,explain:"L'ordre est : admission, compression, combustion, \xE9chappement."},{level:"BIA",q:"Qu'est-ce qui transforme le couple moteur en traction sur un avion \xE0 h\xE9lice ?",options:["Le carburateur","L'h\xE9lice","Le turbocompresseur","Le r\xE9ducteur seul"],correct:1,explain:"L'h\xE9lice acc\xE9l\xE8re une masse d'air vers l'arri\xE8re pour produire la traction."},{level:"BIA",q:"Quel instrument indique la vitesse verticale ?",options:["L'an\xE9mom\xE8tre","L'altim\xE8tre","Le variom\xE8tre","L'horizon artificiel"],correct:2,explain:"Le variom\xE8tre indique la vitesse de mont\xE9e ou de descente."},{level:"ATPL",q:"Le givrage carburateur peut survenir :",options:["Uniquement \xE0 temp\xE9rature n\xE9gative","M\xEAme \xE0 temp\xE9rature positive, par temps humide","Uniquement en altitude","Jamais sur moteur \xE0 pistons"],correct:1,explain:"Le refroidissement d\xFB \xE0 la vaporisation de l'essence peut givrer le carburateur m\xEAme par temps doux et humide."},{level:"ATPL",q:"Un tube de Pitot obstru\xE9 affecte directement :",options:["L'altim\xE8tre seul","L'an\xE9mom\xE8tre","Le compas","L'horizon artificiel"],correct:1,explain:"Le tube de Pitot capte la pression dynamique utilis\xE9e par l'an\xE9mom\xE8tre."},{level:"ATPL",q:"Le taux de dilution (bypass ratio) d'un turbofan mesure :",options:["Le rapport carburant/air","La part d'air qui contourne le c\u0153ur du r\xE9acteur sans \xEAtre br\xFBl\xE9e","La vitesse de rotation du compresseur","Le rendement thermique"],correct:1,explain:"Un taux de dilution \xE9lev\xE9 am\xE9liore la consommation et r\xE9duit le bruit."}],meteo:[{level:"BIA",q:"Dans quel \xE9tage se forment les cumulus ?",options:["\xC9tage bas","\xC9tage moyen","\xC9tage \xE9lev\xE9","Aucun \xE9tage particulier"],correct:0,explain:"Les cumulus se forment dans l'\xE9tage bas, jusqu'\xE0 environ 2 000 m."},{level:"BIA",q:"Le vent souffle :",options:["Des basses vers les hautes pressions","Des hautes vers les basses pressions","Toujours d'ouest en est","Ind\xE9pendamment de la pression"],correct:1,explain:"L'air se d\xE9place des zones de haute pression vers les zones de basse pression."},{level:"BIA",q:"Parmi ces ph\xE9nom\xE8nes, lequel r\xE9duit fortement la visibilit\xE9 au sol ?",options:["Le brouillard","L'arc-en-ciel","La ros\xE9e","La brise thermique"],correct:0,explain:"Le brouillard r\xE9duit fortement la visibilit\xE9, en particulier au d\xE9collage et \xE0 l'atterrissage."},{level:"ATPL",q:"Le QNH permet de lire :",options:["La hauteur par rapport au terrain","L'altitude par rapport au niveau de la mer","Le niveau de vol standard","La temp\xE9rature au sol"],correct:1,explain:"Le QNH ram\xE8ne la pression au niveau de la mer, pour lire l'altitude par rapport \xE0 ce niveau."},{level:"ATPL",q:"Une atmosph\xE8re est dite instable quand :",options:["Le gradient r\xE9el est plus faible que le gradient adiabatique","Le gradient r\xE9el est plus fort que le gradient adiabatique","Il n'y a pas de vent","La pression est stable"],correct:1,explain:"Une particule d\xE9plac\xE9e vers le haut reste alors plus chaude que son environnement et continue de monter."},{level:"ATPL",q:"Un front froid se caract\xE9rise par :",options:["Une d\xE9gradation lente et progressive","De l'air froid qui soul\xE8ve brutalement l'air chaud, propice aux orages","Un temps toujours calme","Une absence de nuages"],correct:1,explain:"Le front froid, plus brutal que le front chaud, peut d\xE9clencher des orages sur une ligne \xE9troite."}],nav:[{level:"BIA",q:"Sur une carte OACI au 1/500 000, un centim\xE8tre repr\xE9sente :",options:["500 m","5 km","50 km","500 km"],correct:1,explain:"1/500 000 signifie qu'un centim\xE8tre sur la carte repr\xE9sente 500 000 cm, soit 5 km, au sol."},{level:"BIA",q:"La d\xE9rive est due :",options:["Au vent","\xC0 l'altitude","\xC0 la temp\xE9rature","\xC0 la masse de l'avion"],correct:0,explain:"Le vent fait s'\xE9carter l'avion de sa route s'il vole cap \xE9gal \xE0 la route."},{l

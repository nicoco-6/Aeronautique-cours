]),yt("sup-polaire","Polaire d'un avion l\xE9ger (Cx0 = 0,03 ; k = 0,06). La tangente issue de l'origine donne la finesse maximale."),se("Finesse maximale : d\xE9monstration",["La finesse est f = Cz / Cx = Cz / (Cx0 + k\xB7Cz\xB2). Elle est maximale quand sa d\xE9riv\xE9e par rapport \xE0 Cz s'annule, ce qui donne Cx0 \u2212 k\xB7Cz\xB2 = 0, soit Cz = \u221A(Cx0 / k). Pour cette valeur, Cx = 2\xB7Cx0 : la tra\xEEn\xE9e induite \xE9gale exactement la tra\xEEn\xE9e parasite.","G\xE9om\xE9triquement, la finesse est la pente de la droite qui joint l'origine \xE0 un point de la polaire. Elle est maximale pour la tangente \xE0 la polaire issue de l'origine."]),dt("Condition de finesse maximale",["Cz(fmax) = \u221A(Cx0 / k)","Cx(fmax) = 2 \xB7 Cx0","fmax = 1 / (2 \xB7 \u221A(Cx0 \xB7 k))"]),se("Exemple chiffr\xE9",["Avec Cx0 = 0,03 et k = 0,06 : Cz(fmax) = \u221A0,5 \u2248 0,71, Cx = 0,06 et fmax \u2248 11,8. Un avion de tourisme r\xE9el se situe entre 9 et 13 selon son allongement et sa propret\xE9 a\xE9rodynamique."]),yt("sup-finesse","Finesse en fonction de Cz : le maximum est atteint l\xE0 o\xF9 tra\xEEn\xE9e induite et tra\xEEn\xE9e parasite s'\xE9galisent."),Jn("Ce qu'il faut retenir",["fmax varie comme \u221A\u03BB : doubler l'allongement multiplie la finesse maximale par 1,41. C'est pourquoi les planeurs ont des ailes tr\xE8s longues et \xE9troites (\u03BB de 25 \xE0 40).","R\xE9duire Cx0 (car\xE9nages, train rentrant, surfaces propres) am\xE9liore la finesse de la m\xEAme mani\xE8re, par la racine de Cx0.","L'incidence de finesse maximale est un rep\xE8re de s\xE9curit\xE9 en cas de panne moteur : c'est elle qui donne la plus grande distance de plan\xE9 en air calme."])]},{id:"sup-puissance-montee",level:"SUP",title:"Puissance n\xE9cessaire, taux de mont\xE9e et plafond",summary:"Bilan de puissance en palier, vitesse de mont\xE9e Vy, effet de l'altitude et d\xE9finition du plafond.",blocks:[se("Puissance n\xE9cessaire au vol en palier",["En palier stabilis\xE9, la traction \xE9gale la tra\xEEn\xE9e et la portance \xE9gale le poids. La puissance n\xE9cessaire est le produit de la tra\xEEn\xE9e par la vitesse. En rempla\xE7ant Cz par W / (\xBD\u03C1SV\xB2) dans la polaire, on obtient deux termes aux comportements oppos\xE9s."]),dt("Puissance n\xE9cessaire en palier",["Pn = \xBD \xB7 \u03C1 \xB7 S \xB7 Cx0 \xB7 V\xB3  +  2 \xB7 k \xB7 W\xB2 / (\u03C1 \xB7 S \xB7 V)","terme parasite \u221D V\xB3               terme induit \u221D 1 / V"]),se("Vitesses remarquables",["La vitesse de puissance minimale (endurance maximale) se situe l\xE0 o\xF9 la puissance induite vaut trois fois la puissance parasite. Elle vaut 76 % de la vitesse de tra\xEEn\xE9e minimale, qui est aussi la vitesse de finesse maximale.","Exemple : avion de 1 000 kg (W = 9 810 N), S = 16 m\xB2, Cx0 = 0,03, k = 0,06, \u03C1 = 1,225 kg/m\xB3. On trouve une vitesse de tra\xEEn\xE9e minimale d'environ 37,6 m/s (73 kt), une vitesse de puissance minimale d'environ 28,6 m/s (56 kt) et une puissance minimale d'environ 27,5 kW."]),yt("sup-puissance","Puissance n\xE9cessaire (parasite + induite) et puissance utile disponible d'un avion \xE0 h\xE9lice de 1 000 kg."),se("Taux de mont\xE9e",["L'exc\xE8s de puissance disponible sur la puissance n\xE9cessaire sert \xE0 monter. Le taux de mont\xE9e (vitesse verticale) vaut ce surplus divis\xE9 par le poids. Pour un avion \xE0 h\xE9lice, la puissance utile est \xE0 peu pr\xE8s constante avec la vitesse : le meilleur taux de mont\xE9e Vy se trouve donc pr\xE8s de la vitesse de puissance minimale, l\xE0 o\xF9 l'\xE9cart est le plus grand.","La meilleure pente de mont\xE9e, Vx, correspond au plus grand exc\xE8s de traction (et non de puissance) : sur un avion \xE0 h\xE9lice, elle est inf\xE9rieure \xE0 Vy."]),dt("Taux de mont\xE9e",["Vz = (Pu \u2212 Pn) / W","Exemple : (50 000 \u2212 27 500) / 9 810 \u2248 2,3 m/s \u2248 450 ft/min"]),yt("sup-roc","Taux de mont\xE9e en fonction de la vitesse vraie, au niveau de la mer et \xE0 3 000 m (mod\xE8le simplifi\xE9 : puissance utile proportionnelle \xE0 \u03C3)."),se("Effet de l'altitude et plafond",["Avec l'altitude, la masse volumique diminue. La puissance d'un moteur atmosph\xE9rique baisse \xE0 peu pr\xE8s comme \u03C3 = \u03C1 / \u03C10, tandis que la puissance n\xE9cessaire augmente pour une m\xEAme vitesse indiqu\xE9e. Le surplus fond, et la meilleure vitesse de mont\xE9e en vitesse vraie augmente.","Le plafond absolu est l'altitude o\xF9 le taux de mont\xE9e tombe \xE0 z\xE9ro. Comme il est atteint de fa\xE7on asymptotique, on d\xE9finit aussi un plafond pratique, o\xF9 le taux de mont\xE9e vaut encore 100 ft/min pour un avion \xE0 h\xE9lice (500 ft/min pour un avion \xE0 r\xE9action). Dans l'exemple, le plafond pratique est voisin de 3 000 m."])]},{id:"sup-diagramme-vn",level:"SUP",title:"Domaine de vol : le diagramme V-n",summary:"Facteur de charge, vitesse de man\u0153uvre Va et limites de certification.",blocks:[se("Un domaine d\xE9limit\xE9 par l'a\xE9rodynamique et la structure",["Le diagramme V-n (vitesse, facteur de charge) borne l'ensemble des combinaisons de vitesse et de facteur de charge dans lesquelles l'avion peut \xE9voluer. Il a deux types de fronti\xE8res : a\xE9rodynamiques (le d\xE9crochage) et structurales (la charge limite et la vitesse maximale).","\xC0 basse vitesse, le facteur de charge maximal atteignable est fix\xE9 par le d\xE9crochage : n = (V / Vs)\xB2, puisque la portance varie comme V\xB2 et que Cz est born\xE9 par Czmax. La courbe monte donc en parabole jusqu'\xE0 la charge limite certifi\xE9e."]),dt("Facteur de charge limit\xE9 par le d\xE9crochage",["n = (V / Vs)\xB2","Va = Vs \xB7 \u221Anmax        (vitesse de man\u0153uvre)"]),yt("sup-vn","Domaine de vol d'un avion l\xE9ger de cat\xE9gorie normale (Vs = 50 kt, nmax = +3,8 g, n\xE9gatif limit\xE9 \xE0 \u22121,5 g)."),se("Lecture du diagramme",["Sous Va, l'avion d\xE9croche avant d'atteindre la charge limite : une action violente sur la commande ne peut pas endommager la structure par exc\xE8s de facteur de charge, l'aile d\xE9croche d'abord. Au-dessus de Va, la charge limite peut \xEAtre d\xE9pass\xE9e avant le d\xE9crochage, et un braquage brusque est dangereux.","Va d\xE9pend de la masse, car Vs en d\xE9pend : Vs varie comme \u221AW, donc Va aussi. Un avion plus l\xE9ger a une vitesse de man\u0153uvre plus faible. Avec Vs = 50 kt et nmax = 3,8, on obtient Va \u2248 98 kt."]),Jn("Valeurs de r\xE9f\xE9rence (avions l\xE9gers)",["Cat\xE9gorie normale : +3,8 g ; cat\xE9gorie utilitaire : +4,4 g ; cat\xE9gorie voltige : +6 g.","Le facteur de s\xE9curit\xE9 de certification est de 1,5 : la charge ultime vaut 1,5 fois la charge limite. Les d\xE9formations permanentes ne doivent pas appara\xEEtre sous la charge limite ; la structure ne doit pas rompre sous la charge ultime.","Les rafales ajoutent leur propre incr\xE9ment de facteur de charge : en air turbulent, on r\xE9duit la vitesse \xE0 la vitesse de turbulence recommand\xE9e par le manuel de vol."])]},{id:"sup-breguet",level:"SUP",title:"Rayon d'action et autonomie : les \xE9quations de Breguet",summary:"Relier consommation, finesse et masse de carburant pour estimer la distance franchissable.",blocks:[se("Pourquoi ces \xE9quations ?",["La consommation d'un avion d\xE9pend de sa masse, qui diminue au fil du vol. On ne peut donc pas multiplier simplement une consommation horaire par une dur\xE9e. Les \xE9quations de Breguet int\xE8grent cette perte de masse : en croisi\xE8re \xE0 finesse et vitesse constantes, la distance parcourue est proportionnelle au logarithme du rapport entre la masse initiale et la masse finale."]),dt("Avion \xE0 r\xE9action (consommation sp\xE9cifique c, en h\u207B\xB9)",["R = (V / c) \xB7 (Cz / Cx) \xB7 ln(W1 / W2)","E = (1 / c) \xB7 (Cz / Cx) \xB7 ln(W1 / W2)"],"R : distance franchissable ; E : endurance ; W1 et W2 : masses au d\xE9but et \xE0 la fin de la croisi\xE8re."),dt("Avion \xE0 h\xE9lice",["R = (\u03B7h / (cp \xB7 g)) \xB7 (Cz / Cx) \xB7 ln(W1 / W2)"],"\u03B7h : rendement de l'h\xE9lice ; cp : consommation de carburant par unit\xE9 d'\xE9nergie fournie \xE0 l'h\xE9lice."),se("Exemple chiffr\xE9",["Avion de ligne : V = 830 km/h, finesse 17, c = 0,6 h\u207B\xB9, carburant br\xFBl\xE9 \xE9gal \xE0 20 % de la masse initiale. On obtient R = (830 / 0,6) \xD7 17 \xD7 ln(1 / 0,8) \u2248 5 250 km. C'est un ordre de grandeur de croisi\xE8re pure : le calcul exclut la mont\xE9e, la descente et les r\xE9serves, ce qui r\xE9duit la distance r\xE9elle."]),yt("sup-breguet","Distance franchie en fonction du carburant br\xFBl\xE9, pour trois finesses (V = 830 km/h, c = 0,6 h\u207B\xB9)."),uu(["Carburant br\xFBl\xE9","Finesse 14","Finesse 17","Finesse 20"],[["10 %","2 040 km","2 480 km","2 910 km"],["20 %","4 320 km","5 250 km","6 170 km"],["30 %","6 910 km","8 390 km","9 870 km"]],"Distance de croisi\xE8re pure selon l'\xE9quation de Breguet pour un avion \xE0 r\xE9action."),Jn("Cons\xE9quences pratiques",["La relation est logarithmique : dans la seconde moiti\xE9 du vol, br\xFBler un m\xEAme volume de carburant fait parcourir plus de distance, car l'avion est plus l\xE9ger. Les avions de ligne montent par paliers (cruise climb) pour suivre l'altitude optimale qui augmente avec l'all\xE8gement.","Pour un avion \xE0 r\xE9action, la distance maximale ne se trouve pas \xE0 la finesse maximale mais \xE0 un produit V \xB7 Cz / Cx maximal, atteint \xE0 une vitesse environ 1,32 fois sup\xE9rieure \xE0 la vitesse de tra\xEEn\xE9e minimale.","Pour l'endurance, on vole \xE0 la finesse maximale (r\xE9action) ou \xE0 la puissance minimale (h\xE9lice)."])]}],aeronefs:[{id:"sup-cycle-otto",level:"SUP",title:"Thermodynamique du moteur \xE0 pistons : le cycle d'Otto",summary:"Cycle id\xE9al, rendement en fonction du rapport volum\xE9trique, cliquetis et puissance indiqu\xE9e.",blocks:[se("Le cycle id\xE9al \xE0 quatre temps",["Le moteur \xE0 allumage command\xE9 d'un avion l\xE9ger se mod\xE9lise par le cycle d'Otto : compression adiabatique (1 \u2192 2), combustion \xE0 volume constant (2 \u2192 3), d\xE9tente adiabatique (3 \u2192 4), puis \xE9chappement \xE0 volume constant (4 \u2192 1). On suppose un gaz parfait de rapport des chaleurs sp\xE9cifiques \u03B3 = 1,4, sans frottement ni \xE9change de chaleur avec les parois."]),yt("sup-otto-pv","Diagramme pression-volume du cycle d'Otto (rapport volum\xE9trique 8 ; la combustion triple la pression)."),dt("Rendement thermique id\xE9al",["\u03B7 = 1 \u2212 1 / r^(\u03B3 \u2212 1)","r = V max / V min : rapport volum\xE9trique"],"Exemple : r = 8, \u03B3 = 1,4 donne \u03B7 = 1 \u2212 8^(\u22120,4) \u2248 56,5 %."),yt("sup-otto-eta","Le rendement id\xE9al augmente avec le rapport volum\xE9trique, mais de moins en moins vite."),se("Pourquoi les moteurs r\xE9els font moins bien",["Le rendement r\xE9el d'un moteur d'avion l\xE9ger se situe plut\xF4t entre 25 et 35 %. Les pertes viennent des \xE9changes thermiques avec les parois, des frottements, de la combustion qui n'est pas instantan\xE9e, et du m\xE9lange volontairement enrichi pour refroidir le moteur \xE0 forte puissance.","Le rapport volum\xE9trique est limit\xE9 par le cliquetis (d\xE9tonation) : un m\xE9lange trop comprim\xE9 s'enflamme spontan\xE9ment avant l'\xE9tincelle. L'indice d'octane de l'avgas fixe donc une limite pratique, de l'ordre de 7 \xE0 9 pour les moteurs atmosph\xE9riques courants, bien plus faible que sur une voiture moderne."]),dt("Puissance d'un quatre-temps",["P = pme \xB7 Vc \xB7 N / (2 \xB7 60)","pme : pression moyenne effective (Pa) ; Vc : cylindr\xE9e (m\xB3) ; N : r\xE9gime (tr/min)"],"Exemple : pme = 9,5 bar, Vc = 5,9 L, N = 2 700 tr/min donne P \u2248 126 kW (environ 170 ch)."),Jn("Effet de l'altitude",["La masse d'air admise baisse avec la densit\xE9 : la puissance d'un moteur atmosph\xE9rique d\xE9cro\xEEt \xE0 peu pr\xE8s comme \u03C3 = \u03C1 / \u03C10. \xC0 8 000 ft d'altitude-densit\xE9, \u03C3 \u2248 0,79.","Appauvrir le m\xE9lange en altitude \xE9vite un exc\xE8s de carburant qui encrasse les bougies et gaspille de la puissance.","Un turbocompresseur maintient la pression d'admission jusqu'\xE0 une altitude critique, au prix de contraintes thermiques suppl\xE9mentaires."])]},{id:"sup-turbomachines",level:"SUP",title:"Turbomachines : cycle de Brayton, pouss\xE9e et rendements",summary:"Rendement thermique, rendement propulsif et int\xE9r\xEAt du taux de dilution.",blocks:[se("Le cycle de Brayton",["Une turbine \xE0 gaz suit le cycle de Brayton : compression de l'air, combustion \xE0 pression constante, puis d\xE9tente dans la turbine et la tuy\xE8re. Le rendement thermique id\xE9al ne d\xE9pend que du rapport de pression global (OPR), pas de la temp\xE9rature de combustion."]),dt("Rendement thermique id\xE9al",["\u03B7th = 1 \u2212 OPR^(\u2212(\u03B3 \u2212 1) / \u03B3)        avec \u03B3 = 1,4"]),uu(["Rapport de pression OPR","Rendement thermique id\xE9al"],lae,"Les moteurs modernes d\xE9passent un OPR de 40, d'o\xF9 leur bon rendement thermique."),se("Pouss\xE9e et rendement propulsif",["La pouss\xE9e vient de l'acc\xE9l\xE9ration d'un d\xE9bit d'air : elle est \xE9gale au d\xE9bit massique multipli\xE9 par la diff\xE9rence entre la vitesse d'\xE9jection et la vitesse de l'avion. La puissance propulsive utile est la pouss\xE9e multipli\xE9e par la vitesse de l'avion, alors que l'\xE9nergie cin\xE9tique d\xE9pens\xE9e dans le jet est plus grande, d'o\xF9 un rendement propulsif inf\xE9rieur \xE0 1."]),dt("Pouss\xE9e et rendement propulsif",["F = \u1E41 \xB7 (Ve \u2212 V0)","\u03B7p = 2 \xB7 V0 / (V0 + Ve)","\u03B7global = \u03B7th \xB7 \u03B7p"]),yt("sup-propulsif","Rendement propulsif en fonction de la vitesse, pour trois vitesses d'\xE9jection."),se("Int\xE9r\xEAt du taux de dilution",["Pour une m\xEAme pouss\xE9e, il vaut mieux acc\xE9l\xE9rer beaucoup d'air peu qu'un peu d'air beaucoup. Un turbofan \xE0 fort taux de dilution \xE9jecte une grande masse d'air \xE0 vitesse mod\xE9r\xE9e. \xC0 V0 = 230 m/s, on obtient \u03B7p \u2248 0,55 pour un turbor\xE9acteur pur (Ve = 600 m/s), 0,79 pour Ve = 350 m/s et 0,90 pour Ve = 280 m/s.","C'est la raison de la taille croissante des soufflantes sur les avions de ligne. Le turbopropulseur applique le m\xEAme principe, avec une h\xE9lice de rendement de l'ordre de 0,8 \xE0 0,85 : excellent \xE0 vitesse mod\xE9r\xE9e, mais limit\xE9 par les effets de compressibilit\xE9 en bout de pale \xE0 haute vitesse."])]}],meteo:[{id:"sup-isa",level:"SUP",title:"L'atmosph\xE8re standard ISA : mod\xE8le chiffr\xE9",summary:"Hypoth\xE8ses, formules de temp\xE9rature, pression et densit\xE9, vitesse du son.",blocks:[se("Un mod\xE8le physique complet",["L'atmosph\xE8re standard internationale (ISA) est un mod\xE8le d'air sec trait\xE9 comme un gaz parfait. Elle repose sur deux lois : l'\xE9quation d'\xE9tat p = \u03C1\xB7R\xB7T (avec R = 287,05 J/(kg\xB7K)) et l'\xE9quilibre hydrostatique dp = \u2212\u03C1\xB7g\xB7dz, qui relie la baisse de pression \xE0 la hauteur d'air situ\xE9 au-dessus.","On y ajoute un profil de temp\xE9rature impos\xE9 : 15 \xB0C au niveau de la mer, d\xE9croissance de 6,5 K par kilom\xE8tre jusqu'\xE0 11 km (la tropopause), puis temp\xE9rature constante de \u221256,5 \xB0C jusqu'\xE0 20 km."]),dt("Troposph\xE8re (0 \xE0 11 km)",["T(h) = 288,15 \u2212 0,0065 \xB7 h        (h en m\xE8tres, T en kelvins)","p(h) = 1 013,25 \xB7 (T / 288,15)^5,256   hPa","\u03C1 = p / (R \xB7 T)"]),yt("sup-isa","Temp\xE9rature et pression ISA de 0 \xE0 20 km : la temp\xE9rature cesse de baisser \xE0 la tropopause, la pression continue de d\xE9cro\xEEtre de fa\xE7on exponentielle."),uu(["Altitude (m)","T (\xB0C)","p (hPa)","\u03C1 / \u03C10","Vitesse du son (km/h)"],iae,"Valeurs calcul\xE9es avec le mod\xE8le ISA ; \u03C10 = 1,225 kg/m\xB3."),se("Applications directes",["Vitesse du son : a = \u221A(\u03B3\xB7R\xB7T) \u2248 20,05\xB7\u221AT (T en kelvins, a en m/s). Elle ne d\xE9pend que de la temp\xE9rature. Au niveau de vol 350, T \u2248 218,8 K donne a \u2248 297 m/s (1 068 km/h) ; \xE0 Mach 0,78, la vitesse vraie est donc d'environ 231 m/s, soit 833 km/h.","Pr\xE8s du niveau de la mer, la pression baisse d'environ 1 hPa tous les 8 m (27 ft). Quand le QNH est inf\xE9rieur \xE0 1 013 hPa, l'altitude-pression du terrain est donc sup\xE9rieure \xE0 son altitude.","L'atmosph\xE8re r\xE9elle s'\xE9carte toujours de l'ISA. L'\xE9cart de temp\xE9rature ISA (par exemple ISA + 15) est la donn\xE9e qui sert \xE0 corriger les performances."])]},{id:"sup-vent-geostrophique",level:"SUP",title:"Vent g\xE9ostrophique, vent thermique et jet-stream",summary:"L'\xE9quilibre entre gradient de pression et force de Coriolis, et son lien avec les courants-jets.",blocks:[se("Deux forces qui s'\xE9quilibrent",["Loin du sol, l'air est soumis \xE0 deux forces horizontales principales : la force due au gradient de pression, dirig\xE9e des hautes vers les basses pressions, et la force de Coriolis, due \xE0 la rotation de la Terre, perpendiculaire au mouvement (vers la droite dans l'h\xE9misph\xE8re nord). Quand elles s'\xE9quilibrent, le vent souffle parall\xE8lement aux isobares : c'est le vent g\xE9ostrophique.","La force de Coriolis par unit\xE9 de masse est f\xB7V, avec f = 2\xB7\u03A9\xB7sin \u03C6, o\xF9 \u03A9 = 7,292\xB710\u207B\u2075 rad/s est la vitesse de rotation de la Terre et \u03C6 la latitude."]),dt("Vent g\xE9ostrophique",["Vg = (1 / (\u03C1 \xB7 f)) \xB7 |\u2202p/\u2202n|","f = 2 \xB7 \u03A9 \xB7 sin \u03C6"],"\u2202p/\u2202n : variation de pression perpendiculairement aux isobares."),se("Exemple chiffr\xE9",["\xC0 45\xB0 N, f \u2248 1,03\xB710\u207B\u2074 s\u207B\xB9. Avec \u03C1 = 1,2 kg/m\xB3 et 4 hPa d'\xE9cart pour 100 km (400 Pa pour 100 000 m), on trouve Vg \u2248 32 m/s, soit environ 63 kt. Le vent est proportionnel au resserrement des isobares : sur une carte, des isobares serr\xE9es signifient un vent fort."]),yt("sup-geostrophique","Vent g\xE9ostrophique en fonction de la latitude, pour trois gradients de pression. Il perd son sens pr\xE8s de l'\xE9quateur, o\xF9 f tend vers z\xE9ro."),se("Pr\xE8s du sol : le frottement",["Pr\xE8s du sol, le frottement ralentit l'air, ce qui r\xE9duit la force de Coriolis. Le vent se d\xE9vie alors vers les basses pressions, d'environ 10 \xE0 30\xB0, et sa vitesse tombe \xE0 un tiers ou deux tiers de la valeur g\xE9ostrophique. La r\xE8gle de Buys-Ballot en d\xE9coule : dans l'h\xE9misph\xE8re nord, quand on tourne le dos au vent, la basse pression est \xE0 gauche."]),se("Vent thermique et courants-jets",["Le vent g\xE9ostrophique varie avec l'altitude l\xE0 o\xF9 existe un gradient horizontal de temp\xE9rature. On parle de vent thermique : il est d'autant plus fort que le contraste de temp\xE9rature est marqu\xE9. Pour un gradient de 1 K par 100 km \xE0 45\xB0 N, avec T \u2248 250 K, le vent g\xE9ostrophique augmente d'environ 38 m/s (75 kt) sur 10 km de hauteur.","C'est l'origine des courants-jets : au-dessus du front polaire, o\xF9 l'air chaud rencontre l'air froid, le contraste de temp\xE9rature est intense et le vent d'ouest culmine vers 9 \xE0 12 km. Les vitesses d\xE9passent r\xE9guli\xE8rement 100 kt et atteignent parfois plus de 200 kt, ce qui influence directement les dur\xE9es de vol transatlantiques."])]}],nav:[{id:"sup-orthodromie",level:"SUP",title:"Orthodromie et loxodromie : naviguer sur la sph\xE8re",summary:"Distance minimale, cap initial et comparaison avec la route \xE0 cap constant.",blocks:[se("Deux routes, deux g\xE9om\xE9tries",["L'orthodromie est la plus courte distance entre deux points : c'est l'arc de grand cercle (le plan de coupe passe par le centre de la Terre). Son cap varie le long de la route, car elle coupe les m\xE9ridiens sous des angles diff\xE9rents.","La loxodromie coupe tous les m\xE9ridiens sous le m\xEAme angle : c'est la route \xE0 cap constant, une ligne droite sur une carte de Mercator, mais plus longue que l'orthodromie. Sur de courtes distances, la diff\xE9rence est n\xE9gligeable ; sur un long-courrier, elle devient tr\xE8s sensible."]),dt("Distance orthodromique (formule de haversine)",["a = sin\xB2(\u0394\u03C6/2) + cos \u03C61 \xB7 cos \u03C62 \xB7 sin\xB2(\u0394\u03BB/2)","d = 2 \xB7 R \xB7 arcsin(\u221Aa)        R \u2248 6 371 km","\u03B80 = atan2( sin \u0394\u03BB \xB7 cos \u03C62 ,  cos \u03C61 \xB7 sin \u03C62 \u2212 sin \u03C61 \xB7 cos \u03C62 \xB7 cos \u0394\u03BB )"],"\u03B80 : cap initial. 1 NM = 1 852 m : c'est une minute d'arc de grand cercle."),dt("Loxodromie",["\u0394\u03C8 = ln[ tan(\u03C0/4 + \u03C62/2) / tan(\u03C0/4 + \u03C61/2) ]","cap = atan2(\u0394\u03BB, \u0394\u03C8)","d = R \xB7 \u221A( \u0394\u03C6\xB2 + (\u0394\u03C6/\u0394\u03C8)\xB2 \xB7 \u0394\u03BB\xB2 )"],"\u0394\u03C8 : diff\xE9rence de latitude croissante (projection de Mercator). Les angles sont en radians."),se("Exemple : Paris-Charles-de-Gaulle vers New York-JFK",["L'orthodromie mesure environ 5 833 km (3 150 NM), avec un cap initial de 292\xB0 et un cap d'arriv\xE9e de 233\xB0 : le cap change de pr\xE8s de 60\xB0 au cours de la travers\xE9e. La route culmine \xE0 52,4\xB0 N, au nord de Paris, et passe pr\xE8s de l'Irlande.","La loxodromie, au cap constant de 261\xB0, mesure environ 6 075 km (3 280 NM) : elle est plus longue de 4 %, soit 240 km de plus. \xC0 Mach 0,78, cela repr\xE9sente environ 17 minutes de vol."]),yt("sup-orthodromie","Sur une carte de Mercator, la loxodromie est droite et l'orthodromie, plus courte, se courbe vers le p\xF4le."),Jn("Navigation pratique",["Sur des distances de plus de 500 NM environ, on d\xE9coupe l'orthodromie en tron\xE7ons \xE0 cap quasi constant, avec des points de report interm\xE9diaires.","Les centrales de navigation et le GPS calculent l'orthodromie directement ; le pilote suit un cap qui change progressivement.","Aux latitudes \xE9lev\xE9es, la convergence des m\xE9ridiens rend les caps magn\xE9tiques et les cartes de Mercator peu fiables, d'o\xF9 l'usage de la navigation en grille."])]},{id:"sup-triangle-vitesses",level:"SUP",title:"Triangle des vitesses analytique et points particuliers",summary:"R\xE9soudre d\xE9rive et vitesse sol par le calcul, puis point de non-retour et point d'\xE9quitemps.",blocks:[se("R\xE9soudre le triangle par la trigonom\xE9trie",["Le triangle des vitesses relie la vitesse vraie (TAS), le vent et la vitesse sol (GS). Notons \u03B1 l'angle entre la route et la direction d'o\xF9 vient le vent (0\xB0 pour un vent de face, 180\xB0 pour un vent arri\xE8re). La loi des sinus donne la correction de d\xE9rive (WCA), puis la vitesse sol."]),dt("R\xE9solution analytique",["sin(WCA) = (Vw / TAS) \xB7 sin \u03B1","GS = TAS \xB7 cos(WCA) \u2212 Vw \xB7 cos \u03B1"],"Vw : vitesse du vent. Une solution n'existe que si Vw \xB7 sin \u03B1 \u2264 TAS."),se("Composantes du vent et approximation",["La composante de vent traversier vaut Vw\xB7sin \u03B1 et la composante de face Vw\xB7cos \u03B1. Pour de petits angles, la correction de d\xE9rive se calcule rapidement par WCA \u2248 60 \xD7 (Vw / TAS) \xD7 sin \u03B1, en degr\xE9s. Avec TAS = 110 kt et un vent de 25 kt de travers (\u03B1 = 90\xB0), on trouve 13,6\xB0 par la r\xE8gle, contre 13,1\xB0 par le calcul exact, et une vitesse sol de 107 kt."]),yt("sup-triangle","Correction de d\xE9rive et vitesse sol selon l'angle du vent (TAS = 110 kt, vent de 25 kt)."),se("Point de non-retour (PNR)",["Le point de non-retour est le dernier point d'o\xF9 l'on peut encore faire demi-tour avec le carburant disponible. Si E est l'autonomie, GSa la vitesse sol \xE0 l'aller et GSr la vitesse sol au retour, la distance au PNR vaut E\xB7GSa\xB7GSr / (GSa + GSr).","Exemple : E = 3 h, GSa = 100 kt, GSr = 120 kt donnent x = 3 \xD7 100 \xD7 120 / 220 \u2248 164 NM, atteint apr\xE8s 1 h 38 min. V\xE9rification : 164 NM \xE0 100 kt font 1,64 h \xE0 l'aller et 164 NM \xE0 120 kt font 1,36 h au retour, soit 3 h au total."]),dt("Points particuliers",["Distance du PNR : x = E \xB7 GSa \xB7 GSr / (GSa + GSr)","Point d'\xE9quitemps (PET) entre A et B, s\xE9par\xE9s de D : x = D \xB7 GSr / (GSa + GSr)"],"Le PET est le point d'o\xF9 il faut le m\xEAme temps pour continuer jusqu'\xE0 B ou pour retourner en A. Exemple : D = 400 NM, GSa = 100 kt, GSr = 120 kt donne x \u2248 218 NM."),Jn("\xC0 retenir",["Un vent de travers d\xE9place l'avion mais peut aussi lui co\xFBter de la vitesse sol : le gain d'un vent arri\xE8re n'\xE9gale jamais la perte d'un vent de face de m\xEAme force, car le temps pass\xE9 dans le vent d\xE9favorable est plus long.","Le PNR et le PET se recalculent en vol avec les vitesses sol r\xE9ellement mesur\xE9es, jamais avec les valeurs pr\xE9vues au sol."])]}],"prepa-vol":[{id:"sup-altitude-densite",level:"SUP",title:"Altitude-densit\xE9 et performances",summary:"Calculer l'altitude-densit\xE9, le rapport \u03C3 et l'\xE9cart entre vitesse vraie et indiqu\xE9e.",blocks:[se("Une altitude qui traduit la densit\xE9 de l'air",["L'altitude-densit\xE9 est l'altitude de l'atmosph\xE8re standard dans laquelle l'air aurait la m\xEAme masse volumique que l'air r\xE9el. Quand elle d\xE9passe l'altitude du terrain, l'air est moins dense, et le moteur, l'h\xE9lice et l'aile y perdent des performances.","On commence par l'altitude-pression (altitude du terrain corrig\xE9e du calage), puis on corrige de l'\xE9cart de temp\xE9rature avec l'ISA. Une r\xE8gle courante donne 120 ft par degr\xE9 d'\xE9cart."]),dt("Calcul de l'altitude-densit\xE9",["AP = altitude + 27 \xD7 (1 013 \u2212 QNH)        (ft, QNH en hPa)","AD \u2248 AP + 120 \xD7 (T \u2212 T ISA)        T ISA = 15 \u2212 2 \xD7 AP / 1 000"],"Approximation valable en basse altitude ; en cas de doute, utiliser les abaques du manuel de vol."),se("Exemple chiffr\xE9",["Terrain \xE0 2 000 ft d'altitude-pression, temp\xE9rature 30 \xB0C. La temp\xE9rature ISA \xE0 cette altitude vaut environ 11 \xB0C, soit un \xE9cart de 19 \xB0C. L'altitude-densit\xE9 vaut 2 000 + 120 \xD7 19 \u2248 4 275 ft : l'avion se comporte comme s'il \xE9tait \xE0 plus de 4 000 ft, alors que le terrain est \xE0 2 000 ft."]),yt("sup-altitude-densite","Altitude-densit\xE9 en fonction de la temp\xE9rature pour quatre altitudes-pression."),se("Cons\xE9quences physiques",["La densit\xE9 relative \u03C3 = \u03C1 / \u03C10 baisse avec l'altitude-densit\xE9. La vitesse vraie correspondant \xE0 une m\xEAme vitesse indiqu\xE9e augmente comme 1 / \u221A\u03C3 : \xE0 6 000 ft d'altitude-densit\xE9, 100 kt indiqu\xE9s font environ 109 kt vrais. L'avion d\xE9colle donc \xE0 une vitesse sol plus \xE9lev\xE9e et avec moins de puissance.","La distance de roulement suit \xE0 peu pr\xE8s la relation s \u221D W\xB2 / (\u03C1 \xB7 F), o\xF9 F est la force moyenne d'acc\xE9l\xE9ration. Deux effets se cumulent : la vitesse de d\xE9collage requise augmente, et la force de traction diminue avec la densit\xE9. Comme ordre de grandeur, la distance de d\xE9collage d'un avion l\xE9ger augmente d'environ 10 % par tranche de 1 000 ft d'altitude-densit\xE9 ; il faut toujours se r\xE9f\xE9rer au manuel de vol.","\xC0 masse plus \xE9lev\xE9e, la distance cro\xEEt environ comme le carr\xE9 de la masse : +10 % de masse donne environ +20 % de distance."]),yt("sup-sigma","Rapport de densit\xE9 \u03C3 et rapport entre vitesse vraie et indiqu\xE9e en fonction de l'altitude-densit\xE9."),uu(["Altitude-densit\xE9 (ft)","\u03C3","TAS / IAS"],uae,"Valeurs de l'atmosph\xE8re standard.")]},{id:"sup-centrage-sensibilite",level:"SUP",title:"Masse et centrage : moments et sensibilit\xE9",summary:"Calcul du centre de gravit\xE9, \xE9volution en vol, lien avec la stabilit\xE9 longitudinale.",blocks:[se("Le centre de gravit\xE9 comme barycentre",["Le centre de gravit\xE9 est le barycentre des masses de l'avion. On choisit une r\xE9f\xE9rence (le datum), on mesure le bras de levier de chaque \xE9l\xE9ment (distance au datum), et on calcule le moment, produit de la masse par le bras. Le bras du centre de gravit\xE9 est le moment total divis\xE9 par la masse totale."]),dt("Position du centre de gravit\xE9",["xCG = \u03A3(mi \xB7 xi) / \u03A3 mi","Variation due au d\xE9placement d'une masse m sur une distance d : \u0394xCG = m \xB7 d / M"]),uu(["\xC9l\xE9ment","Masse (kg)","Bras (m)","Moment (kg\xB7m)"],[["Avion vide","650","0,95","617,5"],["Pilote et passager avant","160","0,45","72,0"],["Passager arri\xE8re","80","1,30","104,0"],["Bagages","20","1,85","37,0"],["Carburant","90","1,10","99,0"],["Total au d\xE9part","1 000","0,930","929,5"]],"Exemple de devis de masse d'un avion \xE0 quatre places (valeurs p\xE9dagogiques)."),se("\xC9volution en vol",["En consommant 60 kg de carburant, la masse tombe \xE0 940 kg et le moment \xE0 929,5 \u2212 60 \xD7 1,10 = 863,5 kg\xB7m, soit un centre de gravit\xE9 \xE0 0,919 m. Il avance de 1,1 cm : on v\xE9rifie que l'arriv\xE9e reste dans le domaine, pas seulement le d\xE9part.","La sensibilit\xE9 est utile pour d\xE9cider vite. D\xE9placer 20 kg de bagages de l'arri\xE8re (1,85 m) vers l'avant (0,45 m) avance le centre de gravit\xE9 de 20 \xD7 1,40 / 1 000 = 2,8 cm."]),yt("sup-cg","Domaine de centrage de l'exemple : le chargement avec peu de monde \xE0 l'avant et de la charge \xE0 l'arri\xE8re sort du domaine par l'arri\xE8re."),se("Lien avec la stabilit\xE9",["La stabilit\xE9 longitudinale d\xE9pend de la distance entre le centre de gravit\xE9 et le point neutre : c'est la marge statique, exprim\xE9e en fraction de la corde moyenne. Un centre de gravit\xE9 recul\xE9 r\xE9duit cette marge : l'avion devient plus sensible en tangage et la r\xE9cup\xE9ration de d\xE9crochage ou de vrille plus difficile.","\xC0 l'inverse, un centre de gravit\xE9 tr\xE8s avanc\xE9 augmente les efforts sur le manche et peut rendre l'arrondi impossible faute de braquage suffisant de la profondeur. C'est pourquoi le domaine autoris\xE9 a une limite avant et une limite arri\xE8re, et pourquoi le centrage se contr\xF4le toujours avant le vol."])]}],"facteurs-humains":[{id:"sup-modeles-erreur",level:"SUP",title:"Mod\xE8les de l'erreur humaine : Reason, SRK et Yerkes-Dodson",summary:"Erreurs actives et conditions latentes, niveaux de comportement de Rasmussen, activation et performance.",blocks:[se("Le mod\xE8le de Reason",["James Reason distingue les erreurs actives, commises par ceux qui sont en contact direct avec le syst\xE8me (le pilote), et les conditions latentes, cr\xE9\xE9es bien en amont (conception, organisation, formation, planning). Une condition latente peut rester dormante pendant des ann\xE9es.","Le mod\xE8le du fromage suisse repr\xE9sente chaque d\xE9fense (proc\xE9dures, supervision, alarmes, formation) comme une tranche perc\xE9e de trous. Un accident survient quand les trous de toutes les tranches s'alignent : il n'a presque jamais une cause unique."]),yt("sup-fromage","Un danger traverse les couches de d\xE9fense quand leurs failles s'alignent."),se("Les niveaux de comportement de Rasmussen (SRK)",["Rasmussen classe l'activit\xE9 du pilote selon trois niveaux, qui n'appellent ni les m\xEAmes ressources mentales ni les m\xEAmes erreurs."]),uu(["Niveau","Situation","Erreur typique","Exemple en vol"],[["Habilet\xE9 (skill)","Geste automatis\xE9, familier","Lapsus, inattention","Sortir le train \xE0 la mauvaise phase"],["R\xE8gle (rule)","Situation reconnue, proc\xE9dure connue","Mauvaise r\xE8gle appliqu\xE9e","Appliquer une check-list de panne \xE0 la mauvaise panne"],["Connaissance (knowledge)","Situation nouvelle, sans r\xE8gle","Raisonnement erron\xE9","Diagnostic faux d'une panne in\xE9dite"]],"Plus on descend dans le tableau, plus le co\xFBt mental est \xE9lev\xE9 et plus le risque d'erreur augmente."),se("Activation et performance : la loi de Yerkes-Dodson",["La performance varie selon l'activation (\xE9veil, stress) en forme de cloche. Trop faible, elle conduit \xE0 l'ennui et \xE0 l'inattention ; trop forte, au tunnel attentionnel et \xE0 la sid\xE9ration.","Le niveau optimal d\xE9pend de la t\xE2che : plus elle est complexe ou nouvelle, plus l'optimum se trouve \xE0 faible activation. C'est pourquoi une panne en vol, qui \xE9l\xE8ve le stress, d\xE9grade plus vite le raisonnement que le pilotage routinier."]),yt("sup-yerkes","Courbes sch\xE9matiques de Yerkes-Dodson (sans unit\xE9 : elles illustrent l'allure, pas des mesures)."),Jn("Gestion des menaces et des erreurs (TEM)",["Les menaces sont des facteurs ext\xE9rieurs (m\xE9t\xE9o, trafic, panne) qu'il faut anticiper ; les erreurs sont in\xE9vitables, mais peuvent \xEAtre d\xE9tect\xE9es et corrig\xE9es avant de produire un \xE9tat ind\xE9sirable.","Les contre-mesures sont des briefings, des check-lists, la r\xE9partition des t\xE2ches, l'assertivit\xE9 et la v\xE9rification crois\xE9e.","L'objectif n'est pas de supprimer toute erreur, mais de construire des d\xE9fenses pour que l'erreur ne devienne pas un accident."])]},{id:"sup-hypoxie-gaz",level:"SUP",title:"Physique des gaz et hypoxie en altitude",summary:"Loi de Dalton, \xE9quation des gaz alv\xE9olaires, loi de Boyle-Mariotte et cons\xE9quences pour le pilote.",blocks:[se("Pression totale et pressions partielles",["Selon la loi de Dalton, la pression d'un m\xE9lange de gaz est la somme des pressions partielles de ses constituants. L'air contient 20,95 % d'oxyg\xE8ne \xE0 toute altitude utile pour l'aviation : c'est la pression totale qui diminue, donc la pression partielle d'oxyg\xE8ne, seule grandeur qui compte pour l'apport en oxyg\xE8ne du sang.","\xC0 10 000 ft, la pression est d'environ 697 hPa : la pression partielle d'oxyg\xE8ne de l'air ambiant n'est plus que de 146 hPa, contre 212 hPa au niveau de la mer, soit 69 %. \xC0 18 000 ft, on tombe \xE0 106 hPa, soit la moiti\xE9."]),dt("Pression partielle de l'oxyg\xE8ne alv\xE9olaire",["PAO2 = FiO2 \xB7 (Pb \u2212 PH2O) \u2212 PaCO2 / R","FiO2 = 0,2095 ; PH2O = 47 mmHg ; R \u2248 0,8"],"Pb : pression barom\xE9trique. PaCO2 : pression partielle de CO2 dans le sang art\xE9riel (environ 40 mmHg au repos)."),se("Exemple chiffr\xE9",["Au niveau de la mer (Pb = 760 mmHg) : PAO2 = 0,2095 \xD7 (760 \u2212 47) \u2212 40 / 0,8 \u2248 99 mmHg. \xC0 10 000 ft (Pb \u2248 523 mmHg) : PAO2 \u2248 50 mmHg, sans hyperventilation. En respirant plus vite, le corps abaisse la PaCO2 \xE0 25 mmHg et remonte la PAO2 vers 68 mmHg : une compensation r\xE9elle, mais limit\xE9e et qui s'accompagne de sympt\xF4mes d'hyperventilation."]),yt("sup-po2","Pression partielle d'oxyg\xE8ne inspir\xE9 et alv\xE9olaire selon l'altitude (mod\xE8le simplifi\xE9, atmosph\xE8re standard)."),se("Loi de Boyle-Mariotte et gaz pi\xE9g\xE9s",["\xC0 temp\xE9rature constante, le volume d'un gaz varie en sens inverse de sa pression. Un gaz pi\xE9g\xE9 dans l'organisme (sinus, oreille moyenne, intestins, caries) se dilate donc en mont\xE9e : \xE0 18 000 ft, o\xF9 la pression est la moiti\xE9 de celle du sol, son volume a presque doubl\xE9 (1 013 / 506 \u2248 2).","\xC0 la descente, la contraction du gaz peut provoquer une douleur si les passages d'air sont obstru\xE9s, d'o\xF9 les man\u0153uvres d'\xE9quilibrage des oreilles et l'interdiction de voler enrhum\xE9."]),Jn("\xC0 retenir",["Les premiers signes d'hypoxie (euphorie, jugement alt\xE9r\xE9, vision d\xE9grad\xE9e) ne sont pas ressentis comme tels par le pilote : le temps utile de conscience est court en altitude, voir le graphique de la le\xE7on Physiologie du vol.","Le tabac, la fatigue, l'alcool et certaines maladies diminuent la tol\xE9rance \xE0 l'altitude : l'\xE9quivalent physiologique de l'altitude r\xE9elle est plus \xE9lev\xE9.","Les seuils d'utilisation de l'oxyg\xE8ne d\xE9pendent de la r\xE9glementation applicable au vol : \xE0 v\xE9rifier dans les textes en vigueur."])]}]},Oe=(e,t,r,a)=>({level:"SUP",q:e,options:t,correct:r,explain:a}),Bb={aero:[Oe("Un avion a Cx0 = 0,02 et k = 0,08. Quel Cz donne la finesse maximale ?",["0,25","0,50","0,75","1,00"],1,"Cz = \u221A(Cx0 / k) = \u221A0,25 = 0,5. La finesse vaut alors 0,5 / 0,04 = 12,5."),Oe("\xC0 la finesse maximale, quelle relation lie les tra\xEEn\xE9es parasite et induite ?",["La tra\xEEn\xE9e induite vaut le double de la parasite","La tra\xEEn\xE9e parasite vaut le double de l'induite","Elles sont \xE9gales","La tra\xEEn\xE9e induite est nulle"],2,"Cx = 2\xB7Cx0 : le terme induit k\xB7Cz\xB2 est \xE9gal \xE0 Cx0."),Oe("Un avion a Vs = 60 kt et un facteur de charge limite de 4 g. Quelle est sa vitesse de man\u0153uvre Va ?",["60 kt","90 kt","120 kt","240 kt"],2,"Va = Vs \xB7 \u221An = 60 \xD7 2 = 120 kt."),Oe("Si l'on double l'allongement d'une aile, \xE0 Cx0 constant, la finesse maximale est multipli\xE9e par environ :",["1,2","1,41","2","4"],1,"k est inversement proportionnel \xE0 \u03BB et fmax varie en 1/\u221Ak, donc en \u221A\u03BB : le facteur est \u221A2."),Oe("Dans l'\xE9quation de Breguet, pourquoi un m\xEAme volume de carburant fait-il parcourir plus de distance en fin de vol ?",["Le moteur est plus efficace","L'avion est plus l\xE9ger","Le vent est plus favorable","La finesse diminue"],1,"La distance d\xE9pend de ln(W1/W2) : \xE0 masse plus faible, la m\xEAme quantit\xE9 br\xFBl\xE9e repr\xE9sente une fraction plus grande.")],aeronefs:[Oe("Le rendement id\xE9al d'un cycle d'Otto de rapport volum\xE9trique 8 (\u03B3 = 1,4) vaut environ :",["35 %","45 %","56 %","72 %"],2,"\u03B7 = 1 \u2212 8^(\u22120,4) \u2248 0,565."),Oe("Qu'est-ce qui limite principalement le rapport volum\xE9trique d'un moteur \xE0 pistons d'avion ?",["Le cliquetis (d\xE9tonation)","Le poids du vilebrequin","La pression atmosph\xE9rique","La couleur de l'avgas"],0,"Un rapport trop \xE9lev\xE9 provoque l'auto-inflammation du m\xE9lange, limit\xE9e par l'indice d'octane."),Oe("Un turbor\xE9acteur \xE9jecte l'air \xE0 600 m/s et vole \xE0 200 m/s. Son rendement propulsif vaut :",["25 %","50 %","67 %","75 %"],1,"\u03B7p = 2\xB7V0 / (V0 + Ve) = 400 / 800 = 0,5."),Oe("Pourquoi un fort taux de dilution am\xE9liore-t-il le rendement propulsif ?",["Il augmente la temp\xE9rature de combustion","Il r\xE9duit la vitesse d'\xE9jection moyenne pour une m\xEAme pouss\xE9e","Il @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

.pv-app {
  --pv-navy: #142A3D;
  --pv-sky: #3B6E93;
  --pv-ground: #9C7A4E;
  --pv-paper: #EDF1F1;
  --pv-paper-raised: #FFFFFF;
  --pv-ink: #16222C;
  --pv-ink-soft: #4E5D66;
  --pv-amber: #C97A1F;
  --pv-amber-deep: #9C5E14;
  --pv-amber-soft: rgba(201,122,31,0.13);
  --pv-bia: #2C6E8E;
  --pv-bia-soft: rgba(44,110,142,0.12);
  --pv-line: #D5DBDA;
  --pv-sup: #7A3E65;
  --pv-sup-soft: rgba(122,62,101,0.12);
  font-family: 'Source Serif 4', Georgia, serif;
  background: var(--pv-paper);
  color: var(--pv-ink);
  min-height: 100vh;
  line-height: 1.55;
}
.pv-app *, .pv-app *::before, .pv-app *::after { box-sizing: border-box; }
.pv-app h1, .pv-app h2, .pv-app h3, .pv-app button, .pv-app nav {
  font-family: 'Titillium Web', 'Segoe UI', sans-serif;
}

/* Header */
.pv-header { background: var(--pv-navy); color: #fff; position: relative; overflow: hidden; border-bottom: 3px solid var(--pv-amber); }
.pv-horizon-svg { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 84px; height: 84px; opacity: 0.92; }
.pv-header-inner { position: relative; max-width: 960px; margin: 0 auto; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 16px; }
.pv-brand { display: flex; align-items: center; gap: 12px; padding-right: 100px; }
.pv-brand h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; }
.pv-brand p { margin: 2px 0 0; font-size: 0.85rem; color: rgba(255,255,255,0.72); }
.pv-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.pv-nav button { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 3px; font-size: 0.88rem; cursor: pointer; transition: background 0.15s ease; }
.pv-nav button:hover { background: rgba(255,255,255,0.13); }
.pv-nav button.active { background: var(--pv-amber); border-color: var(--pv-amber); color: #1A1204; font-weight: 600; }

/* Main */
.pv-main { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
.pv-intro { margin: 0 0 22px; color: var(--pv-ink-soft); font-size: 0.98rem; max-width: 64ch; }

/* Module list */
.pv-module-list { display: flex; flex-direction: column; border-top: 1px solid var(--pv-line); }
.pv-module-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--pv-paper-raised); border: none; border-bottom: 1px solid var(--pv-line); padding: 16px 14px; font-family: inherit; color: inherit; }
.pv-module-row.is-available { cursor: pointer; }
.pv-module-row.is-soon { cursor: default; background: transparent; }
.pv-module-row.is-available:hover { background: var(--pv-amber-soft); }
.pv-light { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pv-light-on { background: var(--pv-amber); box-shadow: 0 0 7px 2px rgba(201,122,31,0.55); }
.pv-light-off { background: #C6CCCB; }
.pv-module-icon { color: var(--pv-navy); flex-shrink: 0; }
.is-soon .pv-module-icon { color: #B6BCBB; }
.pv-module-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pv-module-title { font-weight: 600; font-size: 1rem; color: var(--pv-ink); }
.is-soon .pv-module-title { color: #8A9294; }
.pv-module-tagline { font-size: 0.85rem; color: var(--pv-ink-soft); }
.pv-module-meta-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pv-module-meta { font-size: 0.82rem; color: var(--pv-ink-soft); white-space: nowrap; }
.pv-module-progress { font-size: 0.76rem; color: var(--pv-amber-deep); white-space: nowrap; }
.pv-module-soon { font-size: 0.78rem; color: #9AA1A0; border: 1px solid #D8DCDB; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }

/* Back link */
.pv-back { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--pv-bia); font-size: 0.85rem; cursor: pointer; padding: 0; margin-bottom: 14px; font-family: 'Titillium Web', sans-serif; }
.pv-back:hover { text-decoration: underline; }

/* Module detail */
.pv-module-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 1.35rem; color: var(--pv-navy); }
.pv-module-desc { color: var(--pv-ink-soft); margin: 0 0 4px; max-width: 60ch; }
.pv-progress { color: var(--pv-ink-soft); font-size: 0.85rem; margin: 0 0 18px; }
.pv-lesson-rows { display: flex; flex-direction: column; border-top: 1px solid var(--pv-line); }
.pv-lesson-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--pv-paper-raised); border: none; border-bottom: 1px solid var(--pv-line); padding: 14px; cursor: pointer; font-family: inherit; color: inherit; }
.pv-lesson-row:hover { background: var(--pv-amber-soft); }
.pv-lesson-num { font-family: 'Titillium Web', sans-serif; font-weight: 700; color: var(--pv-amber); font-size: 0.85rem; width: 22px; flex-shrink: 0; }
.pv-lesson-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pv-lesson-title { font-weight: 600; color: var(--pv-ink); }
.pv-lesson-summary { font-size: 0.84rem; color: var(--pv-ink-soft); }
.pv-lesson-check { color: var(--pv-bia); flex-shrink: 0; }

/* Lesson view */
.pv-lesson-heading { font-size: 1.5rem; color: var(--pv-navy); margin: 0 0 14px; }
.pv-level-filter { display: flex; gap: 6px; margin-bottom: 20px; }
.pv-level-filter button { border: 1px solid var(--pv-line); background: var(--pv-paper-raised); color: var(--pv-ink-soft); padding: 6px 13px; border-radius: 3px; font-size: 0.82rem; cursor: pointer; font-family: 'Titillium Web', sans-serif; }
.pv-level-filter button.active { background: var(--pv-navy); border-color: var(--pv-navy); color: #fff; }
.pv-blocks { display: flex; flex-direction: column; gap: 16px; }
.pv-block { padding: 14px 16px 14px 18px; border-left: 3px solid; background: var(--pv-paper-raised); border-radius: 0 4px 4px 0; }
.pv-block-BIA { border-color: var(--pv-bia); }
.pv-block-ATPL { border-color: var(--pv-amber); }
.pv-block-badge { display: inline-block; font-family: 'Titillium Web', sans-serif; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; margin-bottom: 8px; }
.pv-block-BIA .pv-block-badge { background: var(--pv-bia-soft); color: var(--pv-bia); }
.pv-block-ATPL .pv-block-badge { background: var(--pv-amber-soft); color: var(--pv-amber-deep); }
.pv-block-heading { font-family: 'Titillium Web', sans-serif; font-size: 1.02rem; margin: 0 0 8px; color: var(--pv-ink); }
.pv-block p { margin: 0 0 8px; }
.pv-block p:last-child { margin-bottom: 0; }
.pv-block ul { margin: 0; padding-left: 20px; }
.pv-block li { margin-bottom: 6px; }
.pv-diagram-card { background: var(--pv-paper-raised); border: 1px solid var(--pv-line); border-radius: 4px; padding: 16px; }
.pv-diagram-caption { text-align: center; font-size: 0.82rem; color: var(--pv-ink-soft); margin: 8px 0 0; font-family: 'Titillium Web', sans-serif; }
.pv-svg-diagram { width: 100%; height: auto; display: block; }
.pv-table { width: 100%; border-collapse: collapse; font-family: 'Titillium Web', sans-serif; font-size: 0.88rem; }
.pv-table th, .pv-table td { border: 1px solid var(--pv-line); padding: 8px 10px; text-align: center; }
.pv-table th { background: var(--pv-paper); color: var(--pv-ink-soft); font-weight: 600; }
.pv-mark-read { margin-top: 24px; display: inline-flex; align-items: center; gap: 6px; background: var(--pv-paper-raised); border: 1px solid var(--pv-bia); color: var(--pv-bia); padding: 9px 16px; border-radius: 3px; cursor: pointer; font-family: 'Titillium Web', sans-serif; font-size: 0.88rem; font-weight: 600; }
.pv-mark-read.is-read { background: var(--pv-bia); color: #fff; }

/* Coming soon */
.pv-soon { text-align: center; padding: 70px 20px; color: var(--pv-ink-soft); }
.pv-soon svg { color: var(--pv-line); margin-bottom: 12px; }
.pv-soon h2 { color: var(--pv-navy); margin: 0 0 8px; font-family: 'Titillium Web', sans-serif; }
.pv-soon p { max-width: 46ch; margin: 0 auto; }

.pv-footer { max-width: 880px; margin: 0 auto; padding: 0 20px 40px; }
.pv-footer p { font-size: 0.78rem; color: var(--pv-ink-soft); line-height: 1.6; border-top: 1px solid var(--pv-line); padding-top: 14px; max-width: 72ch; }
.pv-footer strong { color: var(--pv-ink); font-weight: 600; }

/* Quiz */
.pv-quiz-score-badge { font-size: 0.76rem; color: var(--pv-amber-deep); white-space: nowrap; }
.pv-quiz-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.pv-quiz-counter { font-family: 'Titillium Web', sans-serif; font-size: 0.85rem; color: var(--pv-ink-soft); }
.pv-quiz-level-tag { font-family: 'Titillium Web', sans-serif; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 2px; }
.pv-quiz-level-tag.BIA { background: var(--pv-bia-soft); color: var(--pv-bia); }
.pv-quiz-level-tag.ATPL { background: var(--pv-amber-soft); color: var(--pv-amber-deep); }
.pv-quiz-question { font-size: 1.15rem; color: var(--pv-ink); margin: 14px 0 20px; line-height: 1.4; }
.pv-quiz-options { display: flex; flex-direction: column; gap: 10px; }
.pv-quiz-option {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  background: var(--pv-paper-raised); border: 1.5px solid var(--pv-line); border-radius: 4px;
  padding: 12px 14px; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif; font-size: 0.98rem; color: var(--pv-ink);
}
.pv-quiz-option:hover:not(:disabled) { border-color: var(--pv-bia); background: var(--pv-bia-soft); }
.pv-quiz-option:disabled { cursor: default; }
.pv-quiz-option.is-correct { border-color: var(--pv-bia); background: var(--pv-bia-soft); font-weight: 600; }
.pv-quiz-option.is-wrong { border-color: #9C4A1F; background: rgba(156,74,31,0.1); }
.pv-quiz-option-letter {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--pv-line);
  display: flex; align-items: center; justify-content: center; font-family: 'Titillium Web', sans-serif; font-size: 0.8rem; font-weight: 600;
}
.pv-quiz-feedback { margin-top: 18px; padding: 14px 16px; border-radius: 4px; background: var(--pv-paper-raised); border-left: 3px solid var(--pv-bia); }
.pv-quiz-feedback.is-wrong { border-left-color: #9C4A1F; }
.pv-quiz-feedback-verdict { font-family: 'Titillium Web', sans-serif; font-weight: 700; margin: 0 0 6px; }
.pv-quiz-feedback.is-wrong .pv-quiz-feedback-verdict { color: #9C4A1F; }
.pv-quiz-feedback:not(.is-wrong) .pv-quiz-feedback-verdict { color: var(--pv-bia); }
.pv-quiz-next {
  margin-top: 20px; background: var(--pv-navy); color: #fff; border: none; padding: 10px 20px;
  border-radius: 3px; cursor: pointer; font-family: 'Titillium Web', sans-serif; font-weight: 600; font-size: 0.9rem;
}
.pv-quiz-result { text-align: center; padding: 40px 20px; }
.pv-quiz-score-big { font-family: 'Titillium Web', sans-serif; font-size: 3rem; font-weight: 700; color: var(--pv-navy); margin: 6px 0; }
.pv-quiz-score-label { color: var(--pv-ink-soft); margin-bottom: 24px; }
.pv-quiz-result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pv-quiz-result-actions button {
  font-family: 'Titillium Web', sans-serif; font-weight: 600; font-size: 0.88rem; padding: 9px 18px; border-radius: 3px; cursor: pointer;
}
.pv-quiz-restart { background: var(--pv-paper-raised); border: 1px solid var(--pv-bia); color: var(--pv-bia); }
.pv-quiz-back-btn { background: var(--pv-navy); border: 1px solid var(--pv-navy); color: #fff; }

/* Niveau Bac+2 / Bac+3 */
.pv-block-SUP { border-color: var(--pv-sup); }
.pv-block-SUP .pv-block-badge { background: var(--pv-sup-soft); color: var(--pv-sup); }
.pv-quiz-level-tag.SUP { background: var(--pv-sup-soft); color: var(--pv-sup); }
.pv-level-filter { flex-wrap: wrap; }
.pv-level-filter button.active.is-sup { background: var(--pv-sup); border-color: var(--pv-sup); }
.pv-lesson-level { display: inline-block; align-self: flex-start; font-family: 'Titillium Web', sans-serif; font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 2px; background: var(--pv-sup-soft); color: var(--pv-sup); margin-bottom: 3px; }
.pv-formula { padding: 12px 16px; background: var(--pv-paper); border: 1px solid var(--pv-line); border-radius: 4px; overflow-x: auto; }
.pv-formula-heading { font-family: 'Titillium Web', sans-serif; font-size: 0.78rem; font-weight: 600; color: var(--pv-sup); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; }
.pv-formula-line { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 1rem; line-height: 1.8; margin: 0; white-space: pre; color: var(--pv-ink); }
.pv-formula-caption { font-size: 0.8rem; color: var(--pv-ink-soft); margin: 8px 0 0; white-space: normal; }
.pv-diagram-card { overflow-x: auto; }
.pv-table-wrap { overflow-x: auto; }
@media (max-width: 640px) {
  .pv-header-inner { padding: 18px 16px 14px; }
  .pv-brand { padding-right: 70px; }
  .pv-horizon-svg { width: 56px; height: 56px; right: 12px; }
  .pv-nav { gap: 4px; }
  .pv-nav button { padding: 7px 10px; font-size: 0.82rem; }
  .pv-module-row, .pv-lesson-row { padding: 13px 10px; gap: 10px; }
  .pv-main { padding: 20px 14px 50px; }

1F",strokeWidth:2.5,dot:{r:3},name:"TUC (valeurs indicatives)"})]})})})}function Lae({id:e}){return e==="four-forces"?(0,w.jsx)(cae,{}):e==="airfoil"?(0,w.jsx)(dae,{}):e==="three-axes"?(0,w.jsx)(fae,{}):e==="cz-alpha"?(0,w.jsx)(pae,{}):e==="drag"?(0,w.jsx)(mae,{}):e==="wind-triangle"?(0,w.jsx)(hae,{}):e==="four-stroke"?(0,w.jsx)(vae,{}):e==="cloud-layers"?(0,w.jsx)(gae,{}):e==="cg-envelope"?(0,w.jsx)(yae,{}):e==="airspace-structure"?(0,w.jsx)(xae,{}):e==="tuc-chart"?(0,w.jsx)(bae,{}):e&&e.startsWith("sup-")?(0,w.jsx)(NR,{id:e}):null}var Zc=[{id:"aero",title:"A\xE9rodynamique & m\xE9canique du vol",tagline:"Les forces, la portance, la tra\xEEn\xE9e, le d\xE9crochage, les axes et le virage.",Icon:ps,status:"available",lessons:[{id:"forces",title:"Les quatre forces et l'\xE9quilibre du vol",summary:"Portance, poids, traction, tra\xEEn\xE9e : comment elles s'\xE9quilibrent en vol.",blocks:[{type:"text",level:"BIA",heading:"Quatre forces, un \xE9quilibre",paragraphs:["Un avion en vol est soumis \xE0 quatre forces principales. La portance s'oppose au poids : elle est produite par les ailes et dirig\xE9e vers le haut. Le poids est la force de gravit\xE9, appliqu\xE9e au centre de gravit\xE9 de l'avion, dirig\xE9e vers le bas.","La traction s'oppose \xE0 la tra\xEEn\xE9e : elle est fournie par le moteur (h\xE9lice ou r\xE9acteur) et dirig\xE9e vers l'avant. La tra\xEEn\xE9e est la r\xE9sistance de l'air au d\xE9placement de l'avion, dirig\xE9e vers l'arri\xE8re.","En vol rectiligne, en palier, \xE0 vitesse constante, ces quatre forces s'\xE9quilibrent deux \xE0 deux : la portance compense exactement le poids, et la traction compense exactement la tra\xEEn\xE9e."]},{type:"diagram",level:"BIA",diagramId:"four-forces",caption:"Les quatre forces agissant sur un avion en vol de croisi\xE8re."},{type:"text",level:"BIA",paragraphs:["D\xE8s que cet \xE9quilibre est rompu, l'avion acc\xE9l\xE8re dans la direction de la force exc\xE9dentaire : plus de traction que de tra\xEEn\xE9e fait acc\xE9l\xE9rer l'avion, plus de portance que de poids le fait monter."]},{type:"text",level:"ATPL",heading:"L'\xE9quilibre en mont\xE9e et en descente",paragraphs:["D\xE8s que la trajectoire n'est plus horizontale, l'\xE9quilibre se complique : une partie du poids et une partie de la traction se projettent sur l'axe de la trajectoire. En mont\xE9e stabilis\xE9e, avec \u03B3 la pente de mont\xE9e, on peut \xE9crire en premi\xE8re approximation : la traction doit compenser \xE0 la fois la tra\xEEn\xE9e et la composante du poids le long de la trajectoire (T = D + W\xB7sin \u03B3), tandis que la portance ne compense plus que la composante du poids perpendiculaire \xE0 la trajectoire (L = W\xB7cos \u03B3), donc un peu moins que le poids total.","C'est pour cette raison qu'un avion a besoin d'un exc\xE9dent de traction disponible pour monter : la pente de mont\xE9e d\xE9pend directement de la puissance ou de la pouss\xE9e qu'il reste une fois la tra\xEEn\xE9e compens\xE9e."]}]},{id:"portance",title:"Le profil d'aile et la portance",summary:"Anatomie d'un profil, origine physique de la portance, formule et coefficient Cz.",blocks:[{type:"text",level:"BIA",heading:"Anatomie d'un profil d'aile",paragraphs:["Vu en coupe, un profil d'aile pr\xE9sente un bord d'attaque (l'avant, arrondi) et un bord de fuite (l'arri\xE8re, effil\xE9). La surface sup\xE9rieure se nomme l'extrados, la surface inf\xE9rieure l'intrados. La corde est la ligne droite qui relie le bord d'attaque au bord de fuite.","L'angle d'incidence est l'angle form\xE9 entre la corde du profil et la direction du vent relatif, c'est-\xE0-dire la direction dans laquelle l'air aborde l'aile. Ce n'est pas la m\xEAme chose que l'assiette de l'avion : on peut avoir une forte incidence m\xEAme en vol horizontal, par exemple \xE0 basse vitesse."]},{type:"diagram",level:"BIA",diagramId:"airfoil",caption:"Coupe d'un profil d'aile cambr\xE9, avec le vent relatif et l'angle d'incidence."},{type:"text",level:"BIA",heading:"D'o\xF9 vient la portance ?",paragraphs:["L'aile d\xE9vie l'air vers le bas : par r\xE9action, l'air pousse l'aile vers le haut. Cette d\xE9viation s'accompagne d'une acc\xE9l\xE9ration de l'air au-dessus de l'extrados, qui cr\xE9e une d\xE9pression, tandis que l'air passant sous l'intrados est relativement plus comprim\xE9. Cette diff\xE9rence de pression entre extrados et intrados est la portance.","Plus l'angle d'incidence augmente, plus l'air est d\xE9vi\xE9 fortement et plus la portance augmente, jusqu'\xE0 un certain angle critique, au-del\xE0 duquel l'\xE9coulement d\xE9croche de l'extrados et la portance chute brutalement (voir la le\xE7on sur le d\xE9crochage)."]},{type:"text",level:"ATPL",heading:"La formule de la portance",paragraphs:["La portance ob\xE9it \xE0 la relation : Rz = \xBD \xB7 \u03C1 \xB7 V\xB2 \xB7 S \xB7 Cz, o\xF9 \u03C1 est la masse volumique de l'air, V la vitesse par rapport \xE0 l'air, S la surface alaire, et Cz le coefficient de portance, qui d\xE9pend essentiellement de la forme du profil et de l'angle d'incidence.","Cette formule explique pourquoi un avion doit acc\xE9l\xE9rer pour d\xE9coller, ou pourquoi il vole \xE0 plus forte incidence \xE0 basse vitesse : \xE0 portance \xE9gale au poids, si V diminue, Cz doit augmenter, donc l'incidence doit augmenter."]},{type:"text",level:"ATPL",heading:"La courbe de Cz en fonction de l'incidence",paragraphs:["Le coefficient Cz cro\xEEt de fa\xE7on presque lin\xE9aire avec l'angle d'incidence, jusqu'\xE0 un maximum, le Czmax, atteint \xE0 l'incidence critique (typiquement autour de 15 \xE0 16\xB0 pour un profil classique non hypersustent\xE9). Au-del\xE0, l'\xE9coulement d\xE9croche et Cz chute."]},{type:"diagram",level:"ATPL",diagramId:"cz-alpha",caption:"Coefficient de portance Cz en fonction de l'angle d'incidence : la chute apr\xE8s le maximum correspond au d\xE9crochage."}]},{id:"trainee",title:"La tra\xEEn\xE9e",summary:"Les diff\xE9rents types de tra\xEEn\xE9e, la finesse, et la vitesse de tra\xEEn\xE9e minimale.",blocks:[{type:"text",level:"BIA",heading:"Une force qui s'oppose au mouvement",paragraphs:["La tra\xEEn\xE9e est la composante de la r\xE9sistance de l'air parall\xE8le \xE0 la trajectoire, toujours oppos\xE9e \xE0 l'avancement. Elle augmente avec la vitesse et avec l'angle d'incidence : voler vite ou voler \xE0 forte incidence co\xFBte plus de tra\xEEn\xE9e."]},{type:"list",level:"ATPL",heading:"Les familles de tra\xEEn\xE9e",items:["Tra\xEEn\xE9e de frottement : due \xE0 la viscosit\xE9 de l'air qui \xAB colle \xBB aux surfaces (couche limite).","Tra\xEEn\xE9e de forme, ou de pression : due au d\xE9collement de l'\xE9coulement derri\xE8re les parties peu profil\xE9es.","Tra\xEEn\xE9e induite : sous-produit in\xE9vitable de la portance, li\xE9e aux tourbillons marginaux en bout d'aile ; elle diminue quand la vitesse augmente.","Tra\xEEn\xE9e d'interf\xE9rence : n\xE9e aux jonctions entre \xE9l\xE9ments de l'avion, par exemple aile-fuselage.","Tra\xEEn\xE9e de compressibilit\xE9, ou d'onde : appara\xEEt \xE0 haute vitesse, proche du mach de l'avion, surtout pertinente pour les avions rapides."]},{type:"text",level:"ATPL",heading:"Tra\xEEn\xE9e parasite et tra\xEEn\xE9e induite",paragraphs:["On regroupe souvent frottement, forme et interf\xE9rence sous le nom de tra\xEEn\xE9e parasite, qui cro\xEEt avec le carr\xE9 de la vitesse. \xC0 l'inverse, la tra\xEEn\xE9e induite d\xE9cro\xEEt quand la vitesse augmente, car elle est li\xE9e \xE0 l'incidence : plus on vole vite, moins il faut d'incidence pour porter le m\xEAme poids.","La tra\xEEn\xE9e totale, somme des deux, pr\xE9sente donc un minimum pour une vitesse particuli\xE8re : voler plus lentement ou plus vite que cette vitesse co\xFBte plus de tra\xEEn\xE9e."]},{type:"diagram",level:"ATPL",diagramId:"drag",caption:"Tra\xEEn\xE9e parasite, tra\xEEn\xE9e induite et tra\xEEn\xE9e totale en fonction de la vitesse (courbe sch\xE9matique, pas des donn\xE9es r\xE9elles)."},{type:"text",level:"ATPL",heading:"La finesse",paragraphs:["La finesse est le rapport entre la portance et la tra\xEEn\xE9e, Cz / Cx, ou de fa\xE7on \xE9quivalente la distance parcourue pour chaque m\xE8tre de chute en vol plan\xE9. Elle est maximale pr\xE9cis\xE9ment \xE0 la vitesse de tra\xEEn\xE9e minimale. C'est une donn\xE9e essentielle en cas de panne moteur : voler \xE0 la vitesse de finesse max permet de parcourir la plus grande distance possible avant de se poser.","Les ordres de grandeur varient \xE9norm\xE9ment selon le type d'appareil : environ 8 \xE0 10 pour un avion de tourisme, autour de 15 \xE0 20 pour un avion de ligne moteurs coup\xE9s, et jusqu'\xE0 40, voire 60 ou plus pour un planeur de performance, taill\xE9 sp\xE9cifiquement pour minimiser la tra\xEEn\xE9e."]},{type:"text",level:"ATPL",heading:"R\xE9duire la tra\xEEn\xE9e induite : les winglets",paragraphs:["Les ailettes verticales en bout d'aile, les winglets, r\xE9duisent l'intensit\xE9 des tourbillons marginaux responsables de la tra\xEEn\xE9e induite, en limitant le contournement de l'air entre intrados et extrados en bout de voilure. Sur un avion de ligne, ce gain se traduit directement par une consommation de carburant r\xE9duite sur longue distance, ce qui explique leur g\xE9n\xE9ralisation progressive depuis les ann\xE9es 1990."]}]},{id:"decrochage",title:"Le d\xE9crochage",summary:"M\xE9canisme, facteurs aggravants, signes avant-coureurs et r\xE9cup\xE9ration.",blocks:[{type:"text",level:"BIA",heading:"Une question d'angle, pas seulement de vitesse",paragraphs:["Le d\xE9crochage survient quand l'angle d'incidence d\xE9passe l'angle critique : l'\xE9coulement d'air ne suit plus la forme de l'extrados, se d\xE9colle, et la portance chute brutalement. Contrairement \xE0 une id\xE9e re\xE7ue, le d\xE9crochage n'est pas d'abord une question de vitesse trop faible : il peut survenir \xE0 n'importe quelle vitesse, d\xE8s que l'incidence critique est d\xE9pass\xE9e.","Les signes avant-coureurs habituels sont des vibrations de la cellule, le buffet, caus\xE9es par l'\xE9coulement perturb\xE9 qui frappe l'empennage, une perte d'efficacit\xE9 des gouvernes, et sur de nombreux avions une alarme sonore d\xE9di\xE9e."]},{type:"text",level:"ATPL",heading:"La vitesse de d\xE9crochage",paragraphs:["En posant Rz = Poids \xE0 Czmax, on obtient la vitesse de d\xE9crochage : Vs = racine carr\xE9e de (2\xB7W / (\u03C1\xB7S\xB7Czmax)). Cette vitesse augmente avec la masse de l'avion, et diminue si Czmax augmente, par exemple volets sortis.","Elle augmente aussi avec le facteur de charge : un virage inclin\xE9 ou une ressource brutale augmentent la vitesse de d\xE9crochage effective, m\xEAme si le poids r\xE9el n'a pas chang\xE9 (voir la le\xE7on sur le virage). C'est ce qu'on appelle un d\xE9crochage acc\xE9l\xE9r\xE9 : il peut survenir \xE0 une vitesse largement sup\xE9rieure au Vs de r\xE9f\xE9rence en vol droit et en palier."]},{type:"text",level:"ATPL",heading:"R\xE9cup\xE9ration",paragraphs:["La technique de r\xE9cup\xE9ration standard consiste d'abord \xE0 r\xE9duire l'angle d'incidence, en poussant l\xE9g\xE8rement sur le manche, pour redonner \xE0 l'aile un \xE9coulement sain, avant d'appliquer la puissance et de r\xE9tablir les ailes \xE0 l'horizontale, au pied si besoin pour \xE9viter d'aggraver une dissym\xE9trie. Un d\xE9crochage dissym\xE9trique, mal ma\xEEtris\xE9, peut d\xE9g\xE9n\xE9rer en vrille, un r\xE9gime avanc\xE9 qui fait l'objet d'un entra\xEEnement sp\xE9cifique."]}]},{id:"axes-gouvernes",title:"Les trois axes et les gouvernes",summary:"Tangage, roulis, lacet, et les surfaces qui les commandent.",blocks:[{type:"text",level:"BIA",heading:"Trois axes, trois mouvements",paragraphs:["Un avion peut tourner autour de trois axes qui se croisent au centre de gravit\xE9. L'axe de tangage est transversal, d'une aile \xE0 l'autre : il commande le mouvement de nez qui monte ou descend, contr\xF4l\xE9 par la gouverne de profondeur, sur l'empennage horizontal.","L'axe de roulis est longitudinal, du nez \xE0 la queue : il commande l'inclinaison des ailes, contr\xF4l\xE9e par les ailerons, en bout d'aile. L'axe de lacet est vertical : il commande le mouvement du nez \xE0 droite ou \xE0 gauche, contr\xF4l\xE9 par la gouverne de direction, sur l'empennage vertical, la d\xE9rive."]},{type:"diagram",level:"BIA",diagramId:"three-axes",caption:"Les trois axes de rotation d'un avion et les gouvernes associ\xE9es."},{type:"text",level:"ATPL",heading:"Le lacet induit",paragraphs:["Actionner les ailerons pour s'incliner produit un effet secondaire ind\xE9sirable : l'aileron qui s'abaisse d'un c\xF4t\xE9 augmente la portance, donc la tra\xEEn\xE9e induite, de ce c\xF4t\xE9, ce qui fait l\xE9g\xE8rement lacet du c\xF4t\xE9 oppos\xE9 au virage d\xE9sir\xE9. C'est le lacet induit, corrig\xE9 en pratique par une coordination au palonnier lors de l'entr\xE9e en virage."]},{type:"text",level:"ATPL",heading:"Compensateur et stabilit\xE9",paragraphs:["Le compensateur, ou trim, est une petite surface, g\xE9n\xE9ralement sur la gouverne de profondeur, qui permet d'annuler l'effort que le pilote doit exercer sur les commandes pour maintenir une assiette donn\xE9e. Ce n'est pas une commande de vol primaire, seulement une aide au pilotage.","Un avion est con\xE7u pour \xEAtre naturellement stable autour de ces trois axes : l'empennage horizontal assure la stabilit\xE9 longitudinale, la d\xE9rive la stabilit\xE9 de route, et la forme en di\xE8dre des ailes contribue \xE0 la stabilit\xE9 lat\xE9rale."]},{type:"text",level:"ATPL",heading:"L'effet girouette et le di\xE8dre",paragraphs:["La stabilit\xE9 de route s'explique simplement : si l'avion d\xE9rape, la d\xE9rive, en arri\xE8re du centre de gravit\xE9, re\xE7oit le vent relatif de travers et produit une force qui ram\xE8ne le nez dans l'axe, exactement comme une girouette s'aligne avec le vent. C'est l'effet girouette.","Le di\xE8dre, l'angle vers le haut des ailes vues de face, stabilise le roulis par un m\xE9canisme voisin : si une aile s'abaisse, l'avion glisse l\xE9g\xE8rement de ce c\xF4t\xE9, ce qui augmente l'incidence de l'aile basse par rapport \xE0 l'aile haute et la fait remonter. La position des ailes sur le fuselage joue aussi : une voilure haute est intrins\xE8quement plus stable en roulis qu'une voilure basse, qui en a souvent besoin d'un peu plus pour compenser."]},{type:"text",level:"ATPL",heading:"Le foyer, pivot de la stabilit\xE9 longitudinale",paragraphs:["La stabilit\xE9 longitudinale, elle, d\xE9pend de la position relative de deux points : le centre de gravit\xE9 et le foyer a\xE9rodynamique, le point autour duquel les variations de portance dues \xE0 l'incidence s'appliquent, situ\xE9 autour du quart avant de la corde. Pour qu'un avion soit stable en tangage, le centre de gravit\xE9 doit rester devant le foyer, avec une marge suffisante : c'est tout l'enjeu du respect du domaine de centrage vu dans le module Pr\xE9paration du vol."]}]},{id:"virage",title:"Le virage et le facteur de charge",summary:"Comment un avion vire, et pourquoi virer serr\xE9 rapproche du d\xE9crochage.",blocks:[{type:"text",level:"BIA",heading:"Virer en inclinant",paragraphs:["Pour virer, le pilote incline l'avion par le roulis. Une partie de la portance, jusque-l\xE0 enti\xE8rement verticale, devient horizontale et \xAB tire \xBB l'avion vers l'int\xE9rieur du virage. M\xE9caniquement, la composante verticale de la portance diminue alors : pour ne pas perdre d'altitude, il faut augmenter la portance totale, donc l'incidence, en tirant l\xE9g\xE8rement sur le manche."]},{type:"text",level:"ATPL",heading:"Le facteur de charge",paragraphs:["Le facteur de charge n est le rapport entre la portance et le poids r\xE9el de l'avion : n = 1 / cos(\u03C6), o\xF9 \u03C6 est l'angle d'inclinaison. Il traduit ce que ressentent les occupants : \xE0 n = 2, tout se passe comme si le poids de l'avion avait doubl\xE9."]},{type:"table",level:"ATPL",headers:["Inclinaison","Facteur de charge n","Vitesse de d\xE9crochage"],rows:[["0\xB0","1,00","100 %"],["30\xB0","1,15","107 %"],["45\xB0","1,41","119 %"],["60\xB0","2,00","141 %"]],caption:"La vitesse de d\xE9crochage en virage vaut Vs (palier) multipli\xE9e par la racine carr\xE9e de n : elle augmente avec l'inclinaison."},{type:"text",level:"ATPL",paragraphs:["Cette augmentation de la vitesse de d\xE9crochage en virage inclin\xE9 est une donn\xE9e de s\xE9curit\xE9 essentielle : un virage engag\xE9 \xE0 basse vitesse, pr\xE8s du sol, en tour de piste par exemple, rapproche significativement de l'incidence critique, m\xEAme sans que la vitesse affich\xE9e n'ait chang\xE9."]},{type:"text",level:"ATPL",heading:"Des limites structurales, pas seulement a\xE9rodynamiques",paragraphs:["Le facteur de charge n'est pas seulement une question de d\xE9crochage : la structure elle-m\xEAme n'encaisse qu'une plage limit\xE9e, certifi\xE9e par le constructeur. Un avion de cat\xE9gorie normale est g\xE9n\xE9ralement limit\xE9 \xE0 environ +4 g et -2 g, contre +6 g et -4 g pour un avion certifi\xE9 voltige, con\xE7u pour encaisser des man\u0153uvres bien plus violentes sans dommage structurel."]}]},{id:"vitesses-hypersustentation",title:"Vitesses caract\xE9ristiques et hypersustentation",summary:"Le r\xF4le des volets et le vocabulaire des vitesses limites (Vs, Vfe, Vne, Va...).",blocks:[{type:"text",level:"BIA",heading:"\xC0 quoi servent les volets",paragraphs:["Les volets augmentent la cambrure du profil, donc le Czmax : \xE0 portance \xE9gale, l'avion peut voler, et surtout d\xE9coller et atterrir, \xE0 une vitesse plus faible. C'est ce qui permet d'utiliser des pistes plus courtes. En contrepartie, sortir les volets augmente aussi la tra\xEEn\xE9e."]},{type:"list",level:"ATPL",heading:"Le vocabulaire des vitesses limites",items:["Vs : vitesse de d\xE9crochage en configuration lisse, volets rentr\xE9s.","Vs0 : vitesse de d\xE9crochage en configuration atterrissage, volets sortis.","Vfe : vitesse maximale volets sortis, \xE0 ne pas d\xE9passer sous peine d'endommager les volets.","Vno : vitesse maximale en utilisation normale, en air turbulent notamment.","Vne : vitesse \xE0 ne jamais d\xE9passer, quelles que soient les conditions.","Va : vitesse de man\u0153uvre, la vitesse maximale \xE0 laquelle les gouvernes peuvent \xEAtre braqu\xE9es \xE0 fond sans risque pour la structure.","Vx et Vy : respectivement la vitesse de mont\xE9e \xE0 meilleur angle, pour franchir un obstacle, et \xE0 meilleur taux, pour gagner de l'altitude le plus vite possible."]},{type:"text",level:"ATPL",heading:"Sur l'an\xE9mom\xE8tre",paragraphs:["Plusieurs de ces vitesses sont mat\xE9rialis\xE9es par des arcs de couleur sur l'an\xE9mom\xE8tre : arc blanc pour la plage d'utilisation des volets, de Vs0 \xE0 Vfe, arc vert pour l'utilisation normale, de Vs \xE0 Vno, arc jaune de Vno \xE0 Vne en zone de prudence, et trait rouge \xE0 Vne. De quoi lire d'un coup d'\u0153il dans quelle configuration on se trouve."]}]},{id:"vol-plane",title:"Le vol plan\xE9",summary:"Voler sans moteur : taux de chute, meilleure finesse, et ce que change le vent.",blocks:[{type:"text",level:"BIA",paragraphs:["Moteur coup\xE9 ou au ralenti, un avion peut continuer \xE0 voler en descente r\xE9guli\xE8re : c'est le vol plan\xE9. La pesanteur remplace alors la traction pour fournir l'\xE9nergie n\xE9cessaire \xE0 vaincre la tra\xEEn\xE9e, ce qui explique pourquoi l'avion perd continuellement de l'altitude."]},{type:"text",level:"ATPL",heading:"Taux de chute et vitesse de meilleure finesse",paragraphs:["Deux vitesses caract\xE9risent le plan\xE9 : la vitesse de taux de chute minimal, qui permet de rester en l'air le plus longtemps possible, utile pour attendre une \xE9claircie en planeur, et la vitesse de meilleure finesse, qui maximise la distance parcourue, la seule qui compte vraiment en cas de panne moteur pour rallier un terrain. Ces deux vitesses sont proches mais distinctes, et plus faibles que la vitesse de croisi\xE8re habituelle.","Le vent modifie la distance franchissable sans en changer la finesse r\xE9elle par rapport \xE0 l'air : face au vent, il faut augmenter l\xE9g\xE8rement la vitesse par rapport \xE0 la vitesse de finesse max en air calme pour optimiser la distance sol, et inversement vent arri\xE8re."]}]},{id:"stabilite-dynamique",title:"Stabilit\xE9 dynamique et confort de vol",summary:"Ce qui se passe apr\xE8s une perturbation : retour direct ou oscillations amorties.",blocks:[{type:"text",level:"BIA",paragraphs:["La stabilit\xE9 statique, d\xE9j\xE0 vue, dit seulement si un avion tend \xE0 revenir vers son \xE9quilibre apr\xE8s une perturbation. La stabilit\xE9 dynamique pr\xE9cise comment il y revient : directement, en oscillant avec des oscillations qui s'amortissent, ou, dans le pire des cas, en oscillant de plus en plus fort."]},{type:"text",level:"ATPL",heading:"Le phugo\xEFde",paragraphs:["Le mode d'oscillation longitudinale le plus connu est le phugo\xEFde : une lente oscillation de plusieurs dizaines de secondes, o\xF9 l'avion \xE9change de la vitesse contre de l'altitude et inversement, le nez montant et descendant doucement sans que l'incidence ne varie beaucoup. Un avion bien con\xE7u amortit ce mouvement de lui-m\xEAme en quelques cycles ; un pilote peut aussi l'amortir activement aux commandes.","D'autres modes existent en roulis-lacet, comme le roulis hollandais, une oscillation coupl\xE9e plus rapide, g\xE9n\xE9ralement jugul\xE9e par un amortisseur de lacet sur les avions qui y sont sensibles, notamment les avions de ligne \xE0 fl\xE8che marqu\xE9e."]}]},{id:"haute-vitesse",title:"A\xE9rodynamique \xE0 haute vitesse",summary:"Ce qui change quand l'\xE9coulement approche la vitesse du son.",blocks:[{type:"text",level:"BIA",paragraphs:["Aux vitesses \xE9lev\xE9es, l'air ne se comporte plus tout \xE0 fait comme un fluide incompressible : il se comprime localement devant l'avion. Ce ph\xE9nom\xE8ne, la compressibilit\xE9, ne devient significatif qu'\xE0 l'approche de la vitesse du son, et ne concerne donc pas l'aviation l\xE9g\xE8re, mais bien les avions de ligne et les avions de chasse."]},{type:"text",level:"ATPL",heading:"Nombre de Mach et onde de choc",paragraphs:["Le nombre de Mach exprime la vitesse de l'avion en proportion de la vitesse du son locale, qui d\xE9pend elle-m\xEAme de la temp\xE9rature de l'air. M\xEAme en croisi\xE8re subsonique, l'\xE9coulement acc\xE9l\xE9r\xE9 au-dessus de l'extrados d'une aile peut localement d\xE9passer Mach 1 avant le reste de l'avion : une onde de choc appara\xEEt alors \xE0 cet endroit, cr\xE9ant une tra\xEEn\xE9e suppl\xE9mentaire, la tra\xEEn\xE9e d'onde, et parfois une perturbation de l'\xE9coulement en aval.","C'est pour repousser l'apparition de cette onde de choc vers une vitesse de croisi\xE8re plus \xE9lev\xE9e que les ailes des avions de ligne sont dessin\xE9es en fl\xE8che : cela r\xE9duit la composante de vitesse per\xE7ue par le profil perpendiculairement au bord d'attaque, et retarde d'autant les effets de compressibilit\xE9."]}]}]},{id:"aeronefs",title:"Connaissance des a\xE9ronefs",tagline:"Cellules, structures, moteurs \xE0 pistons et turbines, instruments de bord.",Icon:Bn,status:"available",lessons:[{id:"structure-cellule",title:"Structure et cellule",summary:"Les grands ensembles d'un avion, les mat\xE9riaux, et les modes de construction.",blocks:[{type:"text",level:"BIA",heading:"Les grands ensembles",paragraphs:["Un avion se d\xE9compose en quelques grands ensembles : le fuselage, qui loge l'\xE9quipage et la charge utile ; la voilure, qui porte l'avion ; l'empennage, \xE0 l'arri\xE8re, qui assure la stabilit\xE9 et le pilotage en tangage et en lacet ; et le train d'atterrissage, qui supporte l'avion au sol.","Les mat\xE9riaux ont \xE9volu\xE9 avec le temps : bois et toile pour les premiers avions, alliages d'aluminium \xE0 partir des ann\xE9es 1930, puis mat\xE9riaux composites, plus l\xE9gers \xE0 r\xE9sistance \xE9gale, de plus en plus pr\xE9sents sur les avions r\xE9cents."]},{type:"text",level:"ATPL",heading:"Efforts structuraux",paragraphs:["La structure est dimensionn\xE9e pour encaisser des efforts en vol (rafales, man\u0153uvres, facteur de charge) et au sol (atterrissage, roulage). La voilure elle-m\xEAme est un assemblage de longerons, qui reprennent l'essentiel des efforts de flexion, et de nervures, qui donnent sa forme au profil.","C'est ce dimensionnement structural qui fixe la vitesse de man\u0153uvre Va, d\xE9j\xE0 vue dans le module A\xE9rodynamique : au-del\xE0, un braquage complet des gouvernes pourrait d\xE9passer les efforts admissibles par la cellule."]},{type:"text",level:"BIA",heading:"Une peau qui travaille",paragraphs:["La plupart des avions modernes utilisent une construction dite semi-monocoque : le rev\xEAtement ext\xE9rieur participe lui-m\xEAme \xE0 la r\xE9sistance de la structure, \xE9paul\xE9 par des cadres et des lisses, plut\xF4t que de simplement habiller une charpente interne qui porterait tous les efforts \xE0 elle seule."]},{type:"text",level:"ATPL",heading:"Fatigue et corrosion",paragraphs:["Cette conception r\xE9duit la masse par rapport \xE0 une structure enti\xE8rement treillis, mais impose une surveillance attentive de la fatigue, l'endommagement progressif d'un mat\xE9riau soumis \xE0 des cycles r\xE9p\xE9t\xE9s d'efforts, et de la corrosion, en particulier sur les avions pressuris\xE9s qui cumulent de nombreux cycles de mise en pression et de d\xE9pressurisation au fil de leur carri\xE8re. C'est pour cette raison que chaque cellule a une dur\xE9e de vie certifi\xE9e, exprim\xE9e en heures de vol ou en cycles."]}]},{id:"motorisation",title:"Motorisation : pistons et turbines",summary:"Le cycle \xE0 quatre temps, l'h\xE9lice, puis les turbor\xE9acteurs et turbopropulseurs.",blocks:[{type:"text",level:"BIA",heading:"Le moteur \xE0 pistons",paragraphs:["La plupart des avions l\xE9gers volent avec un moteur \xE0 pistons fonctionnant en quatre temps : admission du m\xE9lange air-essence, compression, combustion qui pousse le piston, puis \xE9chappement des gaz br\xFBl\xE9s. Le moteur entra\xEEne une h\xE9lice, qui transforme ce couple en traction en acc\xE9l\xE9rant une masse d'air vers l'arri\xE8re."]},{type:"diagram",level:"BIA",diagramId:"four-stroke",caption:"Le cycle \xE0 quatre temps : admission, compression, combustion, \xE9chappement."},{type:"text",level:"ATPL",heading:"Richesse du m\xE9lange et givrage carburateur",paragraphs:["En altitude, l'air se rar\xE9fie : le m\xE9lange devient trop riche en essence si l'on ne corrige rien, d'o\xF9 la commande de richesse (mixture) que le pilote doit r\xE9gler. Un carburateur peut aussi givrer par temps humide, m\xEAme \xE0 temp\xE9rature positive, \xE0 cause du refroidissement d\xFB \xE0 la vaporisation de l'essence : d'o\xF9 l'usage pr\xE9ventif du r\xE9chauffage carburateur."]},{type:"text",level:"ATPL",heading:"L'h\xE9lice",paragraphs:["Une h\xE9lice \xE0 pas fixe garde le m\xEAme angle de calage de ses pales quelles que soient les conditions : simple et l\xE9ger, ce compromis n'est optimal que sur une plage de vitesses r\xE9duite. Une h\xE9lice \xE0 pas variable permet au contraire d'ajuster cet angle en vol, pour rester efficace aussi bien \xE0 basse vitesse, au d\xE9collage, qu'\xE0 vitesse de croisi\xE8re \xE9lev\xE9e, un peu comme changer de rapport sur une transmission."]},{type:"text",level:"BIA",heading:"Turbor\xE9acteurs et turbopropulseurs",paragraphs:["Une turbine aspire l'air, le comprime, y br\xFBle du carburant, puis d\xE9tend les gaz \xE0 travers une turbine qui entra\xEEne le compresseur. Le turbor\xE9acteur \xE9jecte ces gaz \xE0 grande vitesse pour produire sa pouss\xE9e ; le turbopropulseur utilise l'essentiel de l'\xE9nergie pour entra\xEEner une h\xE9lice via un r\xE9ducteur."]},{type:"text",level:"ATPL",paragraphs:["Le turbofan, utilis\xE9 par la plupart des avions de ligne, est un compromis : une soufflante fait passer une partie de l'air autour du c\u0153ur du r\xE9a

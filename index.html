abilis\xE9, sert de r\xE9f\xE9rence principale en pratique."]}]},{id:"gps-satellite",title:"Le GPS et la navigation par satellite",summary:"Comment une constellation de satellites donne une position au m\xE8tre pr\xE8s.",blocks:[{type:"text",level:"BIA",paragraphs:["Le r\xE9cepteur GPS calcule sa position en mesurant le temps mis par les signaux radio d'au moins quatre satellites \xE0 lui parvenir : en connaissant pr\xE9cis\xE9ment leurs positions et ces d\xE9lais, il en d\xE9duit sa propre position par triangulation, avec une pr\xE9cision de quelques m\xE8tres."]},{type:"text",level:"ATPL",heading:"Une aide pr\xE9cieuse, pas infaillible",paragraphs:["Le GPS a transform\xE9 la navigation a\xE9rienne, mais reste vuln\xE9rable : signal faible, facilement brouill\xE9 ou perturb\xE9, pannes de satellites, ou simples erreurs de saisie d'un point de cheminement. Le RAIM (Receiver Autonomous Integrity Monitoring) surveille la coh\xE9rence des signaux re\xE7us pour d\xE9tecter une anomalie, mais ne remplace pas la n\xE9cessit\xE9 de savoir naviguer \xE0 l'estime et \xE0 la carte en cas de perte du signal."]}]},{id:"preparer-navigation-vfr",title:"Pr\xE9parer une navigation VFR, \xE9tape par \xE9tape",summary:"De la carte vierge au log de navigation pr\xEAt \xE0 emporter.",blocks:[{type:"list",level:"BIA",heading:"Les grandes \xE9tapes",items:["Tracer la route sur la carte, en \xE9vitant les espaces interdits ou r\xE9glement\xE9s.","D\xE9couper la route en segments entre des points de report faciles \xE0 identifier au sol.","Mesurer distance et route vraie de chaque segment.","Appliquer la d\xE9clinaison magn\xE9tique pour obtenir une route magn\xE9tique.","Calculer cap et temps de chaque segment \xE0 partir du vent pr\xE9vu."]},{type:"text",level:"ATPL",heading:"Le log de navigation",paragraphs:["Toutes ces informations se consignent dans un log de navigation, un tableau emport\xE9 en vol, avec une colonne pour les heures th\xE9oriques et une autre pour les heures r\xE9elles de passage \xE0 chaque point : l'\xE9cart entre les deux, observ\xE9 en vol, permet de recaler les pr\xE9visions suivantes et de d\xE9tecter rapidement un vent diff\xE9rent de celui qui avait \xE9t\xE9 pr\xE9vu."]}]},{id:"navigation-secours",title:"Navigation de secours et d\xE9routement",summary:"Que faire si l'on doute de sa position, ou s'il faut changer de destination en vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Se sentir incertain de sa position arrive \xE0 tout pilote : la bonne r\xE9ponse consiste \xE0 ralentir, prendre de l'altitude pour \xE9largir son champ de vision, identifier un rep\xE8re net au sol, et le recouper avec la carte plut\xF4t que de continuer au hasard en esp\xE9rant reconna\xEEtre quelque chose."]},{type:"text",level:"ATPL",heading:"D\xE9cider un d\xE9routement",paragraphs:["Un d\xE9routement, changer de destination en cours de vol, se d\xE9cide pour de multiples raisons : m\xE9t\xE9o qui se d\xE9grade, panne, carburant plus consomm\xE9 que pr\xE9vu. La pr\xE9paration de vol inclut justement le choix d'un ou plusieurs a\xE9rodromes de d\xE9gagement, avec leur propre calcul de distance et de carburant, pour ne pas avoir \xE0 improviser dans l'urgence."]}]},{id:"cas-pratique-navigation",title:"Lecture de carte : cas pratique",summary:"Relier les notions pr\xE9c\xE9dentes sur un exemple concret de segment de navigation.",blocks:[{type:"text",level:"BIA",paragraphs:["Prenons un segment de 30 milles nautiques, route vraie 080\xB0, avec une d\xE9clinaison locale de 2\xB0 Ouest. La route magn\xE9tique devient 082\xB0 (on ajoute la d\xE9clinaison Ouest). S'il n'y avait pas de vent, ce serait directement le cap \xE0 suivre."]},{type:"text",level:"ATPL",heading:"En ajoutant le vent",paragraphs:["Avec un vent de 040\xB0 pour 15 kt et une vitesse propre de 100 kt, le triangle des vitesses donne une d\xE9rive d'environ 7\xB0 vers la droite \xE0 corriger, donc un cap magn\xE9tique \xE0 piloter proche de 075\xB0, pour une vitesse sol l\xE9g\xE8rement inf\xE9rieure \xE0 100 kt. Avec le facteur de base (Fb = 60 / vitesse sol), on obtient un temps de vol pour ce segment d'environ 19 minutes."]}]}]},{id:"reglementation",title:"R\xE9glementation & s\xE9curit\xE9 des vols",tagline:"Espaces a\xE9riens, r\xE8gles de l'air, licences, circulation d'a\xE9rodrome.",Icon:Ll,status:"available",lessons:[{id:"espaces-regles",title:"Espaces a\xE9riens et r\xE8gles de l'air",summary:"Les classes d'espace a\xE9rien et les grandes r\xE8gles de priorit\xE9 en vol.",blocks:[{type:"text",level:"BIA",heading:"Espaces contr\xF4l\xE9s et non contr\xF4l\xE9s",paragraphs:["L'espace a\xE9rien est d\xE9coup\xE9 en volumes o\xF9 les r\xE8gles diff\xE8rent : dans un espace contr\xF4l\xE9, un contr\xF4leur suit et parfois autorise chaque vol ; dans un espace non contr\xF4l\xE9, le pilote g\xE8re lui-m\xEAme sa s\xE9curit\xE9, en s'informant sur une fr\xE9quence d\xE9di\xE9e."]},{type:"diagram",level:"BIA",diagramId:"airspace-structure",caption:"Autour d'un a\xE9rodrome contr\xF4l\xE9 : une CTR proche du sol, une TMA plus vaste au-dessus, et de l'espace non contr\xF4l\xE9 (classe G) \xE0 l'\xE9cart."},{type:"table",level:"ATPL",headers:["Classe","Type de trafic","Service rendu au VFR"],rows:[["A","IFR uniquement","VFR interdit"],["C, D","IFR et VFR","Clairance et information de trafic"],["E","IFR et VFR","Information de trafic si possible"],["G","IFR et VFR","Information de vol, pas de clairance"]],caption:"L'espace a\xE9rien th\xE9orique va de A \xE0 G, mais la France n'utilise en pratique que les classes A, C, D, E et G : les classes B et F n'y sont pas employ\xE9es."},{type:"text",level:"ATPL",heading:"Les r\xE8gles de priorit\xE9",paragraphs:["Les r\xE8gles de priorit\xE9 en vol suivent une logique g\xE9n\xE9rale : l'a\xE9ronef le moins man\u0153uvrant est prioritaire (un planeur ou un ballon sur un avion motoris\xE9, par exemple), et un a\xE9ronef en difficult\xE9 ou en remorquage est toujours prioritaire."]},{type:"list",level:"ATPL",items:["En croisement, l'a\xE9ronef qui voit l'autre venir sur sa droite doit s'\xE9carter.","En rattrapage, l'avion rattrap\xE9 est prioritaire : celui qui rattrape s'\xE9carte, g\xE9n\xE9ralement par la droite.","En approche de face (t\xEAte-\xE0-t\xEAte), chacun s'\xE9carte par sa droite, comme sur la route.","\xC0 l'atterrissage, l'a\xE9ronef le plus bas est en g\xE9n\xE9ral prioritaire, sauf s'il en d\xE9passe un autre ou s'il coupe sa trajectoire."]}]},{id:"minimums-meteo-vfr",title:"Minimums m\xE9t\xE9orologiques VFR",summary:"Visibilit\xE9 et distance aux nuages exig\xE9es pour voler \xE0 vue.",blocks:[{type:"text",level:"BIA",paragraphs:["Voler \xE0 vue (VFR) suppose de rester suffisamment loin des nuages et de voir suffisamment loin pour rep\xE9rer les autres a\xE9ronefs et le relief \xE0 temps. Ces exigences minimales, la visibilit\xE9 et la distance aux nuages, sont plus strictes en altitude et en espace contr\xF4l\xE9 qu'\xE0 basse altitude en espace non contr\xF4l\xE9."]},{type:"table",level:"ATPL",headers:["Situation","Visibilit\xE9","Distance aux nuages"],rows:[["Au-dessus de 3 000 ft (ou 1 000 ft sol si plus haut)","5 km","1 500 m horizontalement, 300 m verticalement"],["En dessous, hors espace contr\xF4l\xE9","1 500 m","Hors des nuages, en vue du sol"]],caption:"Simplifi\xE9 : les minimums se resserrent \xE0 basse altitude en espace non contr\xF4l\xE9, mais restent plus stricts d\xE8s que l'on quitte le voisinage imm\xE9diat du sol."},{type:"text",level:"ATPL",paragraphs:["Ces minimums existent pour garantir un temps de r\xE9action suffisant en cas de croisement avec un autre trafic, et pour \xE9viter de p\xE9n\xE9trer par inadvertance dans un nuage sans qualification ni \xE9quipement pour voler sans rep\xE8res visuels ext\xE9rieurs."]}]},{id:"licences",title:"Licences et privil\xE8ges",summary:"Le BIA, l'\xE9chelle des licences de pilote, et le certificat m\xE9dical.",blocks:[{type:"text",level:"BIA",paragraphs:["Le BIA n'est pas une licence de pilote : c'est un brevet scolaire d'initiation \xE0 l'a\xE9ronautique, qui ne donne aucun privil\xE8ge de vol seul aux commandes. Il ouvre n\xE9anmoins la voie, notamment via des bourses, \xE0 des heures de vol d'initiation."]},{type:"table",level:"ATPL",headers:["Licence","Usage principal"],rows:[["LAPL","Vol priv\xE9 l\xE9ger, privil\xE8ges limit\xE9s"],["PPL","Vol priv\xE9, tous types d'appareils l\xE9gers concern\xE9s"],["CPL","Vol r\xE9mun\xE9r\xE9, premier \xE9chelon professionnel"],["ATPL","Commandant de bord en transport a\xE9rien public"]],caption:"Chaque licence sup\xE9rieure inclut globalement les privil\xE8ges de la pr\xE9c\xE9dente et y ajoute les siens."},{type:"text",level:"ATPL",heading:"Le certificat m\xE9dical",paragraphs:["Une licence de pilote s'accompagne toujours d'un certificat m\xE9dical, dont l'exigence cro\xEEt avec le niveau de la licence : une classe 2 suffit pour un LAPL ou un PPL, tandis qu'une classe 1, plus exigeante et \xE0 renouveler plus souvent, est n\xE9cessaire pour exercer en tant que pilote professionnel (CPL, ATPL)."]}]},{id:"circulation-aerodrome",title:"Circulation d'a\xE9rodrome",summary:"Le tour de piste et les grandes \xE9tapes de la circulation sur un a\xE9rodrome.",blocks:[{type:"list",level:"BIA",heading:"Les \xE9tapes du tour de piste",items:["D\xE9collage, mont\xE9e initiale dans l'axe.","Vent traversier, virage \xE0 90\xB0 apr\xE8s la piste.","Vent arri\xE8re, parall\xE8le \xE0 la piste, en sens oppos\xE9.","Base, virage vers l'axe d'approche finale.","Finale, alignement avec la piste jusqu'\xE0 l'atterrissage."]},{type:"text",level:"ATPL",heading:"A\xE9rodromes contr\xF4l\xE9s et non contr\xF4l\xE9s",paragraphs:["Sur un a\xE9rodrome contr\xF4l\xE9, le pilote suit les instructions du contr\xF4leur, avec une phras\xE9ologie pr\xE9cise et un compte-rendu obligatoire \xE0 chaque \xE9tape. Sur un a\xE9rodrome non contr\xF4l\xE9, le pilote s'auto-annonce sur la fr\xE9quence d\xE9di\xE9e et applique les r\xE8gles de circulation standard, sans autorisation formelle d'un contr\xF4leur."]},{type:"text",level:"ATPL",heading:"La nuit a\xE9ronautique et les feux de navigation",paragraphs:["La nuit a\xE9ronautique ne correspond pas exactement \xE0 la nuit ressentie : elle commence 30 minutes apr\xE8s le coucher du soleil et se termine 30 minutes avant son lever. Dans cet intervalle, un a\xE9ronef doit porter ses feux de navigation : vert \xE0 droite, rouge \xE0 gauche et blanc \xE0 l'arri\xE8re, le m\xEAme code que pour les bateaux, qui permet \xE0 un observateur de deviner l'orientation de l'appareil d'un simple coup d'\u0153il."]},{type:"text",level:"ATPL",heading:"Hauteurs minimales de survol",paragraphs:["En dehors des phases de d\xE9collage et d'atterrissage, un avion doit rester \xE0 une hauteur minimale au-dessus du sol : de l'ordre de 150 m (500 ft) en rase campagne, et bien davantage \xE0 la verticale des agglom\xE9rations et des rassemblements de personnes, avec en plus une marge horizontale par rapport \xE0 l'obstacle le plus \xE9lev\xE9 dans un rayon donn\xE9 autour de l'appareil."]}]},{id:"documents-bord",title:"Documents de bord et papiers du pilote",summary:"Ce qu'un avion et un pilote doivent avoir sur eux pour voler l\xE9galement.",blocks:[{type:"list",level:"BIA",heading:"\xC0 bord de l'avion",items:["Le certificat d'immatriculation, qui identifie l'appareil.","Le certificat de navigabilit\xE9, qui atteste qu'il est en \xE9tat de voler.","Le manuel de vol, avec les performances et limitations propres \xE0 cet appareil.","Le carnet de route, o\xF9 se consignent les vols effectu\xE9s."]},{type:"text",level:"ATPL",heading:"Pour le pilote",paragraphs:["Le pilote doit de son c\xF4t\xE9 pouvoir pr\xE9senter sa licence, son certificat m\xE9dical en cours de validit\xE9, et une pi\xE8ce d'identit\xE9. L'absence de l'un de ces documents n'emp\xEAche pas forc\xE9ment de voler dans l'instant, mais expose \xE0 des sanctions et complique la gestion d'un incident ou d'un contr\xF4le au sol."]}]},{id:"certification-aeronefs",title:"La certification des a\xE9ronefs",summary:"Pourquoi un avion de s\xE9rie passe par un long processus avant d'\xEAtre autoris\xE9 \xE0 voler.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant qu'un nouveau mod\xE8le d'avion ne puisse transporter qui que ce soit, le constructeur doit d\xE9montrer aux autorit\xE9s, par le calcul puis par des essais en vol r\xE9els, qu'il respecte un ensemble de normes de s\xE9curit\xE9 strictes : r\xE9sistance structurale, performances minimales, comportement en cas de panne."]},{type:"text",level:"ATPL",heading:"Type-certificat et d\xE9clinaisons",paragraphs:["Cette d\xE9monstration aboutit \xE0 un certificat de type, propre \xE0 un mod\xE8le d'avion donn\xE9. Chaque exemplaire produit ensuite re\xE7oit son propre certificat de navigabilit\xE9 individuel, qui atteste sa conformit\xE9 \xE0 ce type certifi\xE9 et doit \xEAtre maintenu dans le temps par l'entretien. Une modification non approuv\xE9e de l'appareil peut faire perdre cette conformit\xE9, m\xEAme pour une intervention apparemment mineure."]}]},{id:"services-circulation-aerienne",title:"Les services de la circulation a\xE9rienne",summary:"Contr\xF4le, information de vol, alerte : trois services rendus par des organismes diff\xE9rents.",blocks:[{type:"text",level:"BIA",paragraphs:["Plusieurs organismes au sol peuvent assister un pilote en vol, selon l'espace travers\xE9 : une tour de contr\xF4le (TWR) pour les abords imm\xE9diats d'un a\xE9rodrome, une approche (APP) pour les arriv\xE9es et d\xE9parts plus larges, ou un centre de contr\xF4le en route (ACC) pour la croisi\xE8re en espace contr\xF4l\xE9."]},{type:"text",level:"ATPL",heading:"AFIS et service d'alerte",paragraphs:["Sur les terrains non contr\xF4l\xE9s mais \xE9quip\xE9s, un agent AFIS (Aerodrome Flight Information Service) fournit des informations utiles sans pouvoir donner d'instruction contraignante comme le ferait un contr\xF4leur. Quel que soit l'organisme, un service d'alerte veille en toile de fond : si un plan de vol d\xE9pos\xE9 n'est pas cl\xF4tur\xE9 dans le d\xE9lai pr\xE9vu, les proc\xE9dures de recherche et de sauvetage se d\xE9clenchent automatiquement."]}]},{id:"information-aeronautique",title:"L'information a\xE9ronautique",summary:"NOTAM et AIP : les publications qui tiennent les pilotes inform\xE9s.",blocks:[{type:"text",level:"BIA",paragraphs:["L'AIP (Aeronautical Information Publication) rassemble, pays par pays, toutes les informations permanentes utiles \xE0 la navigation : cartes, fr\xE9quences, proc\xE9dures, caract\xE9ristiques de chaque a\xE9rodrome. Les NOTAM, d\xE9j\xE0 vus, compl\xE8tent cette base par les informations temporaires ou urgentes qui ne peuvent attendre la prochaine mise \xE0 jour de l'AIP."]},{type:"text",level:"ATPL",heading:"O\xF9 trouver l'information",paragraphs:["En France, le Service de l'Information A\xE9ronautique publie ces documents, consultables en ligne avant chaque vol. Les NOTAM suivent un code structur\xE9 par cat\xE9gories (balisage, obstacles, espaces a\xE9riens, proc\xE9dures), ce qui permet, une fois le code appris, de filtrer rapidement ceux qui concernent r\xE9ellement le vol pr\xE9vu parmi le volume parfois important de notices actives sur une route donn\xE9e."]}]},{id:"assurances-responsabilites",title:"Assurances et responsabilit\xE9s",summary:"Ce que couvre, ou non, l'assurance d'un a\xE9ronef.",blocks:[{type:"text",level:"BIA",paragraphs:["Comme pour un v\xE9hicule routier, une assurance responsabilit\xE9 civile est obligatoire pour tout a\xE9ronef en vol, afin de couvrir les dommages caus\xE9s \xE0 des tiers, au sol ou en l'air. Des garanties compl\xE9mentaires, facultatives, peuvent couvrir l'appareil lui-m\xEAme ou les occupants."]},{type:"text",level:"ATPL",heading:"Le commandant de bord, responsable en dernier ressort",paragraphs:["Quel que soit le nombre de personnes \xE0 bord ou les automatismes disponibles, la r\xE9glementation fait du commandant de bord le seul responsable final de la conduite du vol et de la s\xE9curit\xE9 des personnes transport\xE9es. Cette responsabilit\xE9 ne se d\xE9l\xE8gue pas, pas m\xEAme \xE0 un contr\xF4leur a\xE9rien, dont les instructions restent soumises au jugement du pilote si leur application compromettait la s\xE9curit\xE9 du vol."]}]},{id:"aeronefs-sans-pilote",title:"R\xE9glementation des a\xE9ronefs sans pilote",summary:"Pourquoi les drones partagent le m\xEAme ciel, et les m\xEAmes grands principes de s\xE9curit\xE9.",blocks:[{type:"text",level:"BIA",paragraphs:["Les drones, ou a\xE9ronefs t\xE9l\xE9pilot\xE9s, partagent le m\xEAme espace a\xE9rien que l'aviation habit\xE9e, et sont donc soumis eux aussi \xE0 des r\xE8gles : cat\xE9gories selon la masse et le risque, limites de hauteur, zones interdites ou r\xE9glement\xE9es, formation du t\xE9l\xE9pilote au-del\xE0 d'un usage strictement r\xE9cr\xE9atif."]},{type:"text",level:"ATPL",heading:"Un principe commun : ne jamais survoler sans raison",paragraphs:["Le principe g\xE9n\xE9ral reste proche de celui de l'aviation habit\xE9e, transpos\xE9 \xE0 l'absence d'occupants \xE0 bord : limiter le survol de personnes non impliqu\xE9es dans le vol, garder l'appareil en vue ou sous contr\xF4le fiable, et rester \xE0 l'\xE9cart des a\xE9rodromes et de leurs trajectoires d'approche, sauf autorisation sp\xE9cifique. C'est aussi pour cette cohabitation que les pilotes d'avions et de drones doivent apprendre \xE0 se signaler et \xE0 se d\xE9tecter mutuellement."]}]}]},{id:"facteurs-humains",title:"Facteurs humains & performance",tagline:"Physiologie du vol, prise de d\xE9cision, gestion de l'erreur humaine.",Icon:Sl,status:"available",lessons:[{id:"physiologie-vol",title:"Physiologie du vol",summary:"Comment l'altitude affecte le corps, et l'hypoxie en particulier.",blocks:[{type:"text",level:"BIA",paragraphs:["En altitude, la pression atmosph\xE9rique diminue, donc la quantit\xE9 d'oxyg\xE8ne disponible \xE0 chaque respiration diminue aussi, m\xEAme si la proportion d'oxyg\xE8ne dans l'air reste la m\xEAme. Le corps peut en souffrir sans m\xEAme que le pilote s'en rende compte : c'est l'hypoxie."]},{type:"text",level:"ATPL",heading:"Reconna\xEEtre l'hypoxie",paragraphs:["Les premiers signes d'hypoxie sont trompeurs : euphorie, sensation de bien-\xEAtre, d\xE9gradation du jugement, avant des sympt\xF4mes plus francs comme des troubles visuels ou une confusion. C'est justement cette alt\xE9ration pr\xE9coce du jugement qui la rend dangereuse, et qui justifie l'usage d'oxyg\xE8ne compl\xE9mentaire au-del\xE0 de certaines altitudes r\xE9glementaires.","Le froid et la d\xE9shydratation, plus fr\xE9quents en vol qu'au sol, d\xE9gradent \xE9galement les performances et la vigilance, et s'ajoutent souvent aux effets de l'altitude."]},{type:"diagram",level:"ATPL",diagramId:"tuc-chart",caption:"Le temps de conscience utile (TUC) : le temps dont dispose un pilote pour agir efficacement apr\xE8s une perte de pressurisation, avant que l'hypoxie ne l'en emp\xEAche. Valeurs indicatives, elles varient selon les individus."},{type:"text",level:"ATPL",heading:"Pourquoi cette chute si rapide",paragraphs:["Cette chute tr\xE8s rapide au-del\xE0 de 30 000 \xE0 35 000 ft explique pourquoi les \xE9quipages de ligne s'entra\xEEnent \xE0 enfiler un masque \xE0 oxyg\xE8ne en quelques secondes en cas de d\xE9pressurisation soudaine : au-dessus de ces altitudes, le temps de conscience utile se compte en dizaines de secondes, pas en minutes."]},{type:"table",level:"BIA",headers:["Altitude","Effets ressentis"],rows:[["Environ 12 000 ft","Fatigue, l\xE9ger mal de t\xEAte sur vol prolong\xE9"],["Environ 18 000 ft","Mal de t\xEAte, somnolence, troubles visuels, coordination d\xE9grad\xE9e"],["Environ 22 000 ft","Palpitations, hyperventilation, risque de perte de connaissance"],["Environ 25 000 ft","Convulsions possibles, perte de connaissance rapide"]],caption:"Seuils indicatifs : la sensibilit\xE9 \xE0 l'hypoxie varie beaucoup d'une personne \xE0 l'autre, et avec la fatigue, le froid ou le tabac."},{type:"text",level:"ATPL",heading:"Ce que dit la r\xE9glementation sur l'oxyg\xE8ne",paragraphs:["La r\xE9glementation impose de l'oxyg\xE8ne compl\xE9mentaire au-del\xE0 de certains seuils : pour le pilote, d\xE8s que le vol d\xE9passe une trentaine de minutes au-dessus d'environ 10 000 ft (FL100), puis en continu au-dessus d'environ 13 000 ft (FL130) ; pour l'ensemble des occupants, \xE9galement au-dessus de ce dernier seuil. Ces valeurs pr\xE9cises varient selon la r\xE9glementation applicable, mais l'ordre de grandeur reste le m\xEAme."]},{type:"table",level:"ATPL",headers:["Facteur de charge","Effet ressenti"],rows:[["+2 g","Sensation d'\xEAtre plaqu\xE9 au si\xE8ge"],["+3 \xE0 +4 g","Vision p\xE9riph\xE9rique qui se r\xE9duit (voile gris)"],["+5 g et plus","Perte de vision puis de connaissance (voile noir)"],["N\xE9gatif (-2 \xE0 -3 g)","Afflux de sang vers la t\xEAte (voile rouge)"]],caption:"Le facteur de charge vu en m\xE9canique du vol a aussi un effet direct sur le corps : le sang a du mal \xE0 irriguer le cerveau au-del\xE0 d'un certain seuil, positif comme n\xE9gatif."}]},{id:"perception-desorientation",title:"Perception et d\xE9sorientation",summary:"Comment le corps peut se tromper sans rep\xE8res visuels fiables.",blocks:[{type:"text",level:"BIA",paragraphs:["Sans rep\xE8re visuel ext\xE9rieur fiable, par exemple dans les nuages ou de nuit au-dessus d'une zone sans lumi\xE8re, l'oreille interne peut donner des sensations d'inclinaison ou de virage totalement fausses. C'est pourquoi le vol sans visibilit\xE9 ext\xE9rieure exige de se fier aux instruments plut\xF4t qu'aux sensations."]},{type:"text",level:"ATPL",heading:"Quelques illusions classiques",paragraphs:["Une illusion vestibulaire fr\xE9quente est la fausse sensation de sortie de virage apr\xE8s un virage prolong\xE9 \xE0 vitesse constante : l'oreille interne s'habitue au mouvement et signale, \xE0 tort, un retour au vol droit quand le virage continue en r\xE9alit\xE9, ou l'inverse \xE0 la sortie. D'autres illusions sont visuelles : une piste en pente peut donner une fausse impression de hauteur en approche.","L'illusion somatogravique, ressentie lors d'une forte acc\xE9l\xE9ration (au d\xE9collage, par exemple), donne la fausse sensation que le nez se cabre, ce qui peut pousser un pilote \xE0 pousser sur le manche sans raison r\xE9elle. C'est cette famille d'illusions qui rend le vol IFR exigeant : il faut apprendre \xE0 faire consciemment confiance aux instruments plut\xF4t qu'\xE0 ses sensations."]}]},{id:"stress-charge-travail",title:"Stress, fatigue et charge de travail",summary:"Comment la fatigue et une charge de travail excessive d\xE9gradent la performance.",blocks:[{type:"text",level:"BIA",paragraphs:["Piloter demande de faire plusieurs choses \xE0 la fois : surveiller les instruments, naviguer, communiquer, d\xE9cider. Quand ces t\xE2ches s'accumulent au-del\xE0 de ce qu'un pilote peut g\xE9rer sereinement, sa performance se d\xE9grade, souvent avant qu'il n'en ait pleinement conscience."]},{type:"text",level:"ATPL",heading:"Un stress mod\xE9r\xE9, utile jusqu'\xE0 un certain point",paragraphs:["Un minimum de stress am\xE9liore la vigilance et la performance ; au-del\xE0 d'un certain seuil, propre \xE0 chaque personne et \xE0 chaque situation, il devient au contraire contre-productif, avec un r\xE9tr\xE9cissement du champ d'attention et une tendance \xE0 se focaliser sur un seul probl\xE8me au d\xE9triment des autres. Reconna\xEEtre ses propres signes de surcharge fait partie de la formation, tout comme des techniques simples pour l'all\xE9ger : prioriser, d\xE9l\xE9guer quand c'est possible, ou simplement ralentir le rythme des actions."]},{type:"text",level:"ATPL",heading:"La fatigue",paragraphs:["La fatigue, qu'elle soit due au manque de sommeil, \xE0 un vol long ou \xE0 un d\xE9calage horaire, d\xE9grade le jugement de fa\xE7on comparable \xE0 l'alcool \xE0 partir d'un certain niveau, tout en \xE9tant plus difficile \xE0 s'auto-\xE9valuer. C'est pourquoi la r\xE9glementation encadre les temps de vol et de repos des \xE9quipages professionnels, et pourquoi un pilote priv\xE9 devrait appliquer la m\xEAme prudence : renoncer \xE0 un vol par fatigue n'a rien d'anodin."]}]},{id:"decision-erreurs",title:"Prise de d\xE9cision et gestion des erreurs",summary:"Pourquoi un accident r\xE9sulte rarement d'une seule cause isol\xE9e.",blocks:[{type:"text",level:"BIA",paragraphs:["L'erreur humaine fait partie du pilotage, comme de toute activit\xE9. L'enjeu n'est pas de ne jamais se tromper, mais de rep\xE9rer ses erreurs suffisamment t\xF4t et de savoir les corriger ou renoncer \xE0 temps."]},{type:"text",level:"ATPL",heading:"La cha\xEEne d'erreurs",paragraphs:["L'analyse des accidents montre qu'ils r\xE9sultent presque toujours d'un encha\xEEnement de plusieurs d\xE9cisions ou erreurs, chacune anodine prise isol\xE9ment, plut\xF4t que d'une cause unique. Interrompre cette cha\xEEne \xE0 n'importe quel maillon, par exemple en renon\xE7ant \xE0 un vol ou en faisant demi-tour, suffit \xE0 \xE9viter l'accident.","Certains pi\xE8ges de d\xE9cision reviennent souvent, comme le get-there-itis, la tentation de continuer un vol \xE0 tout prix pour arriver \xE0 destination malgr\xE9 des conditions qui se d\xE9gradent."]},{type:"text",level:"ATPL",heading:"Une r\xE9alit\xE9 statistique",paragraphs:["En aviation l\xE9g\xE8re, l'immense majorit\xE9 des accidents impliquent un facteur humain \xE0 un moment ou un autre de la cha\xEEne, bien davantage qu'une simple d\xE9faillance technique de l'avion. C'est pr\xE9cis\xE9ment pour cette raison que la formation aux facteurs humains occupe une place croissante dans les programmes, aux c\xF4t\xE9s du pilotage pur et de la technique.","La r\xE9glementation fixe d'ailleurs une limite l\xE9gale d'alcool\xE9mie pour piloter nettement plus stricte que sur la route : au-del\xE0 d'un taux tr\xE8s faible, voler est interdit, et la meilleure marge de s\xE9curit\xE9 reste simplement de ne jamais m\xE9langer les deux."]}]},{id:"vision-audition",title:"Vision et audition en vol",summary:"Pourquoi l'\u0153il humain n'est pas id\xE9alement con\xE7u pour rep\xE9rer un autre avion.",blocks:[{type:"text",level:"BIA",paragraphs:["L'\u0153il distingue beaucoup mieux ce qui bouge par rapport \xE0 un fond que ce qui reste immobile dans le champ de vision. Or un avion sur une trajectoire de collision reste pr\xE9cis\xE9ment fixe dans le champ visuel, sans mouvement apparent qui attirerait l'attention, jusqu'\xE0 grossir brutalement dans les derni\xE8res secondes."]},{type:"text",level:"ATPL",heading:"Balayer le ciel m\xE9thodiquement",paragraphs:["C'est pourquoi la technique recommand\xE9e consiste \xE0 balayer le ciel par petits secteurs successifs, en marquant une pause sur chacun plut\xF4t qu'en promenant contin\xFBment le regard, ce qui laisse \xE0 l'\u0153il le temps de d\xE9tecter un mouvement relatif. Le bruit ambiant du moteur et de la cabine masque par ailleurs une partie des sons ext\xE9rieurs, ce qui limite la d\xE9tection auditive d'un trafic proche, contrairement \xE0 ce qu'on pourrait imaginer."]}]},{id:"mal-air-adaptation",title:"Le mal de l'air et l'adaptation",summary:"D'o\xF9 vient le mal des transports, et comment l'organisme s'habitue au vol.",blocks:[{type:"text",level:"BIA",paragraphs:["Le mal de l'air provient d'un conflit entre ce que l'oreille interne ressent (le mouvement r\xE9el) et ce que les yeux voient, en particulier \xE0 l'int\xE9rieur d'un cockpit o\xF9 les rep\xE8res visuels ext\xE9rieurs se font rares, par exemple en virage prolong\xE9 ou par mauvaise visibilit\xE9."]},{type:"text",level:"ATPL",heading:"Un ph\xE9nom\xE8ne qui s'att\xE9nue avec l'exp\xE9rience",paragraphs:["La sensibilit\xE9 au mal de l'air diminue g\xE9n\xE9ralement avec l'entra\xEEnement, \xE0 mesure que le cerveau apprend \xE0 recalibrer ces informations contradictoires, m\xEAme si certaines personnes y restent plus sujettes que d'autres toute leur vie. Limiter les mouvements de t\xEAte, regarder un point fixe \xE0 l'horizon et \xE9viter de piloter l'estomac vide ou trop charg\xE9 r\xE9duisent les sympt\xF4mes en attendant cette accoutumance."]}]},{id:"travail-equipage-crm",title:"Travail en \xE9quipage (CRM)",summary:"Pourquoi bien communiquer entre pilotes compte autant que bien piloter.",blocks:[{type:"text",level:"BIA",paragraphs:["D\xE8s qu'un avion est pilot\xE9 \xE0 plusieurs, la fa\xE7on dont l'\xE9quipage communique et se r\xE9partit les t\xE2ches devient un facteur de s\xE9curit\xE9 \xE0 part enti\xE8re : plusieurs accidents historiques se sont produits alors que l'avion fonctionnait parfaitement, simplement parce qu'une information cruciale n'avait pas circul\xE9 entre les membres d'\xE9quipage."]},{type:"text",level:"ATPL",heading:"La gestion des ressources en \xE9quipage",paragraphs:["Le CRM (Crew Resource Management) regroupe les pratiques qui structurent ce travail collectif : r\xE9partition claire des r\xF4les, annonces standardis\xE9es \xE0 chaque \xE9tape du vol, et surtout la capacit\xE9 pour n'importe quel membre d'\xE9quipage, m\xEAme le plus junior, de faire remonter une inqui\xE9tude sans h\xE9siter face \xE0 une hi\xE9rarchie. Cette derni\xE8re dimension, la gestion de l'autorit\xE9, a fait l'objet d'une attention particuli\xE8re apr\xE8s plusieurs accidents o\xF9 un subordonn\xE9 avait remarqu\xE9 un probl\xE8me sans oser s'imposer."]}]},{id:"checklists-securite",title:"La check-list, outil de s\xE9curit\xE9",summary:"Pourquoi m\xEAme un pilote exp\xE9riment\xE9 suit une liste \xE9crite plut\xF4t que sa m\xE9moire.",blocks:[{type:"text",level:"BIA",paragraphs:["La check-list garantit qu'une s\xE9rie d'actions critiques est bien r\xE9alis\xE9e dans l'ordre, sans d\xE9pendre uniquement de la m\xE9moire d'un pilote, aussi exp\xE9riment\xE9 soit-il. Elle se lit g\xE9n\xE9ralement \xE0 voix haute, point par point, avec une v\xE9rification physique de chaque \xE9l\xE9ment plut\xF4t qu'une r\xE9citation par c\u0153ur."]},{type:"text",level:"ATPL",heading:"\xAB Faire-v\xE9rifier \xBB plut\xF4t que \xAB lire-faire \xBB",paragraphs:["Sur les actions les plus critiques, la m\xE9thode \xAB faire-v\xE9rifier \xBB (l'action est effectu\xE9e de m\xE9moire puis contr\xF4l\xE9e sur la liste) se r\xE9v\xE8le souvent plus fiable que le simple \xAB lire-faire \xBB (lire l'instruction puis l'ex\xE9cuter), car elle sollicite deux fois l'attention du pilote sur chaque point. Sauter un \xE9l\xE9ment de check-list, ou la r\xE9citer sans vraiment regarder ce qu'elle d\xE9crit, figure parmi les causes d'accident les plus document\xE9es, malgr\xE9 la simplicit\xE9 apparente de l'outil."]}]},{id:"automatisation-pieges",title:"L'automatisation et ses pi\xE8ges",summary:"Ce que le pilote automatique change dans la vigilance du pilote.",blocks:[{type:"text",level:"BIA",paragraphs:["L'automatisation r\xE9duit la charge de travail physique, mais d\xE9place le r\xF4le du pilote vers la surveillance : il doit comprendre ce que fait le syst\xE8me, v\xE9rifier qu'il fait bien ce qui est attendu, et \xEAtre pr\xEAt \xE0 reprendre la main si besoin, ce qui demande une vigilance diff\xE9rente, parfois plus difficile \xE0 maintenir qu'un pilotage actif."]},{type:"text",level:"ATPL",heading:"La complaisance automatique",paragraphs:["Ce ph\xE9nom\xE8ne, la complaisance automatique, d\xE9signe une confiance excessive envers les syst\xE8mes, qui peut faire baisser la garde face \xE0 une anomalie. Elle s'accompagne parfois d'une perte progressive d'aisance au pilotage manuel, faute de pratique r\xE9guli\xE8re, un sujet suffisamment identifi\xE9 pour que certaines compagnies imposent d\xE9sormais des exercices p\xE9riodiques de pilotage manuel, pr\xE9cis\xE9ment pour pr\xE9server cette comp\xE9tence."]}]},{id:"retour-experience",title:"Apprendre de ses erreurs : le retour d'exp\xE9rience",summary:"Comment la s\xE9curit\xE9 a\xE9rienne progresse en analysant syst\xE9matiquement incidents et accidents.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque incident, m\xEAme mineur, et chaque accident font l'objet d'une analyse par des organismes d\xE9di\xE9s, ind\xE9pendants des compagnies et des constructeurs, dans le seul but de comprendre ce qui s'est pass\xE9 et d'\xE9viter que cela se reproduise, jamais de d\xE9signer un coupable."]},{type:"text",level:"ATPL",heading:"Le compte-rendu volontaire",paragraphs:["Au-del\xE0 des enqu\xEAtes officielles apr\xE8s accident, de nombreux syst\xE8mes encouragent les pilotes \xE0 signaler volontairement leurs propres erreurs ou quasi-incidents, souvent de fa\xE7on confidentielle ou anonymis\xE9e, pour alimenter une base de retour d'exp\xE9rience collective. Cette culture, qui valorise le signalement plut\xF4t que la sanction, part du principe qu'une erreur reconnue et analys\xE9e profite \xE0 tous, alors qu'une erreur cach\xE9e se reproduira t\xF4t ou tard, chez quelqu'un d'autre."]}]}]},{id:"histoire",title:"Histoire de l'a\xE9ronautique et de l'espace",tagline:"Des premiers planeurs \xE0 la conqu\xEAte spatiale.",Icon:an,status:"available",lessons:[{id:"precurseurs",title:"Les pr\xE9curseurs et les premiers vols motoris\xE9s",summary:"De Cl\xE9ment Ader aux fr\xE8res Wright, puis la travers\xE9e de la Manche par Bl\xE9riot.",blocks:[{type:"text",level:"BIA",paragraphs:["Apr\xE8s des si\xE8cles de tentatives et les premiers vols en ballon puis en planeur au XIXe si\xE8cle, notamment ceux d'Otto Lilienthal, le Fran\xE7ais Cl\xE9ment Ader fait d\xE9coller son \xC9ole de quelques m\xE8tres en 1890, sans toutefois de vol r\xE9ellement contr\xF4l\xE9.","Le 17 d\xE9cembre 1903, les fr\xE8res Wright r\xE9alisent aux \xC9tats-Unis le premier vol motoris\xE9, contr\xF4l\xE9 et soutenu de l'histoire, \xE0 bord du Flyer, au-dessus des dunes de Kitty Hawk. Quelques ann\xE9es plus tard, en 1909, Louis Bl\xE9riot devient le premier \xE0 traverser la Manche en avion, \xE0 bord de son Bl\xE9riot XI, un exploit qui marque les esprits en Europe et lance v\xE9ritablement l'aviation comme secteur industriel."]}]},{id:"guerres-jet",title:"Des guerres mondiales \xE0 l'\xE8re du jet",summary:"Comment les deux conflits mondiaux acc\xE9l\xE8rent les progr\xE8s techniques, jusqu'au premier avion \xE0 r\xE9action.",blocks:[{type:"text",level:"BIA",paragraphs:["La Premi\xE8re Guerre mondiale transforme l'avion, d'abord simple outil de reconnaissance, en v\xE9ritable arme de combat, et acc\xE9l\xE8re consid\xE9rablement les progr\xE8s techniques. L'entre-deux-guerres voit ensuite le passage progressif du bois et de la toile aux structures m\xE9talliques, ainsi que les d\xE9buts de l'aviation commerciale, avec des figures comme Mermoz et Saint-Exup\xE9ry sur les lignes de l'A\xE9ropostale.","La Seconde Guerre mondiale pousse plus loin encore ces progr\xE8s, et voit appara\xEEtre les premiers avions \xE0 r\xE9action op\xE9rationnels, comme le Messerschmitt Me 262 allemand. En 1947, l'Am\xE9ricain Chuck Yeager devient le premier pilote \xE0 franchir le mur du son en vol contr\xF4l\xE9 et en palier, \xE0 bord du Bell X-1, ouvrant l'\xE8re du vol supersonique."]}]},{id:"aviation-moderne",title:"L'aviation civile et le transport a\xE9rien moderne",summary:"Du premier jet commercial au gros-porteur, jusqu'au Concorde.",blocks:[{type:"text",level:"BIA",paragraphs:["L'apr\xE8s-guerre voit le transport a\xE9rien civil se d\xE9velopper rapidement, d'abord avec des avions \xE0 h\xE9lices puis, \xE0 partir des ann\xE9es 1950, avec les premiers avions de ligne \xE0 r\xE9action, qui r\xE9duisent consid\xE9rablement les temps de trajet. Le Boeing 747, entr\xE9 en service en 1970, symbolise l'arriv\xE9e du transport a\xE9rien de masse, avec une capacit\xE9 largement sup\xE9rieure aux avions pr\xE9c\xE9dents.","Le Concorde, mis en service en 1976 par la France et le Royaume-Uni, reste \xE0 ce jour le seul avion de ligne supersonique \xE0 avoir \xE9t\xE9 exploit\xE9 commercialement, avant son retrait en 2003 pour des raisons \xE9conomiques et de s\xE9curit\xE9 apr\xE8s un accident."]}]},{id:"conquete-spatiale",title:"La conqu\xEAte spatiale",summary:"De Spoutnik \xE0 la Station spatiale internationale, en passant par Gagarine et Apollo 11.",blocks:[{type:"text",level:"BIA",paragraphs:["Le 4 octobre 1957, l'URSS met en orbite Spoutnik 1, premier satellite artificiel, qui marque le d\xE9but de l'\xE8re spatiale et de la course entre les deux grandes puissances de la guerre froide. Youri Gagarine devient le premier homme dans l'espace le 12 avril 1961, \xE0 bord de Vostok 1.","Le 21 juillet 1969, Neil Armstrong devient le premier homme \xE0 marcher sur la Lune, lors de la mission Apollo 11. Depuis, la conqu\xEAte spatiale s'est poursuivie avec les stations spatiales, dont l'actuelle Station spatiale internationale, occup\xE9e en permanence depuis 2000, et plus r\xE9cemment l'essor des lanceurs r\xE9utilisables, qui a nettement r\xE9duit le co\xFBt d'acc\xE8s \xE0 l'espace."]}]},{id:"pionnieres-aviation",title:"Les pionni\xE8res de l'aviation",summary:"Des premi\xE8res licences f\xE9minines aux records de vitesse.",blocks:[{type:"text",level:"BIA",paragraphs:["La Fran\xE7aise Raymonde de Laroche devient en 1910 la premi\xE8re femme titulaire d'un brevet de pilote au monde. Quelques ann\xE9es plus tard, H\xE9l\xE8ne Boucher encha\xEEne les records de vitesse dans les ann\xE9es 1930, avant de mourir en plein entra\xEEnement en 1934, \xE0 seulement 26 ans."]},{type:"text",level:"BIA",heading:"Amelia Earhart et Jacqueline Auriol",paragraphs:["L'Am\xE9ricaine Amelia Earhart devient en 1932 la premi\xE8re femme \xE0 traverser l'Atlantique en solitaire, avant de dispara\xEEtre en 1937 en tentant un tour du monde. Plus tard, la Fran\xE7aise Jacqueline Auriol, pilote d'essai, d\xE9tient \xE0 plusieurs reprises le record de vitesse f\xE9minin dans les ann\xE9es 1950, contribuant \xE0 ouvrir le m\xE9tier de pilote d'essai aux femmes."]}]},{id:"aeropostale-raids",title:"L'A\xE9ropostale et les grands raids",summary:"Comment des lignes postales ont ouvert la voie \xE0 l'aviation commerciale longue distance.",blocks:[{type:"text",level:"BIA",paragraphs:["Dans les ann\xE9es 1920, la compagnie fond\xE9e par Pierre-Georges Lat\xE9co\xE8re, bient\xF4t surnomm\xE9e l'A\xE9ropostale, relie la France \xE0 l'Afrique de l'Ouest puis \xE0 l'Am\xE9rique du Sud par avion, pour acheminer le courrier bien plus vite que par bateau. Ces lignes, pionni\xE8res et dangereuses, forment toute une g\xE9n\xE9ration d'aviateurs."]},{type:"text",level:"BIA",heading:"Mermoz et Saint-Exup\xE9ry",paragraphs:["Jean Mermoz r\xE9alise en 1930 la premi\xE8re travers\xE9e de l'Atlantique Sud par avion sur cette ligne postale, avant de dispara\xEEtre en vol au-dessus du m\xEAme oc\xE9an en 1936. Antoine de Saint-Exup\xE9ry, lui aussi pilote de l'A\xE9ropostale, tire de cette exp\xE9rience ses r\xE9cits \xAB Vol de nuit \xBB et \xAB Terre des hommes \xBB, qui ont fait conna\xEEtre cette aventure bien au-del\xE0 du monde a\xE9ronautique."]}]},{id:"aviation-militaire-histoire",title:"L'aviation militaire, des biplans aux avions furtifs",summary:"De l'observation a\xE9rienne de 1914 \xE0 la furtivit\xE9 radar contemporaine.",blocks:[{type:"text",level:"BIA",paragraphs:["Utilis\xE9 d'abord pour observer les positions ennemies lors de la Premi\xE8re Guerre mondiale, l'avion devient rapidement une arme \xE0 part enti\xE8re, avec l'apparition des chasseurs et des as, des pilotes qui accumulent de nombreuses victoires a\xE9riennes en combat singulier."]},{type:"text",level:"ATPL",heading:"Vers la furtivit\xE9",paragraphs:["Apr\xE8s l'arriv\xE9e du jet dans les ann\xE9es 1940, la course technologique militaire se poursuit vers la vitesse puis, \xE0 partir des ann\xE9es 1980, vers la furtivit\xE9 : des formes \xE9tudi\xE9es pour r\xE9fl\xE9chir le moins possible les ondes radar, associ\xE9es \xE0 des mat\xE9riaux absorbants, rendent certains avions militaires beaucoup plus difficiles \xE0 d\xE9tecter qu'un avion de forme conventionnelle."]}]},{id:"helicopteres-histoire",title:"H\xE9licopt\xE8res et aviation verticale, une histoire",summary:"Des premiers essais h\xE9sitants \xE0 l'h\xE9licopt\xE8re pratique de Sikorsky.",blocks:[{type:"text",level:"BIA",paragraphs:["D\xE8s 1907, le Fran\xE7ais Paul Cornu r\xE9alise avec son appareil un tr\xE8s bref d\xE9collage vertical, \xE0 peine contr\xF4lable et retenu par des perches : un jalon historique, mais encore loin d'un v\xE9hicule pratique."]},{type:"text",level:"BIA",heading:"Sikorsky et le premier h\xE9licopt\xE8re pratique",paragraphs:["Il faut attendre 1939 pour qu'Igor Sikorsky, ing\xE9nieur russe \xE9migr\xE9 aux \xC9tats-Unis, fasse voler le VS-300, le premier h\xE9licopt\xE8re r\xE9ellement maniable, avec la configuration devenue classique : un grand rotor principal et un petit rotor de queue. Ses d\xE9veloppements ult\xE9rieurs sont produits en s\xE9rie d\xE8s la Seconde Guerre mondiale, lan\xE7ant v\xE9ritablement l'\xE8re de l'h\xE9licopt\xE8re."]}]},{id:"exploration-spatiale-recente",title:"L'exploration spatiale r\xE9cente",summary:"Rovers martiens et essor du vol spatial commercial r\xE9utilisable.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 de la Lune, l'exploration s'est tourn\xE9e vers Mars, avec plusieurs g\xE9n\xE9rations de rovers robotis\xE9s envoy\xE9s explorer sa surface \xE0 la recherche d'indices sur son pass\xE9, en particulier d'\xE9ventuelles traces d'eau liquide."]},{type:"text",level:"ATPL",heading:"Le retour des lanceurs r\xE9utilisables",paragraphs:["Depuis le milieu des ann\xE9es 2010, des entreprises priv\xE9es ont d\xE9montr\xE9 la possibilit\xE9 de r\xE9cup\xE9rer et de r\xE9utiliser le premier \xE9tage d'une fus\xE9e, qui se pose verticalement apr\xE8s avoir largu\xE9 sa charge utile, plut\xF4t que d'\xEAtre perdu \xE0 chaque lancement comme c'\xE9tait syst\xE9matiquement le cas auparavant. Cette r\xE9utilisabilit\xE9 a fait chuter le co\xFBt d'acc\xE8s \xE0 l'espace et ouvert la voie \xE0 des vols habit\xE9s op\xE9r\xE9s par des soci\xE9t\xE9s priv\xE9es plut\xF4t que par les seules agences gouvernementales."]}]},{id:"vol-a-voile-histoire",title:"Le vol \xE0 voile et l'aviation l\xE9g\xE8re, une histoire",summary:"Du planeur de loisir \xE0 l'aviation l\xE9g\xE8re et sportive d'aujourd'hui.",blocks:[{type:"text",level:"BIA",paragraphs:["Apr\xE8s les premiers planeurs exp\xE9rimentaux du XIXe si\xE8cle, le vol \xE0 voile se d\xE9veloppe surtout dans l'entre-deux-guerres en Allemagne, o\xF9 les restrictions impos\xE9es \xE0 l'aviation motoris\xE9e apr\xE8s la Premi\xE8re Guerre mondiale poussent de nombreux pilotes vers le vol sans moteur : c'est l\xE0 que se mettent au point les techniques d'exploitation des ascendances thermiques encore utilis\xE9es aujourd'hui."]},{type:"text",level:"BIA",heading:"L'essor de l'aviation l\xE9g\xE8re",paragraphs:["Parall\xE8lement, l'aviation l\xE9g\xE8re motoris\xE9e se d\xE9mocratise apr\xE8s la Seconde Guerre mondiale, avec des avions de construction simplifi\xE9e accessibles aux particuliers et aux clubs. Cette d\xE9mocratisation se poursuit aujourd'hui avec les ULM, plus l\xE9gers et moins co\xFBteux, qui ouvrent le vol \xE0 un public toujours plus large, dans la continuit\xE9 de cette histoire."]}]}]},{id:"comm",title:"Communications",tagline:"Phras\xE9ologie radio normalis\xE9e, proc\xE9dures VFR et IFR.",Icon:xl,status:"available",lessons:[{id:"principes-phraseologie",title:"Principes de la phras\xE9ologie",summary:"L'alphabet OACI et la structure d'un message radio.",blocks:[{type:"text",level:"BIA",paragraphs:["La phras\xE9ologie a\xE9ronautique normalise les \xE9changes radio pour qu'ils restent compr\xE9hensibles malgr\xE9 la qualit\xE9 parfois m\xE9diocre des liaisons et les diff\xE9rences de langue. Elle repose notamment sur l'alphabet phon\xE9tique OACI, qui \xE9p\xE8le chaque lettre avec un mot d\xE9di\xE9 pour \xE9viter toute confusion."]},{type:"list",level:"BIA",heading:"L'alphabet phon\xE9tique OACI",items:["A Alpha, B Bravo, C Charlie, D Delta, E Echo, F Foxtrot","G Golf, H Hotel, I India, J Juliett, K Kilo, L Lima","M Mike, N November, O Oscar, P Papa, Q Quebec, R Romeo","S Sierra, T Tango, U Uniform, V Victor, W Whiskey","X X-ray, Y Yankee, Z Zulu"]},{type:"text",level:"ATPL",heading:"Structure d'un message",paragraphs:["Un message radio suit en g\xE9n\xE9ral une structure fixe : \xE0 qui l'on s'adresse, qui l'on est, puis le message lui-m\xEAme. Les instructions importantes, notamment celles qui touchent \xE0 la s\xE9curit\xE9, doivent \xEAtre r\xE9p\xE9t\xE9es par le pilote (le read-back), afin que le contr\xF4leur puisse v\xE9rifier qu'elles ont \xE9t\xE9 correctement comprises.","Les nombres se prononcent chiffre par chiffre (par exemple \xAB un vingt-cinq \xBB ne se dit pas, on dit \xAB un deux cinq \xBB), \xE0 l'exception des niveaux et altitudes ronds, pour \xE9viter toute ambigu\xEFt\xE9 entre des valeurs proches."]}]},{id:"communications-vfr",title:"Communications VFR",summary:"Les \xE9changes typiques d'un vol VFR, du roulage au d\xE9collage.",blocks:[{type:"text",level:"BIA",paragraphs:["En VFR, les communications accompagnent chaque \xE9tape du vol : demande de mise en route et de roulage, autorisation de d\xE9collage, comptes-rendus en tour de piste, puis en croisi\xE8re sur les fr\xE9quences successives travers\xE9es."]},{type:"text",level:"ATPL",heading:"Clairances et espace contr\xF4l\xE9",paragraphs:["En espace contr\xF4l\xE9, chaque \xE9tape peut n\xE9cessiter une clairance explicite du contr\xF4leur avant d'\xEAtre ex\xE9cut\xE9e, par exemple pour s'aligner sur la piste ou p\xE9n\xE9trer une zone de contr\xF4le. Hors espace contr\xF4l\xE9, le pilote s'auto-annonce sur la fr\xE9quence appropri\xE9e sans attendre d'autorisation, mais reste responsable de sa propre s\xE9paration avec les autres trafics."]},{type:"text",level:"ATPL",heading:"En cas de panne radio",paragraphs:["En cas de panne radio en circuit d'a\xE9rodrome, la tour peut communiquer par signaux lumineux : un feu vert continu autorise le d\xE9collage ou l'atterrissage, un feu rouge continu signifie de c\xE9der le passage ou de s'arr\xEAter, un feu rouge clignotant demande de d\xE9gager la piste utilis\xE9e. C'est une proc\xE9dure de secours \xE0 conna\xEEtre m\xEAme si elle est rarement utilis\xE9e en pratique."]}]},{id:"communications-ifr",title:"Communications IFR et proc\xE9dures d'urgence",summary:"Ce qui change en IFR, et la phras\xE9ologie des situations d'urgence.",blocks:[{type:"text",level:"ATPL",paragraphs:["En IFR, les \xE9changes sont plus denses et plus formalis\xE9s : clairance de route avant le d\xE9part, autorisations de changement de niveau, d'interception d'une trajectoire, ou de proc\xE9dure d'approche, chacune devant \xEAtre lue int\xE9gralement (read-back) par le pilote."]},{type:"list",level:"ATPL",heading:"Deux mots-cl\xE9s d'urgence",items:["Mayday, r\xE9p\xE9t\xE9 trois fois, signale une situation de d\xE9tresse : un danger grave et imminent qui menace l'avion ou ses occupants.","Pan Pan, r\xE9p\xE9t\xE9 trois fois, signale une situation d'urgence qui ne met pas imm\xE9diatement en danger l'avion ou ses occupants, mais n\xE9cessite une assistance."]},{type:"text",level:"ATPL",heading:"Le code transpondeur d'urgence",paragraphs:["En compl\xE9ment de la voix, afficher le code transpondeur 7700 signale une d\xE9tresse \xE0 tous les organismes de contr\xF4le qui re\xE7oivent l'\xE9cho radar de l'avion, m\xEAme sans contact radio \xE9tabli. D'autres codes d\xE9di\xE9s existent pour une panne radio (7600) ou une intervention illicite \xE0 bord (7500)."]}]},{id:"organismes-frequences",title:"Organismes et fr\xE9quences",summary:"Qui appeler selon la phase de vol, et comment trouver la bonne fr\xE9quence.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque organisme au sol dispose de sa propre fr\xE9quence radio, publi\xE9e sur les cartes et dans la documentation de chaque a\xE9rodrome : tour, approche, centre en route, ou simple fr\xE9quence d'auto-information sur un terrain non contr\xF4l\xE9. Changer de fr\xE9quence au bon moment, en suivant les instructions re\xE7ues ou les limites d'espace, fait partie du travail courant du pilote."]},{type:"text",level:"ATPL",heading:"La fr\xE9quence de d\xE9tresse",paragraphs:["La fr\xE9quence 121,5 MHz, surveill\xE9e en continu par de nombreux organismes et a\xE9ronefs, sert exclusivement aux communications de d\xE9tresse et d'urgence : un pilote qui ne parvient \xE0 joindre personne sur sa fr\xE9quence habituelle peut toujours s'y rabattre en dernier recours pour obtenir de l'aide."]}]},{id:"atis-infos-auto",title:"L'ATIS et les informations automatiques",summary:"Comment r\xE9cup\xE9rer les informations de base avant m\xEAme de contacter un contr\xF4leur.",blocks:[{type:"text",level:"BIA",paragraphs:["Sur les a\xE9rodromes les plus fr\xE9quent\xE9s, un message enregistr\xE9 et mis \xE0 jour r\xE9guli\xE8rement, l'ATIS, diffuse en continu sur une fr\xE9quence d\xE9di\xE9e les informations de base : piste en service, vent, visibilit\xE9, calage altim\xE9trique. \xC9couter ce message avant le premier contact radio \xE9vite de faire r\xE9p\xE9ter ces informations au contr\xF4leur, et acc\xE9l\xE8re les \xE9changes."]},{type:"text",level:"ATPL",heading:"Accuser r\xE9ception de l'ATIS",paragraphs:["Chaque message ATIS est identifi\xE9 par une lettre de l'alphabet OACI, qui change \xE0 chaque mise \xE0 jour : le premier contact radio inclut g\xE9n\xE9ralement la mention de cette lettre, pour que le contr\xF4leur sache imm\xE9diatement que le pilote dispose des informations \xE0 jour, sans avoir \xE0 les redonner int\xE9gralement."]}]},{id:"comptes-rendus-croisiere",title:"Comptes-rendus standards en croisi\xE8re",summary:"Ce qu'un pilote communique en route, m\xEAme hors espace contr\xF4l\xE9.",blocks:[{type:"text",level:"BIA",paragraphs:["En croisi\xE8re, un pilote VFR communique g\xE9n\xE9ralement sa position, son altitude et ses intentions \xE0 chaque changement de fr\xE9quence, ou en passant un point de report notable : de quoi permettre aux autres usagers de la fr\xE9quence de se faire une image mentale du trafic environnant, m\xEAme sans service de contr\xF4le actif."]},{type:"text",level:"ATPL",heading:"Le format standard d'un compte-rendu de position",paragraphs:["Un compte-rendu de position suit un ordre reconnu de tous : identification de l'avion, position actuelle, heure de passage, altitude, puis intentions. Respecter cet ordre, m\xEAme sous forme abr\xE9g\xE9e en VFR non contr\xF4l\xE9, aide les autres pilotes \xE0 l'\xE9coute \xE0 extraire rapidement l'information utile au milieu d'un message parfois rapide."]}]},{id:"phraseologie-situations-particulieres",title:"Phras\xE9ologie des situations particuli\xE8res",summary:"Remise de gaz, demi-tour, essais radio : des formules d\xE9di\xE9es pour ne pas improviser.",blocks:[{type:"text",level:"BIA",paragraphs:["Certaines situations, bien que non urgentes, m\xE9ritent une phras\xE9ologie bien identifi\xE9e plut\xF4t qu'une formulation improvis\xE9e : annoncer une remise de gaz (interrompre un atterrissage pour reprendre de l'altitude), un demi-tour en tour de piste, ou un simple essai radio avant le premier vol de la journ\xE9e."]},{type:"text",level:"ATPL",heading:"L'essai radio gradu\xE9",paragraphs:["L'essai radio utilise une \xE9chelle de lisibilit\xE9 de 1 \xE0 5 (1 : inintelligible, 5 : parfaitement clair) plut\xF4t qu'un simple \xAB vous me recevez ? \xBB, afin de donner une information exploitable \xE0 l'autre station sur la qualit\xE9 r\xE9elle de la liaison, utile pour d\xE9cider si elle est suffisante pour la suite du vol."]}]},{id:"nombres-lettres-unites",title:"Nombres, lettres et unit\xE9s en phras\xE9ologie",summary:"Comment prononcer sans ambigu\xEFt\xE9 les chiffres, les niveaux et les fr\xE9quences.",blocks:[{type:"text",level:"BIA",paragraphs:["Chaque chiffre se prononce isol\xE9ment pour \xE9viter toute confusion : \xAB 125 \xBB se dit \xAB un deux cinq \xBB, jamais \xAB cent vingt-cinq \xBB. Les niveaux de vol et les caps suivent la m\xEAme logique, toujours chiffre par chiffre."]},{type:"text",level:"ATPL",heading:"Les exceptions \xE0 conna\xEEtre",paragraphs:["Les altitudes et niveaux ronds en centaines ou en milliers peuvent se grouper (\xAB niveau cent \xBB pour FL100), de m\xEAme que les caps et routes complets \xE0 trois chiffres sont parfois \xE9nonc\xE9s comme un nombre entier dans certains contextes. Ces exceptions, apprises avec la pratique, ne doivent jamais introduire d'ambigu\xEFt\xE9 : en cas de doute, revenir \xE0 l'\xE9nonc\xE9 chiffre par chiffre reste toujours la solution la plus s\xFBre."]}]},{id:"anglais-aeronautique",title:"L'anglais a\xE9ronautique",summary:"Pourquoi l'anglais s'impose au-del\xE0 des fronti\xE8res fran\xE7aises, et ce qu'il recouvre vraiment.",blocks:[{type:"text",level:"BIA",paragraphs:["Si la phras\xE9ologie fran\xE7aise suffit pour voler en France sur la plupart des terrains, l'anglais a\xE9ronautique devient indispensable d\xE8s qu'un vol franchit une fronti\xE8re, ou \xE9volue sur un a\xE9rodrome international : c'est la langue commune qui permet \xE0 des pilotes et contr\xF4leurs de nationalit\xE9s diff\xE9rentes de se comprendre."]},{type:"text",level:"ATPL",heading:"Phras\xE9ologie standard et anglais conversationnel",paragraphs:["Au-del\xE0 de la phras\xE9ologie standard, largement commune d'un pays \xE0 l'autre et assez vite m\xE9morisable, une situation non pr\xE9vue peut obliger \xE0 sortir de ce cadre et \xE0 communiquer en anglais courant avec le contr\xF4leur : c'est pour cette raison que les licences professionnelles exigent un niveau d'anglais certifi\xE9, au-del\xE0 de la simple phras\xE9ologie apprise par c\u0153ur."]}]},{id:"erreurs-phraseologie",title:"Erreurs de phras\xE9ologie classiques et comment les \xE9viter",summary:"Les pi\xE8ges les plus fr\xE9quents chez les pilotes en formation.",blocks:[{type:"list",level:"BIA",heading:"Des erreurs fr\xE9quentes",items:["Confondre deux indicatifs d'appel proches sur une m\xEAme fr\xE9quence tr\xE8s charg\xE9e.","Oublier de r\xE9p\xE9ter (read-back) une instruction pourtant bien re\xE7ue.","Parler trop vite ou encha\xEEner trop d'informations en un seul message.","Utiliser un vocabulaire non standard l\xE0 o\xF9 une formule normalis\xE9e existe."]},{type:"text",level:"ATPL",heading:"Le bon r\xE9flexe",paragraphs:["En cas de doute sur une instruction re\xE7ue, mieux vaut toujours demander une r\xE9p\xE9tition (\xAB dites encore \xBB) que de deviner ou de supposer : une mauvaise compr\xE9hension non corrig\xE9e co\xFBte souvent bien plus cher, en temps comme en s\xE9curit\xE9, que les quelques secondes n\xE9cessaires pour la clarifier imm\xE9diatement."]}]}]},{id:"prepa-vol",title:"Pr\xE9paration et gestion du vol",tagline:"Masse et centrage, performances, plan de vol.",Icon:bl,status:"available",lessons:[{id:"masse-centrage",title:"Masse et centrage",summary:"Rester dans les limites de masse et de centrage de l'avion.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant chaque vol, il faut v\xE9rifier que la masse totale de l'avion, \xE9quipage, passagers, bagages et carburant compris, reste inf\xE9rieure \xE0 la masse maximale autoris\xE9e, et que le centre de gravit\xE9 se situe dans la plage pr\xE9vue par le constructeur."]},{type:"text",level:"ATPL",heading:"Bras de levier et moment",paragraphs:["Le calcul de centrage repose sur la notion de moment, le produit d'une masse par son bras de levier, sa distance \xE0 un point de r\xE9f\xE9rence. En sommant les moments de chaque poste (occupants, bagages, carburant) et en divisant par la masse totale, on obtient la position du centre de gravit\xE9.","Un centrage trop avant rend l'avion plus stable mais exige plus de portance de l'empennage, donc plus de tra\xEEn\xE9e ; un centrage trop arri\xE8re le rend plus maniable mais moins stable, avec un risque accru de d\xE9crochage difficile \xE0 rattraper."]},{type:"diagram",level:"ATPL",diagramId:"cg-envelope",caption:"Le devis de masse et centrage se v\xE9rifie graphiquement : le point calcul\xE9 doit tomber dans le domaine autoris\xE9, \xE0 toutes les masses envisag\xE9es pour le vol."},{type:"text",level:"ATPL",heading:"Pourquoi v\xE9rifier \xE0 deux masses",paragraphs:["Le domaine autoris\xE9 n'est pas un simple intervalle fixe : il se resserre g\xE9n\xE9ralement pr\xE8s de la masse maximale. Un centrage prudent au d\xE9collage peut donc sortir du domaine \xE0 l'atterrissage, une fois le carburant consomm\xE9, si le r\xE9servoir n'est pas au centre de gravit\xE9 de l'avion : c'est pourquoi on v\xE9rifie le centrage aux deux masses extr\xEAmes du vol, pas seulement au d\xE9part."]}]},{id:"performances",title:"Performances au d\xE9collage et \xE0 l'atterrissage",summary:"Ce qui allonge ou raccourcit les distances de d\xE9collage et d'atterrissage.",blocks:[{type:"list",level:"BIA",heading:"Les facteurs qui allongent la distance",items:["Une masse plus \xE9lev\xE9e.","Une altitude ou une temp\xE9rature plus \xE9lev\xE9es (l'air est alors moins dense).","Une piste en pente montante, ou humide, ou herbeuse.","Un vent arri\xE8re plut\xF4t que de face."]},{type:"text",level:"ATPL",heading:"L'altitude densit\xE9",paragraphs:["L'altitude et la temp\xE9rature se combinent dans la notion d'altitude densit\xE9 : l'altitude \xE0 laquelle la densit\xE9 de l'air observ\xE9e correspondrait, en atmosph\xE8re standard. Par forte chaleur en altitude, l'altitude densit\xE9 peut \xEAtre largement sup\xE9rieure \xE0 l'altitude r\xE9elle du terrain, ce qui d\xE9grade fortement les performances. Les abaques du manuel de vol permettent de calculer pr\xE9cis\xE9ment les distances attendues \xE0 partir de ces param\xE8tres."]},{type:"text",level:"ATPL",heading:"Des marges, pas des valeurs limites",paragraphs:["Les distances publi\xE9es dans le manuel de vol correspondent \xE0 un avion neuf, pilot\xE9 de fa\xE7on optimale, sur piste s\xE8che et dure. Un pilote prudent applique une marge de s\xE9curit\xE9 substantielle par rapport \xE0 ces chiffres, plut\xF4t que de calculer au plus juste, pour absorber l'\xE9cart entre les conditions d'essai et la r\xE9alit\xE9 d'un vol donn\xE9."]}]},{id:"plan-vol",title:"Plan de vol et dossier m\xE9t\xE9o",summary:"Pr\xE9parer un vol : plan de vol, NOTAM, et lecture d'un METAR.",blocks:[{type:"text",level:"BIA",paragraphs:["Pr\xE9parer un vol ne se limite pas \xE0 la navigation : il faut aussi v\xE9rifier la m\xE9t\xE9o pr\xE9vue sur tout le trajet et se renseigner sur l'\xE9tat des a\xE9rodromes et des espaces travers\xE9s avant de partir."]},{type:"text",level:"ATPL",heading:"Plan de vol et NOTAM",paragraphs:["Le plan de vol VFR, d\xE9pos\xE9 avant le d\xE9part pour les vols qui le n\xE9cessitent, notamment ceux qui traversent une fronti\xE8re, pr\xE9cise la route pr\xE9vue, les points de report et l'autonomie ; il sert aussi \xE0 d\xE9clencher les recherches si l'avion n'arrive pas dans un d\xE9lai pr\xE9vu. Les NOTAM (Notice To Airmen) signalent les informations temporaires importantes : travaux sur une piste, zone temporairement activ\xE9e, balise en panne."]},{type:"text",level:"ATPL",heading:"Lire un METAR",paragraphs:["Le METAR est une observation m\xE9t\xE9o cod\xE9e, transmise r\xE9guli\xE8rement par les a\xE9rodromes \xE9quip\xE9s. Un exemple simplifi\xE9 : \xAB LFPG 231000Z 24012KT 9999 FEW030 18/09 Q1015 \xBB se lit ainsi : \xE0 Paris-Charles-de-Gaulle, le 23 \xE0 10h00 UTC, vent du 240\xB0 pour 12 n\u0153uds, visibilit\xE9 sup\xE9rieure \xE0 10 km, quelques nuages \xE9pars \xE0 3 000 ft, temp\xE9rature 18\xB0C, point de ros\xE9e 9\xB0C, QNH 1015 hPa. Le TAF, construit avec le m\xEAme code mais organis\xE9 diff\xE9remment, donne cette fois une pr\xE9vision pour les heures \xE0 venir (9h ou 24h selon le type) plut\xF4t qu'une observation instantan\xE9e."]},{type:"table",level:"ATPL",headers:["Code","N\xE9bulosit\xE9"],rows:[["SKC","Ciel clair (0/8)"],["FEW","Quelques nuages (1 \xE0 2/8)"],["SCT","\xC9pars (3 \xE0 4/8)"],["BKN","Fragment\xE9 (5 \xE0 7/8)"],["OVC","Couvert (8/8)"]],caption:"La n\xE9bulosit\xE9 se mesure en octas, huiti\xE8mes de ciel couverts. CAVOK (Ceiling And Visibility OK) remplace tout ce bloc quand la visibilit\xE9 d\xE9passe 10 km, sans nuage sous 1 500 m ni ph\xE9nom\xE8ne significatif."}]},{id:"devis-masse-etape",title:"Le devis de masse, \xE9tape par \xE9tape",summary:"Comment additionner concr\xE8tement masse \xE0 vide, occupants, bagages et carburant.",blocks:[{type:"text",level:"BIA",paragraphs:["Le devis de masse part de la masse \xE0 vide de l'avion, une donn\xE9e fixe propre \xE0 chaque exemplaire, \xE0 laquelle on ajoute successivement la masse des occupants, celle des bagages, puis celle du carburant embarqu\xE9, pour obtenir la masse totale au d\xE9collage."]},{type:"text",level:"ATPL",heading:"Associer un moment \xE0 chaque poste",paragraphs:["Chaque poste de cette liste a aussi un bras de levier propre, fix\xE9 par le constructeur : si\xE8ge avant, si\xE8ge arri\xE8re, soute \xE0 bagages, r\xE9servoirs. En multipliant chaque masse par son bras de levier puis en sommant ces moments avant de diviser par la masse totale, on obtient la position du centre de gravit\xE9, \xE0 comparer ensuite au domaine autoris\xE9 vu dans la le\xE7on sur le centrage."]}]},{id:"distances-abaque",title:"Calcul des distances sur abaque",summary:"Lire un graphique de performances pour en tirer une distance de d\xE9collage r\xE9elle.",blocks:[{type:"text",level:"BIA",paragraphs:["Le manuel de vol fournit des abaques, des graphiques \xE0 plusieurs entr\xE9es, qui permettent de passer des conditions du jour (temp\xE9rature, altitude du terrain, masse, vent) \xE0 une distance de d\xE9collage ou d'atterrissage attendue, sans avoir \xE0 refaire soi-m\xEAme les calculs a\xE9rodynamiques sous-jacents."]},{type:"text",level:"ATPL",heading:"Suivre les lignes de construction",paragraphs:["Lire un abaque consiste \xE0 entrer par une valeur connue (par exemple la temp\xE9rature), suivre une ligne de construction jusqu'\xE0 croiser une autre courbe (l'altitude), puis r\xE9p\xE9ter l'op\xE9ration pour chaque param\xE8tre jusqu'\xE0 obtenir la distance finale. Une erreur de lecture \xE0 une \xE9tape se propage \xE0 toutes les suivantes, d'o\xF9 l'int\xE9r\xEAt de v\xE9rifier la coh\xE9rence du r\xE9sultat final par rapport \xE0 l'ordre de grandeur attendu."]}]},{id:"carburant-reserves",title:"Carburant : calcul et gestion des r\xE9serves",summary:"Carburant de voyage, de d\xE9gagement, et r\xE9serve finale : ce que couvre chaque poste.",blocks:[{type:"text",level:"BIA",paragraphs:["Le carburant total emport\xE9 se d\xE9compose en plusieurs postes distincts : celui n\xE9cessaire pour rallier la destination, celui pr\xE9vu pour rejoindre un a\xE9rodrome de d\xE9gagement si besoin, et une r\xE9serve finale incompressible, jamais entam\xE9e sauf urgence r\xE9elle."]},{type:"text",level:"ATPL",heading:"Des minutes, pas seulement des litres",paragraphs:["Cette r\xE9serve finale s'exprime en temps de vol \xE0 une consommation donn\xE9e plut\xF4t qu'en volume, g\xE9n\xE9ralement de l'ordre de 30 minutes de vol de jour et 45 minutes de nuit pour un avion l\xE9ger. Un pilote prudent planifie pour atterrir avec une marge confortable au-dessus de ce minimum r\xE9glementaire, pas tout juste dessus."]}]},{id:"choisir-route-degagements",title:"Choisir sa route et ses d\xE9gagements",summary:"Pourquoi une route directe n'est pas toujours la meilleure option.",blocks:[{type:"text",level:"BIA",paragraphs:["La route la plus courte entre deux a\xE9rodromes n'est pas toujours la plus s\xFBre ni la plus pertinente : survol de relief \xE9lev\xE9, de zones sans terrain de secours, d'espaces r\xE9glement\xE9s, ou simplement de r\xE9gions o\xF9 les rep\xE8res visuels se font rares, sont autant de raisons de pr\xE9f\xE9rer un trac\xE9 l\xE9g\xE8rement plus long mais plus confortable."]},{type:"text",level:"ATPL",heading:"Toujours avoir un plan B",paragraphs:["Choisir un ou plusieurs a\xE9rodromes de d\xE9gagement fait partie int\xE9grante de la pr\xE9paration : en cas de m\xE9t\xE9o d\xE9grad\xE9e, de panne ou de doute sur l'autonomie, le pilote doit savoir vers o\xF9 se rediriger sans avoir \xE0 improviser, avec la route, la distance et le carburant n\xE9cessaires d\xE9j\xE0 estim\xE9s avant le d\xE9collage."]}]},{id:"visite-prevol",title:"La visite pr\xE9vol",summary:"Pourquoi un tour m\xE9thodique de l'avion pr\xE9c\xE8de chaque vol, m\xEAme le plus court.",blocks:[{type:"text",level:"BIA",paragraphs:["Avant chaque vol, un tour complet de l'avion permet de v\xE9rifier son \xE9tat g\xE9n\xE9ral : niveaux de fluides, \xE9tat des pneus, absence de fuite, propret\xE9 des surfaces de portance, jeu normal des gouvernes, pr\xE9sence et fixation correcte des diff\xE9rents \xE9l\xE9ments."]},{type:"text",level:"ATPL",heading:"Une m\xE9thode, pas un coup d'\u0153il",paragraphs:["Cette visite suit un ordre fixe, propre \xE0 chaque type d'avion, d\xE9fini dans le manuel de vol, pr\xE9cis\xE9ment pour ne rien oublier m\xEAme quand la routine s'installe. Un d\xE9faut d\xE9tect\xE9 \xE0 ce moment, m\xEAme mineur en apparence, co\xFBte infiniment moins cher \xE0 traiter au sol qu'en vol : c'est l'un des contr\xF4les les plus rentables de toute la pr\xE9paration d'un vol."]}]},{id:"checklists-discipline",title:"Check-lists et discipline op\xE9rationnelle",summary:"Comment les check-lists rythment chaque phase, du d\xE9marrage au stationnement.",blocks:[{type:"text",level:"BIA",paragraphs:["Au-del\xE0 de la visite pr\xE9vol, chaque phase du vol, mise en route, roulage, avant d\xE9collage, croisi\xE8re, avant atterrissage, dispose de sa propre check-list, qui regroupe les v\xE9rifications essentielles \xE0 ce moment pr\xE9cis plut\xF4t que de tout m\xE9langer en une seule longue liste."]},{type:"text",level:"ATPL",heading:"Une discipline qui se construit",paragraphs:["Suivre syst\xE9matiquement ces listes, y compris quand rien ne semble justifier de s'y attarder, construit une discipline op\xE9rationnelle qui se r\xE9v\xE8le pr\xE9cieuse le jour o\xF9 quelque chose sort effectivement de l'ordinaire. C'est un des points o\xF9 l'exp\xE9rience peut jouer contre le pilote, en encourageant des raccourcis qui fonctionnent... jusqu'au jour o\xF9 ils ne fonctionnent plus."]}]},{id:"compte-rendu-apres-vol",title:"Le compte-rendu apr\xE8s vol",summary:"Cl\xF4turer un plan de vol, consigner les heures, et signaler ce qui doit l'\xEAtre.",blocks:[{type:"text",level:"BIA",paragraphs:["Un vol ne s'arr\xEAte pas vraiment au moment o\xF9 l'avion se pose : il faut encore cl\xF4turer un \xE9ventuel plan de vol d\xE9pos\xE9, pour ne pas d\xE9clencher inutilement une alerte, et consigner les heures de vol dans le carnet de route de l'avion et le carnet de vol personnel du pilote."]},{type:"text",level:"ATPL",heading:"Signaler une anomalie",paragraphs:["Toute anomalie constat\xE9e en vol, m\xEAme mineure ou qui semble s'\xEAtre r\xE9sorb\xE9e d'elle-m\xEAme, m\xE9rite d'\xEAtre consign\xE9e pour que la maintenance puisse l'examiner avant le vol suivant. C'est cette rigueur, r\xE9p\xE9t\xE9e vol apr\xE8s vol par tous les pilotes qui utilisent un m\xEAme avion, qui permet de d\xE9tecter t\xF4t un probl\xE8me naissant plut\xF4t que de le d\xE9couvrir au pire moment."]}]}]}],N0={aero:[{level:"BIA",q:"Quelle force est produite par les ailes et dirig\xE9e vers le haut ?",options:["Portance","Tra\xEEn\xE9e","Traction","Poids"],correct:0,explain:"La portance \xE9quilibre le poids en vol stabilis\xE9."},{level:"BIA",q:"Que repr\xE9sente le bord de fuite d'un profil d'aile ?",options:["L'avant, arrondi","L'arri\xE8re, effil\xE9","La surface sup\xE9rieure","La surface inf\xE9rieure"],correct:1,explain:"Le bord de fuite est l'arri\xE8re effil\xE9 du profil ; le bord d'attaque est l'avant, arrondi."},{level:"BIA",q:"Le d\xE9crochage se produit quand :",options:["la vitesse est trop faible","l'angle d'incidence d\xE9passe l'angle critique","les volets sont sortis","le moteur cale"],correct:1,explain:"Le d\xE9crochage d\xE9pend de l'incidence, pas directement de la vitesse : il peut survenir \xE0 toute vitesse."},{level:"BIA",q:"Quelle gouverne commande le roulis ?",options:["La gouverne de profondeur","Les ailerons","La gouverne de direction","Les volets"],correct:1,explain:"Les ailerons, en bout d'aile, commandent l'inclinaison autour de l'axe de roulis."},{level:"ATPL",q:"Dans Rz = \xBD\xB7\u03C1\xB7V\xB2\xB7S\xB7Cz, si la vitesse double (Cz et S constants), la portance est multipli\xE9e par :",options:["2","3","4","elle ne change pas"],correct:2,explain:"La portance d\xE9pend du carr\xE9 de la vitesse : doubler V multiplie la portance par 4."},{level:"ATPL",q:"Quel type de tra\xEEn\xE9e diminue quand la vitesse augmente ?",options:["La tra\xEEn\xE9e de frottement","La tra\xEEn\xE9e induite","La tra\xEEn\xE9e de forme","La tra\xEEn\xE9e d'onde"],correct:1,explain:"La tra\xEEn\xE9e induite, li\xE9e \xE0 l'incidence n\xE9cessaire pour porter l'avion, diminue quand la vitesse augmente."},{level:"ATPL",q:"\xC0 60\xB0 d'inclinaison en virage, le facteur de charge vaut environ :",options:["1,15","1,41","2","3"],correct:2,explain:"n = 1 / cos(60\xB0) = 1 / 0,5 = 2."},{level:"ATPL",q:"La vitesse de man\u0153uvre Va correspond \xE0 :",options:["La vitesse maximale volets sortis","La vitesse maximale de braquage complet des gouvernes sans risque structurel","La vitesse de d\xE9crochage","La vitesse de meilleur taux de mont\xE9e"],correct:1,explain:"Au-del\xE0 de Va, un braquage complet des gouvernes pourrait d\xE9passer les efforts admissibles par la structure."}],aeronefs:[{level:"BIA",q:"Dans le cycle \xE0 4 temps, quel temps suit la compression ?",options:["Admission","Combustion","\xC9chappement","D\xE9tente froide"],correct:1,explain:"L'ordre est : admission, compression, combustion, \xE9chappement."},{level:"BIA",q:"Qu'est-ce qui transforme le couple moteur en traction sur un avion \xE0 h\xE9lice ?",options:["Le carburateur","L'h\xE9lice","Le turbocompresseur","Le r\xE9ducteur seul"],correct:1,explain:"L'h\xE9lice acc\xE9l\xE8re une masse d'air vers l'arri\xE8re pour produire la traction."},{level:"BIA",q:"Quel instrument indique la vitesse verticale ?",options:["L'an\xE9mom\xE8tre","L'altim\xE8tre","Le variom\xE8tre","L'horizon artificiel"],correct:2,explain:"Le variom\xE8tre indique la vitesse de mont\xE9e ou de descente."},{level:"ATPL",q:"Le givrage carburateur peut survenir :",options:["Uniquement \xE0 temp\xE9rature n\xE9gative","M\xEAme \xE0 temp\xE9rature positive, par temps humide","Uniquement en altitude","Jamais sur moteur \xE0 pistons"],correct:1,explain:"Le refroidissement d\xFB \xE0 la vaporisation de l'essence peut givrer le carburateur m\xEAme par temps doux et humide."},{level:"ATPL",q:"Un tube de Pitot obstru\xE9 affecte directement :",options:["L'altim\xE8tre seul","L'an\xE9mom\xE8tre","Le compas","L'horizon artificiel"],correct:1,explain:"Le tube de Pitot capte la pression dynamique utilis\xE9e par l'an\xE9mom\xE8tre."},{level:"ATPL",q:"Le taux de dilution (bypass ratio) d'un turbofan mesure :",options:["Le rapport carburant/air","La part d'air qui contourne le c\u0153ur du r\xE9acteur sans \xEAtre br\xFBl\xE9e","La vitesse de rotation du compresseur","Le rendement thermique"],correct:1,explain:"Un taux de dilution \xE9lev\xE9 am\xE9liore la consommation et r\xE9duit le bruit."}],meteo:[{level:"BIA",q:"Dans quel \xE9tage se forment les cumulus ?",options:["\xC9tage bas","\xC9tage moyen","\xC9tage \xE9lev\xE9","Aucun \xE9tage particulier"],correct:0,explain:"Les cumulus se forment dans l'\xE9tage bas, jusqu'\xE0 environ 2 000 m."},{level:"BIA",q:"Le vent souffle :",options:["Des basses vers les hautes pressions","Des hautes vers les basses pressions","Toujours d'ouest en est","Ind\xE9pendamment de la pression"],correct:1,explain:"L'air se d\xE9place des zones de haute pression vers les zones de basse pression."},{level:"BIA",q:"Parmi ces ph\xE9nom\xE8nes, lequel r\xE9duit fortement la visibilit\xE9 au sol ?",options:["Le brouillard","L'arc-en-ciel","La ros\xE9e","La brise thermique"],correct:0,explain:"Le brouillard r\xE9duit fortement la visibilit\xE9, en particulier au d\xE9collage et \xE0 l'atterrissage."},{level:"ATPL",q:"Le QNH permet de lire :",options:["La hauteur par rapport au terrain","L'altitude par rapport au niveau de la mer","Le niveau de vol standard","La temp\xE9rature au sol"],correct:1,explain:"Le QNH ram\xE8ne la pression au niveau de la mer, pour lire l'altitude par rapport \xE0 ce niveau."},{level:"ATPL",q:"Une atmosph\xE8re est dite instable quand :",options:["Le gradient r\xE9el est plus faible que le gradient adiabatique","Le gradient r\xE9el est plus fort que le gradient adiabatique","Il n'y a pas de vent","La pression est stable"],correct:1,explain:"Une particule d\xE9plac\xE9e vers le haut reste alors plus chaude que son environnement et continue de monter."},{level:"ATPL",q:"Un front froid se caract\xE9rise par :",options:["Une d\xE9gradation lente et progressive","De l'air froid qui soul\xE8ve brutalement l'air chaud, propice aux orages","Un temps toujours calme","Une absence de nuages"],correct:1,explain:"Le front froid, plus brutal que le front chaud, peut d\xE9clencher des orages sur une ligne \xE9troite."}],nav:[{level:"BIA",q:"Sur une carte OACI au 1/500 000, un centim\xE8tre repr\xE9sente :",options:["500 m","5 km","50 km","500 km"],correct:1,explain:"1/500 000 signifie qu'un centim\xE8tre sur la carte repr\xE9sente 500 000 cm, soit 5 km, au sol."},{level:"BIA",q:"La d\xE9rive est due :",options:["Au vent","\xC0 l'altitude","\xC0 la temp\xE9rature","\xC0 la masse de l'avion"],correct:0,explain:"Le vent fait s'\xE9carter l'avion de sa route s'il vole cap \xE9gal \xE0 la route."},{level:"BIA",q:"Que donne le VOR ?",options:["Une distance","Une radiale","Une vitesse sol","Une pression"],correct:1,explain:"Le VOR donne une radiale, la direction depuis la balise vers laquelle se trouve l'avion."},{level:"ATPL",q:"Dans le triangle des vitesses, la vitesse sol est :",options:["La vitesse air seule","Le vent seul","La somme de la vitesse air et du vent","Toujours \xE9gale \xE0 la vitesse air"],correct:2,explain:"La vitesse sol r\xE9sulte de la combinaison de la vitesse air et du vent."},{level:"ATPL",q:"Le DME donne :",options:["Un rel\xE8vement","Une radiale","Une distance oblique","Un cap magn\xE9tique"],correct:2,explain:"Le DME donne la distance oblique jusqu'\xE0 la balise, souvent coupl\xE9 \xE0 un VOR."},{level:"ATPL",q:"La r\xE8gle des 60 sert notamment \xE0 :",options:["Calculer la masse maximale","Convertir une d\xE9rive en correction de cap","R\xE9gler l'altim\xE8tre","Calculer le taux de dilution"],correct:1,explain:"Elle permet des calculs rapides de d\xE9rive et de correction de cap sans calculateur."}],reglementation:[{level:"BIA",q:"Le BIA donne-t-il le droit de piloter seul aux commandes ?",options:["Oui, sans restriction","Non, ce n'est pas une licence de pilote","Oui, uniquement en planeur","Oui, avec un examen compl\xE9mentaire"],correct:1,explain:"Le BIA est un brevet scolaire d'initiation, pas une licence de pilote."},{level:"BIA",q:"Dans le tour de piste, quelle \xE9tape suit le d\xE9collage ?",options:["La base","Le vent traversier","La finale","Le vent arri\xE8re"],correct:1,explain:"L'ordre est : d\xE9collage, vent traversier, vent arri\xE8re, base, finale."},{level:"BIA",q:"Dans l'espace a\xE9rien de classe A, le VFR est :",options:["Autoris\xE9 sans restriction","Interdit","Autoris\xE9 avec clairance uniquement","Autoris\xE9 la nuit seulement"],correct:1,explain:"La classe A est r\xE9serv\xE9e \xE0 l'IFR ; le VFR y est interdit."},{level:"ATPL",q:"Quelle licence permet de voler contre r\xE9mun\xE9ration, en premier \xE9chelon professionnel ?",options:["LAPL","PPL","CPL","Aucune des trois"],correct:2,explain:"Le CPL est le premier \xE9chelon qui permet le vol r\xE9mun\xE9r\xE9."},{level:"ATPL",q:"En dessous de 3 000 ft (ou 1 000 ft sol) hors espace contr\xF4l\xE9, la visibilit\xE9 minimale VFR est g\xE9n\xE9ralement :",options:["500 m","1 500 m","5 km","10 km"],correct:1,explain:"Les minimums se resserrent \xE0 basse altitude en espace non contr\xF4l\xE9, mais restent \xE0 1 500 m."},{level:"ATPL",q:"Le certificat m\xE9dical de classe 1 est exig\xE9 pour :",options:["Le BIA","Le LAPL","Le PPL uniquement","Les licences professionnelles (CPL, ATPL)"],correct:3,explain:"La classe 1, plus exigeante, est n\xE9cessaire pour exercer en tant que pilote professionnel."}],"facteurs-humains":[{level:"BIA",q:"L'hypoxie est due \xE0 :",options:["Un exc\xE8s d'oxyg\xE8ne","Un manque d'oxyg\xE8ne disponible en altitude","Une d\xE9shydratation","Un exc\xE8s de sommeil"],correct:1,explain:"En altitude, la quantit\xE9 d'oxyg\xE8ne disponible \xE0 chaque respiration diminue."},{level:"BIA",q:"Sans rep\xE8res visuels ext\xE9rieurs, l'oreille interne peut :",options:["Toujours donner des sensations fiables","Donner des sensations fausses de virage ou d'inclinaison","Ne rien ressentir","Corriger automatiquement les instruments"],correct:1,explain:"C'est pourquoi le vol sans visibilit\xE9 ext\xE9rieure exige de se fier aux instruments."},{level:"BIA",q:"Un accident r\xE9sulte g\xE9n\xE9ralement :",options:["D'une seule cause isol\xE9e","D'un encha\xEEnement de plusieurs erreurs","Toujours d'une panne m\xE9canique","Du hasard uniquement"],correct:1,explain:"La cha\xEEne d'erreurs : interrompre un seul maillon suffit souvent \xE0 \xE9viter l'accident."},{level:"ATPL",q:"Le temps de conscience utile (TUC) :",options:["Augmente avec l'altitude","Diminue fortement avec l'altitude","Est ind\xE9pendant de l'altitude","Ne concerne que les vols de nuit"],correct:1,explain:"Au-del\xE0 de 30 000 \xE0 35 000 ft, le TUC se compte en dizaines de secondes."},{level:"ATPL",q:"Le get-there-itis d\xE9signe :",options:["Une maladie li\xE9e \xE0 l'altitude","La tentation de continuer un vol \xE0 tout prix malgr\xE9 des conditions d\xE9grad\xE9es","Une panne d'instrument classique","Une technique de r\xE9cup\xE9ration de d\xE9crochage"],correct:1,explain:"C'est un pi\xE8ge de d\xE9cision classique en a\xE9ronautique."},{level:"ATPL",q:"La fatigue d\xE9grade le jugement de fa\xE7on comparable \xE0 :",options:["La faim","L'alcool, \xE0 partir d'un certain niveau","Le froid uniquement","Rien de comparable n'est \xE9tabli"],correct:1,explain:"C'est pourquoi la r\xE9glementation encadre les temps de vol et de repos des \xE9quipages."}],histoire:[{level:"BIA",q:"Qui r\xE9alise le premier vol motoris\xE9, contr\xF4l\xE9 et soutenu, en 1903 ?",options:["Cl\xE9ment Ader","Les fr\xE8res Wright","Louis Bl\xE9riot","Otto Lilienthal"],correct:1,explain:"Le 17 d\xE9cembre 1903, \xE0 bord du Flyer, \xE0 Kitty Hawk."},{level:"BIA",q:"Louis Bl\xE9riot est c\xE9l\xE8bre pour :",options:["Le premier vol spatial","La travers\xE9e de la Manche en 1909","Le mur du son","Le premier tour du monde"],correct:1,explain:"Il devient le premier \xE0 traverser la Manche en avion, \xE0 bord de son Bl\xE9riot XI."},{level:"BIA",q:"Qui franchit le mur du son en 1947 ?",options:["Youri Gagarine","Chuck Yeager","Neil Armstrong","Louis Bl\xE9riot"],correct:1,explain:"\xC0 bord du Bell X-1, en vol contr\xF4l\xE9 et en palier."},{level:"BIA",q:"Quel \xE9v\xE9nement marque le d\xE9but de l'\xE8re spatiale, en 1957 ?",options:["Le lancement de Spoutnik 1","Le premier vol d'Apollo 11","Le premier vol du Concorde","La cr\xE9ation de la Station spatiale internationale"],correct:0,explain:"Spoutnik 1, premier satellite artificiel, lanc\xE9 par l'URSS le 4 octobre 1957."},{level:"BIA",q:"Neil Armstrong marche sur la Lune en :",options:["1957","1961","1969","1976"],correct:2,explain:"Le 21 juillet 1969, lors de la mission Apollo 11."}],comm:[{level:"BIA",q:"Que signifie \xAB Br
